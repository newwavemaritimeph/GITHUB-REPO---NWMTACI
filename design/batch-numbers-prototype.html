<meta name="claude:viewport-fit-sides" content="cover">
<title>Batch Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* One look: the staff portal is light only. Layout: the portal's navy bar, three tabs (the Admin screen, Open Batches, To Confirm), then the page at its portal size. */
:root { color-scheme: light; --ink: #0f2638; --mute: #587184; --line: #d6e9f1; --soft: #eef4f8; --head: #e3f4fb; --navy: #123F63; --blue: #0571D0; --orange: #F25615; --good: #0a7a3e; --goodbg: #e3f5ea; --warn: #a4530c; --warnbg: #fdeee0; --bad: #b42318; --badbg: #fbe9e7; --ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --num: "Geist Mono", ui-monospace, Consolas, monospace; }
html, body { background: #f2f9fc; color: var(--ink); margin: 0; font: 14px/1.45 var(--ui); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#bar { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 10px; padding-block: 8px; }
#bar img { width: 30px; height: 30px; }
#bar b { font-weight: 600; }
#bar span { margin-left: auto; color: #cfe6f2; font-size: 13px; }
#pick { background: #fff; border-bottom: 2px solid var(--navy); padding-block: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: 600 13px var(--ui); height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--navy); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
#app { padding-block: 16px 40px; display: flex; flex-direction: column; gap: 14px; max-width: 1040px; margin-inline: auto; box-sizing: border-box; width: 100%; }
.head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
.eyebrow { color: var(--blue); font: 600 12px var(--ui); letter-spacing: .08em; text-transform: uppercase; }
h1 { margin: 2px 0 0; font: 700 24px/1.2 var(--ui); color: var(--ink); }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.panel > header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 10px; padding: 12px 16px; }
.panel h2 { margin: 0; font: 600 16px/1.25 var(--ui); }
.row { display: grid; align-items: center; gap: 6px 12px; padding: 9px 16px; border-top: 1px solid var(--line); }
.row.next { grid-template-columns: minmax(0, 1.5fr) 92px 92px minmax(0, 1.25fr) minmax(0, 1fr) 82px; }
.row.up { grid-template-columns: 112px minmax(0, 1.3fr) minmax(0, 1.4fr) 76px 82px; }
.row.head2 { background: var(--head); color: var(--navy); font: 600 12px var(--ui); letter-spacing: .05em; text-transform: uppercase; padding-block: 7px; }
.c { min-width: 0; }
.c b { font-weight: 600; }
.c small { display: block; color: var(--mute); font-size: 12.5px; overflow-wrap: anywhere; }
.m { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 13.5px; overflow-wrap: anywhere; }
.lbl { display: none; color: var(--mute); font: 600 11.5px var(--ui); letter-spacing: .05em; text-transform: uppercase; }
input, select { font: 500 14px var(--ui); color: var(--ink); height: 34px; border: 1px solid #b9dcec; border-radius: 8px; padding: 0 9px; background: #fff; box-sizing: border-box; width: 100%; min-width: 0; }
input.m { font-family: var(--num); }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
input.err { border-color: var(--bad); background: #fffafa; }
.b { display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--blue); font: 600 13.5px var(--ui); cursor: pointer; white-space: nowrap; }
.b.p { background: var(--orange); border-color: var(--orange); color: #fff; }
.b[disabled] { background: #eef2f5; border-color: #dbe3e9; color: #8496a3; cursor: not-allowed; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font: 600 12px var(--ui); white-space: nowrap; }
.chip.w { background: var(--warnbg); color: var(--warn); }
.chip.g { background: var(--goodbg); color: var(--good); }
.msg { font-size: 12.5px; font-weight: 600; margin-top: 3px; }
.msg.bad { color: var(--bad); }
.msg.warn { color: var(--warn); }
.foot { padding: 10px 16px; border-top: 1px solid var(--line); color: var(--mute); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; }
.bar2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 16px 12px; }
.bar2 input { width: auto; flex: 1 1 220px; }
.add { display: grid; grid-template-columns: minmax(0, 2fr) 110px 110px auto auto; gap: 8px; align-items: end; padding: 12px 16px; border-top: 1px solid var(--line); background: #fbfdfe; }
.add label { display: grid; gap: 4px; font: 600 12.5px var(--ui); color: var(--navy); }
.pager { display: flex; gap: 6px; align-items: center; }
/* Open Batches, as the portal's window. */
.modal { max-width: 640px; width: 100%; margin-inline: auto; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px #0f263822; overflow: hidden; box-sizing: border-box; }
.modal > header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal > header h2 { margin: 0; font: 700 19px var(--ui); color: var(--navy); }
.mbody { padding: 16px 20px 20px; display: grid; gap: 14px; }
.tabs2 { display: flex; gap: 22px; border-bottom: 1px solid var(--line); }
.tabs2 button { border: 0; background: none; padding: 8px 2px 10px; font: 600 15px var(--ui); color: var(--mute); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs2 button[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); }
.field { display: grid; gap: 5px; font: 600 14px var(--ui); color: var(--navy); }
.pattern { background: #ecf8fc; border: 1px solid #cbe9f3; border-radius: 10px; padding: 10px 14px; }
.pattern small { color: var(--mute); font-size: 12.5px; }
.pattern b { display: block; font: 700 18px var(--ui); color: var(--navy); margin-top: 2px; }
.numrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.macts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.confirm { padding: 4px 16px 16px; }
.confirm h3 { margin: 12px 0 6px; font: 600 14px var(--ui); color: var(--navy); }
.confirm ol { margin: 0; padding-left: 20px; display: grid; gap: 7px; max-width: 76ch; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 50; max-width: calc(100% - 32px); box-sizing: border-box; }
@media (max-width: 720px) {
  .row.next, .row.up { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding-block: 11px; }
  .row.head2 { display: none; }
  .row .wide { grid-column: 1 / -1; }
  .lbl { display: block; }
  .add { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .add .wide { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const firstFree = (mid, n) => { while (used(numOf(mid, n))) n += 1; return n; };
const nameOf = (code) => (COURSES.find((c) => c.code === code)?.name ?? OTHERS.find((o) => o[0] === code)?.[1] ?? code);

function nextView() {
  const rows = S.rows.map((r, i) => {
    const mid = r.edit.mid.trim(), n = Number(r.edit.next);
    const okMid = /^[0-9A-Za-z]{1,6}$/.test(mid), okN = Number.isInteger(n) && n > 0 && n < 1000;
    const preview = okMid && okN ? numOf(mid, n) : "—";
    const taken = okMid && okN && used(preview);
    const changed = mid !== r.mid || n !== r.next;
    const note = !okMid ? '<div class="msg bad">Use letters or digits only</div>' : !okN ? '<div class="msg bad">Use a number from 1 to 999</div>' : taken ? `<div class="msg warn">Already used by ${esc(taken.code)} · ${fmt(taken.start)}. The next batch takes ${numOf(mid, firstFree(mid, n))}.</div>` : "";
    return `<div class="row next">
      <div class="c wide"><b>${esc(r.code)}</b><small>${esc(r.name)}</small></div>
      <label class="c"><span class="lbl">Course No.</span><input class="m${okMid ? "" : " err"}" id="mid-${i}" data-i="${i}" data-f="mid" value="${esc(r.edit.mid)}" inputmode="numeric" aria-label="Course number for ${esc(r.code)}"></label>
      <label class="c"><span class="lbl">Next No.</span><input class="m${okN ? "" : " err"}" id="next-${i}" data-i="${i}" data-f="next" value="${esc(r.edit.next)}" inputmode="numeric" aria-label="Next number for ${esc(r.code)}"></label>
      <div class="c wide"><span class="lbl">Next Batch No.</span><span class="m"><b>${preview}</b></span>${note}</div>
      <div class="c"><span class="lbl">Highest Used</span><span class="m">${highest(r.mid)}</span></div>
      <div class="c"><button type="button" class="b${changed ? " p" : ""}" data-act="save-next" data-id="${i}" ${changed && okMid && okN ? "" : "disabled"}>Save</button></div>
    </div>`;
  }).join("");
  const add = S.adding ? `<div class="add">
      <label class="wide">Course<select id="add-course">${OTHERS.filter((o) => !S.rows.some((r) => r.code === o[0])).map((o) => `<option value="${o[0]}">${o[0]} · ${esc(o[1])}</option>`).join("")}</select></label>
      <label>Course No.<input class="m" id="add-mid" placeholder="e.g. 510" inputmode="numeric"></label>
      <label>First No.<input class="m" id="add-next" value="001" inputmode="numeric"></label>
      <button type="button" class="b" data-act="add-cancel">Cancel</button>
      <button type="button" class="b p" data-act="add-save">Add</button>
    </div>` : "";
  return `<section class="panel"><header><h2>Next Number</h2><button type="button" class="b" data-act="add-open" ${S.adding ? "disabled" : ""}>Add a Course</button></header>
    <div class="row next head2"><div>Course</div><div>Course No.</div><div>Next No.</div><div>Next Batch No.</div><div>Highest Used</div><div></div></div>
    ${rows}${add}
    <div class="foot"><span>Every other course: <span class="m">BCH-2026-000145</span>, numbered automatically</span><span>Restarts at 001 every January</span></div>
  </section>`;
}

function upView() {
  const term = S.q.trim().toLowerCase();
  const months = { "This Week": ["2026-11-09", "2026-11-15"], "This Month": ["2026-11-01", "2026-11-30"], "Next Month": ["2026-12-01", "2026-12-31"] };
  const [a, b] = months[S.period];
  const list = S.batches.filter((x) => (term ? `${x.no} ${x.code} ${nameOf(x.code)}`.toLowerCase().includes(term) : x.start >= a && x.start <= b)).sort((x, y) => x.start.localeCompare(y.start));
  const pages = Math.max(1, Math.ceil(list.length / 10)); S.page = Math.min(S.page, pages - 1);
  const shown = list.slice(S.page * 10, S.page * 10 + 10);
  const rows = shown.map((x) => {
    const v = S.draft[x.id] ?? x.no, clean = v.trim().toUpperCase(), clash = clean && used(clean, x.id), changed = clean !== x.no;
    const bad = !clean ? "Enter a batch number" : !/^[0-9A-Z][0-9A-Z-]{2,29}$/.test(clean) ? "Use letters, digits and dashes" : clash ? `Already used by ${clash.code} · ${fmt(clash.start)}` : "";
    return `<div class="row up">
      <div class="c"><span class="lbl">Starts</span><b>${range(x.start, x.end)}</b></div>
      <div class="c"><span class="lbl">Course</span><b>${esc(x.code)}</b><small>${esc(nameOf(x.code))}</small></div>
      <label class="c wide"><span class="lbl">Batch No.</span><input class="m${bad ? " err" : ""}" id="bn-${x.id}" data-bid="${x.id}" value="${esc(v)}" aria-label="Batch number, ${esc(x.code)} ${range(x.start, x.end)}">${bad ? `<div class="msg bad">${esc(bad)}</div>` : ""}</label>
      <div class="c"><span class="lbl">Trainees</span><span class="m">${x.n}</span></div>
      <div class="c"><button type="button" class="b${changed ? " p" : ""}" data-act="save-bn" data-id="${x.id}" ${changed && !bad ? "" : "disabled"}>Save</button></div>
    </div>`;
  }).join("");
  return `<section class="panel"><header><h2>Upcoming Batches</h2><span class="seg" role="group" aria-label="Period">${["This Week", "This Month", "Next Month"].map((p) => `<button type="button" data-act="period" data-id="${p}" aria-selected="${S.period === p && !term}">${p}</button>`).join("")}</span></header>
    <div class="bar2"><input id="q" value="${esc(S.q)}" placeholder="Search batch number or course" aria-label="Search batches"></div>
    <div class="row up head2"><div>Starts</div><div>Course</div><div>Batch No.</div><div>Trainees</div><div></div></div>
    ${rows || '<p class="row" style="color:var(--mute);margin:0">No batches on these dates.</p>'}
    <div class="foot"><span>${term ? `Searching all dates · ${list.length} found` : `Showing ${list.length ? S.page * 10 + 1 : 0}–${S.page * 10 + shown.length} of ${list.length}`}</span><span class="pager"><button type="button" class="b" data-act="pg" data-id="-1" ${S.page ? "" : "disabled"}>Previous</button><button type="button" class="b" data-act="pg" data-id="1" ${S.page < pages - 1 ? "" : "disabled"}>Next</button></span></div>
  </section>`;
}

function screen() {
  return `<div class="head"><div><div class="eyebrow">Admin</div><h1>Batch Numbers</h1></div>
    <div class="seg" role="tablist" aria-label="View">${[["next", "Next Number"], ["up", "Upcoming Batches"]].map(([k, t]) => `<button type="button" role="tab" data-act="view" data-id="${k}" aria-selected="${S.view === k}">${t}</button>`).join("")}</div></div>
    ${S.view === "next" ? nextView() : upView()}`;
}

function openBatches() {
  const r = S.rows.find((x) => x.code === "STPPDSPPS");
  const auto = numOf(r.mid, firstFree(r.mid, r.next));
  const v = S.typed ?? auto, clean = v.trim().toUpperCase(), clash = used(clean);
  const bad = !clean ? "Enter a batch number" : !/^[0-9A-Z][0-9A-Z-]{2,29}$/.test(clean) ? "Use letters, digits and dashes" : clash ? `Already used by ${clash.code} · ${fmt(clash.start)}` : "";
  const month = [];
  let n = r.next; for (let i = 0; i < 4; i += 1) { n = firstFree(r.mid, n); month.push(numOf(r.mid, n)); n += 1; }
  const opened = S.opened.length ? `<div class="pattern" style="background:var(--goodbg);border-color:#bfe5cd"><small>Opened</small><b style="font-size:15px">${S.opened.map(esc).join(", ")}</b></div>` : "";
  return `<div class="modal" role="dialog" aria-label="Open Batches"><header><h2>Open Batches</h2><button type="button" class="b" data-act="toast" data-id="Closes the window." aria-label="Close">×</button></header>
    <div class="mbody">
      <div class="tabs2" role="tablist">${[["week", "This Week"], ["month", "Whole Month"]].map(([k, t]) => `<button type="button" role="tab" data-act="mode" data-id="${k}" aria-selected="${S.mode === k}">${t}</button>`).join("")}</div>
      <label class="field">Course<select id="ob-course"><option>STPPDSPPS · Safety Training for Personnel Providing Direct Service to Passengers in Passenger Spaces</option></select></label>
      <div class="pattern"><small>Required Pattern</small><b>Safety begins every Monday.</b></div>
      <label class="field">${S.mode === "week" ? "Week Starting" : "Month"}<input id="ob-date" type="${S.mode === "week" ? "date" : "month"}" value="${S.mode === "week" ? "2026-11-16" : "2026-12"}"></label>
      ${S.mode === "week" ? `<label class="field">Batch No.
        <span class="numrow"><input class="m${bad ? " err" : ""}" id="ob-no" value="${esc(v)}" aria-label="Batch number">${S.typed !== null && clean !== auto ? `<button type="button" class="b" data-act="ob-reset">Use ${auto}</button>` : '<span class="chip g">Next Number</span>'}</span>
        ${bad ? `<span class="msg bad">${esc(bad)}</span>` : ""}</label>` : `<div class="field">Batch Numbers<span class="m" style="font-weight:500">${month.join(", ")}</span></div>`}
      ${opened}
      <div class="macts"><button type="button" class="b" data-act="toast" data-id="Closes the window.">Close</button><button type="button" class="b p" data-act="ob-open" ${S.mode === "week" && bad ? "disabled" : ""}>${S.mode === "week" ? "Auto-Open Week" : "Auto-Open Month"}</button></div>
    </div></div>`;
}

const confirmTab = () => `<section class="panel"><header><h2>To Confirm</h2></header><div class="confirm"><ol>
    <li>Batch Numbers is for the Admin only. Admin Assistants keep Edit Batch in Schedules for renaming one batch.</li>
    <li>Next Number covers the four STCW courses. Add a Course gives another course its own number, like 26-510-001. Every other course keeps automatic BCH numbers.</li>
    <li>A number already on a batch is refused when typed, and the counter skips used numbers by itself.</li>
    <li>In Open Batches, the Admin may type a batch number for one week; it starts as the next number. A whole month always follows the counter.</li>
    <li>Renaming a batch changes it on screens and on documents printed after. TARs, MISMO lists and certificates already printed keep the number they were printed with.</li>
    <li>Every change is kept in the audit log: who, when, the old number and the new one.</li>
  </ol></div></section>`;

function render() {
  tabs.innerHTML = TABS.map((t, i) => `<button type="button" role="tab" data-act="tab" data-id="${i}" aria-selected="${S.tab === i}">${t}</button>`).join("");
  const focus = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  app.innerHTML = S.tab === 0 ? screen() : S.tab === 1 ? openBatches() : confirmTab();
  const el = focus && document.getElementById(focus);
  if (el) { el.focus(); if (typeof pos === "number" && el.setSelectionRange) try { el.setSelectionRange(pos, pos); } catch { /* not a text field */ } }
}

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.f) { S.rows[Number(t.dataset.i)].edit[t.dataset.f] = t.value; return render(); }
  if (t.dataset.bid) { S.draft[t.dataset.bid] = t.value; return render(); }
  if (t.id === "q") { S.q = t.value; S.page = 0; return render(); }
  if (t.id === "ob-no") { S.typed = t.value; return render(); }
});
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const { act, id } = el.dataset;
  if (act === "tab") { S.tab = Number(id); return render(); }
  if (act === "view") { S.view = id; return render(); }
  if (act === "period") { S.period = id; S.q = ""; S.page = 0; return render(); }
  if (act === "pg") { S.page += Number(id); return render(); }
  if (act === "toast") return toast(id);
  if (act === "save-next") {
    const r = S.rows[Number(id)], mid = r.edit.mid.trim(), n = Number(r.edit.next);
    r.mid = mid; r.next = n; r.edit = { mid, next: String(n).padStart(3, "0") };
    toast(`Saved. The next ${r.code} batch takes ${numOf(mid, firstFree(mid, n))}.`); return render();
  }
  if (act === "save-bn") {
    const b = S.batches.find((x) => x.id === Number(id)), v = S.draft[id].trim().toUpperCase();
    toast(`Renamed ${b.no} to ${v}.`); b.no = v; delete S.draft[id]; return render();
  }
  if (act === "add-open") { S.adding = true; return render(); }
  if (act === "add-cancel") { S.adding = false; return render(); }
  if (act === "add-save") {
    const code = document.getElementById("add-course").value, mid = document.getElementById("add-mid").value.trim(), n = Number(document.getElementById("add-next").value);
    if (!/^[0-9A-Za-z]{1,6}$/.test(mid) || !(n > 0 && n < 1000)) return toast("Enter the course number and a first number from 1 to 999.");
    S.rows.push({ code, name: nameOf(code), mid, next: n, edit: { mid, next: String(n).padStart(3, "0") } }); S.adding = false;
    toast(`${code} batches now start at ${numOf(mid, n)}.`); return render();
  }
  if (act === "mode") { S.mode = id; S.opened = []; return render(); }
  if (act === "ob-reset") { S.typed = null; return render(); }
  if (act === "ob-open") {
    const r = S.rows.find((x) => x.code === "STPPDSPPS");
    const take = (no, start) => { S.batches.push({ id: Date.now() + Math.random(), start, end: start, code: "STPPDSPPS", no, n: 0 }); };
    if (S.mode === "week") {
      const auto = numOf(r.mid, firstFree(r.mid, r.next)), no = (S.typed ?? auto).trim().toUpperCase();
      take(no, "2026-11-16"); if (no === auto) r.next = firstFree(r.mid, r.next) + 1;
      S.opened = [`${no} · Nov 16`]; S.typed = null; toast(`Opened Safety, Nov 16 · ${no}.`);
    } else {
      S.opened = [];
      ["2026-12-07", "2026-12-14", "2026-12-21", "2026-12-28"].forEach((d) => { if (S.batches.some((b) => b.code === "STPPDSPPS" && b.start === d)) return; const n = firstFree(r.mid, r.next); const no = numOf(r.mid, n); take(no, d); r.next = n + 1; S.opened.push(`${no} · ${fmt(d)}`); });
      toast(S.opened.length ? `Opened ${S.opened.length} Safety batches in December.` : "Every December Monday already has a batch.");
    }
    return render();
  }
});
render();
</script>
