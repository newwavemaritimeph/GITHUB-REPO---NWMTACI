<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: the portal's Ocean Wave shell; each tab is one screen with Design 1 compact tables. */
:root{--blue:#0571D0;--cyan:#35CCFA;--orange:#F25615;--navy:#123F63;--bg:#f1f6f9;--surface:#fff;--line:#d8e4ec;--fg:#0f2638;--muted:#58707f;--soft:#eaf6fa;--th:#e3f6fb;--okbg:#e3f4ea;--ok:#0a7a3e;--warnbg:#fde9dd;--warn:#b4480f;--badbg:#fbe4dc;--bad:#b42318;--infobg:#e2effc;--info:#0b5cad;--sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1824;--surface:#112434;--line:#24394b;--fg:#e4eef5;--muted:#9ab0c1;--soft:#152d3d;--th:#173447;--okbg:#12301f;--ok:#5fd493;--warnbg:#3a2516;--warn:#ffad78;--badbg:#3c1d16;--bad:#ff8a7a;--infobg:#132f4a;--info:#7cc0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1824;--surface:#112434;--line:#24394b;--fg:#e4eef5;--muted:#9ab0c1;--soft:#152d3d;--th:#173447;--okbg:#12301f;--ok:#5fd493;--warnbg:#3a2516;--warn:#ffad78;--badbg:#3c1d16;--bad:#ff8a7a;--infobg:#132f4a;--info:#7cc0ff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--sans)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{background:linear-gradient(100deg,#0571D0,#1c9be3 60%,#35CCFA);color:#fff;padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.brand b{letter-spacing:.04em}.brand span{font-size:13px;opacity:.9}
.views{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}.views button{border:0;background:none;color:#fff;padding:9px 13px;border-radius:10px 10px 0 0;font-weight:500;font-size:14px}.views button.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 3px 0 var(--orange)}
.page{max-width:1180px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:600}h1{margin:2px 0 0;font-size:25px;text-wrap:balance}h2{margin:0;font-size:16px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.note{background:var(--infobg);color:var(--info);border-radius:10px;padding:10px 14px;font-size:13.5px}.note.warn{background:var(--warnbg);color:var(--warn)}.note.ok{background:var(--okbg);color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}.ph small{color:var(--muted)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}th{background:var(--th);color:var(--muted);font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:7px 10px;white-space:nowrap}td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}td small{display:block;color:var(--muted);font-size:12px}.r{text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.info{background:var(--infobg);color:var(--info)}.mut{background:var(--soft);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500;font-size:13.5px}.pri{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13.5px}.pri:disabled{opacity:.5}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}.seg button{border:0;background:none;padding:7px 13px;font-weight:600;font-size:13.5px}.seg button.on{background:var(--navy);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools input,.tools select{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--surface)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.tile span{display:block;font-size:12.5px;color:var(--muted)}.tile b{font:600 22px var(--mono)}.tile small{color:var(--muted);font-size:12px}
.daygrp td{background:var(--soft);font-weight:700;color:var(--navy)}.daygrp small{display:inline;font-weight:500;margin-left:8px}
.drop{border:1.5px dashed #9fb6c6;border-radius:12px;padding:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);font:13px var(--mono)}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding:10px 16px 0}.chart div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;position:relative;min-width:8px}.chart div.r2{background:var(--orange)}.chart span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--muted)}
</style>

<div class="bar"><div class="brand"><b>NEW WAVE · PROTOTYPE</b><span>Admin setup and Releasing Officer reports · sample data</span></div><nav class="views" id="views"></nav></div>
<main class="page" id="page"></main>

<script>
const VIEWS=["Admin · Certificate Numbers","Admin · Classroom Links","Admin · Default Rooms","Releasing · Reports","Releasing · Released"];
const S={view:VIEWS[0],numStep:0,linkStep:0,period:"Daily",rq:"",from:"2026-10-14",to:"2026-10-20"};
const NUMS=[["HPT","Hydraulic and Pneumatic Training","HPT-00149","HPT-00150","ok"],["ECDIS","Operational Use of ECDIS","ECDIS-00412","ECDIS-00413","ok"],["ABC","Awareness on Basic Computer","41","ABC-00042","ok"],["SSOC","Ship Security Officer Course","SSOC-01188","SSOC-01189","ok"],["ILO - Food Hygiene","Food Hygiene","FH-00077","FH-00078","ok"],["XYZ","Unknown Course","XYZ-00010","—","none"]];
const LINKS=[["DWK","Deck Watchkeeping","https://classroom.google.com/c/ODI0ODIzMTYxNDM4","iqsghbil","ok"],["GPM","Galley Provisions Management","https://classroom.google.com/c/ODA0NzgwMTUzMTU4","f5wq5hlh","ok"],["ESEA","Enclosed Space Entry Awareness","https://classroom.google.com/c/ODA0Mzk1ODk4MTAy","u56xwr5j","ok"],["CMAEN","Comprehensive Maritime English","https://classroom.google.com/c/ODEyMTczNzU4MzMx","pmfgmnde","ok"],["BBSC","Behavior Based Safety Course","https://classroom.google.com/c/ODExMTY5NTU3Mzk3","vgek5kqi","ok"],["ABC","Awareness on Basic Computer","https://classroom.google.com/c/NzUyOTczNTE4MTEw","krkxp74v","ok"],["CCMD0081","CCMD (Oct 19-21, 2026)","https://classroom.google.com/c/ODU2NDQ1NTYwMTM0","—","batch"]];
const REL=[["2026-10-20","3:42 PM","DELA CRUZ, Juan Miguel","ECDIS","ECDIS-00150","Trainee","Pickup","NW-H 004512"],["2026-10-20","11:05 AM","REYES, Maria Clara","ABC","ABC-00041","Representative (Sister)","Pickup","NW-H 004511"],["2026-10-19","4:20 PM","SANTOS, Paolo","HPT","HPT-00148","LBC · 7821 3345 9012","Courier","NW-H 004510"],["2026-10-19","9:30 AM","LIM, Andrea","SSOC","SSOC-01187","Trainee","Pickup","NW-H 004509"],["2026-10-17","2:15 PM","GARCIA, Noel","BRM","BRM-00233","Trainee","Pickup","NW-H 004508"],["2026-10-15","10:00 AM","MENDOZA, Carlo","MEFAR","MEFAR-00611","Trainee","Pickup","NW-H 004507"]];
const longDay=d=>new Date(d+"T12:00:00+08:00").toLocaleDateString("en-PH",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
function bar(){document.getElementById("views").innerHTML=VIEWS.map(v=>`<button class="${S.view===v?"on":""}" data-view="${v}">${v}</button>`).join("")}
function render(){bar();document.getElementById("page").innerHTML=({[VIEWS[0]]:nums,[VIEWS[1]]:links,[VIEWS[2]]:rooms,[VIEWS[3]]:reports,[VIEWS[4]]:released})[S.view]()}
function nums(){
  const pre=`<div class="head"><div><span class="eyebrow">Admin › Configuration › Certifications</span><h1>Import Last Certificate Numbers</h1></div></div>
  <div class="note">Your Google Sheet needs three columns: <b>Course Code</b>, <b>Course Name</b> and <b>Last Certificate No.</b> (e.g. HPT-00149, or just 149). In Google Sheets choose File › Download › CSV, or share the sheet as "Anyone with the link" and paste the link. The portal reads the prefix and digits from the number and continues from the next one. This is a one-time setup by the Admin; afterwards the Releasing Officer can still correct one course in Numbering.</div>`;
  if(S.numStep===0)return pre+`<div class="panel"><div class="ph"><h2>Your Sheet</h2></div><div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:10px">
   <div class="drop"><span><b>Paste the Google Sheet link</b><br><small style="color:var(--muted)">https://docs.google.com/spreadsheets/d/…/edit</small></span><span class="tools"><input style="min-width:280px" value="https://docs.google.com/spreadsheets/d/1aB…/edit" aria-label="Google Sheet link"><button class="pri" data-act="readnums">Read Sheet</button></span></div>
   <div class="drop"><span><b>Or upload the CSV / Excel file</b></span><button class="btn" data-act="readnums">Choose File</button></div></div></div>`;
  if(S.numStep===1)return pre+`<div class="panel"><div class="ph"><h2>Check Before Saving</h2><small>${NUMS.filter(n=>n[4]==="ok").length} matched · ${NUMS.filter(n=>n[4]!=="ok").length} not found</small></div><div class="wrap"><table><thead><tr><th>From the Sheet</th><th>Portal Course</th><th>Last No. Used</th><th>Next Certificate</th><th>Status</th></tr></thead><tbody>
   ${NUMS.map(n=>`<tr><td class="mono">${n[0]}</td><td>${n[4]==="ok"?`<b>${n[1]}</b>`:`<select><option>Pick the course or skip</option></select>`}</td><td class="mono">${n[2]}</td><td class="mono"><b>${n[3]}</b></td><td>${n[4]==="ok"?`<span class="pill ok">Will update</span>`:`<span class="pill warn">Course not found</span>`}</td></tr>`).join("")}</tbody></table></div>
   <div class="ph" style="justify-content:flex-end"><button class="btn" data-act="numback">Back</button><button class="pri" data-act="savenums">Save ${NUMS.filter(n=>n[4]==="ok").length} Courses</button></div></div>`;
  return pre+`<div class="note ok">Saved 5 courses. Their next certificates now continue from your sheet. Enrolled trainees still without a number got theirs in enrollment order. Saved in the audit log.</div><button class="btn" data-act="numreset" style="align-self:flex-start">Import Another Sheet</button>`;}
function links(){
  const pre=`<div class="head"><div><span class="eyebrow">Admin › Configuration › Classroom Links</span><h1>Import Google Classroom Links and Codes</h1></div></div>
  <div class="note">Paste your table of courses with their Classroom link and class code (copy it from your sheet or the table you made). Once saved, every training-details email and instructions PDF includes the course's <b>Join Google Classroom</b> button and class code automatically.</div>`;
  if(S.linkStep===0)return pre+`<div class="panel"><div class="ph"><h2>Paste Your Table</h2><small>Columns: Course Code · Course · Link · Class Code</small></div><div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:10px">
   <textarea rows="8" aria-label="Pasted table">15	Deck Watchkeeping	DWK	https://classroom.google.com/c/ODI0ODIzMTYxNDM4	iqsghbil
16	Galley Provisions Management	GPM	https://classroom.google.com/c/ODA0NzgwMTUzMTU4	f5wq5hlh
17	Enclosed Space Entry Awareness	ESEA	https://classroom.google.com/c/ODA0Mzk1ODk4MTAy	u56xwr5j
18	Comprehensive Maritime English	CMAEN	https://classroom.google.com/c/ODEyMTczNzU4MzMx	pmfgmnde
…</textarea>
   <div class="tools" style="justify-content:flex-end"><button class="btn" data-act="readlinks">Or Upload CSV</button><button class="pri" data-act="readlinks">Read Table</button></div></div></div>`;
  if(S.linkStep===1)return pre+`<div class="panel"><div class="ph"><h2>Check Before Saving</h2><small>${LINKS.filter(l=>l[4]==="ok").length} courses · 1 batch class</small></div><div class="wrap"><table><thead><tr><th>Code</th><th>Portal Course</th><th>Classroom Link</th><th>Class Code</th><th>Status</th></tr></thead><tbody>
   ${LINKS.map(l=>`<tr><td class="mono">${l[0]}</td><td><b>${l[1]}</b></td><td><a href="#" class="mono" style="color:var(--blue);font-size:12px">${l[2].replace("https://","").slice(0,38)}…</a></td><td class="mono">${l[3]}</td><td>${l[4]==="ok"?`<span class="pill ok">Will save</span>`:`<span class="pill info">Saved on batch CCMD-0081</span>`}</td></tr>`).join("")}</tbody></table></div>
   <div class="note" style="margin:0 16px 12px">CCMD has one class per batch (CCMD0076–0083). Those rows are saved on the matching batch, so each trainee gets the class for their own dates.</div>
   <div class="ph" style="justify-content:flex-end"><button class="btn" data-act="linkback">Back</button><button class="pri" data-act="savelinks">Save All</button></div></div>`;
  return pre+`<div class="note ok">Saved. New enrollment emails and instructions PDFs now carry the Join Google Classroom button and the class code for these courses.</div>
  <div class="panel"><div class="ph"><h2>What the Trainee Gets</h2></div><div style="padding:0 16px 16px"><div style="border:1px solid var(--line);border-radius:10px;padding:12px;max-width:520px;font-family:Arial,sans-serif;font-size:14px"><b style="color:#123F63">Google Classroom</b><p style="margin:6px 0">Join your class with the Gmail address you registered.</p><span style="display:inline-block;background:#0571D0;color:#fff;padding:9px 14px;border-radius:8px;font-weight:700">Join Google Classroom</span><p style="margin:8px 0 0">Or click + › Join class and enter <b style="font-family:monospace;background:#eef4f8;padding:1px 6px;border-radius:4px">iqsghbil</b></p></div></div></div>
  <button class="btn" data-act="linkreset" style="align-self:flex-start">Import Again</button>`;}
function reports(){const P=S.period;
  const data={Daily:{lbl:"Tuesday, October 20, 2026",printed:6,reprint:1,released:5,courier:1,pending:9,overdue:0,photos:7,post:11,bars:[[9,4],[10,6],[11,3],[13,5],[14,7],[15,4],[16,2]],x:["9AM","10","11","1PM","2","3","4"]},
   Weekly:{lbl:"Week of October 14 – 20, 2026",printed:38,reprint:3,released:31,courier:6,pending:9,overdue:2,photos:41,post:57,bars:[[0,5],[0,7],[0,6],[0,8],[0,4],[0,2],[0,6]],x:["Wed","Thu","Fri","Sat","Sun","Mon","Tue"]},
   Monthly:{lbl:"October 2026",printed:142,reprint:9,released:118,courier:21,pending:9,overdue:2,photos:150,post:203,bars:[[0,22],[0,35],[0,41],[0,44]],x:["Wk 1","Wk 2","Wk 3","Wk 4"]}}[P];
  const max=Math.max(...data.bars.map(b=>b[1]));
  return `<div class="head"><div><span class="eyebrow">Releasing Officer › Reports</span><h1>Certificate Report</h1></div><div class="tools"><div class="seg">${["Daily","Weekly","Monthly"].map(p=>`<button class="${p===P?"on":""}" data-period="${p}">${p}</button>`).join("")}</div><input type="${P==="Monthly"?"month":"date"}" value="${P==="Monthly"?"2026-10":"2026-10-20"}" aria-label="Report date"><button class="btn">‹</button><button class="btn">›</button></div></div>
  <div class="note"><b>${data.lbl}</b>. Generate the PDF to print or file it, or download Excel. Every export is recorded in the audit log.</div>
  <div class="tiles"><div class="tile"><span>Printed</span><b>${data.printed}</b><small>first prints</small></div><div class="tile"><span>Reprinted</span><b>${data.reprint}</b><small>paid or Admin-approved</small></div><div class="tile"><span>Released</span><b>${data.released}</b><small>${data.courier} by courier</small></div><div class="tile"><span>Waiting for Release</span><b>${data.pending}</b><small>printed, not claimed</small></div><div class="tile"><span>Overdue to Print</span><b style="color:${data.overdue?"var(--bad)":"inherit"}">${data.overdue}</b><small>due before today</small></div><div class="tile"><span>Photos Uploaded</span><b>${data.photos}</b></div><div class="tile"><span>Post-Tests Passed</span><b>${data.post}</b></div></div>
  <div class="panel"><div class="ph"><h2>Released ${P==="Daily"?"by Hour":P==="Weekly"?"by Day":"by Week"}</h2><span class="tools"><button class="btn">Download Excel</button><button class="pri">Generate PDF</button></span></div>
   <div class="chart" aria-label="Released per period">${data.bars.map((b,i)=>`<div style="height:${Math.max(6,b[1]/max*100)}%" title="${b[1]} released"><span>${data.x[i]}</span></div>`).join("")}</div><div style="height:26px"></div>
   <div class="wrap"><table><thead><tr><th>Course</th><th class="r">Printed</th><th class="r">Reprinted</th><th class="r">Released</th><th class="r">Waiting</th></tr></thead><tbody>
    ${[["ECDIS",8,1,7,1],["HPT",6,0,5,1],["SSOC",9,1,8,1],["ABC",5,0,4,1],["BRM",4,1,3,1]].map(r=>`<tr><td><b>${r[0]}</b></td>${r.slice(1).map(v=>`<td class="r mono">${v}</td>`).join("")}</tr>`).join("")}
    <tr><td><b>Total</b></td><td class="r mono"><b>${data.printed}</b></td><td class="r mono"><b>${data.reprint}</b></td><td class="r mono"><b>${data.released}</b></td><td class="r mono"><b>${data.pending}</b></td></tr></tbody></table></div></div>`;}
function released(){const term=S.rq.trim().toLowerCase();const rows=REL.filter(r=>r[0]>=S.from&&r[0]<=S.to&&(!term||r.join(" ").toLowerCase().includes(term)));
  const days=[...new Set(rows.map(r=>r[0]))];
  return `<div class="head"><div><span class="eyebrow">Releasing Officer › Released</span><h1>Released Certificates</h1></div><div class="tools"><label>From <input type="date" id="from" value="${S.from}"></label><label>To <input type="date" id="to" value="${S.to}"></label><div class="seg"><button data-range="today">Today</button><button data-range="week" class="on">This Week</button><button data-range="month">This Month</button></div></div></div>
  <div class="tiles"><div class="tile"><span>Released in Range</span><b>${rows.length}</b></div><div class="tile"><span>Picked Up</span><b>${rows.filter(r=>r[6]==="Pickup").length}</b></div><div class="tile"><span>By Courier</span><b>${rows.filter(r=>r[6]==="Courier").length}</b></div><div class="tile"><span>Days</span><b>${days.length}</b></div></div>
  <div class="panel"><div class="ph"><input class="mono" id="rq" placeholder="Search trainee, course or certificate no." value="${S.rq}" style="border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:260px;background:var(--surface)"><span class="tools"><button class="btn">Download Excel</button><button class="pri">Generate PDF</button></span></div>
  <div class="wrap"><table><thead><tr><th>Time</th><th>Trainee</th><th>Course</th><th>Certificate No.</th><th>Released To</th><th>Method</th><th>Sticker No.</th></tr></thead><tbody>
   ${days.map(d=>{const g=rows.filter(r=>r[0]===d);return `<tr class="daygrp"><td colspan="7">${longDay(d)}<small>${g.length} released</small></td></tr>`+g.map(r=>`<tr><td class="mono">${r[1]}</td><td><b>${r[2]}</b></td><td>${r[3]}</td><td class="mono">${r[4]}</td><td>${r[5]}</td><td><span class="pill ${r[6]==="Courier"?"info":"ok"}">${r[6]}</span></td><td class="mono">${r[7]}</td></tr>`).join("")}).join("")}
   ${rows.length?"":`<tr><td colspan="7" style="color:var(--muted)">Nothing released in this range.</td></tr>`}</tbody></table></div></div>`;}
function rooms(){const B=[["BCH-2026-0431","BT-PSSR","Updating Training on Basic Training – PSSR","Oct 21","Room 103",18],["BCH-2026-0432","BT-PSSR","Updating Training on Basic Training – PSSR","Oct 22","Room 103",24],["BCH-2026-0440","Safety","Ship Security Awareness / STPPDSPPS","Oct 26","Room 304",12],["BCH-2026-0441","Crowd","Crowd Management Training","Oct 27–28","Room 304",15],["BCH-2026-0442","Crisis","Crisis Management and Human Behavior","Oct 29–31","Room 304",9],["BCH-2026-0450","HPT","Hydraulic and Pneumatic Training","Oct 26–30","Online",6]];
 return `<div class="head"><div><span class="eyebrow">Admin › Configuration › Classrooms</span><h1>Default Rooms</h1></div></div>
 <div class="note">Rule from the owner: every <b>BT-PSSR</b> batch is in <b>Room 103</b>; every <b>Safety</b>, <b>Crowd</b> and <b>Crisis</b> batch is in <b>Room 304</b>. New batches get the room automatically when they are opened, and existing open batches are updated once. Only the Admin sets these defaults here; the Admin can change the room of one batch, e.g. when the room is under repair.</div>
 <div class="panel"><div class="ph"><h2>Default Room per Course</h2></div><div class="wrap"><table><thead><tr><th>Course</th><th>Default Room</th><th></th></tr></thead><tbody><tr><td><b>BT-PSSR</b><small>Updating Training on Basic Training – PSSR</small></td><td><select><option>Room 103</option><option>Room 304</option></select></td><td><button class="btn">Save</button></td></tr><tr><td><b>Safety</b><small>STPPDSPPS</small></td><td><select><option>Room 304</option><option>Room 103</option></select></td><td><button class="btn">Save</button></td></tr><tr><td><b>Crowd</b><small>PSCMT</small></td><td><select><option>Room 304</option><option>Room 103</option></select></td><td><button class="btn">Save</button></td></tr><tr><td><b>Crisis</b><small>PSCMHBT</small></td><td><select><option>Room 304</option><option>Room 103</option></select></td><td><button class="btn">Save</button></td></tr></tbody></table></div></div>
 <div class="panel"><div class="ph"><h2>Upcoming Batches</h2><small>Room shown on the admission slip, instructions, MISMO list and resource plan</small></div><div class="wrap"><table><thead><tr><th>Batch</th><th>Course</th><th>Dates</th><th>Room</th><th class="r">Trainees</th></tr></thead><tbody>
 ${B.map(b=>`<tr><td class="mono">${b[0]}</td><td><b>${b[1]}</b><small>${b[2]}</small></td><td>${b[3]}</td><td>${b[4]==="Online"?'<span class="pill mut">Online · Classroom</span>':`<span class="pill ok">${b[4]}</span><small>Default</small>`}</td><td class="r mono">${b[5]}/24</td></tr>`).join("")}</tbody></table></div></div>`;}
document.addEventListener("click",e=>{const t=e.target.closest("[data-view],[data-act],[data-period],[data-range]");if(!t)return;
 if(t.dataset.view)S.view=t.dataset.view;else if(t.dataset.period)S.period=t.dataset.period;
 else if(t.dataset.range){S.to="2026-10-20";S.from=t.dataset.range==="today"?"2026-10-20":t.dataset.range==="week"?"2026-10-14":"2026-10-01"}
 else{const a=t.dataset.act;if(a==="readnums")S.numStep=1;if(a==="numback")S.numStep=0;if(a==="savenums")S.numStep=2;if(a==="numreset")S.numStep=0;if(a==="readlinks")S.linkStep=1;if(a==="linkback")S.linkStep=0;if(a==="savelinks")S.linkStep=2;if(a==="linkreset")S.linkStep=0}
 render()});
document.addEventListener("change",e=>{if(e.target.id==="from"){S.from=e.target.value;render()}if(e.target.id==="to"){S.to=e.target.value;render()}});
document.addEventListener("input",e=>{if(e.target.id==="rq"){S.rq=e.target.value;const p=e.target.selectionStart;render();const el=document.getElementById("rq");el.focus();el.setSelectionRange(p,p)}});
render();
</script>
