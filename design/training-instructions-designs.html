<style>

.cls{border:1px dashed #0571D0;border-radius:6px;padding:5px 8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:10.5px}.cls b{color:#0571D0}

<script>
const DES = [["Classic Letterhead", "Grid of details, then reminders and policies"], ["Two Column", "Details left, rules right"], ["Checklist", "What to bring and reminders as tick boxes"], ["Timeline", "Reporting → class → assessment → certificate"], ["Ticket", "Admission-style details block, then the rules"], ["Modern Minimal", "Big course title, light lines, numbered reminders"], ["Four Cards", "When · Where · Bring · Rules in a 2 × 2 grid"], ["Side Band", "Navy band with the course and dates"], ["Numbered Steps", "Before · Arrive · During · After · Certificate"], ["Formal Memo", "To · From · Re · Date, then short paragraphs"], ["Cards + Steps (07 + 09)", "Four cards, then the five numbered steps"]];
const S = {
  stcw: { cat: "STCW Courses", ref: "ENR-2026-000301", name: "DELA CRUZ, JUAN P.", no: "NWMTACI-0000412", srn: "1234567890", course: "PSCMT · Crowd Management", batch: "26-507-024", dates: "Nov 10–11, 2026 (Tue–Wed)", time: "8:00 AM – 5:00 PM", room: "Room 2, Bel-Air Apartment", mode: "Face to face", bring: ["Valid ID and Seaman's Book (SIRB)", "Training uniform (white polo, black pants, black shoes)", "Own tumbler and ballpen"], rem: ["Report by 7:30 AM on the first day; late arrivals over 15 minutes are rescheduled.", "Attendance is required on all training days for MARINA reporting.", "Check your name on the TAR; report corrections before the first day."] },
  inh: { cat: "In-House Courses", ref: "ENR-2026-000318", name: "SANTOS, MARIA L.", no: "NWMTACI-0000405", srn: "2219334881", course: "HPT · Hazardous Products Training", batch: "Open schedule", dates: "Nov 12, 2026 (Thu)", time: "8:00 AM – 5:00 PM", room: "Google Classroom", mode: "Online", link: "classroom.google.com/c/NjM5…", code: "x7k2pqm", bring: ["Laptop or phone with camera", "Stable internet connection", "Valid ID shown on camera at the start"], rem: ["Join the Google Classroom with the link and class code below the day before.", "Keep your camera on during the session.", "Complete the post-test and the evaluation to release your certificate."] },
};
const POL = [["Payment", "Full payment for 1-day courses; 50% down payment otherwise."], ["Reschedule", "5+ days before: ₱350.00. Under 5 days: 50% of the fee + ₱250.00."], ["Cancellation", "5+ days before: ₱350.00. Under 5 days: 50% of the fee + ₱250.00."], ["Certificate", "Released after all requirements and balances are complete."]];
let D = 11, V = "sheets";
const head = (x) => `<div class="lh"><i></i><div><b>NEW WAVE MARITIME TRAINING AND ASSESSMENT CENTER, INC.</b><small>Room 103, Bel-Air Apartment, 1020 Roxas Boulevard, Ermita, Manila 1000 · +63 948 847 6530 · (02) 8553 0310 · newwavemaritime@gmail.com</small></div></div>
  <div class="tt"><div><b>TRAINING INSTRUCTIONS</b> <span>· ${x.cat} · issued Nov 3, 2026</span></div><em>REF NO. <b>${x.ref}</b></em></div>`;
const cls = (x) => x.link ? `<div class="cls"><span><b>Google Classroom</b> ${x.link}</span><span>Class code <b class="mono">${x.code}</b></span></div>` : "";
const pol = `<div class="h">Policies</div><div class="pol">${POL.map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join("")}</div>`;
const sig = `<div class="sig"><span>Registration Officer</span><span>Trainee</span></div>`;
function sheet(x) {
  const det = `<table class="grid"><tbody><tr><th>Trainee</th><td><b>${x.name}</b></td><th>NWMTACI No.</th><td class="mono">${x.no}</td></tr><tr><th>Course</th><td><b>${x.course}</b></td><th>Batch</th><td class="mono">${x.batch}</td></tr><tr><th>Dates</th><td>${x.dates}</td><th>Time</th><td>${x.time}</td></tr><tr><th>Venue</th><td>${x.room}</td><th>Mode</th><td>${x.mode}</td></tr></tbody></table>`;
  if (D === 1) return `${head(x)}${det}${cls(x)}<div class="h">What to Bring</div><ul class="ul">${x.bring.map((b) => `<li>${b}</li>`).join("")}</ul><div class="h">Reminders</div><ul class="ul">${x.rem.map((b) => `<li>${b}</li>`).join("")}</ul>${pol}${sig}`;
  if (D === 2) return `${head(x)}<div class="two"><div style="display:flex;flex-direction:column;gap:6px">${det}${cls(x)}<div class="h">What to Bring</div><ul class="ul">${x.bring.map((b) => `<li>${b}</li>`).join("")}</ul></div><div style="display:flex;flex-direction:column;gap:6px;border-left:1px solid #c8d3dc;padding-left:10px"><div class="h">Reminders</div><ul class="ul">${x.rem.map((b) => `<li>${b}</li>`).join("")}</ul>${pol}</div></div>${sig}`;
  if (D === 3) return `${head(x)}${det}${cls(x)}<div class="two" style="flex:none"><div><div class="h">Bring on the First Day</div>${x.bring.map((b) => `<div><span class="box"></span>${b}</div>`).join("")}</div><div><div class="h">Before You Come</div>${x.rem.map((b) => `<div><span class="box"></span>${b}</div>`).join("")}</div></div>${pol}${sig}`;

  if (D === 6) return `${head(x)}<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-end;border-bottom:1px solid #e3e8ec;padding-bottom:6px"><div><div style="font-size:9.5px;color:#7a8b97;text-transform:uppercase;letter-spacing:.08em">${x.name} · ${x.no}</div><div style="font-size:19px;font-weight:600;color:#14232f;letter-spacing:-.01em">${x.course}</div></div><div style="text-align:right;font-size:11px"><b>${x.dates}</b><div>${x.time} · ${x.room}</div></div></div>${cls(x)}<div class="two" style="flex:none"><div><div class="h">What to Bring</div>${x.bring.map((b, i) => `<div style="display:flex;gap:6px"><b style="color:#0571D0">${i + 1}</b><span>${b}</span></div>`).join("")}</div><div><div class="h">Reminders</div>${x.rem.map((b, i) => `<div style="display:flex;gap:6px"><b style="color:#F25615">${i + 1}</b><span>${b}</span></div>`).join("")}</div></div>${pol}${sig}`;
  if (D === 7) { const card = (t, c, body) => `<div style="border:1px solid #c8d3dc;border-top:3px solid ${c};border-radius:6px;padding:6px 8px;min-width:0"><div class="h" style="color:${c}">${t}</div>${body}</div>`;

  if (D === 9) { const steps = [["Before", x.link ? "Join the Google Classroom the day before." : "Check your name on the TAR."], ["Arrive", "Report by 7:30 AM with your valid ID."], ["During", x.mode === "Online" ? "Camera on, full attendance." : "Wear the uniform, full attendance."], ["After", "Take the post-test and the evaluation."], ["Certificate", "Released once requirements and balance are complete."]];
    return `${head(x)}<table class="grid"><tbody><tr><th>Trainee</th><td><b>${x.name}</b> · <span class="mono">${x.no}</span></td><th>Course</th><td><b>${x.course}</b></td></tr><tr><th>Dates</th><td>${x.dates} · ${x.time}</td><th>Venue</th><td>${x.room}</td></tr></tbody></table>${cls(x)}<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">${steps.map(([t, b], i) => `<div style="border:1px solid #c8d3dc;border-radius:6px;padding:5px 6px;min-width:0"><div style="width:18px;height:18px;border-radius:50%;background:#F25615;color:#fff;font-weight:700;font-size:10px;display:grid;place-items:center">${i + 1}</div><b style="display:block;margin-top:2px">${t}</b><span style="font-size:10px">${b}</span></div>`).join("")}</div><div class="h">What to Bring</div><div>${x.bring.join(" · ")}</div>${pol}${sig}`; }
  if (D === 11) { const card = (t, c, body) => `<div style="border:1px solid #c8d3dc;border-top:3px solid ${c};border-radius:6px;padding:5px 8px;min-width:0"><div class="h" style="color:${c}">${t}</div>${body}</div>`;
    const steps = [["Before", x.link ? "Join the Google Classroom the day before." : "Check your name on the TAR."], ["Arrive", "Report by 7:30 AM with your valid ID."], ["During", x.mode === "Online" ? "Camera on, full attendance." : "Wear the uniform, full attendance."], ["After", "Take the post-test and the evaluation."], ["Certificate", "Released once requirements and balance are complete."]];
    return `${head(x)}<div style="font-size:11.5px"><b>${x.name}</b> · <span class="mono">${x.no}</span> · SRN <span class="mono">${x.srn}</span> · <b>${x.course}</b> · Batch <span class="mono">${x.batch}</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">${card("When", "#0571D0", `<div><b>${x.dates}</b></div><div>${x.time} · report by 7:30 AM</div>`)}${card("Where", "#123F63", `<div><b>${x.room}</b> · ${x.mode}</div>${x.link ? `<div>${x.link} · code <b class="mono">${x.code}</b></div>` : `<div>Bel-Air Apartment, 1020 Roxas Blvd, Ermita</div>`}`)}${card("Bring", "#F25615", `<ul class="ul">${x.bring.map((b) => `<li>${b}</li>`).join("")}</ul>`)}${card("Reminders", "#0a7a3e", `<ul class="ul">${x.rem.slice(1).map((b) => `<li>${b}</li>`).join("")}</ul>`)}</div>
    <div class="h">Your Steps</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">${steps.map(([t, b], i) => `<div style="border:1px solid #c8d3dc;border-radius:6px;padding:4px 6px;min-width:0"><div style="display:flex;gap:5px;align-items:center"><span style="width:17px;height:17px;border-radius:50%;background:#F25615;color:#fff;font-weight:700;font-size:9.5px;display:grid;place-items:center;flex:none">${i + 1}</span><b>${t}</b></div><span style="font-size:9.8px">${b}</span></div>`).join("")}</div>${pol}${sig}`; }
  if (D === 10) return `${head(x)}<table style="font-size:11px"><tbody><tr><td style="width:60px;color:#5c6e7c">TO</td><td><b>${x.name}</b> (${x.no})</td><td style="width:60px;color:#5c6e7c">DATE</td><td>Nov 3, 2026</td></tr><tr><td style="color:#5c6e7c">FROM</td><td>Registration Office, New Wave MTACI</td><td style="color:#5c6e7c">REF</td><td class="mono">${x.ref}</td></tr><tr><td style="color:#5c6e7c">RE</td><td colspan="3"><b>Training Instructions · ${x.course}</b></td></tr></tbody></table><div style="border-top:1px solid #14232f"></div><p style="margin:0">Your enrollment is confirmed. Your training runs on <b>${x.dates}</b>, <b>${x.time}</b>, at <b>${x.room}</b> (${x.mode.toLowerCase()}), batch <span class="mono">${x.batch}</span>. Please report by <b>7:30 AM</b>.</p>${x.link ? `<p style="margin:0">Join the Google Classroom at <b>${x.link}</b> with class code <b class="mono">${x.code}</b> the day before.</p>` : ""}<p style="margin:0"><b>Please bring:</b> ${x.bring.join("; ")}.</p><p style="margin:0"><b>Reminders:</b> ${x.rem.join(" ")}</p>${pol}${sig}`;
  return `${head(x)}<div class="tk"><div class="l"><b style="font-size:13px">${x.name}</b><div class="mono" style="font-size:10px;color:#5c6e7c">${x.no} · SRN ${x.srn}</div><div style="margin-top:4px"><b>${x.course}</b></div><div>${x.dates} · ${x.time}</div><div>${x.room} · ${x.mode}</div></div><div class="r"><small>Batch</small><b>${x.batch}</b><small>Report by</small><b>7:30 AM</b></div></div>${cls(x)}<div class="two" style="flex:none"><div><div class="h">What to Bring</div><ul class="ul">${x.bring.map((b) => `<li>${b}</li>`).join("")}</ul></div><div><div class="h">Reminders</div><ul class="ul">${x.rem.map((b) => `<li>${b}</li>`).join("")}</ul></div></div>${pol}${sig}`;
}
function vSheets() {
  return `<div class="pick">${DES.map(([n, d], i) => `<button data-d="${i + 1}" class="${D === i + 1 ? "on" : ""}"><b>Design ${String(i + 1).padStart(2, "0")} · ${n}</b><small>${d}</small></button>`).join("")}</div>
  <div class="sheets"><div><p class="cap">STCW Courses · half of Legal (8.5 × 7 in)</p><div class="pw"><article class="paper">${sheet(S.stcw)}</article></div></div><div><p class="cap">In-House Courses · half of Legal (8.5 × 7 in)</p><div class="pw"><article class="paper">${sheet(S.inh)}</article></div></div></div>`;

function vReg() {
  const rows = [["PSCMT", "Crowd Management", "Nov 10–11", "Enrolled", true], ["HPT", "Hazardous Products Training", "Nov 12", "Enrolled", true], ["SSO", "Ship Security Officers", "Nov 15–17", "Pending", false]];

  <section class="panel"><div class="ph"><h2>Registration › Enrollment Window</h2></div><div class="lines"><div><span>Status</span><span class="chip en">Enrolled</span></div><div><span>Training Instructions</span><span>Emailed Nov 3 · 9:20 AM</span></div></div><div class="foot"><span style="font-size:13.5px;color:var(--muted)">Uses the STCW Courses template</span><button class="btn pri" data-gen="PSCMT">Generate Training Instructions</button></div></section></div>`;
}
function vAdmin() {
  const x = Sx === "stcw" ? S.stcw : S.inh;
  return `<div class="flow"><section class="panel"><div class="ph"><h2>Admin › Configuration › Training Instructions</h2></div><div class="views" style="padding:0 20px">${[["stcw", "STCW Courses"], ["inh", "In-House Courses"]].map(([k, l]) => `<button data-cat="${k}" class="${Sx === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <div class="ed"><label>Subject<input value="Your ${x.cat === "STCW Courses" ? "STCW" : "In-House"} training instructions · {{course}}"></label><label>What to Bring (one per line)<textarea>${x.bring.join("\n")}</textarea></label><label>Reminders (one per line)<textarea>${x.rem.join("\n")}</textarea></label><label>Policies<textarea>${POL.map(([k, v]) => `${k}: ${v}`).join("\n")}</textarea></label>
    <div><span style="font-size:13px;color:var(--muted)">Placeholders</span><div class="ph-chips">${["{{trainee}}", "{{course}}", "{{dates}}", "{{time}}", "{{room}}", "{{classroom_link}}", "{{class_code}}"].map((p) => `<code>${p}</code>`).join("")}</div></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn">Cancel</button><button class="btn pri" data-save>Save ${x.cat} Template</button></div></div></section>
    <div><p class="cap">Preview · ${x.cat}</p><div class="pw"><article class="paper">${sheet(x)}</article></div></div></div>`;
}
let Sx = "stcw";
let EW = "desk";
function mail(k) {
  const x = S[k], inh = k === "inh", first = x.name.split(", ")[1].split(" ")[0];
  const fn = first[0] + first.slice(1).toLowerCase();
  const steps = inh
    ? ["Join the Google Classroom today with the button below.", "Check your camera, microphone and internet before class.", "Log in by 7:45 AM on " + x.dates.split(" (")[0] + " and show your valid ID on camera.", "Attend the whole session with your camera on.", "Take the post-test and the evaluation; your certificate follows."]
    : ["Report to " + x.room + " by 7:30 AM on " + x.dates.split("–")[0] + ".", "Bring the items listed under What to Bring.", "Sign the attendance sheet every training day.", "Pass the assessment on the last day.", "Your certificate is released once requirements and balances are complete."];
  return `<div class="inbox"><div class="ihead"><b>Your training instructions · ${x.course.split(" · ")[0]} · ${x.course.split(" · ")[1]}</b><span>From: New Wave Maritime &lt;training@newwavemaritimemtaci.com&gt;</span><span>To: ${fn.toLowerCase()}.${x.name.split(",")[0].toLowerCase().replace(/ /g, "")}@gmail.com</span></div>
  <div class="ibody"><div class="mail ${EW === "phone" ? "ph" : ""}">
    <div class="mh"><i>NW</i><div><b>NEW WAVE MARITIME TRAINING AND ASSESSMENT CENTER, INC.</b><small>Room 103, Bel-Air Apartment, 1020 Roxas Boulevard, Ermita, Manila 1000 · +63 948 847 6530 · newwavemaritime@gmail.com</small></div></div>
    <div class="mt">TRAINING INSTRUCTIONS<span>${x.ref}</span></div>
    <p class="mp">Dear ${fn}, you are enrolled. Here is everything you need for your training.</p>
    <div class="mid"><b>${x.name}</b> · ${x.no} · SRN ${x.srn}</div>
    <div class="cards">
      <div class="card" style="--c:#0571D0"><h4>When</h4><p><b>${x.dates}</b><br>${x.time}</p></div>
      <div class="card" style="--c:#F25615"><h4>Where</h4><p><b>${x.room}</b><br>${x.mode} · ${x.course}${inh ? "" : `<br>Batch ${x.batch}`}</p></div>
      <div class="card" style="--c:#123F63"><h4>What to Bring</h4><ul>${x.bring.map((b) => `<li>${b}</li>`).join("")}</ul></div>
      <div class="card" style="--c:#35CCFA"><h4>Reminders</h4><ul>${x.rem.map((b) => `<li>${b}</li>`).join("")}</ul></div>
    </div>
    ${inh ? `<div class="gc"><div><small style="color:#587184">Google Classroom · class code</small><br><code>${x.code}</code></div><a href="#">Join Google Classroom</a></div>` : ""}
    <div class="steps"><h4>Your Five Steps</h4><ol>${steps.map((t, i) => `<li><b>${i + 1}</b><span>${t}</span></li>`).join("")}</ol></div>
    <div class="pol">${POL.map(([a, b]) => `<b>${a}:</b> ${b}`).join("<br>")}</div>
    <div class="att"><i>PDF</i>training-instructions-${x.ref}.pdf · half Legal · 1 page</div>
    <div class="mf"><b>Questions?</b> Call or text 0948-847-6530 · newwavemaritime@gmail.com · facebook.com/newwavemtc<br>New Wave Maritime Training and Assessment Center, Inc. · Ride the New Wave of Maritime Excellence</div>
  </div></div></div>`;
}
function vMail() {
  return `<div class="views" style="margin-bottom:14px">${[["desk", "Desktop"], ["phone", "Phone Width"]].map(([k, l]) => `<button data-ew="${k}" class="${EW === k ? "on" : ""}">${l}</button>`).join("")}</div><div class="flow">${mail("stcw")}${mail("inh")}</div><p class="note" style="padding:12px 0 0">Sent when Registration clicks Generate Training Instructions; the same text as the printed sheet, with the PDF attached. The subject, What to Bring, Reminders and Policies come from Admin › Configuration › Training Instructions (STCW or In-House).</p>`;
}
function fit() { document.querySelectorAll(".pw").forEach((w) => { const p = w.firstElementChild; const k = Math.min(1, w.clientWidth / 816); p.style.transform = `scale(${k})`; w.style.height = `${672 * k}px`; }); }
addEventListener("resize", fit);
function render() {
  document.querySelectorAll("#views button").forEach((b) => b.classList.toggle("on", b.dataset.v === V));
  document.getElementById("view").innerHTML = V === "sheets" ? vSheets() : V === "reg" ? vReg() : V === "mail" ? vMail() : vAdmin();
  fit();
}
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (el.hidden = true), 2200); }
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.v) V = b.dataset.v; else if (b.dataset.ew) EW = b.dataset.ew; else if (b.dataset.d) D = Number(b.dataset.d); else if (b.dataset.cat) Sx = b.dataset.cat;
  else if (b.dataset.gen) { toast(`${b.dataset.gen}: instructions opened to print and emailed to the trainee.`); return; }
  else if ("save" in b.dataset) { toast("Template saved. New instructions use it."); return; }
  else return;
  render();
});
render();
</script>
