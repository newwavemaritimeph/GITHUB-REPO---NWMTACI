<title>Certificate Numbers Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Continue New Wave's existing certificate numbers: Doc No. (one series), Registration No. (per certificate, -MMYYYY), Certificate No. (per course); record certificates issued before the portal. */
:root{--navy:#123F63;--blue:#0571D0;--orange:#F25615;--cyan:#35CCFA;--bg:#f2f6f9;--surface:#fff;--line:#dbe5ec;--fg:#0f2638;--muted:#5b6f7f;--soft:#eef4f8;--okbg:#e3f4ea;--ok:#0a7a3e;--warnbg:#fde9dd;--warn:#b4480f;--badbg:#fbe4dc;--bad:#b42318;--infobg:#e2effb;--info:#0558a8;--sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c1925;--surface:#122534;--line:#23394b;--fg:#e5eef5;--muted:#98adbf;--soft:#18303f;--okbg:#12301f;--ok:#5fd493;--warnbg:#3a2516;--warn:#ffad78;--badbg:#3c1d16;--bad:#ff8a7a;--infobg:#132f4a;--info:#7cc0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1925;--surface:#122534;--line:#23394b;--fg:#e5eef5;--muted:#98adbf;--soft:#18303f;--okbg:#12301f;--ok:#5fd493;--warnbg:#3a2516;--warn:#ffad78;--badbg:#3c1d16;--bad:#ff8a7a;--infobg:#132f4a;--info:#7cc0ff;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--sans)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{background:var(--navy);color:#fff;padding:12px 20px 0}.top b{color:var(--cyan);font-size:18px}.top small{display:block;font-size:10px;letter-spacing:.07em;color:#c9dceb}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}.tabs button{background:none;border:0;color:#d4e4f1;padding:10px 16px;border-radius:10px 10px 0 0;font-weight:500;white-space:nowrap}.tabs button.on{background:var(--bg);color:var(--fg)}
.page{max-width:1200px;margin:0 auto;padding-block:18px 60px;padding-inline:20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:600}h1{margin:2px 0 0;font-size:27px;line-height:1.2}h2{margin:0;font-size:16px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 10px;flex-wrap:wrap}.ph .m{color:var(--muted);font-size:13px}
.pb{padding:0 18px 18px}
.series{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.sbox{display:flex;flex-direction:column;gap:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.inp{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 11px;font-size:14.5px;width:100%;min-width:0}
.next{background:var(--soft);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}.next span{color:var(--muted);font-size:13px}.next b{font:600 18px var(--mono);color:var(--blue)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500;font-size:14px}.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.sm{padding:5px 10px;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wrap{overflow-x:auto;margin:0 18px 18px}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--navy);color:#fff;font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:8px 10px;white-space:nowrap}td{padding:8px 10px;border-bottom:1px solid var(--line)}tr:nth-child(even) td{background:var(--soft)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}
.note{background:var(--infobg);color:var(--info);border-radius:10px;padding:10px 14px;font-size:13.5px}
.cert{background:#fff;color:#1b2b3a;border:6px double #123F63;border-radius:6px;padding:22px 26px;max-width:640px;margin:0 auto;width:100%;aspect-ratio:1.414;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;text-align:center;font-family:Georgia,serif}
.cert .nos{position:absolute;left:26px;bottom:22px;text-align:left;font-size:12.5px;line-height:1.5}.cert .nos b{display:inline-block;width:118px}
.cert .doc{position:absolute;right:8px;top:50%;transform:rotate(90deg) translateX(50%);transform-origin:right center;font-size:11.5px;letter-spacing:.06em}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:50}
@media (max-width:560px){.form{grid-template-columns:1fr}.page,.top{padding-inline:16px}}
</style>
<div class="top"><b>NEW WAVE</b><small>CERTIFICATE NUMBERS · CONTINUE YOUR EXISTING SERIES</small><nav class="tabs" id="tabs"></nav></div>
<main class="page" id="page"></main>
<div class="toast" id="toast" hidden></div>
<script>
const S={tab:"Numbering",doc:{last:6883,digits:8},reg:{prefix:"NWMTC",last:7548,digits:6},course:[{code:"FSH",name:"Fire Safety and Hazards",prefix:"FSH",last:55,digits:6},{code:"UBT-PSSR",name:"Updating Training on Basic Training – PSSR",prefix:"BT",last:1244,digits:6},{code:"PSCMT",name:"Crowd Management Training",prefix:"CM",last:309,digits:6}],
 issued:[{name:"SANTOS, Maria",course:"FSH",cert:"FSH000054",reg:"NWMTC007546-092026",doc:"00006881",date:"2026-09-28"},{name:"REYES, Paolo",course:"FSH",cert:"FSH000055",reg:"NWMTC007548-092026",doc:"00006883",date:"2026-09-30"}],
 printed:[],issueMonth:"102026"};
const pad=(n,d)=>String(n).padStart(d,"0");
const nextDoc=()=>pad(S.doc.last+1,S.doc.digits),nextReg=()=>`${S.reg.prefix}${pad(S.reg.last+1,S.reg.digits)}-${S.issueMonth}`;
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400)}
const V={
 "Numbering":()=>`<div><span class="eyebrow">Admin › Certificate Controls</span><h1>Certificate Numbering</h1></div><div class="note">Enter the <b>last number you already used</b> on paper. The portal continues from the next one and never reuses a number.</div>
 <div class="series"><section class="panel"><div class="ph"><h2>Doc. No.</h2><span class="m">One series for all certificates</span></div><div class="pb sbox"><div class="form"><label class="f">Last Doc. No. Used<input class="inp mono" id="docLast" type="number" value="${S.doc.last}"></label><label class="f">Digits<input class="inp mono" id="docDigits" type="number" value="${S.doc.digits}"></label></div><div class="next"><span>Next certificate prints</span><b>Doc. No. ${nextDoc()}</b></div><div class="acts"><button class="btn pri" data-save="doc">Save</button></div></div></section>
 <section class="panel"><div class="ph"><h2>Registration No.</h2><span class="m">New on every certificate</span></div><div class="pb sbox"><div class="form"><label class="f">Prefix<input class="inp mono" id="regPrefix" value="${S.reg.prefix}"></label><label class="f">Last Number Used<input class="inp mono" id="regLast" type="number" value="${S.reg.last}"></label></div><div class="next"><span>Next certificate prints (issued Oct 2026)</span><b>${nextReg()}</b></div><p style="margin:0;color:var(--muted);font-size:13px">The ending is the month and year the certificate is issued.</p><div class="acts"><button class="btn pri" data-save="reg">Save</button></div></div></section></div>
 <section class="panel"><div class="ph"><h2>Certificate No. per Course</h2><span class="m">In-House courses: Releasing Officer · STCW: Admin</span></div><div class="wrap"><table><thead><tr><th>Course</th><th>Prefix</th><th>Last No. Used</th><th>Digits</th><th>Next Certificate No.</th><th></th></tr></thead><tbody>${S.course.map((c,i)=>`<tr><td><b>${c.code}</b><br><small style="color:var(--muted)">${c.name}</small></td><td><input class="inp mono" style="max-width:110px" id="cp${i}" value="${c.prefix}"></td><td><input class="inp mono" style="max-width:120px" type="number" id="cl${i}" value="${c.last}"></td><td><input class="inp mono" style="max-width:80px" type="number" id="cd${i}" value="${c.digits}"></td><td class="mono" style="color:var(--blue);font-weight:600">${c.prefix}${pad(c.last+1,c.digits)}</td><td><button class="btn sm pri" data-savec="${i}">Save</button></td></tr>`).join("")}</tbody></table></div></section>`,
 "Issued Before the Portal":()=>`<div><span class="eyebrow">Releasing Officer</span><h1>Certificates Issued Before the Portal</h1></div><div class="note">Record certificates you already printed so their numbers are reserved and the trainees show as Printed. Upload your log as a spreadsheet, or add one at a time.</div>
 <section class="panel"><div class="ph"><h2>Upload Your Log</h2><span class="m">CSV: Trainee · Course · Certificate No. · Registration No. · Doc. No. · Date Issued</span></div><div class="pb"><div class="drop"><label class="btn">Choose CSV File<input type="file" accept=".csv,text/csv" hidden id="csv"></label><p style="margin:8px 0 0">Each row is matched to the trainee and course in the portal. Unmatched rows are listed for you to fix; numbers already used are refused.</p></div></div></section>
 <section class="panel"><div class="ph"><h2>Add One Certificate</h2></div><div class="pb"><div class="form" style="grid-template-columns:repeat(3,minmax(0,1fr))"><label class="f">Trainee<select class="inp" id="mName"><option>DELA CRUZ, Juan</option><option>GARCIA, Liza</option><option>FLORES, Ken</option></select></label><label class="f">Course<select class="inp" id="mCourse">${S.course.map(c=>`<option>${c.code}</option>`).join("")}</select></label><label class="f">Date Issued<input class="inp" type="date" id="mDate" value="2026-10-02"></label><label class="f">Certificate No.<input class="inp mono" id="mCert" placeholder="FSH000053"></label><label class="f">Registration No.<input class="inp mono" id="mReg" placeholder="NWMTC007540-092026"></label><label class="f">Doc. No.<input class="inp mono" id="mDoc" placeholder="00006870"></label></div><div class="acts" style="margin-top:10px"><button class="btn pri" data-act="addOne">Record Certificate</button></div></div></section>
 <section class="panel"><div class="ph"><h2>Recorded</h2><span class="m">${S.issued.length}</span></div><div class="wrap"><table><thead><tr><th>Trainee</th><th>Course</th><th>Certificate No.</th><th>Registration No.</th><th>Doc. No.</th><th>Issued</th><th>Status</th></tr></thead><tbody>${S.issued.map(r=>`<tr><td>${r.name}</td><td>${r.course}</td><td class="mono">${r.cert}</td><td class="mono">${r.reg}</td><td class="mono">${r.doc}</td><td>${r.date}</td><td><span class="pill p-ok">Printed · Before Portal</span></td></tr>`).join("")}</tbody></table></div></section>`,
 "Print Preview":()=>{const c=S.course[0];return `<div><span class="eyebrow">Releasing Officer › Certificates</span><h1>What the Next Certificate Prints</h1></div><div class="note">Printing takes the next number in each series at the same moment, so the three numbers always belong together. Preview shows them without using them up.</div>
 <div class="cert"><small style="letter-spacing:.2em">CERTIFICATE OF COMPLETION</small><div style="font-size:22px;font-weight:700">JUAN PEREZ DELA CRUZ</div><div>${c.name}</div><div class="nos"><div><b>Certificate No :</b> <span class="mono">${c.prefix}${pad(c.last+1,c.digits)}</span></div><div><b>Registration No :</b> <span class="mono">${nextReg()}</span></div></div><div class="doc mono">Doc. No. ${nextDoc()}</div></div>
 <div class="acts" style="justify-content:center"><button class="btn pri" data-act="print">Print (uses these numbers)</button></div>
 ${S.printed.length?`<section class="panel"><div class="ph"><h2>Printed in This Prototype</h2></div><div class="wrap"><table><thead><tr><th>Certificate No.</th><th>Registration No.</th><th>Doc. No.</th></tr></thead><tbody>${S.printed.map(p=>`<tr><td class="mono">${p.cert}</td><td class="mono">${p.reg}</td><td class="mono">${p.doc}</td></tr>`).join("")}</tbody></table></div></section>`:""}`}};
function render(){document.getElementById("tabs").innerHTML=Object.keys(V).map(t=>`<button class="${t===S.tab?"on":""}" data-tab="${t}">${t}</button>`).join("");document.getElementById("page").innerHTML=V[S.tab]()}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;const v=id=>document.getElementById(id).value.trim();
 if(d.tab)S.tab=d.tab;
 else if(d.save==="doc"){S.doc={last:+v("docLast")||0,digits:+v("docDigits")||8};toast(`Saved. Next Doc. No. ${nextDoc()}`)}
 else if(d.save==="reg"){S.reg={...S.reg,prefix:v("regPrefix"),last:+v("regLast")||0};toast(`Saved. Next ${nextReg()}`)}
 else if(d.savec){const i=+d.savec;Object.assign(S.course[i],{prefix:v("cp"+i),last:+v("cl"+i)||0,digits:+v("cd"+i)||6});toast("Saved")}
 else if(d.act==="addOne"){const r={name:v("mName"),course:v("mCourse"),cert:v("mCert"),reg:v("mReg"),doc:v("mDoc"),date:v("mDate")};if(!r.cert||!r.reg||!r.doc){toast("Enter all three numbers");return}if(S.issued.some(x=>x.cert===r.cert||x.reg===r.reg||x.doc===r.doc)){toast("One of these numbers is already recorded");return}S.issued.push(r);toast("Recorded — these numbers are reserved")}
 else if(d.act==="print"){const c=S.course[0];c.last++;S.reg.last++;S.doc.last++;S.printed.push({cert:c.prefix+pad(c.last,c.digits),reg:`${S.reg.prefix}${pad(S.reg.last,S.reg.digits)}-${S.issueMonth}`,doc:pad(S.doc.last,S.doc.digits)});toast("Printed — the next numbers moved on")}
 else return;render()});
document.addEventListener("change",e=>{if(e.target.id==="csv"&&e.target.files[0]){toast(`${e.target.files[0].name}: 48 rows matched, 2 to fix (sample)`)}});
render();
</script>
