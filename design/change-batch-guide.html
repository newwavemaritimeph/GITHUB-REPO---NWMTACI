<style>
/* Same shell as the live portal: navy bar with dropdown tabs, summary rail on the left, light-cyan table headers. */
:root{--orange:#F25615;--blue:#0571D0;--cyan:#35CCFA;--cyan-l:#9EE3F1;--navy:#123F63;--bg:#f2f6f8;--surface:#fff;--fg:#0f2638;--muted:#587184;--line:#dbe6ec;--soft:#eef4f8;--th:#e6f6fd;--thc:#0b4f8f;--zebra:#f7fafc;
 --good:#0a7a3e;--good-bg:#e2f5e9;--warn:#a2470b;--warn-bg:#fdf0e5;--bad:#b42318;--bad-bg:#fcebea;--info:#0571D0;--info-bg:#e5f1fb;
 --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1722;--surface:#102231;--fg:#e3edf4;--muted:#91a9bb;--line:#20384b;--soft:#152d43;--th:#15344b;--thc:#9fd3f7;--zebra:#12283a;--good:#61d396;--good-bg:#113523;--warn:#ffa56a;--warn-bg:#382313;--bad:#ff8b80;--bad-bg:#3b1918;--info:#5fb4ff;--info-bg:#122e48;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1722;--surface:#102231;--fg:#e3edf4;--muted:#91a9bb;--line:#20384b;--soft:#152d43;--th:#15344b;--thc:#9fd3f7;--zebra:#12283a;--good:#61d396;--good-bg:#113523;--warn:#ffa56a;--warn-bg:#382313;--bad:#ff8b80;--bad-bg:#3b1918;--info:#5fb4ff;--info-bg:#122e48;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.mono,.amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{background:var(--navy);color:#fff;padding-block:16px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{display:flex;align-items:center;gap:12px}.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font:700 15px var(--sans)}.logo b{font-size:19px;font-weight:600}.logo b span{color:var(--orange)}.logo small{display:block;color:var(--cyan-l);font-size:14px}.proto{background:var(--orange);font:600 11px var(--sans);letter-spacing:.08em;padding:2px 8px;border-radius:5px;margin-left:8px}
.who{font-size:14px;color:#cfe3ef;display:flex;align-items:center;gap:8px}.who select{background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:8px;padding:5px 8px}.who select option{color:#0f2638}
.tabs{display:flex;gap:2px;margin-top:16px;flex-wrap:wrap}.tab>button{background:none;border:0;color:#c3dbea;font:500 16px var(--sans);padding:12px 18px;border-radius:10px 10px 0 0;white-space:nowrap;display:flex;align-items:center;gap:8px}.tab>button:hover{color:#fff;background:#ffffff12}.tab.on>button{background:var(--bg);color:var(--fg);font-weight:600}
.caret{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-3px) rotate(45deg)}
.menu{position:absolute;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #0003;padding:6px;z-index:15;display:flex;flex-direction:column;margin-top:2px}.tab{position:relative}.menu button{background:none;border:0;text-align:left;color:var(--fg);font:500 15.5px var(--sans);padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;gap:12px}.menu button:hover{background:var(--soft)}.menu button.on{background:var(--info-bg);color:var(--info);font-weight:600}.menu small,.n{font:600 11.5px var(--mono);background:var(--orange);color:#fff;border-radius:10px;padding:1px 7px}
.page{padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}.eyebrow{display:block;font:600 13px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}h1{font-size:25px;font-weight:600;margin:0}h2{font-size:19px;font-weight:600;margin:0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:16px}.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:14.5px}.seg button.on{background:var(--navy);color:#fff}
.rail{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}@media (max-width:900px){.rail{grid-template-columns:1fr}}.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.ph{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.ph small{color:var(--muted);font-size:14px}
.lines{display:flex;flex-direction:column;padding:0 20px 16px}.lines div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.lines div:first-child{border-top:0}.lines dd,.lines span:last-child{font-family:var(--mono);font-weight:600}.lines .tot{font-weight:700}.lines .bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 16px}.tile{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px}.tile span{display:block;font-size:13px;color:var(--muted)}.tile b{font:600 19px var(--mono)}
.cwrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14.5px}th{background:var(--th);color:var(--thc);font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:10px 12px;border-right:1px solid var(--line);white-space:nowrap}td{padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.35}tbody tr:nth-child(even) td{background:var(--zebra)}td small{display:block;color:var(--muted);font-size:12.5px}.r{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}.due{background:var(--bad-bg);color:var(--bad)}.dueo{background:var(--warn-bg);color:var(--warn)}.appr{background:var(--info-bg);color:var(--info)}.paid{background:var(--good-bg);color:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--blue);border-radius:9px;padding:7px 14px;font-weight:600;font-size:14.5px;white-space:nowrap}.pri{background:var(--orange);color:#fff;border:0}.okb{background:var(--good);color:#fff;border:0}.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:14px 20px;background:var(--soft);border-top:1px solid var(--line)}.form label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}.form select,.form input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);color:var(--fg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
.alert{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:500;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.note{font-size:13.5px;color:var(--muted);padding:0 20px 16px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
</style>
<style>
.views{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:18px}.views button{border:0;background:none;padding:10px 16px;font-weight:600;font-size:14.5px;color:var(--fg)}.views button.on{background:var(--orange);color:#fff}
.guide{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}@media (max-width:860px){.guide{grid-template-columns:1fr}}
.steps{display:flex;flex-direction:column;gap:6px}.steps button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px}
.steps button i{font-style:normal;flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font:700 13px var(--mono)}.steps button.on{border-color:var(--orange);box-shadow:0 0 0 2px var(--warn-bg)}.steps button.on i{background:var(--orange);color:#fff}.steps button.done i{background:var(--good);color:#fff}
.steps b{display:block;font-size:14.5px}.steps small{color:var(--muted);font-size:12.5px}
.who{display:inline-block;font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;background:var(--info-bg);color:var(--info);border-radius:99px;padding:2px 9px;margin-bottom:8px}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}.screen .bar{background:var(--navy);color:#cfe3ef;font-size:13px;padding:8px 14px}
.screen .body{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.hl{outline:3px solid var(--orange);outline-offset:3px;border-radius:9px}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media (max-width:560px){.f{grid-template-columns:1fr}}
.f label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600}.f input,.f select{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--surface);color:var(--fg);font:inherit;font-weight:400}.f .full{grid-column:1/-1}
.tip{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;padding:12px 20px;border-top:1px solid var(--line)}
.fee td:first-child{color:var(--muted)}
</style>
<header class="top"><div class="w">
 <div class="brand"><div class="logo"><div class="mark">NW</div><div><b>New <span>Wave</span> Portal<span class="proto">GUIDE</span></b><small>Ride the New Wave of Maritime Excellence</small></div></div><div class="who" style="color:#cfe3ef;background:none">How to Change a Batch</div></div>
 <nav class="tabs"><div class="tab on"><button>Guide</button></div></nav>
</div></header>
<main class="page"><div class="w">
 <div class="views" id="views"><button data-v="A" class="on">A · Move One Trainee to Another Batch</button><button data-v="B">B · Move the Whole Batch to New Dates</button></div>
 <div class="guide"><div class="steps" id="steps"></div><div><section class="screen"><div class="bar" id="crumb"></div><div class="body" id="body"></div><div class="nav"><button class="btn" id="prev">Back</button><button class="btn pri" id="next">Next</button></div></section></div></div>
</div></main>
<script>
const $=id=>document.getElementById(id);
const FLOWS={
A:[
 {t:"Open the Trainee's Course",who:"Registration",c:"Registration › Trainees & Enrollments",h:`<div class="tip">Search the trainee, then click the course row (e.g. <b>Crowd · BCH-2026-0612 · Nov 3–4</b>). The Enrollment window opens.</div><table><thead><tr><th>Trainee</th><th>Course</th><th>Schedule</th><th>Status</th></tr></thead><tbody><tr class="hl"><td><b>REYES, Marco A.</b><small>NWMTACI-0001482</small></td><td>Crowd</td><td>Nov 3–4</td><td><span class="pill paid">Enrolled</span></td></tr></tbody></table>`},
 {t:"Request a Change › Change Batch",who:"Registration",c:"Enrollment window › Request a Change",h:`<div class="tip">Under <b>Request a Change</b>, click <b>Change batch / reschedule</b>.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn hl">Change batch / reschedule</button><button class="btn">Change course</button><button class="btn">Make-up class</button><button class="btn">Cancellation</button></div>`},
 {t:"Pick the New Batch and Reason",who:"Registration",c:"Change batch / reschedule",h:`<div class="f"><label class="full hl">New Batch<select><option>BCH-2026-0640 · Crowd · Tue Nov 10 – Wed Nov 11 · 18 seats left</option><option>BCH-2026-0655 · Crowd · Tue Nov 17 – Wed Nov 18 · 24 seats left</option></select></label><label class="full">Reason<input value="Trainee has a ship schedule on Nov 3"></label><label>Date Requested<input type="date" value="2026-10-29"></label></div><div class="tip">Only open batches of the <b>same course</b> with seats left are listed. Click <b>Send to the Cashier</b>.</div>`},
 {t:"Cashier Collects the Fee",who:"Cashier",c:"Cashier › Accounting › Requests",h:`<div class="tip">The request appears under <b>Needs Charges</b>. The fee is computed from the request date:</div><table class="fee"><tbody><tr><td>3 or more days before the start</td><td><b>₱300.00</b></td></tr><tr><td>1–2 days before, or after the start</td><td><b>50% of the fee + ₱250.00</b></td></tr></tbody></table><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn hl">Add Charge · ₱300.00</button><button class="btn pri">Record Payment</button></div>`},
 {t:"Moved Automatically Once Paid",who:"Automatic",c:"Trainee's Enrollment",h:`<div class="tip">As soon as the fee is paid, the change is applied: the trainee moves to the new batch, the seat counts update on both batches, and the request shows <b>Approved</b>.</div><table><thead><tr><th>Before</th><th>After</th></tr></thead><tbody><tr><td><s>Crowd · Nov 3–4 · BCH-2026-0612</s></td><td><b>Crowd · Nov 10–11 · BCH-2026-0640</b></td></tr></tbody></table><div class="tip">Then print a new <b>TAR</b> from the Trainee Account (it now shows the new dates).</div>`},
],
B:[
 {t:"Open Class Schedules",who:"Admin Assistant · Admin",c:"Class Schedules",h:`<div class="tip">Use this when the <b>whole batch</b> moves (e.g. a holiday). Everyone on it moves together.</div><table><thead><tr><th>Batch No.</th><th>Course</th><th>Dates</th><th class="r">Seats</th><th></th></tr></thead><tbody><tr><td class="mono">BCH-2026-0612</td><td>Crowd</td><td>Tue Nov 3 – Wed Nov 4</td><td class="r mono">14/24</td><td><button class="btn hl">Edit</button></td></tr></tbody></table>`},
 {t:"Move to New Dates",who:"Admin Assistant · Admin",c:"Edit Schedule › Move to New Dates",h:`<div class="f"><label class="hl">New Start Date<input type="date" value="2026-11-10"></label><label>Automatic End Date<input type="date" value="2026-11-11" readonly></label><label class="full hl">Reason<input value="Holiday · Bonifacio Day"></label></div><div class="tip">Any day except Sunday. The end date follows the course length; Sundays are skipped.</div>`},
 {t:"Email the Trainees and Move",who:"Admin Assistant · Admin",c:"Edit Schedule › Move to New Dates",h:`<label style="display:flex;gap:10px;align-items:center" class="hl"><input type="checkbox" checked style="width:18px;height:18px">Email the 14 trainees on this batch the new dates</label><div style="display:flex;justify-content:flex-end"><button class="btn pri hl">Move Batch</button></div>`},
 {t:"Done",who:"Automatic",c:"Class Schedules",h:`<table><thead><tr><th>Batch No.</th><th>Dates</th><th>Note</th></tr></thead><tbody><tr><td class="mono">BCH-2026-0612</td><td><b>Tue Nov 10 – Wed Nov 11</b></td><td>Moved · was Nov 3–4</td></tr></tbody></table><div class="tip">Trainees, payments, room and instructors stay on the batch. Each trainee gets an email with the old and new dates. Batches already started or with attendance can't be moved.</div>`},
]};
let flow="A",i=0;
function render(){const F=FLOWS[flow];$("steps").innerHTML=F.map((s,k)=>`<button data-k="${k}" class="${k===i?"on":k<i?"done":""}"><i>${k<i?"✓":k+1}</i><span><b>${s.t}</b><small>${s.who}</small></span></button>`).join("");
 $("crumb").textContent=F[i].c;$("body").innerHTML=`<span class="who">${F[i].who}</span>`+F[i].h;$("prev").disabled=i===0;$("next").textContent=i===F.length-1?"Start Again":"Next"}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.v){flow=b.dataset.v;i=0;document.querySelectorAll("#views button").forEach(x=>x.classList.toggle("on",x===b));render()}
 if(b.dataset.k){i=+b.dataset.k;render()}
 if(b.id==="prev"&&i>0){i--;render()}
 if(b.id==="next"){i=i===FLOWS[flow].length-1?0:i+1;render()}});
render();
</script>
