asts mean?","options":["I do not understand your intentions or doubt your action","I am altering course to starboard","I am at anchor","I am turning around"],"answer":0,"why":"Rule 34(d) sets this signal for doubt about the other vessel's intentions."},{"q":"What all-round lights does a vessel engaged in trawling show?","options":["Red over white","Red over red","White over red","Green over white"],"answer":3,"why":"Rule 26: trawlers show green over white; other fishing vessels show red over white."},{"q":"A power-driven vessel underway must keep out of the way of:","options":["A vessel overtaking her","A seaplane taking off","A vessel engaged in fishing","A power-driven vessel on her port side when crossing"],"answer":2,"why":"Rule 18 requires power-driven vessels to keep clear of vessels engaged in fishing."},{"q":"How long is a prolonged blast?","options":["10 to 12 seconds","2 seconds","About 1 second","4 to 6 seconds"],"answer":3,"why":"Rule 32 defines a prolonged blast as four to six seconds."}],"COW - Crude Oil Washing System":[{"q":"What is crude oil washing (COW)?","options":["Washing the deck with detergents","Cleaning the engine with crude oil","Washing tanks with seawater only","Washing cargo tanks with the crude oil cargo during discharge"],"answer":3,"why":"COW uses high-pressure jets of the crude cargo to dissolve tank residues."},{"q":"How does crude oil washing help prevent pollution?","options":["It increases the cargo weight","It makes the ship faster","It removes sludge and residues, so less oily waste is produced","It cools the cargo"],"answer":2,"why":"Less residue means less oily water from tank cleaning and more cargo delivered."},{"q":"Before and during COW, the oxygen content in the cargo tanks must not exceed:","options":["15% by volume","12% by volume","8% by volume","21% by volume"],"answer":2,"why":"Tanks must be inerted to 8% oxygen or less to prevent a flammable atmosphere."},{"q":"Which MARPOL Annex contains the crude oil washing requirements?","options":["Annex II","Annex V","Annex VI","Annex I"],"answer":3,"why":"MARPOL Annex I covers oil pollution, including COW on crude oil tankers."},{"q":"Which approved document describes the ship's COW system and procedures?","options":["Cargo Securing Manual","COW Operations and Equipment Manual","Garbage Management Plan","Ship Security Plan"],"answer":1,"why":"MARPOL requires an approved COW Operations and Equipment Manual onboard."},{"q":"Why must cargo tanks be inerted during crude oil washing?","options":["To make the oil heavier","To cool the crude oil","To clean the inert gas system","Washing jets can create static electricity that may ignite flammable gas"],"answer":3,"why":"Inert gas keeps oxygen too low for combustion, so static sparks cannot ignite vapors."},{"q":"In which record book are COW operations recorded?","options":["Garbage Record Book","Oil Record Book Part II","Deck log only","Oil Record Book Part I"],"answer":1,"why":"ORB Part II records cargo and ballast operations, including crude oil washing."},{"q":"What should be done if a leak is found in the COW lines?","options":["Stop washing immediately and investigate","Continue and report later","Ignore small leaks","Increase the pressure"],"answer":0,"why":"Leaks of crude oil under pressure are a fire and pollution hazard."},{"q":"What should be done before starting COW?","options":["Complete the checklist and test the system for leaks","Open all tank hatches","Start washing without checks","Disable the alarms"],"answer":0,"why":"Checks confirm the equipment, inert gas and communication are ready and safe."},{"q":"Which COW stage washes the lowest parts of the tank to remove sediment?","options":["Hull wash","Top wash","Bottom wash","Deck wash"],"answer":2,"why":"Bottom washing cleans the tank bottom area where sludge and sediment collect."}],"CSA - Cyber Security Awareness":[{"q":"What is phishing?","options":["A type of firewall","A fishing method","A software update","Fake messages that trick you into giving information or clicking bad links"],"answer":3,"why":"Phishing emails pretend to be trusted senders to steal data or install malware."},{"q":"What is malware?","options":["An approved cleaning program","Software designed to damage or gain access to systems","A spare engine part","A weather service"],"answer":1,"why":"Malware includes viruses, ransomware and spyware."},{"q":"What should you do with a USB drive from an unknown source?","options":["Format it on the bridge computer","Plug it into the ECDIS to check it","Do not plug it in; give it to the responsible officer","Use it for crew movies"],"answer":2,"why":"Unknown removable media can carry malware into ship systems."},{"q":"Which is good password practice?","options":["Use the same password everywhere","Share it with friends","Write it on the monitor","Use a long, unique password and do not share it"],"answer":3,"why":"Unique, private passwords limit damage if one account is compromised."},{"q":"IMO Resolution MSC.428(98) requires cyber risks to be addressed in the:","options":["Cargo Securing Manual","Safety Management System (SMS)","Crew list","Garbage Management Plan"],"answer":1,"why":"Companies must include cyber risk management in their ISM safety management systems."},{"q":"What should you do if you suspect a cyber incident onboard?","options":["Post about it online","Report it immediately following the ship's procedure","Ignore it","Fix it yourself by deleting files"],"answer":1,"why":"Fast reporting limits the damage and starts the response plan."},{"q":"Which is an example of shipboard operational technology (OT)?","options":["ECDIS","A galley cookbook","A crew member's personal phone","A paper logbook"],"answer":0,"why":"OT systems such as ECDIS and engine controls run the ship and must be protected."},{"q":"What should be done with software updates on ship computers?","options":["Install approved updates and patches","Never update anything","Download them from any website","Turn off the antivirus first"],"answer":0,"why":"Approved updates fix security weaknesses."},{"q":"What is multi-factor authentication?","options":["Using two or more ways to prove identity, such as a password and a code","Sharing one account between crew","Using two passwords written on paper","Logging in twice"],"answer":0,"why":"MFA makes it much harder for attackers to use a stolen password."},{"q":"What is the principle of least privilege?","options":["No passwords are used","Visitors get full access","Users get only the access they need for their job","Everyone gets administrator rights"],"answer":2,"why":"Limiting access reduces the harm from mistakes or compromised accounts."}],"CSF - Container Ship Familiarization":[{"q":"What does TEU stand for?","options":["Ton Equivalent Unit","Total Export Unit","Twenty-foot Equivalent Unit","Transport Equipment Unit"],"answer":2,"why":"TEU is the standard unit for container capacity, based on a 20-foot container."},{"q":"What does the bay-row-tier system identify?","options":["The voyage number","The cargo weight","The container's owner","The container's position along, across and up the ship"],"answer":3,"why":"Bay is the position fore and aft, row is across, and tier is the height."},{"q":"What are twistlocks used for?","options":["Locking containers to each other and to the deck or hatch","Opening container doors","Lifting containers","Connecting reefer power"],"answer":0,"why":"Twistlocks fit into corner castings to secure containers in place."},{"q":"How should container lashings be maintained at sea?","options":["Never touch lashings at sea","Check regularly and tighten as needed, especially before bad weather","Remove some to save weight","Check only at the discharge port"],"answer":1,"why":"Lashings can loosen as the ship moves, so they must be checked and tightened."},{"q":"How are heavy containers generally stowed?","options":["Only on deck","In any random position","On top of lighter containers","Below lighter containers"],"answer":3,"why":"Heavy containers low in the stack keep the stack stable and the ship's center of gravity low."},{"q":"How is segregation of dangerous goods containers decided?","options":["By the IMDG Code segregation requirements","By the crew's preference","By the container color","By the ship's menu"],"answer":0,"why":"The IMDG Code sets how far apart incompatible dangerous goods must be stowed."},{"q":"How should reefer containers be monitored?","options":["Check only at loading","Open the doors to check the cargo","Check and record the set point and actual temperature regularly","Switch them off at night"],"answer":2,"why":"Regular checks catch power or unit failures before the cargo spoils."},{"q":"Under SOLAS, what does VGM mean for a packed container?","options":["Variable Gross Measurement","Verified Gross Mass","Vessel General Manifest","Very Good Merchandise"],"answer":1,"why":"SOLAS requires the shipper to provide the verified gross mass before loading."},{"q":"Parametric rolling is a danger for container ships mainly in:","options":["Head or following seas","At anchor","Calm harbor waters","In dry dock"],"answer":0,"why":"Parametric rolling can build up quickly in head or following seas and cause container losses."},{"q":"What is a key safety rule when working on a container ship deck?","options":["Walk under suspended containers","Work alone at night without a radio","Wear PPE and stay clear of lifting areas and moving containers","Climb stacks without fall protection"],"answer":2,"why":"Container operations involve heavy moving loads and working at height."}],"CST - Crane Safety Training":[{"q":"What is the main hazard during crane operations?","options":["Bright daylight","Too much paint on the crane","A clean deck","Dropped or swinging loads striking people"],"answer":3,"why":"Falling or swinging loads cause the most serious lifting injuries."},{"q":"When should a crane pre-use inspection be done?","options":["Before each use or shift, as the manufacturer and SMS require","Only once a year","Only after an accident","Never, if it looks fine"],"answer":0,"why":"Daily checks find defects before they cause a failure."},{"q":"What should a lifting plan include?","options":["Load weight, equipment, rigging, sequence, people and hazards","The fuel price","The daily menu","Crew holiday dates"],"answer":0,"why":"A lifting plan makes sure every part of the lift is thought through."},{"q":"Where should the SWL of a crane be shown?","options":["On the galley wall","Nowhere","Clearly marked on the crane and in its certificates","Only in the Master's memory"],"answer":2,"why":"The SWL must be visible so the operator never exceeds it."},{"q":"What is the purpose of an exclusion zone during lifting?","options":["To store tools","To park vehicles","To provide a smoking area","To keep people out of the area where a load could fall or swing"],"answer":3,"why":"Barriers and zones keep people away from the danger area."},{"q":"What should be done if communication fails during a lift?","options":["Continue the lift","Guess the next signal","Stop the lift immediately","Lift faster"],"answer":2,"why":"Without clear communication, continuing the lift is unsafe."},{"q":"If the crane loses power with a load suspended, what should be done?","options":["Pull the load by hand","Keep the area clear and follow the emergency procedure","Leave without warning anyone","Walk under the load to check it"],"answer":1,"why":"Securing the area protects people until the load can be lowered safely."},{"q":"What does a hook safety latch do?","options":["Measures the load weight","Prevents the sling from slipping off the hook","Locks the crane cabin","Increases the SWL"],"answer":1,"why":"The latch keeps slings and lifting gear from coming off the hook."},{"q":"What should be done if a defect is found on a crane?","options":["Do not use it and report the defect","Use it carefully","Repair it during the lift","Ignore minor defects"],"answer":0,"why":"A defective crane must not be used until repaired and checked."},{"q":"What should be assessed before lifting at sea?","options":["Only whether it is raining","Wind, ship motion and visibility","Only the time of day","Nothing, weather never matters"],"answer":1,"why":"Weather and ship motion affect load control and crane limits."}],"ILO - Food Safety and Hygiene":[{"q":"Which temperature range is known as the danger zone, where bacteria grow fastest?","options":["60°C to 100°C","5°C to 60°C","-18°C to 0°C","100°C to 120°C"],"answer":1,"why":"Bacteria multiply quickly between about 5°C and 60°C, so food should spend as little time as possible in this range."},{"q":"Which of these is a physical food hazard?","options":["Salmonella bacteria","Cleaning chemical residue","Mould toxins","A piece of broken glass"],"answer":3,"why":"Physical hazards are foreign objects such as glass, metal or bone that can injure the person eating the food."},{"q":"When chilled food is delivered on board, what should be checked?","options":["Temperature, packaging condition and expiry date","The total weight of all deliveries combined","The brand name and country of the supplier","The number of boxes on each pallet only"],"answer":0,"why":"Temperature, packaging and dates show whether the food is still safe to accept."},{"q":"In a refrigerator, where should raw meat be stored?","options":["On the top shelf above cooked food","Next to open ready-to-eat salads","On the bottom shelf below cooked food","On the door shelves for easy access"],"answer":2,"why":"Keeping raw meat at the bottom stops its juices from dripping onto cooked or ready-to-eat food."},{"q":"What is a safe way to thaw frozen meat?","options":["Leave it on the galley counter overnight","Thaw it slowly in the refrigerator","Soak it in warm water for several hours","Place it near the hot galley range"],"answer":1,"why":"Thawing in the refrigerator keeps the meat out of the danger zone while it defrosts."},{"q":"What does cross-contamination mean?","options":["Transfer of harmful germs from one food or surface to another","Mixing two different recipes in one pot","Cooking food at two different temperatures","Storing dry food and canned food together"],"answer":0,"why":"Cross-contamination is the spread of bacteria, for example from raw meat to cooked food through hands, boards or knives."},{"q":"Hot food kept ready for service should be held at what temperature?","options":["Around 30°C","Around 45°C","Normal room temperature","60°C or higher"],"answer":3,"why":"Holding hot food at 60°C or above keeps it out of the danger zone."},{"q":"A food handler has diarrhoea and vomiting. What should he do?","options":["Continue working but wear gloves","Work only in the dry store","Report to his supervisor and stay away from food handling","Take medicine and return to the galley at once"],"answer":2,"why":"Sick food handlers can pass germs to food, so they must report and be kept away from food work until cleared."},{"q":"Which MLC 2006 regulation covers food and catering on board?","options":["Regulation 3.2","Regulation 1.1","Regulation 2.3","Regulation 4.5"],"answer":0,"why":"MLC 2006 Regulation 3.2 sets the requirements for food and catering for seafarers."},{"q":"A chiller is found running too warm. What is the correct corrective action?","options":["Ignore it if the food still smells fine","Switch off the chiller to let it rest","Add more food to keep it cold","Check the food, discard unsafe items and report it for repair"],"answer":3,"why":"Corrective action means removing food that may be unsafe and fixing the cause of the problem."}],"ILO - Food and Catering Management":[{"q":"Under MLC 2006, how must food be provided to seafarers during their engagement?","options":["At a discounted crew price","Only during working hours","Free of charge","Only on long voyages"],"answer":2,"why":"MLC 2006 Regulation 3.2 requires that seafarers be provided with food free of charge during their engagement."},{"q":"Which nutrient is the body's main source of energy?","options":["Carbohydrates","Vitamins","Minerals","Water"],"answer":0,"why":"Carbohydrates such as rice, bread and potatoes are the body's main energy source."},{"q":"What should menu planning on board take into account?","options":["Only the cook's favourite dishes","Only the cheapest items available","Only the master's personal preferences","Nutrition, crew culture and religious needs"],"answer":3,"why":"MLC 2006 requires food that is nutritious and suited to the crew's religious requirements and cultural practices."},{"q":"Which stock rotation method makes sure older items are used first?","options":["LIFO (Last In, First Out)","FIFO (First In, First Out)","Random selection from shelves","Bulk issue once a month"],"answer":1,"why":"FIFO means the oldest stock is used first, which reduces spoilage."},{"q":"Under MLC 2006, what is the minimum age for a ship's cook?","options":["16 years","17 years","18 years","21 years"],"answer":2,"why":"MLC 2006 Standard A3.2 states that no seafarer under 18 shall work as a ship's cook."},{"q":"Under MLC 2006, who carries out frequent documented inspections of food and water supplies?","options":["The port agent","The master or an officer under his authority","The ship chandler","Any passenger on board"],"answer":1,"why":"MLC 2006 requires frequent documented inspections of food, water and catering spaces by or under the authority of the master."},{"q":"What helps a catering supervisor keep the same portion size every time?","options":["Standard recipes and portion tools","Using larger plates","Guessing the amount by eye","Serving only one dish"],"answer":0,"why":"Standard recipes, ladles and scoops give consistent portions and control food cost."},{"q":"How is food cost per person per day calculated?","options":["Total food cost multiplied by the number of crew","Number of crew divided by voyage days","Total stores weight divided by number of meals","Total food cost divided by (number of crew x number of days)"],"answer":3,"why":"Dividing total food cost by the number of man-days gives the daily cost per person."},{"q":"Which record shows the food items received and issued from the storerooms?","options":["Oil Record Book","Deck logbook","Provision stock (inventory) record","Garbage Record Book"],"answer":2,"why":"The provision inventory record tracks what comes in, what is issued and what remains."},{"q":"A messman is seen not washing hands before handling food. What should the catering supervisor do?","options":["Explain the correct practice and follow up","Ignore it to avoid conflict","Report it only at the end of the contract","Do the messman's tasks himself every time"],"answer":0,"why":"A good supervisor corrects unsafe practice at once and checks that it improves."}],"ILO - Galley (Provision) Management":[{"q":"What are the main factors when planning provisions for a voyage?","options":["The colour of the packaging","Only the price of each item","The location of the supplier","Voyage length, number of crew and menu plan"],"answer":3,"why":"Provisions must match how many people will eat, for how long, and what the menu requires."},{"q":"When provisions arrive, what should they be checked against?","options":["The previous month's menu","The purchase order or requisition","The crew list","The cargo manifest"],"answer":1,"why":"Comparing the delivery with the order confirms correct items, quantities and quality."},{"q":"A delivery of frozen meat shows signs of thawing and refreezing. What should you do?","options":["Reject it and record the reason","Accept it and cook it right away","Refreeze it as quickly as possible","Mix it with the good stock"],"answer":0,"why":"Thawed and refrozen meat may be unsafe, so it should be rejected and the reason documented."},{"q":"How should dry stores be kept?","options":["On the floor near the bulkhead","Next to the cleaning chemicals","Off the floor in a cool, dry, ventilated room","In the engine room for warmth"],"answer":2,"why":"Dry, cool, ventilated storage off the floor protects food from moisture, pests and spoilage."},{"q":"Why must cleaning chemicals be stored away from food?","options":["To save shelf space","Because they are expensive","Because the cook uses them daily","To prevent chemical contamination of food"],"answer":3,"why":"Keeping chemicals separate prevents them from leaking or being mistaken for food."},{"q":"Under FEFO stock rotation, which items are issued first?","options":["Items with the earliest expiry date","The newest items received","The largest packs in stock","Items in alphabetical order"],"answer":0,"why":"FEFO means First Expired, First Out, so items that expire soonest are used first."},{"q":"What is the usual storage temperature for frozen provisions?","options":["0°C","4°C","-18°C or lower","-5°C"],"answer":2,"why":"Frozen food is normally kept at -18°C or colder to stop bacterial growth and keep quality."},{"q":"Why should a provision inventory be taken regularly?","options":["To give the crew extra meals","To know stock levels and plan the next order","To change the menu every day","To avoid using the storerooms"],"answer":1,"why":"Regular inventory shows what is left, reveals losses and guides the next order."},{"q":"Where should fresh fruits and vegetables be stored?","options":["In the same box as raw fish","Under the frozen meat","In the dry store with the flour","In a separate cool room or chiller"],"answer":3,"why":"Fresh produce lasts longer in its own cool room and is kept away from raw meat and fish."},{"q":"Which practice helps to minimize food waste?","options":["Ordering only what the menu and crew size require","Ordering extra of every item","Cooking large amounts at each meal","Throwing away all leftovers right away"],"answer":0,"why":"Ordering according to actual needs prevents stock from expiring unused."}],"ILO - Galley Affairs and Housekeeping":[{"q":"Why should the galley follow a fixed daily routine?","options":["To make the work last longer","To keep work orderly, clean and on time","To avoid inspections","To reduce the number of meals"],"answer":1,"why":"A set routine makes sure cooking, cleaning and storage tasks are done properly and on schedule."},{"q":"What is the correct order for cleaning a food work surface?","options":["Sanitize, rinse, then wash","Rinse only with cold water","Remove debris, wash, rinse, then sanitize","Wipe with a dry cloth only"],"answer":2,"why":"Dirt must be removed and washed off first so that the sanitizer can work on a clean surface."},{"q":"Food waste disposal from ships is regulated under which MARPOL annex?","options":["Annex V","Annex I","Annex IV","Annex VI"],"answer":0,"why":"MARPOL Annex V covers garbage from ships, including food waste."},{"q":"How must plastics be handled on board?","options":["Thrown overboard beyond 12 nautical miles","Burned in the galley range","Mixed with food waste","Kept separate and never discharged into the sea"],"answer":3,"why":"MARPOL Annex V prohibits discharging plastics into the sea anywhere."},{"q":"Why should galley exhaust hoods and grease filters be cleaned regularly?","options":["To make the galley quieter","To reduce the risk of a grease fire","To save fresh water","To cool the food faster"],"answer":1,"why":"Grease build-up in hoods and ducts can catch fire and spread it quickly."},{"q":"What is the main purpose of a galley housekeeping inspection?","options":["To count the crew","To check the ship's stability","To find and correct unsafe or unclean conditions","To plan cargo stowage"],"answer":2,"why":"Inspections identify hazards and hygiene problems so they can be fixed."},{"q":"Cooking oil is spilled on the galley floor. What should be done?","options":["Leave it to dry by itself","Cover it with old newspaper","Clean it only at the end of the day","Clean it up immediately and warn others"],"answer":3,"why":"Prompt clean-up prevents slips and falls in the galley."},{"q":"How should galley knives be handled after use?","options":["Washed separately and stored in a knife rack","Left in a sink full of soapy water","Kept loose in a drawer with other tools","Left on the edge of the counter"],"answer":0,"why":"A knife hidden in soapy water or loose in a drawer can cut someone, so it is washed separately and stored safely."},{"q":"In heavy weather, how should pots on the galley range be kept?","options":["Filled to the top","Left uncovered","Secured with fiddles or pot rails","Placed on the floor"],"answer":2,"why":"Fiddles and rails stop pots from sliding off and causing burns when the ship rolls."},{"q":"How should garbage in the galley be handled?","options":["Mixed together in one bin","Segregated into the correct marked bins","Stored under the cooking range","Kept in open containers"],"answer":1,"why":"Segregation follows the ship's garbage management plan and MARPOL Annex V."}],"ILO - Galley Awareness Course":[{"q":"Who is usually in charge of the galley and food preparation on board?","options":["The chief cook","The bosun","The second engineer","The radio officer"],"answer":0,"why":"The chief cook is responsible for galley operations, food preparation and galley staff."},{"q":"How should you carry a knife in the galley?","options":["Point up over your head","In your back pocket","Blade forward, swinging at your side","Point down, blade close to your side"],"answer":3,"why":"Carrying a knife point down close to the body prevents injury if you slip or bump someone."},{"q":"What must you do before cleaning a meat slicer?","options":["Run it at full speed","Wet the motor housing","Switch it off and unplug or isolate it","Remove the guard while it is running"],"answer":2,"why":"Isolating the power prevents the blade from starting while your hands are near it."},{"q":"What is the correct action for a deep-fat fryer fire?","options":["Pour water on it","Turn off the heat and use a fire blanket or wet chemical extinguisher","Carry the fryer outside","Fan the flames to cool them"],"answer":1,"why":"Water on burning oil causes a violent flare-up, so cut the heat and smother the fire."},{"q":"Why should you never operate electrical galley equipment with wet hands?","options":["Risk of electric shock","It rusts the switches","It wastes electricity","It slows down the machine"],"answer":0,"why":"Water conducts electricity, so wet hands greatly increase the risk of electric shock."},{"q":"Which is good personal hygiene for galley workers?","options":["Wearing jewellery while cooking","Tasting food with fingers","Wiping hands on the apron","Washing hands often and keeping nails short"],"answer":3,"why":"Clean hands and short nails reduce the spread of germs to food."},{"q":"When should galley workers wash their hands?","options":["Only at the end of the shift","After using the toilet and after handling raw food","Only before their own meals","Only when hands look dirty"],"answer":1,"why":"Hands pick up germs from the toilet and raw food and must be washed before touching other food."},{"q":"Which injury is most often caused by hot oil or water spills in the galley?","options":["Fractures","Electric shock","Burns and scalds","Hearing loss"],"answer":2,"why":"Hot liquids cause burns and scalds, one of the most common galley injuries."},{"q":"What should you do first if you discover a fire in the galley?","options":["Raise the alarm and follow the fire procedure","Keep cooking and wait","Cover it and tell no one","Open all doors and leave"],"answer":0,"why":"Raising the alarm early brings help and starts the ship's fire response."},{"q":"Why are galley ranges and ovens switched off when not in use?","options":["To make food taste better","To clean them while hot","To keep the galley warm","To prevent fires and save energy"],"answer":3,"why":"Unattended hot equipment is a fire risk and wastes energy."}],"ILO - Galley Hygiene and Food Sanitation":[{"q":"Cleaning removes dirt. What does sanitizing do?","options":["Adds flavour to the surface","Dries the surface","Reduces germs to a safe level","Polishes the surface"],"answer":2,"why":"Sanitizing, or disinfecting, reduces harmful microorganisms to a safe level after cleaning."},{"q":"Which are common signs of pests in a galley?","options":["Droppings, gnaw marks and damaged packaging","Clean, sealed containers","Bright lighting","Low humidity"],"answer":0,"why":"Droppings, gnawing and torn packaging show that rodents or insects are present."},{"q":"What is the best way to keep pests out of food stores?","options":["Leave stores open for ventilation","Keep food covered, areas clean and gaps sealed","Keep food on the floor","Store garbage near the food rooms"],"answer":1,"why":"Pests need food, shelter and entry points, so cleanliness and sealing gaps keep them out."},{"q":"Who should apply pesticides on board?","options":["Any crew member who sees a pest","The cook during food preparation","Any passenger","Trained persons following safe procedures, away from food"],"answer":3,"why":"Pesticides are poisons and must be applied only by trained persons without contaminating food."},{"q":"How should chopping boards for raw meat and cooked food be used?","options":["One board, washed once a day","Wooden boards only","Separate boards, often colour-coded","Stored together on the floor"],"answer":2,"why":"Separate, colour-coded boards prevent cross-contamination between raw and cooked food."},{"q":"Why must cleaning cloths be changed and washed often?","options":["To make them look new","Dirty cloths can spread bacteria","To use more detergent","Because they shrink"],"answer":1,"why":"A dirty cloth spreads germs from one surface to another."},{"q":"How should dishes be washed?","options":["In hot soapy water, then rinsed and sanitized","In cold seawater only","With a dry towel only","Once a week"],"answer":0,"why":"Washing, rinsing and sanitizing remove food soil and kill remaining germs."},{"q":"Salmonella, often found in raw poultry and eggs, is a type of:","options":["Virus","Mould","Parasite","Bacteria"],"answer":3,"why":"Salmonella is a bacterium and a common cause of food poisoning."},{"q":"How should waste bins in the galley be kept?","options":["Left open for easy use","Covered with lids and emptied regularly","Placed next to food preparation tables","Washed once a month"],"answer":1,"why":"Covered, regularly emptied bins limit smells, pests and contamination."},{"q":"When does a sanitizing solution work properly?","options":["When mixed with any other chemical","When used on dirty, greasy surfaces","When mixed at the strength stated by the maker","When made as strong as possible"],"answer":2,"why":"The correct dilution kills germs safely; too weak fails and too strong can be harmful."}],"ILO - Galley Hygiene with HACCP":[{"q":"What does HACCP stand for?","options":["Health and Catering Control Program","Hazard Analysis and Critical Control Points","Hygiene Assessment and Cooking Control Plan","Hazard Avoidance and Cleaning Check Procedure"],"answer":1,"why":"HACCP stands for Hazard Analysis and Critical Control Points."},{"q":"What is the first principle of HACCP?","options":["Keep records","Set critical limits","Verify the system","Conduct a hazard analysis"],"answer":3,"why":"HACCP begins by identifying the hazards that could make food unsafe."},{"q":"What is a critical control point (CCP)?","options":["A step where control is essential to prevent or reduce a food hazard","Any step where food is moved from one room to another","The office where the galley records are kept","The point where crew collect their meals"],"answer":0,"why":"A CCP is a step where a control can prevent, remove or reduce a hazard to a safe level."},{"q":"What are the three main types of food hazards?","options":["Hot, cold and warm","Fresh, frozen and dry","Biological, chemical and physical","Meat, fish and vegetables"],"answer":2,"why":"Food hazards are grouped as biological (germs), chemical (substances) and physical (objects)."},{"q":"Cooking chicken to a safe core temperature is an example of a:","options":["Cleaning schedule","Critical control point","Purchase order","Storage rule"],"answer":1,"why":"Cooking kills harmful bacteria, so it is a key control step in HACCP."},{"q":"How should the core temperature of cooked food be checked?","options":["By touching the food","By looking at the colour only","By smelling the food","With a clean, calibrated probe thermometer"],"answer":3,"why":"Only a calibrated probe thermometer gives a reliable core temperature."},{"q":"Monitoring shows a critical limit was not met. What must you do?","options":["Write down the correct value anyway","Serve the food quickly","Take the planned corrective action","Wait for the next shift"],"answer":2,"why":"HACCP requires planned corrective action whenever a critical limit is not met."},{"q":"Why are HACCP records important?","options":["They prove controls were monitored and actions taken","They decorate the galley","They replace cleaning","They are only the cook's personal diary"],"answer":0,"why":"Records show inspectors and the company that the HACCP system is being followed."},{"q":"How is galley sanitation supported in a HACCP system?","options":["Random cleaning when there is free time","Cleaning only before inspections","Cleaning done by passengers","Written cleaning schedules and prerequisite programs"],"answer":3,"why":"Prerequisite programs such as cleaning schedules provide the hygiene base that HACCP depends on."},{"q":"What is the safe internal cooking temperature commonly taught for poultry?","options":["45°C","74°C","55°C","35°C"],"answer":1,"why":"Poultry is commonly cooked to at least 74°C in the thickest part to kill bacteria such as Salmonella."}],"ILO - Good Housekeeping Course":[{"q":"What does good housekeeping on board mean?","options":["Keeping work areas clean, orderly and free of hazards","Cleaning only when an inspector visits","Storing everything on the floor","Painting the accommodation"],"answer":0,"why":"Good housekeeping keeps spaces tidy and safe, which prevents accidents."},{"q":"Before using a cleaning chemical, what should you read first?","options":["The crew list","The weekly menu","The label and Safety Data Sheet (SDS)","The ship's logbook"],"answer":2,"why":"The label and SDS explain hazards, correct use and required protection."},{"q":"Why should bleach never be mixed with ammonia-based cleaners?","options":["The mixture loses its colour","It makes surfaces sticky","It wastes both chemicals","It produces a toxic gas"],"answer":3,"why":"Bleach and ammonia react to release toxic chloramine gas."},{"q":"What is the most common cause of slips on board?","options":["Bright lights","Wet or oily floors","Wide passageways","Handrails"],"answer":1,"why":"Wet or oily surfaces reduce grip and cause slips."},{"q":"Which of these is a trip hazard?","options":["Hoses and cables left across walkways","Clear passageways","Proper lighting","Non-slip mats"],"answer":0,"why":"Objects left across walkways can catch a person's foot and cause a fall."},{"q":"The 5S method of workplace organization begins with which step?","options":["Shine","Sustain","Sort","Standardize"],"answer":2,"why":"5S runs Sort, Set in order, Shine, Standardize and Sustain, starting by removing what is not needed."},{"q":"What should you wear when handling strong cleaning chemicals?","options":["Short sleeves and sandals","Gloves and eye protection as stated on the SDS","No protection, to feel the chemical","A woollen cap"],"answer":1,"why":"The SDS states the PPE needed to protect skin and eyes from chemical harm."},{"q":"How should waste from the accommodation be handled?","options":["Thrown overboard at night","Burned in the cabin","Mixed with food waste","Segregated according to the garbage management plan"],"answer":3,"why":"The garbage management plan sets how waste is sorted, stored and disposed of under MARPOL Annex V."},{"q":"Why are regular housekeeping inspections carried out?","options":["To find and correct hazards before accidents happen","To punish crew members","To reassign cabins","To count linen only"],"answer":0,"why":"Inspections catch unsafe conditions early so they can be fixed."},{"q":"How must emergency exits and escape routes be kept?","options":["Used as storage areas","Locked at all times","Clear and unobstructed","Covered with loose mats"],"answer":2,"why":"Escape routes must be clear so people can leave quickly in an emergency."}],"ILO - HACCP and United State Public Health":[{"q":"Which agency runs the Vessel Sanitation Program (VSP) for cruise ships calling at US ports?","options":["US Navy","Federal Aviation Administration","Environmental Protection Agency","Centers for Disease Control and Prevention (CDC)"],"answer":3,"why":"The VSP is run by the US CDC to prevent illness on cruise ships."},{"q":"How are Vessel Sanitation Program inspections scored?","options":["On a scale of 1 to 10","On a 100-point scale","From 1 to 5 stars","Pass or fail only"],"answer":1,"why":"VSP inspections start at 100 points and deduct points for each violation found."},{"q":"What do inspectors check during a US public health (USPH) inspection?","options":["Cargo securing records","Engine room logbooks","Food handling, sanitation, potable water and records","Navigation charts"],"answer":2,"why":"USPH inspections focus on food safety, cleanliness, potable water and supporting records."},{"q":"In HACCP, what does setting a critical limit mean?","options":["Fixing a measurable value, such as a temperature, that must be met","Limiting the number of cooks on duty","Setting the price of each menu item","Limiting the galley's working hours"],"answer":0,"why":"A critical limit is the measurable value that separates safe from unsafe at a CCP."},{"q":"Under public health practice, what must a food employee with vomiting or diarrhoea do?","options":["Keep working while wearing gloves","Move to the dishwashing area","Take a short rest and continue","Report it and be excluded from food work"],"answer":3,"why":"Ill food workers can spread disease, so they must report symptoms and be kept from food work."},{"q":"How should potable water hoses be handled under public health rules?","options":["Also used for sewage transfer","Used only for potable water and stored capped, off the deck","Left lying on the deck","Shared with the fire line"],"answer":1,"why":"Dedicated, capped hoses kept off the deck protect drinking water from contamination."},{"q":"In HACCP, what is verification?","options":["Checking that the HACCP plan is working as intended","Buying more food supplies","Washing the dishes","Printing the daily menu"],"answer":0,"why":"Verification confirms through checks and reviews that the HACCP system is effective."},{"q":"What should food in storage carry?","options":["Only the cook's name","The supplier's phone number","A label with the food name and date of preparation or opening","No label at all"],"answer":2,"why":"Labels with name and date allow proper rotation and discarding of old food."},{"q":"Why must handwashing sinks have soap and paper towels?","options":["To decorate the galley","So proper handwashing is possible at all times","To save water","For washing dishes"],"answer":1,"why":"Inspectors check that staff can wash and dry hands properly whenever needed."},{"q":"Why do both HACCP and USPH inspections require records?","options":["To increase paperwork","To replace training","To hide problems","To show temperatures, cleaning and corrective actions were done"],"answer":3,"why":"Records are the proof that food safety controls were actually carried out."}],"ILO - Hazard Analysis and Critical Control Points":[{"q":"How many principles does HACCP have?","options":["Three","Five","Seven","Ten"],"answer":2,"why":"HACCP is built on seven principles, from hazard analysis to record-keeping."},{"q":"What do you identify in a hazard analysis?","options":["Hazards that could make food unsafe and how likely they are","The cost of each recipe","The crew's favourite food","The number of storerooms"],"answer":0,"why":"Hazard analysis lists the hazards at each step and judges which need control."},{"q":"Which of these is a chemical hazard?","options":["Hair in the soup","Salmonella in eggs","Bone fragments in fish","Cleaning detergent in food"],"answer":3,"why":"Detergents, pesticides and other substances in food are chemical hazards."},{"q":"Which is an example of a critical limit?","options":["Cook until it looks nice","Core temperature of at least 74°C for poultry","Serve within the day","Store somewhere cold"],"answer":1,"why":"A critical limit is a measurable value, such as a set core temperature."},{"q":"What does monitoring mean in HACCP?","options":["Buying new equipment","Watching cooking shows","Planned checks or measurements to see if a CCP is under control","Asking the crew if they liked the food"],"answer":2,"why":"Monitoring is the planned observation or measurement of a CCP against its critical limit."},{"q":"What is a corrective action?","options":["Steps taken when monitoring shows a critical limit was not met","The menu change for Sundays","Disciplinary action against the cook","Moving the cook to another ship"],"answer":0,"why":"Corrective action restores control and deals with any affected food."},{"q":"Which step is usually a critical control point in food preparation?","options":["Washing the galley floor","Writing the menu","Choosing the plates","Cooking and cooling of food"],"answer":3,"why":"Cooking and cooling control bacteria directly, so they are typical CCPs."},{"q":"At what temperature should chilled food be stored?","options":["10°C to 15°C","5°C or below","Around 20°C","Room temperature"],"answer":1,"why":"Chilled food kept at 5°C or below slows bacterial growth."},{"q":"What should HACCP documentation include?","options":["Hazard analysis, CCPs, limits, monitoring, corrective action and verification records","The ship's cargo plan","The crew salary list","The voyage charter party"],"answer":0,"why":"HACCP documentation records every principle so the system can be checked."},{"q":"What is the main purpose of HACCP?","options":["To reduce galley staff","To make food taste better","To prevent food safety hazards before they cause harm","To shorten cooking time"],"answer":2,"why":"HACCP is a preventive system that controls hazards before food reaches the consumer."}],"ILO - Messman-Steward Course":[{"q":"In a standard table setting, where is the fork placed?","options":["On the right of the plate","On the left of the plate","Above the glass","On top of the plate"],"answer":1,"why":"Forks go on the left of the plate and knives on the right."},{"q":"Where is the drinking glass normally placed?","options":["On the left near the fork","In the middle of the plate","Below the plate","Above the knife on the right"],"answer":3,"why":"The glass is set above the tip of the knife on the right side."},{"q":"When cleaning a cabin, in what order should you clean?","options":["From top to bottom, dusting before the floor","The floor first, then the shelves","Only the visible areas","Only the bathroom"],"answer":0,"why":"Cleaning top to bottom lets dust fall to the floor, which is cleaned last."},{"q":"How often should bed linen in crew cabins be changed?","options":["Only when the crew asks","Once per contract","Regularly, according to the ship's schedule","Only at the home port"],"answer":2,"why":"A regular linen change schedule keeps cabins hygienic."},{"q":"What should a messman who handles food wear?","options":["Rings and a watch","A clean uniform with hair covered","Any clothes from the cabin","Work gloves from the deck store"],"answer":1,"why":"A clean uniform and covered hair prevent contamination of food."},{"q":"What is the common practice when serving and clearing plates?","options":["Serve from the left and clear from the right","Serve and clear from above the table","Stack all plates at the table","Ask the crew to clear for you"],"answer":0,"why":"Serving from the left and clearing from the right is standard table service."},{"q":"When should messroom tables be wiped?","options":["Once a week","With the floor mop","Only when visibly dirty","After each meal, with a clean sanitized cloth"],"answer":3,"why":"Wiping after every meal with a sanitized cloth prevents germs and pests."},{"q":"A crew member complains about the food. What should the steward do?","options":["Argue with him","Ignore the complaint","Listen politely and report it to the chief cook","Throw the food away without asking"],"answer":2,"why":"Courteous handling and reporting allow the problem to be corrected."},{"q":"How must cold food on the buffet be kept?","options":["At room temperature","Chilled, at 5°C or below","Under a heat lamp","Uncovered"],"answer":1,"why":"Cold food must stay at 5°C or below to stay out of the danger zone."},{"q":"Why must a steward report a cold or skin infection?","options":["To get extra pay","To change cabins","To avoid duty","To prevent spreading germs to food and crew"],"answer":3,"why":"Infections can spread through food handling, so they must be reported."}],"ILO - Public Health and Sanitation":[{"q":"What is one of the most effective ways to prevent the spread of communicable diseases?","options":["Proper handwashing with soap and water","Wearing perfume","Drinking cold water","Sleeping longer hours"],"answer":0,"why":"Handwashing removes germs that spread through touch and food."},{"q":"About how long should you scrub your hands with soap?","options":["2 seconds","5 seconds","At least 20 seconds","10 minutes"],"answer":2,"why":"Health authorities recommend scrubbing with soap for at least 20 seconds."},{"q":"What is potable water?","options":["Water used only for washing decks","Water safe for drinking and cooking","Water taken from ballast tanks","Water used for cooling engines"],"answer":1,"why":"Potable water is treated and safe for drinking, cooking and personal hygiene."},{"q":"Which diseases are spread by contaminated food or water?","options":["Malaria","Dengue","Tetanus","Cholera and typhoid"],"answer":3,"why":"Cholera and typhoid spread through food or water contaminated with human waste."},{"q":"What does disinfection mean?","options":["Killing or reducing harmful germs on surfaces","Removing visible dust only","Painting surfaces","Drying wet floors"],"answer":0,"why":"Disinfection reduces harmful microorganisms on cleaned surfaces."},{"q":"Why are rats and cockroaches on board dangerous?","options":["They eat paint","They damage the hull","They carry and spread disease","They make noise at night"],"answer":2,"why":"Rodents and cockroaches contaminate food and surfaces with disease-causing germs."},{"q":"A crew member has a fever and a contagious illness. What should he do?","options":["Continue working in the galley","Share a cabin with others","Keep it secret","Report to the officer in charge of medical care"],"answer":3,"why":"Early reporting allows treatment and isolation to protect the rest of the crew."},{"q":"Under the International Health Regulations, which certificate relates to ship sanitation and pest control?","options":["Safety Equipment Certificate","Ship Sanitation Control (or Exemption) Certificate","Load Line Certificate","IOPP Certificate"],"answer":1,"why":"The Ship Sanitation Control or Exemption Certificate is issued under the International Health Regulations (2005)."},{"q":"Which diseases can mosquitoes spread?","options":["Food poisoning","Cholera","Malaria and dengue","Tuberculosis"],"answer":2,"why":"Mosquitoes carry malaria and dengue, a risk in many tropical ports."},{"q":"Why are sanitation inspections carried out on board?","options":["To find and correct unhygienic conditions","To count the provisions","To check the cargo","To inspect lifeboats only"],"answer":0,"why":"Sanitation inspections identify hygiene problems before they cause illness."}],"ILO - Safe Food Handling":[{"q":"What is the safest place to thaw frozen fish?","options":["On the galley floor","Under hot running water","In the sun on deck","In the refrigerator"],"answer":3,"why":"Thawing in the refrigerator keeps fish cold and out of the danger zone."},{"q":"How should raw and cooked foods be kept?","options":["Together to save space","Separate to avoid cross-contamination","Cut on the same board","In the same container"],"answer":1,"why":"Separating raw and cooked food prevents bacteria from spreading to ready-to-eat food."},{"q":"How should leftover cooked food be handled?","options":["Left on the counter to cool overnight","Kept warm in the oven for days","Cooled quickly, covered, labelled and refrigerated","Mixed with freshly cooked food"],"answer":2,"why":"Fast cooling and cold storage stop bacteria from multiplying in leftovers."},{"q":"How should food be reheated?","options":["Until piping hot all the way through","Only slightly warmed","Several times a day","Not at all, served cold"],"answer":0,"why":"Reheating thoroughly kills bacteria that may have grown during storage."},{"q":"How can spoiled food be recognized?","options":["Fresh smell and firm texture","Bad smell, slime or mould","Bright natural colour","Cold temperature"],"answer":1,"why":"Off smells, slime and mould are signs that food has spoiled."},{"q":"When should a can of food be rejected?","options":["When it is clearly labelled","When it is clean and dry","When it is within its date","When it is swollen, leaking or badly dented"],"answer":3,"why":"Swollen, leaking or badly dented cans may contain dangerous bacteria."},{"q":"Why should a separate utensil be used for tasting food?","options":["To avoid contaminating the food","To save time","Because spoons are cheap","To cool the food"],"answer":0,"why":"A clean tasting spoon prevents germs from the mouth getting into the food."},{"q":"When should disposable gloves be changed?","options":["Once per day","Only when torn","After handling raw food and before handling ready-to-eat food","Only at the end of the meal"],"answer":2,"why":"Changing gloves between raw and ready-to-eat food prevents cross-contamination."},{"q":"Why should food not be left in the danger zone?","options":["Food freezes there","Food cooks too fast","Food only loses colour","Bacteria multiply quickly there"],"answer":3,"why":"Between about 5°C and 60°C bacteria can multiply to harmful levels."},{"q":"What should be done with food that has dropped on the floor?","options":["Washed and served","Thrown away","Given to the crew","Cooked longer"],"answer":1,"why":"Food that touches the floor is contaminated and must be discarded."}],"ILO - Shipboard Culinary and Catering Management":[{"q":"What does mise en place mean?","options":["Clean as you go","Serve the main course","Everything in its place, prepared before cooking","A type of French sauce"],"answer":2,"why":"Mise en place means preparing and arranging all ingredients and tools before cooking."},{"q":"What does a balanced menu include?","options":["Carbohydrates, proteins, fats, vitamins and minerals","Mostly fried food","Only meat and rice","Desserts at every meal"],"answer":0,"why":"A balanced diet provides all main nutrient groups in the right amounts."},{"q":"A lack of which vitamin causes scurvy, a disease once common among seafarers?","options":["Vitamin A","Vitamin C","Vitamin D","Vitamin K"],"answer":1,"why":"Scurvy is caused by a lack of vitamin C, found in fresh fruits and vegetables."},{"q":"How does inventory control help the galley?","options":["It raises menu prices","It hides shortages","It makes cooking faster","It tracks stock, prevents losses and guides orders"],"answer":3,"why":"Inventory control shows what is used and what is left, so losses and over-ordering are avoided."},{"q":"What should purchasing for the ship be based on?","options":["The cheapest supplier only","The cook's personal taste","The menu plan, stock levels and budget","The size of the storeroom only"],"answer":2,"why":"Purchasing must match the menu, current stock and the catering budget."},{"q":"Which is a good way to control catering cost?","options":["Standard recipes and portion control","Cooking extra food every meal","Buying small amounts every day","Throwing away leftovers"],"answer":0,"why":"Standard recipes and portions keep food use, and therefore cost, predictable."},{"q":"Why does a supervisor assign daily galley tasks?","options":["So only one person works","So the cook rests all day","So everyone does the same task","So work is done safely, on time and by the right person"],"answer":3,"why":"Clear task assignment uses each person's skills and keeps the galley running safely."},{"q":"Which cooking method uses moist heat?","options":["Grilling","Steaming","Roasting","Baking"],"answer":1,"why":"Steaming cooks with hot water vapour, a moist-heat method."},{"q":"Under MLC 2006, what should menus take into account?","options":["Only the master's choice","Only the cheapest food","The crew's religious requirements and cultural practices","Only Western dishes"],"answer":2,"why":"MLC 2006 Standard A3.2 requires food suited to the crew's religious and cultural needs."},{"q":"What are proteins in the diet mainly needed for?","options":["Body growth and repair","Quick energy only","Keeping bones dry","Reducing thirst"],"answer":0,"why":"Protein builds and repairs muscles and other body tissues."}],"ILO - Shipboard Culinary":[{"q":"A roux, used to thicken sauces, is made of:","options":["Egg and sugar","Flour and fat cooked together","Milk and salt","Water and vinegar"],"answer":1,"why":"A roux is equal parts flour and fat cooked together and used to thicken sauces."},{"q":"What does blanching vegetables mean?","options":["Frying them in oil","Baking them slowly","Soaking them in salt water","Boiling briefly, then cooling in cold water"],"answer":3,"why":"Blanching is a short boil followed by cold water to stop the cooking."},{"q":"What is the cut called when vegetables are sliced into thin matchstick strips?","options":["Julienne","Brunoise","Chiffonade","Paysanne"],"answer":0,"why":"Julienne is the classic thin matchstick cut."},{"q":"Béchamel sauce is made from:","options":["Tomato and herbs","Egg yolk and butter","Milk thickened with a white roux","Brown stock"],"answer":2,"why":"Béchamel is a mother sauce of milk thickened with a white roux."},{"q":"Which is a dry-heat cooking method?","options":["Poaching","Roasting","Boiling","Stewing"],"answer":1,"why":"Roasting cooks with hot dry air in an oven."},{"q":"Why is portion control important?","options":["It makes food spicier","It reduces cooking time","It changes the recipe","It keeps servings consistent and controls cost"],"answer":3,"why":"Equal portions satisfy the crew fairly and keep food cost on budget."},{"q":"What should be done to vegetables before preparation?","options":["Keep them with raw meat","Cook them first","Wash them thoroughly in clean water","Store them in a warm place"],"answer":2,"why":"Washing removes soil, chemicals and germs from vegetables."},{"q":"Why is a sharp knife safer than a dull one?","options":["It needs less force and is less likely to slip","It cuts faster for fun","It looks better","It never needs cleaning"],"answer":0,"why":"A dull knife needs more pressure and can slip off the food and cut you."},{"q":"How should food be served?","options":["Kept at room temperature","Promptly, at the correct temperature","Cooked hours earlier and left out","Reheated several times"],"answer":1,"why":"Prompt service at the right temperature keeps food safe and pleasant."},{"q":"What should a balanced menu for seafarers include?","options":["Fried food at every meal","Only rice and fish","Sweets as the main dish","Vegetables, fruits, protein and whole grains"],"answer":3,"why":"Variety from all food groups supports crew health on long voyages."}],"ILO - Shipboard Victualling":[{"q":"What does victualling mean?","options":["Supplying food and provisions for the crew","Loading fuel","Painting the ship","Repairing the galley"],"answer":0,"why":"Victualling is the supply and management of food and provisions on board."},{"q":"What is forecasting of food requirements based on?","options":["The weather only","The ship's speed only","Number of crew, voyage length and menu","The type of cargo"],"answer":2,"why":"How many people, for how long and what they will eat decide the quantities needed."},{"q":"What is a requisition?","options":["A cargo document","A crew contract","A meal plan for one day","A formal request for provisions to be supplied"],"answer":3,"why":"A requisition lists the items and quantities requested from the supplier or store."},{"q":"What does the victualling rate usually refer to?","options":["Fuel cost per day","Food cost per person per day","Crew salary per month","Port charges"],"answer":1,"why":"The victualling or feeding rate is the daily food budget per person."},{"q":"What should stock control records show?","options":["Quantities received, issued and remaining","Only the items purchased","The crew's ages","The voyage route"],"answer":0,"why":"Tracking receipts, issues and balance shows true stock levels."},{"q":"How does tracking daily food consumption help?","options":["It lets you cook more food","It increases waste","It detects overuse or waste and helps plan orders","It removes the need for menu planning"],"answer":2,"why":"Consumption records reveal waste and give data for the next order."},{"q":"Before a long voyage, how much provision stock is needed?","options":["Reduced to save money","Enough for the voyage plus a safety margin","Only what fits in the galley","Bought after departure"],"answer":1,"why":"A safety margin covers delays such as bad weather or port changes."},{"q":"Which practice prevents food wastage?","options":["Cooking without a menu","Ordering double quantities","Storing food at the wrong temperature","Proper storage, FIFO rotation and portion control"],"answer":3,"why":"Good storage, rotation and portions keep food from spoiling or being thrown away."},{"q":"Under MLC 2006, what must food on board be?","options":["Of suitable quality, nutritional value and quantity","As cheap as possible","Paid for by the crew","The same every day"],"answer":0,"why":"MLC 2006 requires food of appropriate quality, nutritional value, quantity and variety."},{"q":"How should meal planning work in victualling?","options":["Repeat the same dish daily","Use only canned food","Use stock wisely while giving variety and nutrition","Ignore stock levels"],"answer":2,"why":"Good meal planning balances available stock with variety and nutrition."}],"INCI - Incident Investigation":[{"q":"Under the ISM Code, what must happen to accidents, hazardous situations and non-conformities?","options":["Kept secret by the master","Reported to the company, investigated and analysed","Reported only if someone is injured","Written only in a personal diary"],"answer":1,"why":"ISM Code section 9 requires reporting, investigation and analysis to improve safety."},{"q":"What is a near miss?","options":["A serious injury","An event that damages cargo","An accident causing pollution","An event that could have caused harm but did not"],"answer":3,"why":"A near miss is an unplanned event that did not cause harm but could have."},{"q":"After an incident, what should be done with the evidence?","options":["Preserved quickly before it is lost or changed","Cleaned up right away","Thrown away","Left until the next port"],"answer":0,"why":"Evidence such as data, logs and photos must be secured early before it is lost."},{"q":"How should witness interviews be carried out?","options":["In a group so everyone agrees","Several weeks after the incident","Promptly, one at a time, in a non-blaming way","Only with officers"],"answer":2,"why":"Separate, prompt, non-blaming interviews give the most accurate and honest accounts."},{"q":"What is the main aim of an incident investigation?","options":["To find someone to punish","To find the causes and prevent a repeat","To close the report quickly","To avoid reporting"],"answer":1,"why":"Investigation looks for causes so that corrective and preventive actions stop it happening again."},{"q":"What is a root cause?","options":["The person nearest to the accident","The weather at the time","The first thing noticed","The underlying reason which, if removed, prevents a repeat"],"answer":3,"why":"Fixing the root cause, not just the immediate cause, prevents recurrence."},{"q":"What is the 5 Whys technique used for?","options":["Counting injured persons","Testing alarms","Finding the root cause by asking 'why' repeatedly","Filling in the logbook"],"answer":2,"why":"Asking 'why' several times moves from the symptom to the underlying cause."},{"q":"What is a preventive action meant to do?","options":["Stop a possible problem from happening","Repair damage already done","Punish a crew member","Delay the investigation"],"answer":0,"why":"Preventive action deals with potential problems before they occur."},{"q":"Which equipment records data that can help investigate a navigation accident?","options":["Echo sounder only","Magnetic compass","Barometer","Voyage Data Recorder (VDR)"],"answer":3,"why":"The VDR records bridge audio, radar, position and other data for investigators."},{"q":"What should a good investigation report include?","options":["Opinions without facts","Facts, causes, conclusions and corrective actions","Only the names of people to blame","Only photographs"],"answer":1,"why":"A useful report links facts to causes and to clear corrective actions."}],"IP - Injury Prevention":[{"q":"How should you lift a heavy box by hand?","options":["Bend your back and lift quickly","Twist your body while lifting","Keep your back straight and lift with your legs","Hold the load far from your body"],"answer":2,"why":"Using the leg muscles with a straight back protects the spine from injury."},{"q":"In the hierarchy of controls, which is the most effective?","options":["Eliminating the hazard","Wearing PPE","Putting up warning signs","Giving training"],"answer":0,"why":"Removing the hazard completely is the most effective control."},{"q":"Where does PPE stand among safety controls?","options":["It is the first and best control","It is optional on deck","It is only for officers","It is the last line of defence"],"answer":3,"why":"PPE protects the worker only after other controls have been applied."},{"q":"Which PPE protects against falling objects?","options":["Ear muffs","Safety helmet","Goggles","Gloves"],"answer":1,"why":"A safety helmet protects the head from falling or swinging objects."},{"q":"What causes many of the most common shipboard injuries?","options":["Lightning","Piracy","Slips, trips and falls","Collisions"],"answer":2,"why":"Slips, trips and falls are among the most frequent causes of injury on board."},{"q":"What must be done before entering an enclosed space?","options":["Obtain a permit, ventilate and test the atmosphere","Enter quickly and hold your breath","Enter alone to save time","Check the air by smell"],"answer":0,"why":"Enclosed spaces can lack oxygen or contain toxic gas, so permit, ventilation and testing are required."},{"q":"What must you wear when working aloft?","options":["A life jacket only","A safety harness with a lifeline attached","Rubber boots only","No special equipment"],"answer":1,"why":"A properly attached safety harness stops a fall from height."},{"q":"Why should near misses and unsafe conditions be reported?","options":["To blame others","To delay work","To fill in forms","To fix hazards before someone is hurt"],"answer":3,"why":"Reporting lets hazards be corrected before they cause an injury."},{"q":"What is a toolbox talk before a job used for?","options":["Counting the tools","Assigning overtime","Discussing the hazards and safe methods for the task","Cleaning the work area"],"answer":2,"why":"A toolbox talk makes sure everyone knows the risks and controls before starting."},{"q":"What must be done before working on electrical or machinery equipment?","options":["Isolate it, lock it out and tag it","Leave it running","Cover it with a cloth","Spray it with water"],"answer":0,"why":"Lockout and tagout prevent the equipment from being started while someone is working on it."}],"ISM - International Safety Management (ISM) Code":[{"q":"Which SOLAS chapter makes the ISM Code mandatory?","options":["Chapter II-2","Chapter III","Chapter V","Chapter IX"],"answer":3,"why":"SOLAS Chapter IX, Management for the Safe Operation of Ships, makes the ISM Code mandatory."},{"q":"What does the Designated Person Ashore (DPA) provide?","options":["Cargo bookings","A link between the ship and the highest level of management","Crew salaries","Fuel purchases"],"answer":1,"why":"The DPA gives a direct link between the ship and top management ashore on safety matters."},{"q":"To whom is the Document of Compliance (DOC) issued?","options":["The company","The master","The flag state","The classification society"],"answer":0,"why":"The DOC is issued to the company to show its SMS meets the ISM Code."},{"q":"To whom is the Safety Management Certificate (SMC) issued?","options":["The DPA","The company office","The ship","The chief engineer"],"answer":2,"why":"The SMC is issued to each ship that operates under an approved SMS."},{"q":"What authority does the master have under the ISM Code?","options":["No authority on safety matters","Authority only while in port","Authority shared with the port agent","Overriding authority for safety and pollution prevention"],"answer":3,"why":"The ISM Code gives the master overriding authority to make decisions on safety and pollution prevention."},{"q":"Which is an objective of the ISM Code?","options":["To increase cargo handling speed","To ensure safety at sea and prevent human injury or loss of life","To reduce crew wages","To set freight rates"],"answer":1,"why":"The ISM Code aims to ensure safety at sea, prevent injury or loss of life and avoid damage to the environment."},{"q":"What is a non-conformity under the ISM Code?","options":["A routine drill","A newly joined crew member","A situation where objective evidence shows a requirement was not met","A change of course"],"answer":2,"why":"A non-conformity is an observed situation where a specified requirement has not been fulfilled."},{"q":"How often must internal safety audits be carried out?","options":["At intervals not exceeding 12 months","Once every 5 years","Only after accidents","Once every 3 months"],"answer":0,"why":"The ISM Code requires internal audits on board and ashore at intervals not exceeding twelve months."},{"q":"What must the SMS include procedures to prepare for?","options":["Crew parties","Emergency situations, with drills and exercises","Shopping trips ashore","Port holidays"],"answer":1,"why":"ISM Code section 8 requires emergency preparedness with drills and exercises."},{"q":"How long is a full-term Safety Management Certificate valid?","options":["1 year","2 years","10 years","5 years"],"answer":3,"why":"The SMC is valid for up to five years, with an intermediate verification."}],"LCBOCT - Liquid Cargo and Ballast Operations for Chemical Tankers":[{"q":"Which IMO code sets construction and equipment rules for ships carrying dangerous chemicals in bulk?","options":["IBC Code","IMDG Code","IGC Code","IMSBC Code"],"answer":0,"why":"The International Bulk Chemical (IBC) Code covers ships carrying dangerous chemicals in bulk."},{"q":"Under MARPOL Annex II, which noxious liquid substance category is the most harmful?","options":["Category Z","Category Y","Category X","Other Substances (OS)"],"answer":2,"why":"Category X substances pose a major hazard and have the strictest discharge rules."},{"q":"Before loading two chemicals in adjacent tanks, what should be checked?","options":["Their colour","Their price","Their country of origin","Their compatibility, using a compatibility chart"],"answer":3,"why":"Incompatible chemicals can react dangerously if they mix through a leak."},{"q":"Which document gives a chemical's hazards, handling and emergency measures?","options":["Bill of lading","Safety Data Sheet (SDS)","Cargo manifest","Mate's receipt"],"answer":1,"why":"The SDS describes the hazards, safe handling, PPE and emergency measures for a chemical."},{"q":"What must cargoes that can self-react (polymerize) be accompanied by?","options":["An inhibitor certificate","Heating coils always switched on","Extra ballast","Open tank hatches"],"answer":0,"why":"The IBC Code requires an inhibitor certificate for cargoes that may self-react."},{"q":"Which chemical tanker ship type carries the most hazardous cargoes?","options":["Type 3","Type 2","Type 1","Type 4"],"answer":2,"why":"Under the IBC Code, Ship Type 1 has the highest level of protection for the most hazardous cargoes."},{"q":"Where are cargo and tank-washing operations with noxious liquid substances recorded?","options":["Oil Record Book","Cargo Record Book","Garbage Record Book","Deck logbook only"],"answer":1,"why":"MARPOL Annex II requires a Cargo Record Book for operations with noxious liquid substances."},{"q":"Which approved manual describes cargo unloading, stripping and tank washing under Annex II?","options":["SOPEP","Garbage Management Plan","Ballast Water Management Plan","Procedures and Arrangements (P&A) Manual"],"answer":3,"why":"The P&A Manual sets the approved procedures for cargo handling, tank cleaning and discharges under Annex II."},{"q":"Why is nitrogen padding or inert gas used in some cargo tanks?","options":["To prevent fire and stop cargo reacting with air","To cool the cargo","To speed up loading","To clean the tanks"],"answer":0,"why":"Padding keeps oxygen and moisture away from the cargo, reducing fire and reaction risks."},{"q":"During cargo transfer, what must ballast operations be planned to keep within limits?","options":["The cargo temperature","The crew's working hours","Stability, trim and hull stresses","Tank washing machine speed"],"answer":2,"why":"Cargo and ballast must be planned together so stability and hull stresses stay within safe limits."}],"LMT - Leadership and Management Training":[{"q":"What does delegation mean?","options":["Doing all tasks yourself","Giving a task and authority to another while keeping responsibility","Avoiding decisions","Punishing poor work"],"answer":1,"why":"In delegation the leader passes on the task and authority but stays accountable for the result."},{"q":"Under STCW, at which level are leadership and managerial skills required?","options":["Support level","Rating level","Cadet level","Management level"],"answer":3,"why":"The STCW Code lists leadership and managerial skills as a competence at management level."},{"q":"What is closed-loop communication?","options":["The receiver repeats the message back and the sender confirms it","Speaking without listening","Writing notes only","Talking in a closed room"],"answer":0,"why":"Repeating back and confirming makes sure the message was understood correctly."},{"q":"What does a SMART goal mean?","options":["Simple, Many, Active, Rapid, Total","A goal set only by the master","Specific, Measurable, Achievable, Relevant, Time-bound","A goal kept secret from the crew"],"answer":2,"why":"SMART goals are clear and measurable, making progress easy to check."},{"q":"Which is a good way to motivate crew?","options":["Constant criticism","Recognizing good work and treating people fairly","Ignoring their concerns","Threatening penalties"],"answer":1,"why":"Recognition and fairness build commitment and better performance."},{"q":"In a conflict between crew members, what should a leader do first?","options":["Take sides with friends","Wait for it to go away","Punish both sides","Listen to both sides and find the cause"],"answer":3,"why":"Understanding both views and the real cause is the first step to a fair solution."},{"q":"What is the first step in good decision-making?","options":["Act immediately","Ask the agent","Gather information and define the problem","Choose the easiest option"],"answer":2,"why":"Good decisions start with understanding the situation and the problem clearly."},{"q":"What does performance management on board include?","options":["Setting expectations, giving feedback and appraising work","Paying salaries only","Handling discipline only","Approving shore leave"],"answer":0,"why":"Performance management means clear expectations, regular feedback and fair appraisal."},{"q":"Which leadership style suits an emergency that needs quick action?","options":["Laissez-faire","Democratic voting","Delegating all decisions","Directive (authoritative)"],"answer":3,"why":"In an emergency, clear direct orders save time and lives."},{"q":"How should feedback be given?","options":["Only negative","Specific, timely and focused on behaviour","In public to embarrass","Saved until the end of the contract"],"answer":1,"why":"Specific and timely feedback about actions helps people improve."}],"LSC - Low Sulfur":[{"q":"Which MARPOL annex regulates sulphur in marine fuel?","options":["Annex I","Annex V","Annex VI","Annex IV"],"answer":2,"why":"MARPOL Annex VI covers air pollution from ships, including fuel sulphur limits."},{"q":"Since 1 January 2020, what is the global fuel sulphur limit outside Emission Control Areas?","options":["0.50% m/m","3.50% m/m","1.00% m/m","0.10% m/m"],"answer":0,"why":"The IMO 2020 global sulphur cap is 0.50% m/m outside ECAs."},{"q":"What is the fuel sulphur limit inside an Emission Control Area (ECA)?","options":["0.50% m/m","1.50% m/m","3.50% m/m","0.10% m/m"],"answer":3,"why":"Ships in a sulphur ECA must use fuel of 0.10% m/m sulphur or less, or an approved equivalent."},{"q":"Burning high-sulphur fuel mainly produces which harmful emission?","options":["Carbon monoxide only","Sulphur oxides (SOx)","Ozone","Methane"],"answer":1,"why":"Sulphur in fuel burns to form sulphur oxides, which harm health and the environment."},{"q":"When changing over to compliant fuel before entering an ECA, what must be recorded?","options":["The crew list","The weather report","Date, time, position and fuel volumes in each tank","The cargo plan"],"answer":2,"why":"Annex VI requires the changeover to be logged with date, time, position and compliant fuel quantities."},{"q":"Which document from the supplier states the sulphur content of delivered fuel?","options":["Bunker Delivery Note (BDN)","Oil Record Book","Bill of lading","Mate's receipt"],"answer":0,"why":"The Bunker Delivery Note shows the quantity and sulphur content of the fuel supplied."},{"q":"How long must Bunker Delivery Notes be kept on board?","options":["6 months","3 years","1 year","10 years"],"answer":1,"why":"MARPOL Annex VI requires BDNs to be kept on board for three years after delivery."},{"q":"What can a ship with an approved exhaust gas cleaning system (scrubber) do?","options":["Discharge oil overboard","Skip fuel records","Ignore ECA rules","Use higher-sulphur fuel if emissions meet the limits"],"answer":3,"why":"An approved scrubber is an equivalent method that cleans exhaust to the required SOx level."},{"q":"What is a risk when changing from heavy fuel oil to low-sulphur distillate fuel?","options":["Higher cargo temperature","Faster ship speed","Low fuel viscosity causing leaks or pump problems","More ballast water"],"answer":2,"why":"Distillate fuel is much thinner, which can cause leaks and fuel pump problems if not managed."},{"q":"How long must the MARPOL fuel sample taken at bunkering be kept?","options":["At least 12 months","1 month","7 days","5 years"],"answer":0,"why":"The MARPOL sample is kept until the fuel is substantially used, and in any case for at least 12 months."}],"LSHB - Leadership and Human Behavior":[{"q":"What does human factors mean in shipping?","options":["Only the ship's design","How people's abilities, limits and behaviour affect safety","Weather conditions","Cargo stowage"],"answer":1,"why":"Human factors look at how people think and act, and how this affects safe operations."},{"q":"Under STCW, what is the minimum rest in any 24-hour period?","options":["6 hours","8 hours","12 hours","10 hours"],"answer":3,"why":"STCW requires at least 10 hours of rest in any 24-hour period."},{"q":"Which are common signs of fatigue?","options":["Slow reactions, poor attention and mistakes","Higher alertness","Better memory","Faster decisions"],"answer":0,"why":"Fatigue slows reactions and reduces attention, leading to errors."},{"q":"What does complacency on board mean?","options":["Extra care during routine work","Asking many questions","Over-confidence leading to less attention to risk","Following checklists strictly"],"answer":2,"why":"Complacency is feeling too safe, which makes people overlook hazards."},{"q":"A leader who lets the team make most decisions with little direction uses which style?","options":["Autocratic","Laissez-faire","Transactional","Directive"],"answer":1,"why":"Laissez-faire leaders give the team freedom with little direction."},{"q":"What can poor communication between crew members lead to?","options":["Better teamwork","Shorter watches","Higher wages","Misunderstandings and accidents"],"answer":3,"why":"Unclear communication is a common cause of errors and accidents."},{"q":"How is a positive safety culture shown?","options":["Crew speak up about unsafe acts without fear","Mistakes are hidden","Procedures are skipped to save time","Near misses are not reported"],"answer":0,"why":"In a positive safety culture, people report and challenge unsafe acts openly."},{"q":"How can stress on board be reduced?","options":["Working longer hours","Staying away from others","Proper rest, good communication and support","Skipping meals"],"answer":2,"why":"Rest, communication and support from shipmates help manage stress."},{"q":"Under STCW, what is the minimum rest in any 7-day period?","options":["70 hours","77 hours","84 hours","56 hours"],"answer":1,"why":"STCW requires at least 77 hours of rest in any 7-day period."},{"q":"How does respecting cultural differences help a multinational crew?","options":["It creates separate groups","It reduces the work","It avoids communication","It builds trust and teamwork"],"answer":3,"why":"Respect for different cultures improves trust and cooperation on board."}],"LT - Leadership and Teamwork":[{"q":"What is situational awareness?","options":["Knowing what is happening around you and what may happen next","Knowing the ship's history","Memorizing the crew list","Reading the weather report once"],"answer":0,"why":"Situational awareness is perceiving, understanding and predicting what is happening around you."},{"q":"What does good teamwork on board depend on?","options":["Each person working alone","Keeping information secret","Clear roles, communication and cooperation","One person doing everything"],"answer":2,"why":"Teams work well when roles are clear and members communicate and cooperate."},{"q":"During an emergency drill, what does task coordination mean?","options":["Everyone doing the same job","Waiting for orders until the drill ends","Running to the lifeboat first","Each member knows his role and acts in order with the team"],"answer":3,"why":"Coordination means each person does his assigned part in the right sequence."},{"q":"A junior crew member sees a hazard the senior officer missed. What should he do?","options":["Stay quiet out of respect","Speak up clearly and respectfully","Wait until the end of the watch","Tell only his friends"],"answer":1,"why":"Speaking up early, even to a senior, can prevent an accident."},{"q":"Under STCW, at which level are leadership and teamworking skills required?","options":["Operational level","Management level only","Support level only","Cadet level only"],"answer":0,"why":"The STCW Code includes application of leadership and teamworking skills at opera
