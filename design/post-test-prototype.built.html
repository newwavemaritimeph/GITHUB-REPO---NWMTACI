ble","Follow the VOC plan and avoid unnecessary venting","Load at the maximum rate without monitoring"],"answer":2,"why":"Keeping the cargo system closed and following the VOC plan limits vapour losses."},{"q":"What device protects cargo tanks from over-pressure and vacuum?","options":["Sea chest strainer","Bilge alarm","Oily water separator","Pressure/vacuum (P/V) valve"],"answer":3,"why":"P/V valves release excess pressure or admit air to prevent tank damage."},{"q":"What should crew wear or carry when working near possible VOC vapour sources?","options":["Nothing special is needed","A personal gas detector and suitable PPE","Only sunglasses","A radio for music"],"answer":1,"why":"Personal gas monitors and PPE protect crew from toxic vapour exposure."}],"VP - Voyage Planning":[{"q":"According to IMO guidelines, what are the four stages of voyage planning?","options":["Loading, sailing, berthing and discharging","Departure, transit, arrival and report","Appraisal, planning, execution and monitoring","Chartwork, radar, lookout and logging"],"answer":2,"why":"IMO Resolution A.893(21) sets the stages as appraisal, planning, execution and monitoring."},{"q":"Which SOLAS chapter requires a voyage plan before the ship sails?","options":["Chapter V","Chapter II-1","Chapter III","Chapter IX"],"answer":0,"why":"SOLAS Chapter V (Regulation 34) requires a voyage plan before proceeding to sea."},{"q":"What happens during the appraisal stage?","options":["Steering the ship along the track","Gathering all relevant information about the voyage","Writing the final voyage report","Checking crew documents"],"answer":1,"why":"Appraisal means collecting and studying all information relevant to the intended voyage."},{"q":"Which publication is commonly used during voyage appraisal?","options":["The crew handbook","The galley menu","The cargo invoice","Sailing directions"],"answer":3,"why":"Sailing directions, tide tables, lists of lights and notices to mariners are key planning sources."},{"q":"What is a no-go area in a voyage plan?","options":["An area for anchoring only","An area where the ship must not enter due to danger","An area with good fishing","A recommended traffic lane"],"answer":1,"why":"No-go areas are marked where depth or hazards make the water unsafe for the ship."},{"q":"What is a wheel-over point?","options":["The point where the pilot boards","The point where the engine is stopped","The point where the anchor is dropped","The point where the rudder is put over to start a planned turn"],"answer":3,"why":"Starting the turn at the wheel-over point brings the ship onto the next track as planned."},{"q":"What is the purpose of contingency planning in a voyage plan?","options":["To prepare safe actions such as emergency anchorages and abort points","To plan crew entertainment","To prepare the cargo bill","To reduce the number of charts"],"answer":0,"why":"Contingency plans give ready options if something goes wrong during the voyage."},{"q":"Who approves the voyage plan on board?","options":["The bosun","The chief cook","The master","The port agent"],"answer":2,"why":"The voyage plan is usually prepared by the navigating officer and approved by the master."},{"q":"What is under-keel clearance (UKC)?","options":["The depth of water between the keel and the seabed","The height of the mast above water","The distance between two ships","The draft of the ship"],"answer":0,"why":"UKC is the water depth remaining below the keel, which must meet company minimums."},{"q":"How is the voyage plan monitored during execution?","options":["Only by checking the ETA","By trusting the plan without checks","By asking other ships","By regular position fixes and cross-checks against the planned track"],"answer":3,"why":"Frequent fixes compared with the planned track show any deviation early."}],"VPCC - Voyage Planning and Chart Correction":[{"q":"How often are Admiralty Notices to Mariners published?","options":["Daily","Weekly","Monthly","Yearly"],"answer":1,"why":"Admiralty Notices to Mariners are published weekly with chart and publication corrections."},{"q":"Where on an Admiralty paper chart is a small correction recorded?","options":["On the back of the chart","In the chart title box","Across the compass rose","In the bottom left-hand margin"],"answer":3,"why":"Small corrections are recorded in the bottom left-hand margin with the notice number and year."},{"q":"How are Temporary and Preliminary (T&P) notices usually marked on paper charts?","options":["In permanent black ink","With a highlighter pen","In pencil","With a sticker only"],"answer":2,"why":"T&P notices are marked in pencil so they can be removed when cancelled or made permanent."},{"q":"Before planning a voyage, what must be checked about the charts?","options":["That they are the latest edition and fully corrected","That they are the cheapest available","That they are in colour","That they are the smallest scale"],"answer":0,"why":"Only current, corrected charts give reliable navigational information."},{"q":"Which scale of chart should be used for coastal navigation and pilotage?","options":["The smallest scale available","An ocean planning chart","A world map","The largest scale chart available"],"answer":3,"why":"Large-scale charts show the most detail needed for coastal waters."},{"q":"The Philippines is located in which NAVAREA for navigational warnings?","options":["NAVAREA XI","NAVAREA I","NAVAREA IV","NAVAREA VIII"],"answer":0,"why":"The Philippines lies within NAVAREA XI, coordinated by Japan."},{"q":"How are ENC charts on ECDIS kept up to date?","options":["By drawing on the screen","By printing paper copies","By loading official update files and checking update status","They never need updating"],"answer":2,"why":"ENCs are corrected by applying official electronic updates and verifying they are installed."},{"q":"Which systems are used to receive navigational warnings at sea?","options":["Echo sounder and log","NAVTEX and SafetyNET (EGC)","Radar and gyro","Speed log and anemometer"],"answer":1,"why":"NAVTEX and SafetyNET deliver navigational and meteorological warnings to ships."},{"q":"Why is a chart correction log kept on board?","options":["To record cargo quantities","To list crew certificates","To track which corrections have been applied to each chart","To log engine hours"],"answer":2,"why":"A correction record proves charts are up to date and shows any missing corrections."},{"q":"What should be done with a relevant navigational warning when planning a route?","options":["Mark it on the chart and adjust the plan if needed","Ignore it until it becomes permanent","Delete it from the system","Only tell the cook"],"answer":0,"why":"Warnings affect safety, so they are plotted and considered in the voyage plan."}],"VRM - Vessel Resource Management":[{"q":"What is situational awareness?","options":["Knowing what is happening around you and what may happen next","Knowing the ship's history","Knowing the crew's birthdays","Knowing the next port's shops"],"answer":0,"why":"Situational awareness means perceiving, understanding and predicting the situation."},{"q":"What is an error chain?","options":["A chain used for anchoring","A list of crew mistakes for punishment","A series of small errors that can lead to an accident","A type of steering failure"],"answer":2,"why":"Accidents often result from linked errors; breaking the chain prevents the accident."},{"q":"What should a junior officer do if he believes the master's order is unsafe?","options":["Stay silent to show respect","Leave the bridge","Carry it out without question","Speak up clearly and explain the concern"],"answer":3,"why":"Challenge and response encourages juniors to voice safety concerns respectfully."},{"q":"What is closed-loop communication?","options":["Talking only to people you like","The receiver repeats the message and the sender confirms it","Using only written messages","Avoiding radio use"],"answer":1,"why":"Repeating back and confirming messages ensures they are understood correctly."},{"q":"Which resources does Vessel Resource Management cover?","options":["People, equipment, information and time","Only the ship's engines","Only the cargo","Only the money budget"],"answer":0,"why":"VRM makes the best use of all available resources, including people, equipment, information and time."},{"q":"What is the best leadership approach on board?","options":["Always shout orders","Never make decisions","Adapt the style to the situation and team","Let the crew do whatever they want"],"answer":2,"why":"Effective leaders adjust their style, being directive in emergencies and consultative when time allows."},{"q":"How can workload be managed during busy periods?","options":["Do everything alone","Ignore less urgent tasks permanently","Work faster without checking","Prioritise tasks and delegate to team members"],"answer":3,"why":"Prioritising and delegating spreads the workload and keeps attention on critical tasks."},{"q":"Why is a briefing held before a critical operation?","options":["To fill time","So everyone understands the plan, roles and risks","To decide who gets overtime","To replace the checklist"],"answer":1,"why":"Briefings create a shared understanding of the plan, roles and hazards."},{"q":"What is complacency?","options":["Overconfidence that leads to less care and attention","Being careful in every task","Asking too many questions","Being new on board"],"answer":0,"why":"Complacency makes people relax their guard and miss warning signs."},{"q":"What is the purpose of a debriefing after an operation?","options":["To blame people for mistakes","To end the voyage","To skip report writing","To review what went well and what can be improved"],"answer":3,"why":"Debriefings turn experience into lessons that improve future operations."}],"WH - Working at Heights":[{"q":"On board, working aloft is commonly defined as work above what height where a person could fall?","options":["0.5 metre","1 metre","3 metres","2 metres"],"answer":3,"why":"Common shipboard guidance treats work more than 2 metres above a deck as work at height."},{"q":"What equipment should a person working at height wear for fall protection?","options":["A life jacket only","A full body harness with a lanyard attached to a secure anchor","A waist belt tied to a handrail","A helmet only"],"answer":1,"why":"A full body harness attached to a strong anchor point arrests a fall safely."},{"q":"When should a safety harness be inspected?","options":["Before each use","Once a year only","Only after a fall","Never, if it looks new"],"answer":0,"why":"Harnesses are checked before every use for cuts, worn stitching and damaged buckles."},{"q":"Where is the best position for an anchor point?","options":["Below the feet","Loose on the deck","Above the worker and strong enough to hold a fall","On a temporary rail"],"answer":2,"why":"An overhead anchor reduces fall distance and swing."},{"q":"How can dropped objects be prevented when working aloft?","options":["Secure tools with lanyards and barricade the area below","Throw tools down when finished","Keep tools loose in pockets","Ask people below to watch out"],"answer":0,"why":"Tethering tools and keeping the area below clear protects people from falling objects."},{"q":"What should be in place before starting work at height?","options":["Only verbal permission from a friend","Nothing if the job is short","A risk assessment and a permit to work","A photo of the area"],"answer":2,"why":"Work at height is high-risk and must be assessed and authorised with a permit."},{"q":"Why must a rescue plan be ready before work at height begins?","options":["To satisfy paperwork only","Because the job will be faster","Because rescue is not needed","A worker hanging in a harness needs prompt rescue to avoid suspension trauma"],"answer":3,"why":"Prolonged suspension in a harness can cause serious injury, so rescue must be quick."},{"q":"When climbing a ladder, how many points of contact should be kept?","options":["One","Three","Two","None if climbing fast"],"answer":1,"why":"Keeping three points of contact (two hands and a foot, or two feet and a hand) prevents falls."},{"q":"A portable ladder should be set at about what angle?","options":["75 degrees (1 out for every 4 up)","45 degrees","90 degrees, straight up","30 degrees"],"answer":0,"why":"The 1-in-4 rule gives an angle of about 75 degrees for stability."},{"q":"What should be done with a harness that has arrested a fall?","options":["Use it again after drying","Give it to another crew member","Remove it from service and report it","Keep it in the store as a spare"],"answer":2,"why":"A harness that has taken a fall load may be weakened and must not be reused."}]};

  else{const done=qs.every((_,i)=>S.answers[i]!=null);
    body=`<dl style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px"><dt style="color:var(--muted)">Trainee</dt><dd style="margin:0;font-weight:600">Juan Miguel P. Dela Cruz</dd><dt style="color:var(--muted)">Course</dt><dd style="margin:0;font-weight:600">${esc(c.course)} <span class="mono" style="color:var(--muted)">${esc(c.code)}</span></dd></dl>
     <div class="note">${qs.length} questions. Choose one answer each. You pass with ${PASS}% (${Math.ceil(qs.length*PASS/100)} correct).${S.attempts.length?` This is retake ${S.attempts.length}.`:""}</div>
     ${qs.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.q)}</b>${q.options.map((o,k)=>`<label class="opt ${S.answers[i]===k?"on":""}"><input type="radio" name="q${i}" data-q="${i}" value="${k}" ${S.answers[i]===k?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div>`).join("")}
     <button class="pri" data-act="submit" ${done?"":"disabled"}>Submit Answers</button>${done?"":`<small style="color:var(--muted)">Answer all ${qs.length} questions to submit (${Object.keys(S.answers).length} answered).</small>`}`;}
  return `<div class="head"><div><span class="eyebrow">Website › Trainee Status › Take Post-Test</span><h1>Course Post-Test</h1></div></div>${picker}
   <div class="phone"><div class="url">newwavemaritimemtaci.com/post-test/…</div><div class="site">${body}</div></div>`;}
function status(){const passed=S.attempts.some(a=>a.pct>=PASS),last=S.attempts.at(-1);
  return `<div class="head"><div><span class="eyebrow">Website › Trainee Status</span><h1>The Post-Test Step</h1></div></div>
  <div class="phone"><div class="url">newwavemaritimemtaci.com/registration-search</div><div class="site">
   <div style="border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px"><b>${esc(COURSES.find(x=>x.key===S.course).course)}</b><small style="color:var(--muted)">ENR-2026-000031 · Oct 12–16, 2026 · <span class="pill ok">Enrolled</span></small>
    <div class="steps"><span class="step y">✓ Training Finished</span><span class="step y">✓ Paid</span><span class="step ${passed?"y":"n"}">${passed?`✓ Post-Test ${last.score}/10`:last?`✗ Post-Test ${last.score}/10`:"✗ Post-Test"}</span><span class="step n">✗ Evaluation</span><span class="step w">Certificate After Both</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${passed?"":`<button class="pri" data-view="Post-Test">${last?"Retake Post-Test":"Take Post-Test"}</button>`}<button class="btn">Evaluate Training</button></div></div>
  </div></div>
  <div class="note">Order on the status page: the post-test first, then the evaluation. The certificate is released only when the fee is paid, the post-test is passed and the evaluation is in.</div>`;}
function releasing(){const rows=[{n:"DELA CRUZ, Juan Miguel",c:"ECDIS",t:"9/10 · 1 attempt",ok:true,ev:true},{n:"REYES, Maria Clara",c:"SAM",t:"6/10 · 2 attempts",ok:false,ev:true},{n:"SANTOS, Paolo",c:"SNC",t:"Not taken",ok:false,ev:false}];
  return `<div class="head"><div><span class="eyebrow">Releasing Officer › Certificates</span><h1>Post-Test Column</h1></div></div>
  ${S.releaseMsg?`<div class="note">${S.releaseMsg}</div>`:""}
  <div class="panel"><div class="wrap"><table><thead><tr><th>#</th><th>Trainee</th><th>Course</th><th>Paid</th><th>Post-Test</th><th>Eval.</th><th>Status</th><th>Action</th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr><td class="mono">${i+1}</td><td><b>${r.n}</b></td><td>${r.c}</td><td style="color:var(--ok)">✓</td><td>${r.ok?`<span class="pill ok">Passed</span><small>${r.t}</small>`:r.t==="Not taken"?`<span class="pill mut">Not Taken</span>`:`<span class="pill warn">Not Passed</span><small>${r.t}</small>`}</td><td>${r.ev?`<span style="color:var(--ok)">✓ PDF</span>`:`<span style="color:var(--bad)">✗</span>`}</td><td><span class="pill ok">Ready for Release</span></td>
   <td>${r.ok&&r.ev?`<button class="pri" data-act="release">Release</button>`:`<button class="btn" disabled>Release</button><small>${!r.ok?"Post-test not passed yet":"Evaluation not submitted yet"}</small>`}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="note">Waiting gets a "Post-Test" checklist item and an Email Post-Test Link button, the same as the evaluation.</div>`;}
function review(){const term=S.q.trim().toLowerCase();const list=COURSES.filter(c=>(!term||`${c.code} ${c.course}`.toLowerCase().includes(term))&&(S.filter==="All"||(S.filter==="Drafted"?DATA[c.key]&&!S.approved.has(c.key):S.filter==="Approved"?S.approved.has(c.key):!DATA[c.key])));
  const c=COURSES.find(x=>x.key===S.review),qs=DATA[S.review]||[];
  return `<div class="head"><div><span class="eyebrow">Admin › Configuration › Courses › Post-Test</span><h1>Review Questions</h1></div></div>
  <div class="note warn">Draft questions written from each certificate's course description. An instructor checks each course, edits anything wrong, then approves. A course's post-test goes live only after it is approved. Until then, its certificates release without a post-test.</div>
  <div class="grid2"><div class="panel"><div class="ph"><div class="tools"><input id="q" placeholder="Search course" value="${esc(S.q)}" aria-label="Search courses"><select id="f">${["All","Drafted","Approved","Not drafted"].map(x=>`<option ${S.filter===x?"selected":""}>${x}</option>`).join("")}</select></div></div>
   <div class="clist">${list.map(x=>`<button class="${x.key===S.review?"on":""}" data-rev="${esc(x.key)}"><b>${esc(x.code)}</b> · ${esc(x.course)}<small>${S.approved.has(x.key)?"✓ Approved":DATA[x.key]?"10 questions · to review":"Drafting…"}</small></button>`).join("")}</div></div>
  <div class="panel"><div class="ph"><div><h2>${esc(c.code)} · ${esc(c.course)}</h2><small>${qs.length?`${qs.length} questions · passing score ${PASS}%`:"Questions are still being drafted"}</small></div>${qs.length?(S.approved.has(c.key)?`<span class="pill ok">Approved · Live</span>`:`<button class="pri" data-act="approve">Approve Questions</button>`):""}</div>
   ${qs.map((q,i)=>`<div class="rq"><b>${i+1}. ${esc(q.q)}</b><ol type="A">${q.options.map((o,k)=>`<li class="${k===q.answer?"c":""}">${esc(o)}${k===q.answer?" ✓":""}</li>`).join("")}</ol><div class="why">Why: ${esc(q.why)}</div><button class="btn" style="margin-top:6px">Edit</button></div>`).join("")}
  </div></div>`;}
document.addEventListener("click",e=>{const t=e.target.closest("[data-view],[data-act],[data-rev]");if(!t)return;
 if(t.dataset.view)S.view=t.dataset.view;else if(t.dataset.rev)S.review=t.dataset.rev;else{const a=t.dataset.act;const qs=DATA[S.course];
  if(a==="submit"){const score=qs.reduce((s,q,i)=>s+(S.answers[i]===q.answer?1:0),0);const pct=Math.round(score/qs.length*100);S.result={score,pct};S.attempts.push({score,pct});}
  if(a==="retake"){S.result=null;S.answers={};}
  if(a==="release")S.releaseMsg="Released. (Prototype.)";
  if(a==="approve")S.approved.add(S.review);}
 render();});
document.addEventListener("change",e=>{if(e.target.dataset.q!==undefined){S.answers[e.target.dataset.q]=Number(e.target.value);render()}
 if(e.target.id==="pick"){S.course=e.target.value;S.answers={};S.result=null;S.attempts=[];render()}if(e.target.id==="f"){S.filter=e.target.value;render()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const p=e.target.selectionStart;render();const el=document.getElementById("q");el.focus();el.setSelectionRange(p,p)}});
render();
</script>
