<style>

:root{--blue:#0571D0;--cyan:#35CCFA;--lcyan:#9EE3F1;--orange:#F25615;--navy:#123F63;--bg:#f1f6f9;--surface:#fff;--line:#d8e4ec;--fg:#0f2638;--muted:#58707f;--soft:#eaf6fa;--th:#e3f6fb;--okbg:#e3f4ea;--ok:#0a7a3e;--warnbg:#fde9dd;--warn:#b4480f;--badbg:#fbe4dc;--bad:#b42318;--infobg:#e2effc;--info:#0b5cad;--sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1824;--surface:#112434;--line:#24394b;--fg:#e4eef5;--muted:#9ab0c1;--soft:#152d3d;--th:#173447;--okbg:#12301f;--ok:#5fd493;--warnbg:#3a2516;--warn:#ffad78;--badbg:#3c1d16;--bad:#ff8a7a;--infobg:#132f4a;--info:#7cc0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1824;--surface:#112434;--line:#24394b;--fg:#e4eef5;--muted:#9ab0c1;--soft:#152d3d;--th:#173447;--okbg:#12301f;--ok:#5fd493;--warnbg:#3a2516;--warn:#ffad78;--badbg:#3c1d16;--bad:#ff8a7a;--infobg:#132f4a;--info:#7cc0ff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--sans)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{background:linear-gradient(100deg,#0571D0,#1c9be3 60%,#35CCFA);color:#fff;padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand b{font-size:17px;letter-spacing:.04em}.brand span{font-size:13px;opacity:.9}
.views{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;align-items:flex-end}.views small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;padding:0 6px 10px 2px}
.views button{border:0;background:none;color:#fff;padding:9px 13px;font-weight:500;font-size:14px;border-radius:10px 10px 0 0}.views button.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 3px 0 var(--orange)}
.page{max-width:1180px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:600}h1{margin:2px 0 0;font-size:26px;text-wrap:balance}h2{margin:0;font-size:16px}h3{margin:0;font-size:15px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.note{background:var(--infobg);color:var(--info);border-radius:10px;padding:10px 14px;font-size:13.5px}.note.warn{background:var(--warnbg);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}.ph small{color:var(--muted)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--th);color:var(--muted);font:600 11.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:8px 12px;white-space:nowrap}td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}td small{display:block;color:var(--muted);font-size:12.5px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.info{background:var(--infobg);color:var(--info)}.mut{background:var(--soft);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;font-weight:500}.pri{background:var(--orange);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:600}.pri:disabled,.btn:disabled{opacity:.5;cursor:default}
.phone{max-width:430px;width:100%;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 12px 34px rgba(18,63,99,.12)}
.url{background:var(--soft);padding:8px 14px;font:500 12.5px var(--mono);color:var(--muted);border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.site{padding:16px;display:flex;flex-direction:column;gap:12px}
.q{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.q b{font-size:14.5px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:14px}.opt input{margin-top:3px;accent-color:var(--blue)}.opt.on{border-color:var(--blue);background:var(--infobg)}
.state{border-radius:14px;padding:14px;font-weight:700;font-size:17px}.state.v{background:var(--okbg);color:var(--ok)}.state.x{background:var(--badbg);color:var(--bad)}
.score{font:700 40px var(--mono)}
.steps{display:flex;flex-wrap:wrap;gap:6px}.step{font-size:12.5px;padding:3px 9px;border-radius:99px;font-weight:600}.step.y{background:var(--okbg);color:var(--ok)}.step.n{background:var(--warnbg);color:var(--warn)}.step.w{background:var(--soft);color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:14px;align-items:start}@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.clist{max-height:520px;overflow:auto}.clist button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:8px 14px;font-size:13.5px}.clist button.on{background:var(--infobg);box-shadow:inset 3px 0 0 var(--orange)}.clist small{display:block;color:var(--muted)}
.rq{padding:10px 16px;border-top:1px solid var(--line)}.rq ol{margin:6px 0 4px;padding-left:20px}.rq li.c{color:var(--ok);font-weight:600}.rq .why{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools input,.tools select{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--surface)}
</style>

<script>
const DATA={"ABC - Awareness on Basic Computer":[{"q":"Which part of a computer processes instructions and is often called its brain?","options":["Monitor","Keyboard","Power supply","Central Processing Unit (CPU)"],"answer":3,"why":"The CPU carries out program instructions and calculations."},{"q":"What is the main job of an operating system such as Windows?","options":["To connect the ship to satellites","To print documents only","To manage the hardware and run programs","To protect the screen from dust"],"answer":2,"why":"The operating system controls the hardware and lets applications run."},{"q":"What happens to unsaved work when the computer suddenly loses power?","options":["It is lost","It is sent by email","It moves to the Recycle Bin","It is saved automatically to the hard disk"],"answer":0,"why":"Unsaved work is held in RAM, which loses its contents without power."},{"q":"What is the best way to organize files on a shipboard computer?","options":["Rename files with random numbers","Keep only one file per computer","Use clearly named folders and file names","Save everything on the desktop"],"answer":2,"why":"Clear folders and names make files easy to find and hard to lose."},{"q":"What does the Cc field in an email do?","options":["Deletes the message after reading","Encrypts the attachment","Sends a copy to other recipients","Marks the message as spam"],"answer":2,"why":"Cc (carbon copy) sends a copy of the email to additional recipients."},{"q":"Which program is best for a table of calculations such as a stores inventory?","options":["Spreadsheet program","Media player","Word processor","Web browser"],"answer":0,"why":"Spreadsheets like Excel are made for tables, formulas and totals."},{"q":"Which of these is the strongest password?","options":["password123","Mx#7rTq!2vLp","The ship's name","Your own birthday"],"answer":1,"why":"A long mix of upper and lower case letters, numbers and symbols is hardest to guess."},{"q":"Why should you make regular backups of important files?","options":["To increase the screen brightness","To avoid installing updates","To make the computer run faster","To recover data if files are lost or damaged"],"answer":3,"why":"Backups let you restore files after deletion, damage or a virus."},{"q":"What should you do with an email attachment from an unknown sender?","options":["Open it immediately to check it","Do not open it and report it to the responsible officer","Forward it to all crew members","Save it to a USB drive for later"],"answer":1,"why":"Unknown attachments may contain malware, so they should not be opened."},{"q":"What is the keyboard shortcut to copy selected text in Windows?","options":["Ctrl + Z","Ctrl + V","Ctrl + P","Ctrl + C"],"answer":3,"why":"Ctrl + C copies; Ctrl + V pastes, Ctrl + Z undoes and Ctrl + P prints."}],"AHPR - Awareness on Harassment Prevention and Response":[{"q":"What is harassment in the workplace?","options":["A disagreement that is settled politely","A friendly joke that both people enjoy","Unwanted behavior that offends, humiliates or intimidates a person","A normal work instruction from a superior"],"answer":2,"why":"Harassment is unwanted conduct that violates a person's dignity or creates a hostile environment."},{"q":"Which best describes bullying?","options":["Repeated unreasonable behavior aimed at a person or group","A safety drill ordered by the Master","A single polite correction of someone's work","A request to work paid overtime"],"answer":0,"why":"Bullying is repeated, unreasonable behavior that can harm a person's health and safety."},{"q":"A crew member tells you privately they were sexually harassed. What should you do first?","options":["Tell the whole crew at the next meeting","Ignore it unless there is a witness","Ask them to settle it with the harasser alone","Listen, take it seriously and follow the reporting procedure"],"answer":3,"why":"Reports must be taken seriously and handled through the company's procedure."},{"q":"Why is confidentiality important when handling a harassment report?","options":["It protects the people involved and encourages reporting","It avoids having to write any records","It hides the incident from the company","It allows the case to be quietly forgotten"],"answer":0,"why":"Confidentiality protects victims and witnesses so people feel safe to report."},{"q":"Which international convention sets seafarers' rights to decent working and living conditions?","options":["COLREGs 1972","ILO Maritime Labour Convention, 2006 (MLC)","Load Lines Convention 1966","MARPOL 73/78"],"answer":1,"why":"The MLC, 2006 is the seafarers' bill of rights for working and living conditions."},{"q":"Under the MLC, 2006, what must seafarers have access to onboard?","options":["An on-board complaint procedure","Their own personal lifeboat","A private cabin for every rating","Free internet at all times"],"answer":0,"why":"MLC Regulation 5.1.5 requires on-board procedures for fair and quick handling of complaints."},{"q":"What is retaliation?","options":["Holding a regular safety meeting","Transferring a seafarer at contract end","Punishing someone for reporting or supporting a complaint","Giving positive feedback to a coworker"],"answer":2,"why":"Retaliation against people who report is itself misconduct and must be prevented."},{"q":"What should a bystander who sees harassment do?","options":["Laugh along to avoid conflict","Safely intervene or report it to a superior or designated person","Record it and post it on social media","Wait until they are called as a witness"],"answer":1,"why":"Bystanders help stop harassment by acting safely or reporting it."},{"q":"Which is an example of sexual harassment?","options":["Asking a colleague to attend a drill","Correcting a mistake in the logbook","Assigning a crew member to their scheduled watch","Repeated unwanted comments about a person's body"],"answer":3,"why":"Unwanted remarks of a sexual nature about someone's body are sexual harassment."},{"q":"What is the main goal of a harassment prevention policy onboard?","options":["Reducing the number of crew onboard","A safe and respectful working environment for everyone","Removing the need for supervision","Limiting communication between crew"],"answer":1,"why":"The policy aims to prevent harm and ensure every seafarer is treated with respect."}],"AI - Accident Investigation":[{"q":"What is the main purpose of a marine accident investigation?","options":["To calculate insurance premiums","To delay the voyage","To find the causes and prevent recurrence","To find someone to punish"],"answer":2,"why":"Safety investigations aim to learn lessons and prevent similar accidents, not to blame."},{"q":"Once an accident is under control, why should the scene be preserved?","options":["To allow repairs to start at once","To save cleaning materials","To keep evidence unchanged for the investigation","To make the area look clean for visitors"],"answer":2,"why":"Moving or cleaning items can destroy evidence needed to find the cause."},{"q":"Which section of the ISM Code covers reports and analysis of accidents and hazardous occurrences?","options":["Section 6","Section 13","Section 2","Section 9"],"answer":3,"why":"ISM Code Section 9 requires reporting, investigation and analysis of non-conformities, accidents and hazardous occurrences."},{"q":"Which shipboard equipment records data useful for reconstructing a navigation accident?","options":["Voyage Data Recorder (VDR)","Galley refrigerator","Fresh water generator","Oily water separator"],"answer":0,"why":"The VDR stores bridge audio, radar, position and other data from before an incident."},{"q":"How should witnesses be interviewed?","options":["All together in a group","Separately and as soon as possible","Using leading questions to save time","Only at the end of the contract"],"answer":1,"why":"Separate, early interviews give fresh accounts that are not influenced by others."},{"q":"What is a near miss?","options":["An event that could have caused harm but did not","An accident with serious injury","A routine maintenance job","A planned emergency drill"],"answer":0,"why":"A near miss is an unplanned event with potential for harm where no harm occurred."},{"q":"Why should near misses be reported?","options":["They give lessons before an actual accident happens","To blame the watchkeeper","To increase paperwork for the crew","To meet a monthly quota only"],"answer":0,"why":"Near misses reveal hazards early so they can be fixed before someone is hurt."},{"q":"Damaged parts, broken equipment and fluid samples are examples of what type of evidence?","options":["Witness evidence","Hearsay evidence","Documentary evidence","Physical evidence"],"answer":3,"why":"Physical evidence is the actual objects and materials from the scene."},{"q":"When is a corrective action effective?","options":["When it names the person to blame","When it only replaces the damaged part","When it is written but not followed up","When it removes or controls the cause so the event does not recur"],"answer":3,"why":"An effective action addresses the cause and is verified to work."},{"q":"Which document records the findings and recommendations of an investigation?","options":["Bell book","Investigation report","Garbage Record Book","Crew list"],"answer":1,"why":"The investigation report presents the facts, causes and recommended actions."}],"AI-RA - Accident Investigation and Risk Assessment Course":[{"q":"In risk assessment, what is a hazard?","options":["The cost of an accident","Anything with the potential to cause harm","The chance that harm will happen","A safety meeting onboard"],"answer":1,"why":"A hazard is a source of potential harm; risk is how likely and how severe the harm may be."},{"q":"Risk is commonly assessed by combining which two factors?","options":["Likelihood and consequence (severity)","Speed and draft","Weather and season","Cost and time"],"answer":0,"why":"Risk = likelihood of an event x severity of its consequence."},{"q":"In the hierarchy of controls, which control is the most effective?","options":["Warning signs","Elimination of the hazard","Extra training","Personal protective equipment"],"answer":1,"why":"Removing the hazard completely is the most effective control."},{"q":"In the hierarchy of controls, which control is the least effective?","options":["Elimination","Engineering controls","Substitution","Personal protective equipment"],"answer":3,"why":"PPE is the last line of defense because it depends on correct use and does not remove the hazard."},{"q":"What is residual risk?","options":["The risk to the cargo only","The risk that exists only in port","The risk before any assessment","The risk that remains after controls are applied"],"answer":3,"why":"Residual risk is what is left after control measures; it must be acceptable before work starts."},{"q":"Under the ISM Code, the company's safety management objectives include:","options":["Avoiding all port inspections","Increasing cargo capacity","Assessing all identified risks and establishing safeguards","Reducing the crew size"],"answer":2,"why":"ISM Code 1.2.2 requires the company to assess identified risks to ship, personnel and environment and set safeguards."},{"q":"When should a risk assessment be reviewed?","options":["Only when the ship is sold","Once every ten years","When conditions change or after an incident","Never after it is approved"],"answer":2,"why":"Risk assessments must be kept current when the task, conditions or lessons learned change."},{"q":"A Job Hazard Analysis divides the work into:","options":["A list of crew names only","Steps, with hazards and controls for each step","Costs and prices","Navigation waypoints"],"answer":1,"why":"Breaking a job into steps helps identify hazards and controls for each part of the task."},{"q":"In an investigation, what is the root cause?","options":["The underlying reason that, if fixed, prevents recurrence","The location of the damage","The first person who saw the event","The last action before the accident"],"answer":0,"why":"Fixing the root cause stops the same type of accident happening again."},{"q":"Before high-risk work such as hot work or enclosed space entry, what is normally required?","options":["Verbal permission from any crew member","Nothing if the job is short","A permit to work supported by a risk assessment","A note posted in the galley"],"answer":2,"why":"Permit-to-work systems ensure hazards are checked and controls are in place before high-risk work."}],"AIIRCA - Accident Investigation and Root Cause Analysis":[{"q":"What is an event timeline used for in an investigation?","options":["Showing events in the order they happened","Planning the next voyage","Listing crew salaries","Recording cargo weight"],"answer":0,"why":"A timeline puts events in sequence so causes and missed barriers can be seen."},{"q":"What is the immediate cause of an accident?","options":["The act or condition that directly led to the event","The ship's flag state","The age of the ship","The company's long-term policy"],"answer":0,"why":"The immediate cause is the direct trigger; deeper causes lie behind it."},{"q":"What is the 5 Whys technique?","options":["Completing five report forms","Asking why repeatedly to reach the underlying cause","Interviewing exactly five witnesses","Taking five photos of the scene"],"answer":1,"why":"Repeatedly asking why moves from symptoms to the underlying cause."},{"q":"The fishbone diagram used in root cause analysis is also called the:","options":["Pareto chart","Gantt chart","Ishikawa (cause-and-effect) diagram","Pie chart"],"answer":2,"why":"The Ishikawa diagram groups possible causes into categories leading to the problem."},{"q":"Where are systemic causes usually found?","options":["Only in the brand of equipment","In management systems, procedures and organization","Only in the weather at the time","Only in one person's mistake"],"answer":1,"why":"Systemic causes are weaknesses in the system that allowed the error or failure."},{"q":"Why is stopping an investigation at human error usually not enough?","options":["It takes too much time to write","It blames the equipment instead","It does not explain why the error happened","It is not allowed in reports"],"answer":2,"why":"Finding why the person made the error reveals the fix that prevents recurrence."},{"q":"What makes a corrective action verifiable?","options":["It is kept secret from the crew","It depends on good luck","It is written in very general words","It has a clear owner, deadline and way to check completion"],"answer":3,"why":"Clear ownership, timing and a check let the company confirm the action was done and works."},{"q":"Which of these is an example of a systemic cause?","options":["The deck was wet at the time of the slip","A light bulb failed during the watch","A crew member dropped a spanner","No written procedure existed for the task"],"answer":3,"why":"A missing procedure is an organizational weakness that can lead to many incidents."},{"q":"What should be done after corrective actions are put in place?","options":["Stop all incident reporting","Verify that they are effective","Change the ship's name","Delete the investigation file"],"answer":1,"why":"Follow-up confirms the actions actually prevent recurrence."},{"q":"What should be done with lessons learned from an investigation?","options":["Share them with the crew and fleet","Share them only with the insurer","Keep them only with the Master","Discard them after one month"],"answer":0,"why":"Sharing lessons helps other ships avoid the same incident."}],"AIS - Automatic Identification System":[{"q":"What is the main purpose of AIS?","options":["To automatically exchange ship identification and navigation data","To control the main engine","To replace the radar completely","To send crew emails"],"answer":0,"why":"AIS broadcasts and receives ship identity, position, course and speed to improve safety."},{"q":"On which radio band does shipborne AIS operate?","options":["MF band","Satellite C-band only","VHF maritime band","HF band"],"answer":2,"why":"AIS uses dedicated VHF maritime channels."},{"q":"Which of these is static AIS information?","options":["Course over ground","Ship's name and IMO number","Rate of turn","Speed over ground"],"answer":1,"why":"Static data such as name, call sign, MMSI and IMO number does not change during the voyage."},{"q":"Where does most dynamic AIS information come from?","options":["Ship's sensors such as GPS and gyro","Manual entry every hour","The cargo manifest","The port authority"],"answer":0,"why":"Position, speed and heading are fed automatically from connected sensors."},{"q":"Which AIS information is entered manually by the crew?","options":["Position","Speed over ground","Heading","Destination and ETA"],"answer":3,"why":"Voyage-related data such as destination, ETA and draught must be updated manually."},{"q":"Which is a limitation of AIS?","options":["It works without any power supply","It shows rocks and unlit buoys automatically","Its data is always accurate","Not all vessels carry AIS or have it switched on"],"answer":3,"why":"Small craft may not carry AIS and data can be missing or wrong, so it cannot be relied on alone."},{"q":"How should AIS information be used for collision avoidance?","options":["As the only source for decisions","Only when the ship is in port","Only during the night","As an aid, cross-checked with radar and visual lookout"],"answer":3,"why":"AIS is an aid; COLREGs decisions must be based on all available means including radar and lookout."},{"q":"Under SOLAS Chapter V, AIS is required on all passenger ships and on ships on international voyages of what size?","options":["10,000 GT and upwards","50 GT and upwards","300 GT and upwards","1,000 GT and upwards"],"answer":2,"why":"SOLAS V/19 requires AIS on ships of 300 GT and upwards on international voyages and all passenger ships."},{"q":"When may AIS be switched off?","options":["Every night","When the Master believes it would compromise safety or security","Whenever the ship is in port","Whenever the radar is working"],"answer":1,"why":"IMO guidance says AIS stays on at all times unless the Master judges it a security risk, such as piracy areas."},{"q":"What does MMSI stand for?","options":["Maritime Mobile Service Identity","Marine Main Ship Index","Master's Manual Safety Instruction","Mobile Marine Satellite Identifier"],"answer":0,"why":"The MMSI is the nine-digit number identifying a ship's radio station, including its AIS."}],"AMMS - Auxiliary Marine Machinery Systems":[{"q":"Why must a centrifugal pump usually be primed before starting?","options":["It cannot normally lift liquid when filled with air","It needs oil in the casing to start","It is designed to pump gases only","It runs backward when empty"],"answer":0,"why":"Centrifugal pumps lose suction when air-bound, so the casing must be filled with liquid."},{"q":"What happens if a positive displacement pump runs against a closed discharge valve?","options":["Pressure rises dangerously, so a relief valve is needed","Nothing happens to the pump","The pump cools down","The flow rate increases"],"answer":0,"why":"Positive displacement pumps keep delivering liquid, so pressure builds until something gives way."},{"q":"What is the purpose of a fuel oil purifier?","options":["To compress starting air","To heat the accommodation","To produce fresh water","To remove water and solid impurities from the oil"],"answer":3,"why":"Purifiers use centrifugal force to separate water and sludge from fuel or lube oil."},{"q":"What is the difference between a purifier and a clarifier?","options":["A purifier only heats the oil","They are exactly the same machine","A purifier removes water and solids; a clarifier mainly removes solids","A clarifier removes only water"],"answer":2,"why":"A purifier separates two liquids plus solids, while a clarifier is set up to remove solids."},{"q":"What is the purpose of the intercooler on a multi-stage air compressor?","options":["To filter the cooling seawater","To heat the air before engine starting","To cool the air between stages and improve efficiency","To lubricate the cylinders"],"answer":2,"why":"Cooling between stages reduces work needed and keeps air temperatures safe."},{"q":"Why are air receivers drained regularly?","options":["To test the alarm panel","To increase the air pressure","To remove collected water and oil","To clean the paintwork"],"answer":2,"why":"Water and oil in receivers cause corrosion and can create a fire or explosion risk."},{"q":"What is the function of a lube oil cooler?","options":["To heat the fuel oil for burning","To remove heat from the lubricating oil using cooling water","To separate water from the bilge","To raise the oil temperature for starting"],"answer":1,"why":"The cooler keeps lube oil at the right temperature so it lubricates properly."},{"q":"What is the purpose of a boiler safety valve?","options":["To release steam if pressure exceeds the set limit","To measure fuel flow","To control the water level","To start the burner"],"answer":0,"why":"The safety valve protects the boiler from overpressure."},{"q":"What is the danger of a very low water level in a boiler?","options":["Fuel consumption stops","Tubes can overheat and be damaged","Steam production becomes cleaner","The boiler cools down faster"],"answer":1,"why":"Without enough water, heated surfaces overheat and can fail."},{"q":"What must be done before maintenance on a pump?","options":["Only inform the cook","Open the casing while under pressure","Keep it running to check vibration","Isolate, lock out and tag out the power and valves"],"answer":3,"why":"Isolation and lockout/tagout prevent unexpected start-up or release of pressure."}],"APA - Anti Piracy Awareness":[{"q":"Which IMO code sets ship and port facility security requirements?","options":["LSA Code","IMDG Code","IBC Code","ISPS Code"],"answer":3,"why":"The International Ship and Port Facility Security (ISPS) Code covers maritime security."},{"q":"How many security levels are there under the ISPS Code?","options":["Three","Four","Two","Five"],"answer":0,"why":"ISPS uses Security Levels 1 (normal), 2 (heightened) and 3 (exceptional)."},{"q":"What does the Ship Security Alert System (SSAS) do?","options":["Sounds a loud alarm on deck","Calls nearby fishing boats","Sends a silent alert to shore authorities","Broadcasts on VHF channel 16 only"],"answer":2,"why":"SSAS sends a covert alert ashore without warning the attackers onboard."},{"q":"Who is responsible onboard for implementing the Ship Security Plan?","options":["Bosun","Chief Cook","Ship Security Officer (SSO)","Port State Control Officer"],"answer":2,"why":"The SSO, under the Master, implements and maintains the Ship Security Plan."},{"q":"Which is a recommended ship protection measure in Best Management Practices (BMP)?","options":["Physical barriers such as razor wire","Keeping only one lookout at night","Slowing down when skiffs approach","Allowing small boats alongside"],"answer":0,"why":"BMP advises hardening the ship with barriers, extra lookouts and a citadel."},{"q":"What is a citadel?","options":["The ship's bonded store","A secure area where the crew can shelter with communications","The captain's private cabin","The lifeboat embarkation deck"],"answer":1,"why":"A citadel is a protected refuge with supplies and communications for the crew during an attack."},{"q":"What does access control onboard mean?","options":["Checking identity and controlling who boards the ship","Removing the gangway watch","Letting anyone board in port","Locking the galley only at night"],"answer":0,"why":"Access control prevents unauthorized persons from boarding."},{"q":"If pirates board and take control, what should the crew do?","options":["Jump overboard to escape","Stay calm, cooperate and avoid actions that risk lives","Fight the attackers with any weapons","Take photos of the pirates"],"answer":1,"why":"Resistance after boarding puts lives at risk; safety of the crew comes first."},{"q":"Which watchkeeping practice helps detect pirates early?","options":["Reducing the bridge team at night","Keeping lookouts inside the wheelhouse","Watching only the AIS screen","Extra lookouts with binoculars plus radar watch"],"answer":3,"why":"Early detection gives more time to raise alarms and take evasive action."},{"q":"How must the Ship Security Plan be kept?","options":["Only at the company office","Posted on social media","Shared with every visitor","Onboard and protected from unauthorized access"],"answer":3,"why":"The approved SSP is confidential and must be protected onboard."}],"ARPA - Automatic Radar Plotting Aids":[{"q":"What does CPA stand for?","options":["Course Position Angle","Closest Point of Approach","Collision Prevention Alarm","Central Plotting Area"],"answer":1,"why":"CPA is the closest distance a target will pass if both ships keep course and speed."},{"q":"What does TCPA mean?","options":["Total course plotted automatically","Target change in position alarm","Time to the closest point of approach","True course and position average"],"answer":2,"why":"TCPA tells how much time remains until the CPA is reached."},{"q":"What does an ARPA trial maneuver show?","options":["Switching off all target alarms","Automatic steering of the ship","A recording of the voyage data","The predicted effect of a planned course or speed change"],"answer":3,"why":"Trial maneuver simulates a planned action so its effect on CPA can be checked before acting."},{"q":"Relative vectors are mainly used to:","options":["Quickly see if a target is on a collision course","Calculate fuel consumption","Show the target's course over ground","Measure the water depth"],"answer":0,"why":"If a target's relative vector points at own ship, there is a risk of collision."},{"q":"Why wait a few minutes after acquiring a target before relying on its data?","options":["ARPA needs time to track and calculate a steady course and speed","The target must reply by VHF first","The radar must warm up again","The gyro must be reset each time"],"answer":0,"why":"ARPA calculations become accurate only after several minutes of steady tracking."},{"q":"What happens if wrong gyro or speed log data is fed into ARPA?","options":["There is no effect at all","Only the screen color changes","The calculated target data will be wrong","The radar range doubles"],"answer":2,"why":"ARPA computes true target motion from own heading and speed, so bad inputs give bad results."},{"q":"What is target swap?","options":["When two ships exchange crew","When ARPA wrongly transfers tracking to a nearby target","When a target sends AIS data","When the radar changes range scale"],"answer":1,"why":"Target swap happens when two echoes pass close and the tracker jumps to the wrong one."},{"q":"Which COLREG rule requires proper use of radar, including radar plotting, to determine risk of collision?","options":["Rule 13","Rule 5","Rule 19","Rule 7"],"answer":3,"why":"Rule 7(b) requires proper use of radar including long-range scanning and radar plotting."},{"q":"For collision avoidance, ARPA true vectors should normally be:","options":["Sea-stabilized, to show the target's heading through the water","Shown only in head-up mode","Switched off completely","Ground-stabilized, to show the tidal set"],"answer":0,"why":"Sea-stabilized vectors show the target's aspect, which relates to the COLREGs situation."},{"q":"Which is a limitation of ARPA?","options":["It works without radar input","It can see behind large obstructions","Its data is never delayed","Small targets in sea or rain clutter may not be tracked"],"answer":3,"why":"Weak echoes in clutter may be lost, so a visual and radar lookout must continue."}],"BAC - Basic Arabic Culture":[{"q":"What is the Islamic holy month of fasting called?","options":["Eid al-Adha","Ramadan","Hajj","Muharram"],"answer":1,"why":"Ramadan is the month when Muslims fast during daylight hours."},{"q":"During Ramadan, Muslims fast from:","options":["Only on Fridays","Dawn to sunset","Noon to midnight","Sunset to dawn"],"answer":1,"why":"The fast runs from dawn until sunset each day."},{"q":"Which day is the weekly congregational prayer day in Islam?","options":["Sunday","Saturday","Monday","Friday"],"answer":3,"why":"Friday (Jumu'ah) is the day of congregational prayer."},{"q":"Which food is forbidden for Muslims?","options":["Pork","Lamb","Rice","Fish"],"answer":0,"why":"Islamic dietary law prohibits pork."},{"q":"What does halal mean?","options":["The time for fasting","Forbidden under Islamic law","Permitted under Islamic law","Spicy food"],"answer":2,"why":"Halal means allowed; haram means forbidden."},{"q":"Which hand should be used to eat or to give and receive things in Arab culture?","options":["The left hand","Both hands always","Either hand with gloves","The right hand"],"answer":3,"why":"The left hand is traditionally considered unclean, so the right hand is used."},{"q":"What does the greeting As-salamu alaykum mean?","options":["Goodbye","Thank you","Peace be upon you","Good morning"],"answer":2,"why":"It is the common Arabic greeting; the reply is Wa alaykum as-salam."},{"q":"How should you behave when Muslim crew members are praying?","options":["Turn on loud music","Take photos of them","Avoid walking in front of them and keep noise low","Ask them to pray later"],"answer":2,"why":"Respecting prayer time supports good relations in a multicultural crew."},{"q":"In Arab ports during Ramadan, non-Muslims should:","options":["Avoid eating, drinking or smoking in public during fasting hours","Celebrate loudly in the streets","Ignore local customs completely","Eat openly in front of officials"],"answer":0,"why":"Many Arab countries expect, and some require, no public eating or drinking during fasting hours."},{"q":"What is good professional etiquette when meeting Arab officials?","options":["Wear shorts and sandals","Dress modestly and greet politely, following their lead","Use first names and jokes right away","Sit with the soles of your shoes showing"],"answer":1,"why":"Modest dress and respectful greetings show professionalism; showing shoe soles is considered rude."}],"BBSC - Behavioral Based Safety Course":[{"q":"What does Behavior Based Safety focus on?","options":["Reducing the number of crew","Buying new equipment only","Observing and improving work behaviors to prevent accidents","Punishing workers who make mistakes"],"answer":2,"why":"BBS uses observation and feedback to increase safe behavior and reduce at-risk behavior."},{"q":"Which is an example of at-risk behavior?","options":["Wearing a hard hat on deck","Reporting an oil leak","Working aloft without a safety harness","Using the handrail on stairs"],"answer":2,"why":"Working at height without fall protection is a clear at-risk behavior."},{"q":"How should a safety observation be done?","options":["Once a year during audits","Hidden and used for discipline","Non-punitive and focused on the behavior, not the person","Only by the company superintendent"],"answer":2,"why":"BBS works when crew trust that observations are for learning, not punishment."},{"q":"What is positive reinforcement?","options":["Praising safe behavior so it is repeated","Giving a warning letter","Ignoring safe behavior","Cutting overtime pay"],"answer":0,"why":"Recognizing safe behavior makes it more likely to continue."},{"q":"Constructive feedback should be:","options":["Given weeks later","Vague and general","Shouted in front of others","Specific, timely and respectful"],"answer":3,"why":"Clear, prompt and respectful feedback helps people change behavior."},{"q":"What does the safety pyramid idea teach?","options":["Accidents happen only to new crew","Many unsafe acts and near misses happen before a serious accident","Serious accidents have no warning signs","Only equipment causes accidents"],"answer":1,"why":"Reducing unsafe acts and near misses reduces the chance of serious accidents."},{"q":"What is Stop Work Authority?","options":["Any crew member may stop a job they believe is unsafe","Only shore staff may stop work","Work cannot stop once it starts","Only the Master may stop work"],"answer":0,"why":"Everyone has the right and duty to stop unsafe work without fear of blame."},{"q":"What does the ISM Code require the company to establish?","options":["A safety management system with safe work practices","A crew entertainment program","A cargo marketing plan","A fixed ship speed"],"answer":0,"why":"The ISM Code requires a documented Safety Management System."},{"q":"In the ABC model of behavior, what do the letters stand for?","options":["Action, Briefing, Check","Antecedent, Behavior, Consequence","Accident, Blame, Correction","Alarm, Barrier, Control"],"answer":1,"why":"Antecedents trigger behavior, and consequences make it more or less likely to be repeated."},{"q":"What is complacency?","options":["Being very alert during work","Following procedures strictly","Asking questions before work","Overconfidence that makes a person less careful in routine tasks"],"answer":3,"why":"Complacency in familiar jobs is a common cause of accidents."}],"BCAF - Bunkering Calculation and Familiarization":[{"q":"What should be done before bunkering starts?","options":["Hold a pre-bunkering meeting and complete the checklist","Hold a crew party","Only do a lifeboat drill","Arrange a cargo survey"],"answer":0,"why":"The checklist confirms communication, transfer rate, tanks and emergency stop with the supplier."},{"q":"At what standard reference temperature is bunker fuel density normally reported?","options":["0°C","50°C","25°C","15°C"],"answer":3,"why":"Fuel density is reported at 15°C so quantities can be compared on the same basis."},{"q":"To convert corrected volume (m³) to mass (metric tonnes), you multiply by:","options":["Tank temperature","Density at 15°C","Sounding depth","Ship's trim"],"answer":1,"why":"Mass = volume at 15°C x density at 15°C."},{"q":"What is ullage?","options":["The distance from the liquid surface to the top reference point","The depth of liquid from the tank bottom","The temperature of the fuel","The weight of fuel in the tank"],"answer":0,"why":"Ullage measures empty space from the top; sounding measures liquid depth from the bottom."},{"q":"What is the Volume Correction Factor (VCF) used for?","options":["Calculating trim","Converting observed volume to volume at 15°C","Measuring the sulfur content","Finding the flash point"],"answer":1,"why":"Oil expands when warm, so the VCF corrects observed volume to the standard temperature."},{"q":"Why should bunker tanks not be filled to 100%?","options":["To save money on fuel","To allow for thermal expansion and avoid overflow","Because sounding pipes cannot reach the top","To make the ship lighter"],"answer":1,"why":"Space must be left for expansion and to prevent overflow and spills."},{"q":"Why are deck scuppers plugged during bunkering?","options":["To stop crew from slipping","To keep rainwater on deck","To cool the deck","To stop any spilled oil from going overboard"],"answer":3,"why":"Plugged scuppers contain spills on deck and prevent pollution."},{"q":"Under MARPOL Annex VI, how long must the Bunker Delivery Note be kept onboard?","options":["1 year","10 years","3 years","6 months"],"answer":2,"why":"MARPOL Annex VI Regulation 18 requires the BDN to be retained onboard for three years."},{"q":"Which MARPOL Annex covers fuel oil sulfur limits and the bunker delivery note?","options":["Annex VI","Annex I","Annex V","Annex IV"],"answer":0,"why":"Annex VI deals with air pollution, including fuel oil quality and sulfur content."},{"q":"Where must bunkering of fuel oil be recorded under MARPOL Annex I?","options":["Crew list","Garbage Record Book","Oil Record Book","Cargo Securing Manual"],"answer":2,"why":"Bunkering of fuel or bulk lube oil is an Oil Record Book Part I entry."}],"BMT - Banksman Training":[{"q":"What is the role of a banksman?","options":["To check the cargo documents","To guide the crane operator with signals and keep the lift area safe","To operate the crane controls","To repair the crane"],"answer":1,"why":"The banksman directs the operator when the load or area cannot be seen clearly."},{"q":"Who should give lifting signals to the crane operator?","options":["Two people at the same time","Whoever is closest to the load","Anyone standing nearby","Only one designated banksman"],"answer":3,"why":"One signaler avoids confusing or conflicting instructions."},{"q":"Which signal must the crane operator obey from any person?","options":["Lower slowly","Emergency stop","Hoist up","Swing left"],"answer":1,"why":"Anyone who sees danger may give the emergency stop signal, and it must be obeyed."},{"q":"Where should the banksman stand?","options":["On top of the load","Directly under the load","In a safe spot where the operator and the load can be clearly seen","Behind the crane out of sight"],"answer":2,"why":"The banksman must be visible to the operator and away from the load path."},{"q":"What is an exclusion zone during lifting?","options":["The ship's office","An area around the lift that unauthorized people must not enter","The crane operator's cabin","A designated smoking area"],"answer":1,"why":"Keeping people out of the danger area prevents injuries from falling or swinging loads."},{"q":"What should be done if visual contact between the banksman and operator is lost?","options":["Stop the operation until contact is restored","Let the load swing freely","Speed up to finish quickly","Continue carefully"],"answer":0,"why":"Without communication the operator is working blind, so the lift must stop."},{"q":"How should radios be used during lifting operations?","options":["On a dedicated channel with clear, agreed words","By mobile phone text messages","On any channel shared with other jobs","By several people giving orders at once"],"answer":0,"why":"A dedicated channel and standard words prevent misunderstandings."},{"q":"How can a banksman be easily seen?","options":["By wearing dark clothing","By standing behind cargo","By wearing high-visibility clothing","By waving a towel"],"answer":2,"why":"High-visibility clothing helps the operator and others spot the banksman."},{"q":"Where should personnel never stand during lifting operations?","options":["At the agreed signaling position","Outside the exclusion zone","Behind the safety barrier","Under the suspended load"],"answer":3,"why":"A load can fall at any time, so no one may stand beneath it."},{"q":"What are tag lines used for?","options":["To control load swing from a safe distance","To tie the crane hook","To measure the load weight","To lift the load"],"answer":0,"why":"Tag lines let crew steady the load without standing close to it."}],"BNC - Basic Networking Course":[{"q":"What is an IP address used for?","options":["Powering the computer","Identifying a device on a network","Storing files","Measuring internet speed"],"answer":1,"why":"Each device needs an IP address so data can be sent to it."},{"q":"Which device connects different networks and forwards traffic between them?","options":["Router","Printer","Scanner","Monitor"],"answer":0,"why":"A router links networks, such as the ship LAN and the satellite internet link."},{"q":"What does a network switch do?","options":["Converts AC power to DC","Cools the server","Prints documents","Connects devices within the same local network"],"answer":3,"why":"A switch connects computers and devices on the same LAN."},{"q":"What does LAN stand for?","options":["Linked Application Network","Local Area Network","Long Antenna Node","Line Access Number"],"answer":1,"why":"A LAN is a network within a small area such as a ship."},{"q":"Which of these is a private IPv4 address?","options":["1.1.1.1","203.0.113.5","8.8.8.8","192.168.1.10"],"answer":3,"why":"Addresses in 192.168.0.0/16 are reserved for private networks."},{"q":"Which command is commonly used to test network connectivity?","options":["del","copy","format","ping"],"answer":3,"why":"Ping sends test packets to check whether another device responds."},{"q":"What does DHCP do?","options":["Stores email","Speeds up the CPU","Automatically assigns IP addresses to devices","Blocks viruses"],"answer":2,"why":"DHCP gives devices their IP settings automatically."},{"q":"What does a firewall do?","options":["Controls network traffic using security rules","Charges batteries","Increases screen resolution","Puts out fires in the server room"],"answer":0,"why":"A firewall allows or blocks traffic to protect the network."},{"q":"A computer has no network connection. What should you check first?","options":["Call the satellite provider","Buy a new computer","The cable connection and network indicator lights","Reinstall the operating system"],"answer":2,"why":"Start troubleshooting with simple physical checks like cables and link lights."},{"q":"Which is good cybersecurity practice on a ship's network?","options":["Share the admin password with all crew","Connect all systems to one open network","Keep crew Wi-Fi separate from ship operational systems","Disable all software updates"],"answer":2,"why":"Separating networks stops problems on crew devices from reaching critical systems."}],"BRM - Bridge Resources Management":[{"q":"What is Bridge Resource Management?","options":["Managing the ship's budget","Repairing bridge equipment","Planning crew shore leave","Effective use of all bridge resources for safe navigation"],"answer":3,"why":"BRM is the use of people, equipment and information to keep navigation safe."},{"q":"What is situational awareness?","options":["Knowing what is happening around the ship and what may happen next","Knowing the ship's history","Remembering all crew names","Reading the daily menu"],"answer":0,"why":"Good situational awareness means perceiving, understanding and anticipating the situation."},{"q":"What is an error chain?","options":["A fault in the anchor chain","A broken steering chain","The chain of command","A series of small errors that can lead to an accident"],"answer":3,"why":"Accidents often follow several linked errors; breaking any link can prevent the accident."},{"q":"What is closed-loop communication?","options":["Talking only by radio","Giving orders with no reply","The receiver repeats the order back and the sender confirms it","Writing orders in the logbook only"],"answer":2,"why":"Repeating back and confirming makes sure the message was understood correctly."},{"q":"When a pilot is onboard, who remains responsible for the safety of the ship?","options":["Only the pilot","The Master, with the OOW monitoring the pilot","The port authority","The helmsman"],"answer":1,"why":"The pilot's presence does not relieve the Master or OOW of their duties for safe navigation."},{"q":"What are the four stages of passage planning?","options":["Ordering, buying, storing and using","Briefing, lunch, watch and sleep","Appraisal, planning, execution and monitoring","Loading, sailing, berthing and discharge"],"answer":2,"why":"IMO guidelines (Resolution A.893) set these four stages of passage planning."},{"q":"How does fatigue affect a watchkeeper?","options":["It reduces alertness and increases errors","It only affects engine crew","It has no effect on watchkeeping","It improves decision-making"],"answer":0,"why":"Fatigue slows reactions and judgment, which can lead to accidents."},{"q":"A junior officer sees danger that the Master has not noticed. What should the officer do?","options":["Leave the bridge","Wait until the Master asks","Stay quiet out of respect","Speak up clearly and promptly"],"answer":3,"why":"Assertiveness by any team member can break the error chain."},{"q":"Under STCW, what is the minimum rest for a watchkeeper in any 24-hour period?","options":["8 hours","10 hours","12 hours","6 hours"],"answer":1,"why":"STCW requires at least 10 hours of rest in any 24 hours and 77 hours in any 7 days."},{"q":"How should a bridge team avoid over-reliance on automation?","options":["Cross-check electronic information with other means","Trust the ECDIS completely","Switch off alarms to reduce noise","Use only one position source"],"answer":0,"why":"Equipment can fail or be wrong, so information must be cross-checked."}],"BRM-BTM - Bridge Resources Management with Bridge Team Management":[{"q":"What is challenge-and-response on the bridge?","options":["Only the Master is allowed to speak","Ignoring doubts to keep the peace","Team members question unclear actions and the leader responds","Testing alarms every day"],"answer":2,"why":"Challenge-and-response lets anyone raise concerns so errors are caught early."},{"q":"How should workload be shared in heavy traffic?","options":["Let one officer do everything","Give clear tasks such as lookout, helm and navigation to team members","Reduce the number of people on the bridge","Stop monitoring the radar"],"answer":1,"why":"Sharing tasks prevents overload and keeps every function covered."},{"q":"What is the purpose of a pre-departure bridge briefing?","options":["To make sure everyone understands the plan, roles and risks","To discuss crew salaries","To plan the menu","To review cargo invoices"],"answer":0,"why":"A briefing creates a shared understanding before the passage starts."},{"q":"How should a passage be monitored?","options":["Monitor only in port","Check the position only at departure","Rely on one GPS alone","Fix the position regularly using more than one method"],"answer":3,"why":"Regular fixes by different methods detect errors and keep the ship on track."},{"q":"What leadership style is usually needed in an emergency?","options":["Clear, direct instructions from the leader","Voting on every decision","No leader at all","Long discussions before any action"],"answer":0,"why":"In emergencies, time is short, so the leader must give clear direct orders."},{"q":"What is the purpose of a debriefing after a passage or event?","options":["To review what went well and what can be improved","To end the watch early","To count the stores","To blame people for mistakes"],"answer":0,"why":"Debriefings turn experience into lessons for the team."},{"q":"What is a shared mental model?","options":["Each member follows a different plan","Only the Master knows the plan","All team members understand the plan and situation the same way","The plan is kept secret"],"answer":2,"why":"A shared picture helps the team spot when something is going wrong."},{"q":"Which sequence describes good emergency decision-making?","options":["Act first without assessing","Assess the situation, decide, act and then review","Wait for the company to decide","Silence the alarms and wait"],"answer":1,"why":"A structured cycle helps make sound decisions under pressure."},{"q":"What are the Master's standing orders and night orders for?","options":["To replace the passage plan","To record cargo quantities","To list the crew's meal times","To give the OOW written instructions, including when to call the Master"],"answer":3,"why":"These orders tell the OOW what is expected and when the Master must be called."},{"q":"Who may be part of the bridge team?","options":["Only the officer of the watch","Only the pilot","Only the Master","The Master, officers, helmsman, lookout and pilot"],"answer":3,"why":"Everyone involved in navigating the ship, including the pilot, is part of the bridge team."}],"BS - Banksman and Slinging":[{"q":"What must be known before lifting any load?","options":["The color of the load","The age of the crane","The weight of the load","The owner of the load"],"answer":2,"why":"Knowing the weight is needed to choose the right equipment and stay within its limits."},{"q":"What does Safe Working Load (SWL) mean?","options":["The load at which the sling breaks","The maximum load the equipment is allowed to lift","The minimum load required to lift","The weight of the sling itself"],"answer":1,"why":"SWL is the maximum load the gear is certified to lift in normal service."},{"q":"As the angle between sling legs increases, what happens to the tension in each leg?","options":["It stays the same","It increases","It decreases","It becomes zero"],"answer":1,"why":"Wider sling angles raise the force in each leg, so the gear can be overloaded."},{"q":"Which defects mean a wire rope sling must not be used?","options":["A correct, readable tag","The proper length","A clean surface","Broken wires, kinks, crushing or corrosion"],"answer":3,"why":"Such damage reduces strength and can cause the sling to fail."},{"q":"What should be done with a damaged sling?","options":["Repair it with tape","Use it only for light loads","Hide it in the store","Remove it from service and label it as defective"],"answer":3,"why":"Defective gear must be taken out of use so no one uses it by mistake."},{"q":"How should slings be protected from sharp edges?","options":["Use edge protectors between the sling and the edge","Nothing is needed","Use a thinner sling","Lift faster"],"answer":0,"why":"Sharp edges can cut slings; packing or protectors prevent damage."},{"q":"What should be done before the full lift?","options":["Swing the load to test it","Lift to full height at once","Lift slightly and check the balance and security of the load","Remove the tag lines"],"answer":2,"why":"A trial lift shows whether the load is balanced and properly slung."},{"q":"Hand signals used during lifting must be:","options":["Agreed and understood by both banksman and operator","Given by several people at once","Made up on the spot","Different for each lift"],"answer":0,"why":"Standard agreed signals prevent misunderstanding."},{"q":"How should a shackle pin be fitted?","options":["Screwed fully home so it cannot loosen","Left half-tightened","Replaced with wire","Replaced with any bolt"],"answer":0,"why":"A loose pin can work out and drop the load."},{"q":"Where should the crane hook be positioned in relation to the load?","options":["Over the heaviest end only","Anywhere, it does not matter","At one end of the load","Directly above the load's center of gravity"],"answer":3,"why":"A hook over the center of gravity keeps the load level and stable."}],"BTM - Bridge Team Management":[{"q":"Before taking over the watch, what should the relieving officer check?","options":["Only the time","Position, course, speed, traffic, weather and the Master's orders","Only the cargo invoice","Only the galley menu"],"answer":1,"why":"STCW requires the relieving officer to be fully aware of the situation before taking over."},{"q":"If a maneuver is in progress at watch change, what should happen?","options":["Both officers leave the bridge","The watch is handed over immediately","The helmsman takes the watch","The officer being relieved completes it before handing over"],"answer":3,"why":"STCW says the watch should not be handed over during a maneuver or avoiding action."},{"q":"What is delegation on the bridge?","options":["Giving tasks without explanation","Doing every task yourself","Avoiding all tasks","Giving tasks to team members according to their skills and role"],"answer":3,"why":"Proper delegation reduces workload and uses the team's skills."},{"q":"What is cross-checking?","options":["Checking only at the end of the voyage","Checking only the clock","Team members verify each other's actions and information","Each person works alone"],"answer":2,"why":"Cross-checking catches errors before they become accidents."},{"q":"What should be done if the steering fails?","options":["Wait for the next watch","Follow emergency procedures, inform the Master and use emergency steering","Switch off the radar","Continue as normal"],"answer":1,"why":"Quick action under the emergency procedure keeps the ship under control."},{"q":"When should the OOW call the Master?","options":["When the coffee runs out","When restricted visibility is met or expected","When the sun rises","When the watch is quiet"],"answer":1,"why":"STCW guidance lists restricted visibility among the situations requiring the Master to be called."},{"q":"Which COLREG rule requires a proper lookout by sight and hearing?","options":["Rule 10","Rule 18","Rule 35","Rule 5"],"answer":3,"why":"Rule 5 requires a proper lookout by sight, hearing and all available means."},{"q":"Under STCW watchkeeping principles, the lookout must:","options":["Give full attention to lookout duty","Do paperwork during the watch","Also steer the ship at the same time","Only look ahead"],"answer":0,"why":"The lookout must not be given other tasks that interfere with keeping a lookout."},{"q":"Who has overall responsibility for the safe navigation of the ship?","options":["The pilot","The bosun","The Master","The helmsman"],"answer":2,"why":"The Master always holds overall command and responsibility."},{"q":"Why are checklists used on the bridge?","options":["To make sure important steps are not missed","To delay operations","To replace good judgment","To record crew complaints"],"answer":0,"why":"Checklists support the team so key steps are not forgotten."}],"BULKFAM - Bulk Carrier Familiarization and Safety":[{"q":"What is the IMSBC Code?","options":["International Maritime Safety Board Code","International Marine Ship Building Code","International Maritime Solid Bulk Cargoes Code","Inland Marine Solid Barge Code"],"answer":2,"why":"The IMSBC Code governs the safe carriage of solid bulk cargoes."},{"q":"What is cargo liquefaction?","options":["Wet cargo behaving like a liquid and shifting","Cargo becoming heavier at sea","Cargo catching fire","Cargo freezing in the hold"],"answer":0,"why":"Cargoes with too much moisture can flow, shift and capsize the ship."},{"q":"A Group A cargo may be loaded only if its moisture content is:","options":["Higher than the TML","Equal to the flash point","Less than the Transportable Moisture Limit (TML)","Above the angle of repose"],"answer":2,"why":"Moisture below the TML is required to avoid liquefaction."},{"q":"In the IMSBC Code, Group B cargoes are those that:","options":["May liquefy","Have chemical hazards","Are only grain cargoes","Are neither liquefiable nor hazardous"],"answer":1,"why":"Group A may liquefy, Group B has chemical hazards, Group C is neither."},{"q":"What can happen if loading is uneven or too fast?","options":["Lower fuel consumption","A faster voyage","Better stability","Excessive shear forces and bending moments that damage the hull"],"answer":3,"why":"Poor loading sequences can overstress the hull structure."},{"q":"Before loading, what should the ship and terminal agree on?","options":["The menu for the voyage","A loading or unloading plan including sequence and ballast","The crew's holiday plan","The ship's paint color"],"answer":1,"why":"The BLU Code requires an agreed plan to keep stresses and stability within limits."},{"q":"What are the main hazards of entering a cargo hold?","options":["Oxygen depletion and toxic gases","Too much fresh air","Bright lighting","Low noise levels"],"answer":0,"why":"Some bulk cargoes consume oxygen or give off toxic gases."},{"q":"What must be done before entering a cargo hold?","options":["Test the atmosphere and follow the enclosed space entry permit","Close the hatch behind you","Enter quickly and alone","Rely on smell to detect gas"],"answer":0,"why":"Atmosphere testing and a permit protect against deadly enclosed-space hazards."},{"q":"What is the angle of repose?","options":["The angle of the crane boom","The angle of the hatch cover","The angle of the ship's list","The steepest slope at which the cargo stays without sliding"],"answer":3,"why":"Cargoes with a low angle of repose shift more easily."},{"q":"What is trimming of bulk cargo?","options":["Removing cargo samples","Leveling the cargo to reduce the risk of shifting","Cutting the cargo into pieces","Painting the hold"],"answer":1,"why":"Leveling the cargo surface reduces shifting and improves stability."}],"CA - Collision Avoidance":[{"q":"Which factors must be considered when deciding a safe speed under Rule 6?","options":["The crew's preference","The fuel price","Visibility, traffic density and maneuverability","The port fees"],"answer":2,"why":"Rule 6 lists visibility, traffic and the vessel's maneuverability among safe speed factors."},{"q":"When does risk of collision exist according to Rule 7?","options":["When the vessel shows a sternlight","When the compass bearing of an approaching vessel does not change appreciably","When the vessel is far away","When the bearing changes quickly"],"answer":1,"why":"A steady bearing with closing range means risk of collision."},{"q":"Under Rule 8, action to avoid collision should be:","options":["Small and gradual","Delayed until the last minute","A series of small course changes","Positive, in ample time and large enough to be readily apparent"],"answer":3,"why":"Rule 8 requires bold, early action that others can see clearly."},{"q":"In a head-on situation between two power-driven vessels, what should each do?","options":["Alter course to starboard","Let the smaller vessel give way","Alter course to port","Stop engines"],"answer":0,"why":"Rule 14 requires each vessel to alter course to starboard."},{"q":"In a crossing situation between two power-driven vessels, which vessel gives way?","options":["The larger vessel","The vessel that has the other on her own starboard side","The faster vessel","The vessel that has the other on her port side"],"answer":1,"why":"Rule 15: the vessel with the other on her starboard side keeps out of the way."},{"q":"In an overtaking situation, which vessel keeps out of the way?","options":["The vessel being overtaken","The overtaking vessel","The vessel on the right","The bigger vessel"],"answer":1,"why":"Rule 13 makes the overtaking vessel responsible for keeping clear."},{"q":"In restricted visibility, what should a vessel do when it hears a fog signal apparently forward of the beam?","options":["Increase speed to clear quickly","Stop sounding fog signals","Alter course toward the sound","Reduce speed to the minimum needed to keep her course"],"answer":3,"why":"Rule 19(e) requires reducing to minimum steerage speed unless no risk of collision exists."},{"q":"When the give-way vessel is clearly not taking proper action, the stand-on vessel:","options":["Must stop and anchor","Should switch off her lights","May take action to avoid collision by her own maneuver","Must keep course and speed no matter what"],"answer":2,"why":"Rule 17 allows, and when close requires, the stand-on vessel to act."},{"q":"According to Rule 7, assumptions about risk of collision:","options":["Can replace a visual lookout","Are always safe at night","Can be based on one radar observation","Should not be based on scanty information, especially radar"],"answer":3,"why":"Rule 7(c) warns against assumptions based on scanty radar information."},{"q":"How must a proper lookout be kept under Rule 5?","options":["By sight, hearing and all available means","Only by radar","Only by AIS","Only at night"],"answer":0,"why":"Rule 5 requires using every available means to judge the situation."}],"CE - Control Engineering":[{"q":"What is closed-loop (feedback) control?","options":["Control that measures the output and corrects the input","Control that works without any measurement","Control without a controller","Control that is always manual"],"answer":0,"why":"Feedback compares the measured value with the set point and corrects the difference."},{"q":"What is a sensor?","options":["A device that stores fuel","A device that steers the ship","A device that measures a value such as temperature or pressure","A device that cools the engine"],"answer":2,"why":"Sensors provide the measurements a control system needs."},{"q":"What is a set point?","options":["The location of the sensor","The pump's running speed","The maximum alarm value","The desired value the controller tries to keep"],"answer":3,"why":"The controller adjusts the process to hold it at the set point."},{"q":"What does PID stand for in control engineering?","options":["Power, Input, Drive","Pressure, Inlet, Discharge","Proportional, Integral, Derivative","Primary, Internal, Direct"],"answer":2,"why":"PID controllers combine three actions to control a process accurately."},{"q":"What does integral action in a controller do?","options":["Reacts only to the rate of change","Switches the system off","Adds noise to the signal","Removes the steady-state error (offset)"],"answer":3,"why":"Integral action keeps correcting until the offset is removed."},{"q":"What is a thermocouple used to measure?","options":["Temperature","Pressure","Flow","Level"],"answer":0,"why":"A thermocouple produces a small voltage that varies with temperature."},{"q":"What does fail-safe design mean?","options":["The system can never fail","The system goes to a safe condition if a fault occurs","The system runs faster after a failure","The alarm is always silent"],"answer":1,"why":"Fail-safe design protects people and machinery when a component fails."},{"q":"What should the engineer do when a machinery alarm sounds?","options":["Acknowledge it, then find and correct the cause","Silence it and ignore it","Wait for the next watch","Disconnect the sensor"],"answer":0,"why":"Alarms warn of abnormal conditions that must be investigated."},{"q":"Which is a common analog instrument signal range?","options":["1-2 kV","0-440 V","100-200 A","4-20 mA"],"answer":3,"why":"4-20 mA current loops are a standard way to send instrument signals."},{"q":"Why does a 4-20 mA signal use 4 mA as its zero?","options":["To make the display brighter","To detect a broken wire or signal loss","To save electrical power","To increase the pressure"],"answer":1,"why":"A reading of 0 mA shows a fault, which is different from a true zero reading of 4 mA."}],"CFC - Classification Familiarization Course":[{"q":"What is the main function of a classification society?","options":["To set and verify technical standards for ship design, construction and maintenance","To hire seafarers for shipowners","To arrange cargo bookings","To buy and sell ships"],"answer":0,"why":"Class societies publish rules and survey ships to confirm they meet them."},{"q":"What does IACS stand for?","options":["International Academy of Crew Standards","International Association of Classification Societies","International Agency for Cargo Safety","Inter-American Coast Security"],"answer":1,"why":"IACS is the association of leading classification societies that sets common requirements."},{"q":"What is the normal interval for a class renewal (special) survey?","options":["2 years","10 years","5 years","1 year"],"answer":2,"why":"Class is renewed in a five-year cycle."},{"q":"When can an annual survey be carried out?","options":["Any time during the year","Only on the exact anniversary date","Within 1 week after expiry","Within 3 months before or after the anniversary date"],"answer":3,"why":"Under the harmonized survey system, annual surveys have a window of three months either side of the anniversary date."},{"q":"What is a Recognized Organization (RO)?","options":["A port terminal operator","A class society authorized by the flag state to do statutory surveys","A shipping company","A crewing agency"],"answer":1,"why":"Flag states may delegate statutory surveys and certificates to recognized organizations."},{"q":"What is a condition of class?","options":["A bonus for carrying cargo","A reward for the crew","A suggestion with no deadline","A requirement that must be corrected within a set time to keep class"],"answer":3,"why":"Failing to clear a condition of class by its due date can lead to suspension of class."},{"q":"Which is a statutory certificate required by SOLAS?","options":["Charter party","Cargo Ship Safety Equipment Certificate","Crew birthday record","Bunker invoice"],"answer":1,"why":"SOLAS requires safety certificates such as the Safety Equipment Certificate."},{"q":"If damage affecting class occurs, what should the ship do?","options":["Repair it secretly","Hide it until the next survey","Inform the classification society promptly","Wait for the charterer to decide"],"answer":2,"why":"Class must be told of damage so it can be surveyed and class kept valid."},{"q":"How should the crew prepare for a class survey?","options":["Make spaces accessible, clean and safe, and have records ready","Remove all records","Paint over defects","Lock the spaces to be surveyed"],"answer":0,"why":"Good preparation lets the surveyor inspect properly and safely."},{"q":"Which section of the ISM Code covers maintenance of the ship and equipment?","options":["Section 3","Section 8","Section 10","Section 12"],"answer":2,"why":"ISM Code Section 10 requires the ship to be maintained in line with rules and company requirements."}],"CHCC - Cargo Handling and Care of Cargo":[{"q":"What does a stowage plan show?","options":["Where each cargo is stowed on the ship","The voyage route","The engine room layout","The crew's sleeping plan"],"answer":0,"why":"The stowage plan shows the location, quantity and type of cargo in each space."},{"q":"Which SOLAS-required manual gives instructions for securing cargo?","options":["Garbage Management Plan","Cargo Securing Manual","Muster list","SOPEP"],"answer":1,"why":"SOLAS requires ships carrying cargo units to have an approved Cargo Securing Manual."},{"q":"Hold ventilation helps prevent condensation when the outside air dew point is:","options":["Not important at all","Higher than the dew point in the hold","Exactly 100°C","Lower than the dew point of the air in the hold"],"answer":3,"why":"Ventilating with drier outside air removes moisture; ventilating with wetter air adds sweat."},{"q":"What is dunnage?","options":["Crew baggage","Material used to protect and separate cargo and allow air flow","Spare fuel","The ship's ballast water"],"answer":1,"why":"Dunnage such as timber or mats protects cargo and helps ventilation and drainage."},{"q":"What is a Mate's Receipt?","options":["A spare parts order","A bunker record","A document acknowledging cargo received onboard and its condition","A crew payslip"],"answer":2,"why":"The Mate's Receipt records cargo received and any remarks on its condition."},{"q":"What should be done if cargo arrives damaged?","options":["Accept it without remarks","Throw it away","Note the damage on the receipt or tally and report it","Hide it in the hold"],"answer":2,"why":"Remarks protect the ship from claims for damage that existed before loading."},{"q":"How should heavy and light cargo be stowed together?","options":["Light cargo at the bottom","Heavy cargo always on deck","In any random order","Heavy cargo at the bottom, light cargo on top"],"answer":3,"why":"Heavy cargo below protects lighter cargo and keeps the center of gravity low."},{"q":"What is a common cause of cargo shifting?","options":["A correct stowage plan","Proper trim","Good dunnage","Poor lashing and securing"],"answer":3,"why":"Cargo that is not properly secured can shift in heavy weather."},{"q":"Which code covers the carriage of packaged dangerous goods by sea?","options":["IMDG Code","LSA Code","ISM Code","IBC Code"],"answer":0,"why":"The International Maritime Dangerous Goods (IMDG) Code covers packaged dangerous goods."},{"q":"What should be monitored during the voyage?","options":["Only at the destination","Nothing after sailing","Lashings, cargo temperatures, bilges and ventilation","Only when the charterer asks"],"answer":2,"why":"Regular checks find problems early and prevent cargo damage."}],"COC - Crane Operation Course":[{"q":"What does a crane load chart show?","options":["The fuel level","The safe working loads at different radii or boom angles","The crew roster","The weather forecast"],"answer":1,"why":"The load chart tells the operator the maximum load for each working position."},{"q":"As the working radius of a jib crane increases, its safe lifting capacity:","options":["Doubles","Increases","Stays the same","Decreases"],"answer":3,"why":"A longer radius increases the overturning moment, so capacity drops."},{"q":"What should be checked before operating a crane?","options":["Only the paintwork","Nothing, if it worked yesterday","Limit switches, brakes, wires, hooks and controls","The galley equipment"],"answer":2,"why":"Pre-use checks find defects before they cause an accident."},{"q":"What does a limit switch do?","options":["Stops crane motion before a dangerous position is reached","Turns on the deck lights","Starts the engine","Increases crane speed"],"answer":0,"why":"Limit switches prevent over-hoisting, over-slewing or over-luffing."},{"q":"Whose signals should the crane operator follow?","options":["The designated banksman, except an emergency stop from anyone","Anyone on deck","The cook","Shore visitors"],"answer":0,"why":"One signaler avoids confusion, but any person may signal an emergency stop."},{"q":"What must a crane operator never do?","options":["Sound the warning signal","Leave the controls while a load is suspended","Wear PPE","Check the wire rope"],"answer":1,"why":"A suspended load must always be under the operator's control."},{"q":"What should be done when wind exceeds the crane manufacturer's limit?","options":["Stop crane operations","Ignore it for small loads","Lift faster to finish","Continue in any wind"],"answer":0,"why":"Strong wind makes loads swing and can overload the crane."},{"q":"How should a crane be operated?","options":["Swinging the load to save time","Smoothly, avoiding sudden starts and stops","Dropping loads quickly","At maximum speed always"],"answer":1,"why":"Smooth control prevents shock loads and swinging."},{"q":"What should be done after crane operations finish?","options":["Leave the controls unlocked","Leave the load hanging","Leave the crane running","Rest the hook, stow the boom and switch off"],"answer":3,"why":"Stowing and securing the crane prevents damage and unauthorized use."},{"q":"What can overloading a crane cause?","options":["No effect at all","Only higher fuel use","Structural failure or a dropped load","A stronger crane"],"answer":2,"why":"Exceeding the SWL can break crane parts and drop the load."}],"COLREG - Collision Regulation on Rules of the Road":[{"q":"What is the horizontal arc of visibility of a masthead light?","options":["112.5°","225°","360°","135°"],"answer":1,"why":"A masthead light shows from right ahead to 22.5° abaft the beam on each side, a total of 225°."},{"q":"What is the horizontal arc of visibility of a sternlight?","options":["112.5°","360°","225°","135°"],"answer":3,"why":"The sternlight shows 67.5° from right aft on each side, a total of 135°."},{"q":"What are the colors of the sidelights?","options":["Red on starboard, green on port","Green on starboard, red on port","Yellow on starboard, blue on port","White on both sides"],"answer":1,"why":"Rule 21 sets a green starboard sidelight and a red port sidelight."},{"q":"What day shape does a vessel at anchor show?","options":["One ball in the fore part","A cone, point down","Two balls in a vertical line","A cylinder"],"answer":0,"why":"Rule 30 requires one ball where it can best be seen in the fore part."},{"q":"What lights does a vessel not under command show?","options":["Two all-round red lights in a vertical line","Three all-round green lights","White over red all-round lights","Red over white all-round lights"],"answer":0,"why":"Rule 27(a) requires two all-round red lights in a vertical line."},{"q":"What does one short blast mean for a power-driven vessel in sight of another?","options":["I am altering my course to port","I doubt your intentions","I am altering my course to starboard","I am operating astern propulsion"],"answer":2,"why":"Rule 34(a): one short blast means altering course to starboard."},{"q":"What do at least five short and rapid bl
