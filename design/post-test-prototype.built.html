tional level."},{"q":"How does a good team leader make sound decisions?","options":["By ignoring advice","By deciding without information","By using available information and team input","By always choosing the fastest option"],"answer":2,"why":"Using information and input from the team leads to better decisions."},{"q":"How does a briefing before a task help the team?","options":["It lets them finish without planning","It avoids responsibility","It shortens rest hours","It explains the plan, roles and hazards"],"answer":3,"why":"A briefing makes sure everyone shares the same plan and knows the risks."},{"q":"What can cause loss of situational awareness?","options":["A proper lookout","Fatigue and distraction","Good communication","Cross-checking information"],"answer":1,"why":"Fatigue and distraction reduce attention, so important changes are missed."},{"q":"What is a debriefing after a drill or operation used for?","options":["Blaming the team","Planning the next meal","Discussing what went well and what to improve","Skipping reports"],"answer":2,"why":"Debriefing helps the team learn and improve next time."},{"q":"Which practice supports clear communication on board?","options":["Using standard phrases and confirming messages","Speaking fast in different languages","Giving vague instructions","Shouting orders without checking"],"answer":0,"why":"Standard phrases and confirmation reduce misunderstandings."}],"MAEN - Maritime English":[{"q":"What does SMCP stand for?","options":["Ship Management Control Procedures","Safety Manual for Crew Personnel","Standard Maritime Cargo Plan","Standard Marine Communication Phrases"],"answer":3,"why":"SMCP stands for the IMO Standard Marine Communication Phrases."},{"q":"Which signal word is used for a distress call?","options":["PAN-PAN","MAYDAY","SECURITE","ROGER"],"answer":1,"why":"MAYDAY means a ship or person is in grave and imminent danger and needs immediate help."},{"q":"Which signal word is used for an urgency message?","options":["MAYDAY","SECURITE","PAN-PAN","OVER"],"answer":2,"why":"PAN-PAN signals an urgent message about the safety of a ship or person."},{"q":"In the phonetic alphabet, how is the letter B spoken?","options":["Bravo","Baker","Boston","Beta"],"answer":0,"why":"The international phonetic alphabet uses Bravo for the letter B."},{"q":"Which SMCP message marker is used to tell another ship about a danger?","options":["QUESTION","ANSWER","REQUEST","WARNING"],"answer":3,"why":"The WARNING marker shows that the message informs others of a danger."},{"q":"What is VHF channel 16 used for?","options":["Cargo operations","Distress, safety and calling","Crew personal calls","Port entertainment"],"answer":1,"why":"VHF channel 16 is the international distress, safety and calling channel."},{"q":"Under SMCP, what do you say if you make a mistake in a radio message?","options":["Mistake, followed by Correction and the right words","Sorry, sorry","Cancel all","Over and out"],"answer":0,"why":"SMCP says to use 'Mistake' and then 'Correction' with the corrected part of the message."},{"q":"What does the word Over mean at the end of a radio message?","options":["The conversation is finished","Stop transmitting immediately","I have finished and expect your reply","Repeat your message"],"answer":2,"why":"Over means the speaker has finished and is waiting for a reply."},{"q":"Under SMCP, how is a course of 095 degrees spoken?","options":["Ninety-five","Nought-ninety-five","Zero ninety-five","Digit by digit: zero-nine-five"],"answer":3,"why":"SMCP requires numbers to be spoken as separate digits to avoid confusion."},{"q":"Which SMCP message marker is used when asking for something to be done?","options":["INFORMATION","REQUEST","ANSWER","INTENTION"],"answer":1,"why":"The REQUEST marker shows that the sender wants action to be taken."}],"MARPOL-3DAY - Consolidated MARPOL Annex I-VI":[{"q":"MARPOL Annex I covers pollution by:","options":["Oil","Sewage","Garbage","Air emissions"],"answer":0,"why":"Annex I contains the regulations for the prevention of pollution by oil."},{"q":"MARPOL Annex II covers pollution by:","options":["Oil","Garbage","Noxious liquid substances in bulk","Sewage"],"answer":2,"why":"Annex II controls noxious liquid substances carried in bulk, such as chemicals."},{"q":"Harmful substances carried in packaged form under Annex III are identified using which code?","options":["IBC Code","IMDG Code","ISM Code","LSA Code"],"answer":1,"why":"Annex III uses the IMDG Code to identify marine pollutants in packaged form."},{"q":"MARPOL Annex IV covers pollution by:","options":["Garbage","Oil","Air emissions","Sewage"],"answer":3,"why":"Annex IV contains the regulations for the prevention of pollution by sewage from ships."},{"q":"Under Annex V, discharge of plastics into the sea is:","options":["Prohibited everywhere","Allowed beyond 12 nautical miles","Allowed if shredded","Allowed in port"],"answer":0,"why":"MARPOL Annex V prohibits the discharge of all plastics into the sea."},{"q":"Which MARPOL annex covers air pollution from ships?","options":["Annex III","Annex IV","Annex VI","Annex II"],"answer":2,"why":"Annex VI covers air pollution, including SOx, NOx and ozone-depleting substances."},{"q":"What is the oil content limit for discharging oily bilge water from machinery spaces?","options":["100 ppm","50 ppm","30 ppm","15 ppm"],"answer":3,"why":"Annex I allows machinery space oily water discharge only at 15 ppm or less, with other conditions met."},{"q":"Where are oil transfer and discharge operations recorded?","options":["Garbage Record Book","Oil Record Book","Cargo manifest","Medical log"],"answer":1,"why":"The Oil Record Book records oil-related operations under Annex I."},{"q":"Which plan is used to respond to an oil spill from a ship?","options":["SOPEP (Shipboard Oil Pollution Emergency Plan)","Garbage Management Plan","Stowage plan","Passage plan"],"answer":0,"why":"The SOPEP sets out actions and contacts for an oil pollution incident."},{"q":"Outside special areas, food waste that is not ground up may be discharged no closer than:","options":["1 nautical mile from land","3 nautical miles from land","12 nautical miles from land","25 nautical miles from land"],"answer":2,"why":"Annex V allows unground food waste only 12 nautical miles or more from the nearest land, with the ship en route."}],"MARPOL-5DAY - Consolidated MARPOL Annexes I-VI":[{"q":"What does MARPOL Annex III deal with?","options":["Sewage","Harmful substances carried in packaged form","Oil","Air pollution"],"answer":1,"why":"Annex III covers harmful substances carried by sea in packaged form."},{"q":"Under Annex II, noxious liquid substances are grouped into which categories?","options":["A, B, C, D","1, 2, 3","I, II, III","X, Y, Z and OS"],"answer":3,"why":"Since 2007, Annex II uses categories X, Y, Z and Other Substances."},{"q":"Which certificate shows compliance with Annex VI air pollution rules?","options":["IAPP Certificate","IOPP Certificate","ISPP Certificate","NLS Certificate"],"answer":0,"why":"The International Air Pollution Prevention (IAPP) Certificate is issued under Annex VI."},{"q":"Under Annex IV, untreated sewage from a holding tank may be discharged no closer than:","options":["1 nautical mile from land","3 nautical miles from land","12 nautical miles from land, with the ship en route","Anywhere, including in port"],"answer":2,"why":"Sewage that is not ground and disinfected may be discharged only 12 nautical miles or more from land, at a moderate rate while en route."},{"q":"Ships of 400 GT and above, and ships certified to carry 15 or more persons, must keep a:","options":["Cargo Record Book","Garbage Record Book","Ballast Record only","Bell book"],"answer":1,"why":"MARPOL Annex V requires these ships to keep a Garbage Record Book."},{"q":"Ships of 12 metres or more in length must display:","options":["Cargo plans","Crew lists","Fire control plans in the mess","Placards on garbage discharge requirements"],"answer":3,"why":"Annex V requires placards telling crew and passengers the garbage discharge rules."},{"q":"Ozone-depleting substances are controlled under which annex?","options":["Annex I","Annex V","Annex VI","Annex III"],"answer":2,"why":"Annex VI controls ozone-depleting substances along with other air pollutants."},{"q":"The International Oil Pollution Prevention (IOPP) Certificate relates to which annex?","options":["Annex I","Annex II","Annex IV","Annex VI"],"answer":0,"why":"The IOPP Certificate is issued under Annex I for oil pollution prevention."},{"q":"What are special areas under MARPOL?","options":["Areas where ships may discharge freely","Areas open only to fishing","Areas that no ship may enter","Sea areas where stricter discharge rules apply"],"answer":3,"why":"Special areas need extra protection, so discharge rules there are stricter."},{"q":"Which equipment keeps oily water discharge at or below 15 ppm?","options":["Sewage treatment plant","Oily water separator with oil content meter","Incinerator","Fresh water generator"],"answer":1,"why":"The oily water separator and its 15 ppm monitor stop discharges that exceed the limit."}],"MEA - Marine Environmental Awareness":[{"q":"Which is the main international convention for preventing pollution from ships?","options":["SOLAS","STCW","MARPOL","MLC"],"answer":2,"why":"MARPOL is the main IMO convention on pollution from ships."},{"q":"Which of these is a source of marine pollution from ships?","options":["Oily bilge water and garbage","Navigation lights","Radar signals","Drinking water"],"answer":0,"why":"Oily bilge water and garbage can pollute the sea if not handled correctly."},{"q":"You see an oil spill on deck. What should you do first?","options":["Wash it overboard with a fire hose","Ignore it if it is small","Cover it with paint","Stop the source if safe, contain it and report it"],"answer":3,"why":"Stopping, containing and reporting a spill prevents it reaching the sea."},{"q":"Why are deck scuppers plugged during bunkering?","options":["To keep the deck dry from rain","To stop spilled oil going overboard","To increase ship speed","To save fresh water"],"answer":1,"why":"Plugged scuppers keep any spilled oil on deck where it can be cleaned up."},{"q":"Under the ISM Code, what must the Safety Management System include?","options":["Crew entertainment plans","Menu planning","A safety and environmental protection policy","Cargo sales targets"],"answer":2,"why":"The ISM Code requires a safety and environmental-protection policy as part of the SMS."},{"q":"How can ballast water harm the environment?","options":["By moving invasive aquatic species to new areas","By making the sea saltier","By cooling the ocean","By adding oxygen"],"answer":0,"why":"Ballast water can carry organisms that invade and damage ecosystems in other regions."},{"q":"How should garbage on board be handled?","options":["Stored in one bin","Thrown overboard at night","Burned on deck","Segregated according to the garbage management plan"],"answer":3,"why":"The garbage management plan sets how waste is sorted and disposed of under MARPOL Annex V."},{"q":"What is each crew member's environmental responsibility?","options":["Leave it all to the master","Follow procedures and report pollution incidents","Hide small spills","Discharge waste in port"],"answer":1,"why":"Every crew member must follow the procedures and report any pollution."},{"q":"Which ship exhaust emissions harm the air?","options":["Oxygen","Water vapour only","Sulphur oxides and nitrogen oxides","Nitrogen gas"],"answer":2,"why":"SOx and NOx from engines contribute to acid rain and health problems."},{"q":"Which practice reduces the waste generated on board?","options":["Reducing packaging, reusing and recycling where possible","Buying single-use items","Mixing all garbage","Throwing away usable stores"],"answer":0,"why":"Reduce, reuse and recycle lowers the amount of garbage the ship produces."}],"MECAR - Medical Care - Refresher":[{"q":"Medical care training on board is based on which STCW table?","options":["Table A-VI/1-1","Table A-VI/4-2","Table A-II/1","Table A-III/1"],"answer":1,"why":"STCW Table A-VI/4-2 sets the minimum standard for persons in charge of medical care on board."},{"q":"What is the normal resting pulse rate of an adult?","options":["20 to 40 beats per minute","120 to 160 beats per minute","40 to 50 beats per minute","60 to 100 beats per minute"],"answer":3,"why":"A normal adult resting pulse is about 60 to 100 beats per minute."},{"q":"Before asking for radio medical advice, what should you prepare?","options":["The patient's history, symptoms and vital signs","The ship's cargo plan","The crew wage list","Only the patient's name"],"answer":0,"why":"The doctor needs accurate history, symptoms and vital signs to give proper advice."},{"q":"What is the ratio of chest compressions to rescue breaths in adult CPR?","options":["5:1","15:1","30:2","10:5"],"answer":2,"why":"Adult CPR uses 30 compressions followed by 2 rescue breaths."},{"q":"Which is a widely used reference for medical care on ships?","options":["IMDG Code","International Medical Guide for Ships","SOLAS Training Manual","Bridge Procedures Guide"],"answer":1,"why":"The WHO International Medical Guide for Ships is the standard medical reference on board."},{"q":"How must controlled drugs on board be kept?","options":["In the galley","Shared among the crew","Thrown away after each voyage","In a locked cabinet with a register of use"],"answer":3,"why":"Controlled drugs are locked away and every use is recorded."},{"q":"What is the Glasgow Coma Scale used to assess?","options":["Blood pressure","Body temperature","Level of consciousness","Blood sugar"],"answer":2,"why":"The Glasgow Coma Scale scores eye, verbal and motor responses to measure consciousness."},{"q":"What is normal adult body temperature?","options":["About 37°C","About 35°C","About 39°C","About 33°C"],"answer":0,"why":"Normal body temperature is about 37°C."},{"q":"Why should the patient's condition and treatment be recorded?","options":["For the ship's newsletter","To replace radio advice","To decide on wages","For continuity of care and handover to doctors"],"answer":3,"why":"Good records let others continue treatment and help doctors ashore."},{"q":"Why is the medical chest inventory checked?","options":["To add extra snacks","To make sure medicines are present, in date and properly stored","To lock it permanently","To keep only bandages"],"answer":1,"why":"Regular checks ensure the right medicines are available and usable when needed."}],"RSDI - Rightship Inspection":[{"q":"RightShip inspections are most commonly requested for which type of vessel?","options":["Passenger cruise ships","Fishing vessels","Dry bulk carriers","Harbour tugboats"],"answer":2,"why":"RightShip vetting and inspection are mainly used by charterers to assess dry bulk carriers."},{"q":"What does RISQ stand for in RightShip inspections?","options":["RightShip Inspection Ship Questionnaire","Risk Index for Ship Quality","Regional Inspection Safety Quota","RightShip Insurance Survey Quote"],"answer":0,"why":"RISQ is the RightShip Inspection Ship Questionnaire that the inspector follows on board."},{"q":"Why do charterers and cargo owners use RightShip vetting?","options":["To set the crew's wage scale","To choose the cheapest bunker supplier","To decide the ship's flag of registry","To reduce the risk of chartering a substandard ship"],"answer":3,"why":"Vetting helps charterers avoid ships with safety or quality risks."},{"q":"On the RightShip platform, the Safety Score ranges from 1 to 5. Which score shows the lowest risk?","options":["1","5","3","0"],"answer":1,"why":"The RightShip Safety Score runs from 1 to 5, with 5 being the best (lowest risk)."},{"q":"What is the best way for the ship to prepare before a RightShip inspection?","options":["Hide records that show past defects","Do an internal check using the inspection questionnaire","Ask the crew to stay in their cabins","Postpone all maintenance until after the visit"],"answer":1,"why":"A self-check against the questionnaire finds gaps early so they can be corrected honestly."},{"q":"During the inspection, the inspector asks a crew member how to start the emergency fire pump. What should the crew member do?","options":["Refer the inspector to the agent","Say it is not his job and walk away","Guess the answer to save time","Explain or demonstrate the correct procedure"],"answer":3,"why":"Inspectors check observable practice, so crew must be able to show they know their duties."},{"q":"Which documents should be checked as part of preparation?","options":["Ship certificates, records and logs for validity and consistency","Only the crew's personal travel documents","Only the menu and provision list","Only the charter party contract"],"answer":0,"why":"Valid certificates and consistent records are a key part of any inspection."},{"q":"What does a RightShip inspector mainly compare during the visit?","options":["The ship's speed with other ships","The crew's salaries with industry rates","What the records say with what is actually done on board","The ship's age with its purchase price"],"answer":2,"why":"Inspections verify that real practices match the documented procedures and records."},{"q":"After the inspection, how should identified observations or gaps be handled?","options":["Ignore them until the next inspection","Delete them from the ship's records","Blame the inspector for the findings","Find the root cause, correct them and send evidence of close-out"],"answer":3,"why":"Proper follow-up means root cause analysis, corrective action and proof that the gap is closed."},{"q":"What attitude should the crew show toward the inspector?","options":["Honest, cooperative and professional","Defensive and argumentative","Silent and unhelpful","Eager to offer gifts"],"answer":0,"why":"Honest and professional cooperation gives a true picture of the ship and builds trust."}],"SAM - Stress and Anger Management":[{"q":"What is stress?","options":["A disease caught from other people","The body and mind's response to pressure or demands","A sign that a person is weak","A condition that only affects officers"],"answer":1,"why":"Stress is the natural physical and mental reaction to demands or pressure."},{"q":"What is an anger trigger?","options":["A medicine used to calm anger","A rule in the ship's safety plan","A type of breathing exercise","A situation or event that sets off a person's anger"],"answer":3,"why":"Triggers are the events, words or situations that start an anger reaction."},{"q":"When you feel anger rising during an argument, what is a good first step?","options":["Pause and take slow, deep breaths","Raise your voice to win the argument","Throw something to release tension","Leave your post without telling anyone"],"answer":0,"why":"Pausing and breathing slowly calms the body before you respond."},{"q":"Which of these is an example of an 'I' statement?","options":["You always make mistakes on watch","You never listen to anybody","I feel upset when orders are not repeated back","Everyone knows you are lazy"],"answer":2,"why":"An 'I' statement expresses your feelings without blaming the other person."},{"q":"What is the fight-or-flight response?","options":["The body's automatic reaction to face or escape a threat","A drill for abandoning ship","A method for settling disputes in court","A rule for choosing a work partner"],"answer":0,"why":"Fight-or-flight is the body's natural alarm reaction that prepares it to face or run from danger."},{"q":"Which is a common physical sign of anger?","options":["Feeling sleepy and relaxed","Slow and steady breathing","Clenched fists and a faster heartbeat","Lower body temperature"],"answer":2,"why":"Anger activates the body, causing tense muscles and a faster heart rate."},{"q":"What does active listening mean?","options":["Waiting for your turn to speak","Listening while doing another task","Interrupting to correct the speaker","Giving full attention and checking you understood"],"answer":3,"why":"Active listening means focusing on the speaker and confirming what they meant."},{"q":"You have a conflict with a crewmate. What is the most constructive action?","options":["Spread rumours about the crewmate","Talk calmly in private and involve a superior if needed","Refuse to work with the crewmate","Wait for a chance to get even"],"answer":1,"why":"Calm private discussion, with escalation if unresolved, solves conflict without harm."},{"q":"What is the 'time-out' technique?","options":["Stepping away briefly to calm down, then returning to talk","Stopping work for the rest of the day","Ignoring the other person for a week","Reporting the other person immediately"],"answer":0,"why":"A short time-out lets emotions settle so the issue can be discussed calmly."},{"q":"Why is drinking alcohol a poor way to manage stress or anger onboard?","options":["It improves concentration on watch","It is allowed at any time on duty","It makes communication clearer","It can worsen mood, judgment and safety"],"answer":3,"why":"Alcohol impairs judgment and self-control and increases the risk of conflict and accidents."}],"SARTA - SART Awareness":[{"q":"What does SART stand for?","options":["Search and Rescue Transponder","Ship Alarm and Radio Transmitter","Satellite Alert Rescue Terminal","Sea Area Radio Tracker"],"answer":0,"why":"SART means Search and Rescue Transponder, a GMDSS locating device."},{"q":"A radar SART responds to which type of radar?","options":["S-band (10 cm) radar only","Weather radar on shore","X-band (9 GHz, 3 cm) radar","Echo sounder signals"],"answer":2,"why":"A radar SART operates in the 9 GHz X-band and answers X-band radar pulses."},{"q":"How does a radar SART appear on a rescue ship's radar screen when it is several miles away?","options":["As a flashing green light","As a line of 12 dots extending outward from the SART position","As a single large circle around own ship","As text showing the vessel name"],"answer":1,"why":"At a distance the SART response shows as a line of 12 dots, with the nearest dot marking its position."},{"q":"What is the main purpose of a SART?","options":["To send weather reports to shore","To measure sea temperature","To communicate by voice with other ships","To help rescue units locate the survival craft"],"answer":3,"why":"The SART's locating signal guides searching ships and aircraft to the survivors."},{"q":"A SART battery must last for 96 hours on standby and then how long while transmitting?","options":["1 hour","24 hours","48 hours","8 hours"],"answer":3,"why":"IMO standards require 96 hours standby followed by 8 hours of transmission when interrogated."},{"q":"For good detection range, a radar SART should be mounted at least how high above sea level?","options":["10 centimetres","1 metre","5 metres","10 metres"],"answer":1,"why":"IMO standards are based on the SART being at least 1 metre above sea level; higher gives better range."},{"q":"When abandoning ship, what should be done with the SART?","options":["Take it to the survival craft and switch it on","Leave it in its bracket on the bridge","Throw it into the sea away from the craft","Keep it switched off until land is seen"],"answer":0,"why":"The SART is carried into the survival craft and activated so rescuers can find it."},{"q":"What is an important precaution when testing a SART on board?","options":["Test it for as long as possible","Test it only while in the water","Test briefly using own radar to avoid false alerts","Remove the battery before testing"],"answer":2,"why":"Short tests avoid other ships mistaking the signal for a real distress."},{"q":"How does an AIS-SART show its position to rescue units?","options":["By flashing a strobe light only","By transmitting its GPS position over AIS","By sending a voice message on VHF","By releasing coloured dye in the water"],"answer":1,"why":"An AIS-SART sends its GPS position through AIS, which appears on AIS displays and ECDIS."},{"q":"During routine inspection of a SART, what should the crew check?","options":["The colour of the paint on the bracket","The serial number of the radar","The ship's call sign on the lanyard only","The battery expiry date and general condition"],"answer":3,"why":"An expired battery or damaged unit may fail in an emergency, so these must be checked."}],"SDC - Smoke Diving Course":[{"q":"What does SCBA stand for?","options":["Ship Crew Breathing Alarm","Safety Cylinder for Basic Air","Smoke Control Breathing Apparatus","Self-Contained Breathing Apparatus"],"answer":3,"why":"SCBA is the Self-Contained Breathing Apparatus worn for entry into smoke-filled spaces."},{"q":"Which check is done before wearing the breathing apparatus?","options":["Checking the colour of the harness","Checking cylinder pressure and the face mask seal","Checking the weight of the helmet","Checking the length of the lifeline only"],"answer":1,"why":"Adequate air pressure and a tight mask seal are essential before entering smoke."},{"q":"What should the wearer do when the low-pressure warning whistle sounds?","options":["Continue the search until finished","Remove the face mask to save air","Withdraw from the space immediately","Wait for the whistle to stop"],"answer":2,"why":"The whistle warns that air is running low, so the wearer must leave at once."},{"q":"Why should smoke divers always work in pairs?","options":["So they can help each other and stay safe","So one can carry extra tools","Because the rules require a race","So one can rest outside"],"answer":0,"why":"Working in pairs means a partner can assist or raise the alarm if something goes wrong."},{"q":"In rope signals between the smoke diver and the attendant, what do four pulls mean?","options":["Help or emergency","Okay, all is well","Advance further","Take up the slack"],"answer":0,"why":"In the common OATH system, four pulls mean Help."},{"q":"How should you move inside a compartment with zero visibility?","options":["Run quickly to find the exit","Stand upright and walk normally","Stay low and feel ahead with your hand or foot","Close your eyes and wait"],"answer":2,"why":"Moving low and testing ahead protects you from heat, openings and obstacles."},{"q":"Why is it safer to stay low in a smoke-filled space?","options":["The floor is always cooler metal","Smoke is heavier than air","Rescuers only search near the floor","Heat and smoke rise, so it is cooler and clearer below"],"answer":3,"why":"Hot gases and smoke rise, leaving cooler air and better visibility near the deck."},{"q":"What search technique helps divers not get lost in a dark compartment?","options":["Walking in random directions","Keeping contact with a wall and with the partner","Shouting until someone answers","Following the sound of the engines"],"answer":1,"why":"Wall-contact search and partner contact give a fixed reference for the way back."},{"q":"Before opening a door to a possible fire area, how should you check it?","options":["Open it quickly to look inside","Kick it to test its strength","Feel the door with the back of your hand","Spray water through the keyhole"],"answer":2,"why":"Checking the door with the back of the hand detects heat behind it without burning your palm."},{"q":"What does the entry control officer record when a team enters with breathing apparatus?","options":["Names, entry time and cylinder pressure","Only the weather conditions","The colour of the smoke","The ship's position"],"answer":0,"why":"These records let the control officer calculate safe working time and track who is inside."}],"SGS - Ship General Safety":[{"q":"What is the main purpose of the ISM Code?","options":["To set crew wages and contracts","To ensure safety at sea and prevent pollution","To regulate cargo prices","To control port fees"],"answer":1,"why":"The ISM Code provides an international standard for safe ship management and pollution prevention."},{"q":"What is the general emergency alarm signal on board?","options":["Seven or more short blasts followed by one long blast","Three long blasts","One short and one long blast repeated","Continuous ringing of the telephone"],"answer":0,"why":"SOLAS sets the general alarm as seven or more short blasts followed by one long blast."},{"q":"What does the muster list show?","options":["The ship's cargo plan","The menu for the week","The crew's leave schedule","Each person's emergency duties and muster station"],"answer":3,"why":"The muster list assigns emergency duties and stations and is posted in conspicuous places."},{"q":"What is a near miss?","options":["An accident that caused serious injury","A ship passing close to land","An event that could have caused harm but did not","A missed crew change"],"answer":2,"why":"A near miss is an unplanned event with potential for harm that should be reported to prevent accidents."},{"q":"Under SOLAS, how often should each crew member take part in an abandon ship drill?","options":["Once a year","Once every six months","At least once every month","Only when joining the ship"],"answer":2,"why":"SOLAS requires each crew member to take part in at least one abandon ship drill every month."},{"q":"What is the purpose of lockout/tagout before maintenance?","options":["To record working hours","To mark tools for inventory","To lock the cabin doors","To isolate energy sources so equipment cannot start"],"answer":3,"why":"Lockout/tagout prevents accidental start-up or release of energy while work is done."},{"q":"Who is the Designated Person Ashore (DPA)?","options":["The link between the ship and the highest level of company management","The port agent who handles cargo documents","The crewing officer who hires seafarers","The ship's chief cook"],"answer":0,"why":"Under the ISM Code, the DPA provides a direct link between the ship and top management."},{"q":"Which work normally needs a permit to work?","options":["Cleaning the mess room","Hot work such as welding","Writing the log book","Serving meals"],"answer":1,"why":"High-risk jobs like hot work require a permit to control hazards."},{"q":"What is the main purpose of personal protective equipment (PPE)?","options":["To improve the crew's appearance","To replace safe work procedures","To keep clothes clean","To protect the worker from remaining hazards"],"answer":3,"why":"PPE is the last line of defence against hazards that cannot be removed by other controls."},{"q":"You see a fire in a store room. What should you do first?","options":["Finish your task before reporting","Raise the alarm","Open all doors to let smoke out","Go to your cabin"],"answer":1,"why":"Raising the alarm first brings help and starts the emergency response."}],"SHM - Ship Handling and Maneuvering":[{"q":"What is squat?","options":["The ship rising out of the water at high speed","The ship listing due to wind","The ship sinking bodily and changing trim when moving in shallow water","The ship drifting sideways at anchor"],"answer":2,"why":"Squat is the increase in draft and change of trim caused by speed in shallow water."},{"q":"What is the most effective way to reduce squat?","options":["Reduce speed","Increase speed","Put the rudder hard over","Ballast the forward tanks"],"answer":0,"why":"Squat increases roughly with the square of speed, so slowing down reduces it the most."},{"q":"A ship with a right-handed fixed-pitch propeller goes astern. Which way does the stern usually swing?","options":["To starboard","To port","It does not swing","Straight down"],"answer":1,"why":"Transverse thrust from a right-handed propeller going astern pushes the stern to port."},{"q":"What is the tactical diameter of a ship?","options":["The ship's maximum breadth","The diameter of the propeller","The distance travelled during a crash stop","The transfer when the ship has turned 180 degrees"],"answer":3,"why":"Tactical diameter is the sideways distance covered when the heading has changed by 180 degrees."},{"q":"When moving ahead, the pivot point is usually located where?","options":["About one-quarter to one-third of the length from the bow","At the stern near the rudder","Exactly at the bridge","Outside the ship ahead of the bow"],"answer":0,"why":"With headway the pivot point moves forward to roughly a quarter to a third of the length from the bow."},{"q":"When a ship runs close to a channel bank, what usually happens?","options":["The whole ship is pushed away from the bank","The ship speeds up and lifts","The ship stops by itself","The stern is drawn toward the bank and the bow sheers away"],"answer":3,"why":"Bank effect causes stern suction toward the bank and a bow cushion that pushes the bow away."},{"q":"Why is rudder effect poor at very low speed with the engine stopped?","options":["The rudder becomes heavier","The steering gear turns off","Little water flows past the rudder","The compass gives wrong readings"],"answer":2,"why":"A rudder needs water flow over it; a short kick ahead increases the flow and steering effect."},{"q":"Where on the bridge can the officer find the ship's turning and stopping data?","options":["In the crew list","On the wheelhouse poster and manoeuvring booklet","In the oil record book","On the muster list"],"answer":1,"why":"IMO guidance requires manoeuvring information such as the wheelhouse poster to be on the bridge."},{"q":"Two ships pass close in a narrow channel. What is the main risk?","options":["Radio interference","Higher fuel consumption","Loss of GPS signal","Interaction causing sheering or collision"],"answer":3,"why":"Pressure fields between close ships cause suction and sheering, so speed and distance must be managed."},{"q":"What is the safest general approach when berthing?","options":["Slow speed, a planned approach angle, and allowance for wind and current","High speed to keep good steering","Approaching parallel to the berth at full ahead","Ignoring the tide because the berth is sheltered"],"answer":0,"why":"Controlled low speed and planning for wind and current reduce the risk of heavy contact."}],"SMC - Stress Management Course":[{"q":"Under the STCW and MLC rules, what is the minimum rest a seafarer must have in any 24-hour period?","options":["10 hours","6 hours","8 hours","12 hours"],"answer":0,"why":"STCW and MLC require at least 10 hours of rest in any 24-hour period."},{"q":"What is the minimum rest required in any 7-day period?","options":["56 hours","70 hours","84 hours","77 hours"],"answer":3,"why":"The minimum rest is 77 hours in any 7-day period."},{"q":"Which is a common cause of fatigue on board?","options":["Regular meals","Long working hours and poor sleep","Short safety meetings","Calling family on rest days"],"answer":1,"why":"Long hours and broken or poor sleep are leading causes of seafarer fatigue."},{"q":"How does fatigue affect a seafarer's work?","options":["It improves alertness","It has no effect on safety","It slows reactions and increases mistakes","It makes tasks finish faster"],"answer":2,"why":"Fatigue reduces attention and reaction time, increasing the chance of errors and accidents."},{"q":"Which is a healthy coping technique for stress?","options":["Skipping meals to save time","Regular exercise and deep breathing","Staying awake to finish more work","Keeping problems to yourself always"],"answer":1,"why":"Exercise and controlled breathing reduce stress hormones and calm the body."},{"q":"Which is a common sign that a person is under too much stress?","options":["Irritability and trouble concentrating","Steady sleep every night","Better appetite and energy","Enjoying hobbies more than usual"],"answer":0,"why":"Irritability, poor concentration and sleep problems are typical signs of stress."},{"q":"You notice a crewmate has become quiet and withdrawn. What should you do?","options":["Ignore it because it is personal","Tell everyone about it at mealtime","Talk to them kindly and encourage them to seek help","Report them for poor attitude"],"answer":2,"why":"Peer support means noticing changes and helping the person reach support early."},{"q":"What helps improve sleep before rest periods?","options":["Drinking strong coffee before bed","Using the phone until late","Eating a heavy meal right before sleeping","A dark, quiet cabin and limiting caffeine"],"answer":3,"why":"A quiet, dark environment and less caffeine help the body get quality sleep."},{"q":"How can good time management reduce workload stress?","options":["By planning and prioritising tasks","By doing all tasks at the same time","By leaving tasks to the last minute","By skipping rest to finish early"],"answer":0,"why":"Planning and prioritising tasks keeps work under control and reduces pressure."},{"q":"If stress becomes too much to handle alone, what is the best action?","options":["Leave the ship without notice","Hide it to avoid looking weak","Speak with a superior, the medical officer or a welfare helpline","Rely on alcohol to relax"],"answer":2,"why":"Seeking support early from trusted people or welfare services protects health and safety."}],"SMO - Safe Mooring Operations":[{"q":"What is a snap-back zone?","options":["A storage area for spare ropes","The area near the gangway","The place where the pilot boards","The area where a parted line may recoil violently"],"answer":3,"why":"When a loaded line parts, it can whip back with great force through the snap-back zone."},{"q":"Why should crew not rely only on painted snap-back zone markings?","options":["The paint is slippery","The markings show where lines are stored","A parted line can recoil outside the painted area","The markings are only for decoration"],"answer":2,"why":"Snap-back paths are hard to predict, so the whole mooring area must be treated as hazardous."},{"q":"What does the ship's mooring plan show?","options":["The arrangement of lines, leads and equipment for mooring","The crew's watch schedule","The cargo stowage plan","The fire control plan"],"answer":0,"why":"The mooring plan shows how lines are led and which equipment to use."},{"q":"What is the main rule about standing near ropes during mooring?","options":["Stand in the bight to guide the rope","Never stand in the bight of a rope or in the line of fire","Sit on the bitts to save energy","Hold the rope with bare hands near the drum"],"answer":1,"why":"Standing in a bight or line of fire can lead to serious injury if the rope moves or parts."},{"q":"Why should mooring lines be tended while alongside?","options":["To keep the ropes clean","To change rope colour","Tide and cargo changes alter line tension","To save winch fuel"],"answer":2,"why":"Changes in draft and tide loosen or overload lines, so they must be adjusted."},{"q":"Why should lines of different materials not be mixed in the same direction?","options":["They stretch differently, so one line takes most of the load","They look untidy on deck","They cost more to buy","They cannot be stored together"],"answer":0,"why":"Lines with different elasticity share load unevenly, which can overload and part the stiffer line."},{"q":"What is the best way to communicate during mooring operations?","options":["Shouting across the deck","Using hand waves only","Using a mobile phone call","Clear radio contact with agreed signals and the bridge"],"answer":3,"why":"Clear, agreed communication between stations and the bridge prevents misunderstandings."},{"q":"What should be checked on mooring lines before use?","options":["The brand name","Wear, chafing, cuts and damage","Only the colour","The weight of the coil"],"answer":1,"why":"Worn or damaged lines can part under load and must be identified before use."},{"q":"Which PPE is required for mooring operations?","options":["Helmet, gloves and safety shoes","Sandals and shorts","Loose jacket and cap","Sunglasses only"],"answer":0,"why":"Helmets, gloves and safety shoes protect against impact, rope burns and crushing."},{"q":"What type of stopper should be used on a synthetic fibre mooring line?","options":["A chain stopper","A fibre rope stopper of suitable material","A steel wire clamp","No stopper is ever needed"],"answer":1,"why":"Fibre lines need a compatible fibre stopper; chain stoppers are used for wire ropes."}],"SNC - Safe Navigation Course":[{"q":"What does the frequency of position fixing mainly depend on?","options":["The time of day","The ship's distance from navigational dangers","The number of crew on watch","The type of cargo"],"answer":1,"why":"The closer the ship is to danger, the more often its position must be fixed."},{"q":"Under COLREG Rule 6, which factor helps decide safe speed?","options":["The arrival time requested by the agent","The colour of the hull","The fuel price","The state of visibility"],"answer":3,"why":"Visibility, traffic density and manoeuvrability are key factors in safe speed."},{"q":"On which frequency are international NAVTEX navigational warnings broadcast?","options":["2182 kHz","156.8 MHz","518 kHz","121.5 MHz"],"answer":2,"why":"International NAVTEX broadcasts in English on 518 kHz."},{"q":"What is the purpose of parallel indexing on radar?","options":["To monitor the ship's cross-track distance from a fixed object","To measure the depth of water","To adjust radar brilliance","To count the number of targets"],"answer":0,"why":"Parallel indexing gives a continuous check of the ship's position relative to its planned track."},{"q":"What is magnetic variation?","options":["The error caused by the ship's own magnetism","The difference between gyro and radar bearings","The change in compass reading with speed","The angle between true north and magnetic north"],"answer":3,"why":"Variation is caused by the earth's magnetic field; deviation is caused by the ship's own magnetism."},{"q":"Why should GPS positions be cross-checked with other methods?","options":["GPS is never accurate","GPS can have errors or lose signal without warning","GPS is not allowed at night","Cross-checking is only for training"],"answer":1,"why":"Relying on one system is risky; radar and visual fixes confirm the GPS position."},{"q":"When should the officer of the watch NOT hand over the watch?","options":["While a manoeuvre or avoiding action is in progress","When the relief arrives early","When the weather is clear","At the scheduled time"],"answer":0,"why":"STCW guidance says handover should wait until the manoeuvre or avoiding action is completed."},{"q":"Three position lines form a small triangle (a cocked hat). Which position should be used?","options":["The point farthest from danger","The middle of the chart","The corner closest to danger","The previous position"],"answer":2,"why":"Taking the position nearest danger gives the safest assumption."},{"q":"What is a dead reckoning position?","options":["A position from a GPS receiver","A position from three radar ranges","A position worked out from course and speed only","A position given by the pilot"],"answer":2,"why":"Dead reckoning uses course steered and speed run, without allowing for current or wind."},{"q":"When should the officer of the watch call the master?","options":["When in doubt or as stated in the master's standing orders","Only after a collision","Only when the master asks","Never during the night"],"answer":0,"why":"The OOW must call the master whenever in doubt or in situations listed in standing orders."}],"SNCA - Safe Navigation and Collision Avoidance":[{"q":"Under COLREG Rule 5, how must a proper lookout be kept?","options":["By sight, hearing and all available means","By radar only","By AIS only","By the master only"],"answer":0,"why":"Rule 5 requires lookout by sight and hearing and all available means appropriate to the conditions."},{"q":"How can an officer tell that risk of collision exists?","options":["The other ship shows a red light","The other ship is larger","The compass bearing of the other ship does not change appreciably","The other ship is sounding its horn"],"answer":2,"why":"Rule 7 states that a steady compass bearing with closing range indicates risk of collision."},{"q":"Two power-driven vessels meet head-on. What should each do?","options":["Both alter course to port","Both stop engines","The larger one keeps course","Both alter course to starboard"],"answer":3,"why":"Rule 14 requires each vessel to alter course to starboard so they pass port to port."},{"q":"In a crossing situation between two power-driven vessels, which one must keep out of the way?","options":["The one that is faster","The one that has the other on her own starboard side","The one that is smaller","The one that sounded first"],"answer":1,"why":"Rule 15 says the vessel with the other on her starboard side is the give-way vessel."},{"q":"A vessel is overtaking when it approaches another from more than how many degrees abaft her beam?","options":["10 degrees","22.5 degrees","45 degrees","90 degrees"],"answer":1,"why":"Rule 13 defines overtaking as coming up from more than 22.5 degrees abaft the beam."},{"q":"In restricted visibility, what sound signal does a power-driven vessel making way give?","options":["Two short blasts every minute","Rapid ringing of a bell","Five short blasts continuously","One prolonged blast at intervals of not more than 2 minutes"],"answer":3,"why":"Rule 35 requires one prolonged blast at least every 2 minutes for a power-driven vessel making way."},{"q":"What does one short blast on the whistle mean when vessels are in sight of each other?","options":["I am operating astern propulsion","I am altering my course to port","I am altering my course to starboard","I do not understand your intentions"],"answer":2,"why":"Rule 34 states one short blast means I am altering my course to starboard."},{"q":"According to Rule 8, how should action to avoid collision be taken?","options":["Positive, in ample time and large enough to be readily seen","Slowly, using many small course changes","Only after the other ship acts","At the last possible moment"],"answer":0,"why":"Rule 8 requires early, substantial action that is readily apparent to the other vessel."},{"q":"Which is a known limitation of radar?","options":["It works only in daylight","It cannot measure range","It shows the name of every ship","Small targets may be lost in sea or rain clutter"],"answer":3,"why":"Sea and rain clutter can hide small craft, so radar must be used carefully."},{"q":"Why should AIS information not be used alone for collision avoidance?","options":["AIS works only in port","Not all vessels carry AIS and its data may be wrong","AIS is not shown on the bridge","AIS only shows weather"],"answer":1,"why":"Some vessels have no AIS and data can be incorrect, so radar and visual checks are still needed."}],"SNT - Safe Navigation Training":[{"q":"What does a cross-track distance (XTD) alarm on ECDIS warn about?","options":["Low battery in the GPS","A target on collision course","The ship moving too far off its planned track","Loss of the gyro compass"],"answer":2,"why":"The XTD alarm warns when the ship goes beyond the set limit from the planned route."},{"q":"Which is a good way to cross-check the GPS position?","options":["Ask the lookout","Radar range and bearing of a fixed charted object","Check the clock","Look at the ship's speed log only"],"answer":1,"why":"A radar fix on a charted object independently confirms the GPS position."},{"q":"How can the gyro compass error be checked at sea?","options":["By taking a bearing of a celestial body or a transit","By reading the echo sounder","By comparing with the speed log","By asking another ship on VHF"],"answer":0,"why":"Azimuths, amplitudes or transit bearings give a known true bearing to compare with the gyro."},{"q":"What is closed-loop communication on the bridge?","options":["Talking only by radio","Giving orders without replies","Writing all orders in the log","The receiver repeats the order and the sender confirms it"],"answer":3,"why":"Repeating back orders and confirming them prevents misunderstandings."},{"q":"Which ECDIS setting helps prevent grounding?","options":["A correctly set safety contour","Maximum screen brightness","Showing all text labels","Turning off the alarms"],"answer":0,"why":"The safety contour highlights water too shallow for the ship's draft."},{"q":"When a pilot is on board, what is the master and OOW's responsibility?","options":["They may leave the bridge freely","The pilot takes full legal responsibility","They remain responsible for the safety of the ship","They only handle radio calls"],"answer":2,"why":"The presence of a pilot does not relieve the master or OOW of their duties."},{"q":"What is the purpose of the Bridge Navigational Watch Alarm System (BNWAS)?","options":["To detect fire on the bridge","To monitor the alertness of the officer of the watch","To track the ship's speed","To record radar images"],"answer":1,"why":"BNWAS raises an alarm if the OOW does not respond, for example if asleep or incapacitated."},{"q":"Why is the echo sounder important for safe navigation?","options":["It shows the weather ahead","It records radio messages","It measures wind speed","It monitors the under-keel clearance"],"answer":3,"why":"The echo sounder shows depth under the keel and warns of shoaling water."},{"q":"For a radar fix, which is usually more accurate?","options":["Radar bearings","Compass bearings from memory","Radar ranges","Estimated distances"],"answer":2,"why":"Radar ranges are generally more accurate than radar bearings."},{"q":"What is the main danger of relying on a single navigation system?","options":["It uses too much power","It makes the bridge too quiet","It is more expensive","Errors or failure may go unnoticed"],"answer":3,"why":"Without cross-checks, a faulty system can lead the ship into danger unnoticed."}],"SOC - Safety Officer Course":[{"q":"What is the purpose of a permit-to-work system?","options":["To record crew overtime","To list spare parts","To schedule meal times","To control high-risk work through formal checks and approval"],"answer":3,"why":"A permit to work ensures hazards are identified and controlled before high-risk work starts."},{"q":"In the hierarchy of controls, which is the most effective?","options":["Eliminating the hazard","Wearing PPE","Putting up warning signs","Giving verbal reminders"],"answer":0,"why":"Removing the hazard completely is the most effective control; PPE is the last resort."},{"q":"In risk assessment, risk is usually measured by combining which two factors?","options":["Cost and time","Likelihood and severity","Crew rank and experience","Weather and location"],"answer":1,"why":"Risk is assessed from how likely an event is and how serious its consequences would be."},{"q":"Why should near misses be reported?","options":["To punish the people involved","To increase paperwork","To learn and prevent future accidents","To delay the voyage"],"answer":2,"why":"Near-miss reports reveal hazards so they can be fixed before someone is hurt."},{"q":"What is a toolbox talk?","options":["A short meeting before work to discuss hazards and controls","A training course ashore","An inventory of tools","A meeting about crew contracts"],"answer":0,"why":"Toolbox talks brief the team on the task, hazards and precautions before starting."},{"q":"Under the ILO MLC, a ship's safety committee is required on ships with how many seafarers or more?","options":["Two","Ten","Twenty","Five"],"answer":3,"why":"MLC Standard A4.3 requires a ship's safety committee on ships with five or more seafarers."},{"q":"What is the main goal of a shipboard safety inspection?","options":["To find people to blame","To identify hazards and arrange corrective action","To check the ship's paint colour","To count the crew"],"answer":1,"why":"Inspections find unsafe conditions so they can be corrected and followed up."},{"q":"Which is an example of an unsafe act?","options":["A broken handrail","Poor lighting in a passage","An oily deck","Working without required PPE"],"answer":3,"why":"An unsafe act is something a person does; the others are unsafe conditions."},{"q":"Under the ISM Code, how should hazardous situations and non-conformities be handled?","options":["Reported, investigated and corrected","Kept secret from the company","Fixed only during dry dock","Ignored if no one was hurt"],"answer":0,"why":"The ISM Code requires reporting and analysis of non-conformities and hazardous occurrences."},{"q":"What is usually discussed at a shipboard safety meeting?","options":["Cargo freight rates","Incidents, hazards and safety improvements","Personal family matters","The next port's tourist spots"],"answer":1,"why":"Safety meetings review incidents and hazards and agree on improvements."}],"SOPEP - Shipboard Oil Pollution Emergency Plan":[{"q":"Under MARPOL Annex I, which ships must carry a SOPEP?","options":["All ships of any size","Oil tankers of 150 GT and above and other ships of 400 GT and above","Only passenger ships","Only ships trading internationally above 10,000 GT"],"answer":1,"why":"MARPOL Annex I requires a SOPEP on oil tankers of 150 GT and above and other ships of 400 GT and above."},{"q":"Who approves the ship's SOPEP?","options":["The ship's chief cook","The port agent","The flag State Administration","The cargo owner"],"answer":2,"why":"The SOPEP must be approved by the Administration of the flag State."},{"q":"What is the first action when an oil spill is discovered on deck during bunkering?","options":["Raise the alarm and stop the transfer","Wash the oil overboard with water","Continue bunkering and report later","Wait for the next port"],"answer":0,"why":"Stopping the source and raising the alarm limits the spill and starts the response."},{"q":"Why are deck scuppers plugged before bunkering?","options":["To keep rainwater on deck","To make cleaning easier","To reduce ship vibration","To stop spilled oil from going overboard"],"answer":3,"why":"Plugged scuppers keep any spill on deck where it can be contained and cleaned."},{"q":"Which record book is used to record oil operations in the machinery spaces?","options":["The official log book","The garbage record book","The bell book","The Oil Record Book Part I"],"answer":3,"why":"Oil Record Book Part I records machinery space operations such as bunkering and sludge disposal."},{"q":"Which item is commonly found in the SOPEP locker?","options":["Life jackets","Absorbent pads and sawdust","Fire hoses","Mooring ropes"],"answer":1,"why":"SOPEP equipment includes absorbents, scoops, shovels and containers for spill clean-up."},{"q":"When an oil pollution incident happens, who must be informed without delay?","options":["The nearest coastal State","The crew's families","The shipyard","The bunker supplier only"],"answer":0,"why":"MARPOL and the SOPEP require prompt reporting to the nearest coastal State."},{"q":"What information does the SOPEP contain?","options":["The crew's medical records","The ship's cargo invoices","Reporting procedures, contacts and steps to control a discharge","The ship's fuel prices"],"answer":2,"why":"The SOPEP lists who to contact and what actions to take to control oil discharge."},{"q":"Why are SOPEP drills carried out regularly?","options":["To use up old equipment","So the crew knows their duties and can respond quickly","Because they replace fire drills","To test the ship's speed"],"answer":1,"why":"Regular drills make sure crew can respond quickly and correctly to a spill."},{"q":"Before using chemical dispersants on a spill at sea, what is needed?","options":["Permission from the bunker supplier","Approval from the crew","Nothing, they may be used freely","Approval from the coastal State authority"],"answer":3,"why":"Dispersants can harm marine life, so coastal State approval is normally required."}],"SOTC - Security Officer Training Course":[{"q":"The ISPS Code is part of which SOLAS chapter?","options":["Chapter II-2","Chapter III","Chapter XI-2","Chapter V"],"answer":2,"why":"The ISPS Code is made mandatory through SOLAS Chapter XI-2."},{"q":"What does security level 1 mean under the ISPS Code?","options":["Normal level with minimum security measures at all times","Heightened risk for a period of time","A security incident is likely or imminent","The ship is under attack"],"answer":0,"why":"Level 1 is the normal level where minimum protective measures are always maintained."},{"q":"Who on board is responsible for implementing the Ship Security Plan?","options":["The chief cook","The bosun","The port agent","The Ship Security Officer"],"answer":3,"why":"The SSO, accountable to the master, implements and maintains the Ship Security Plan."},{"q":"Who approves the Ship Security Plan?","options":["The ship's agent","The flag Administration or an authorised organisation","The charterer","The local police"],"answer":1,"why":"The SSP is approved by the flag Administration or a recognised security organisation on its behalf."},{"q":"What is a key access control measure at the gangway?","options":["Checking ID and logging all persons boarding","Letting visitors in if they look official","Leaving the gangway unattended at night","Allowing anyone with a parcel on board"],"answer":0,"why":"Checking identity and logging visitors prevents unauthorised access."},{"q":"Why should security patrols be done at irregular times and routes?","options":["To save time","To make patrols easier to schedule","To avoid predictable patterns that intruders could exploit","Because crew prefer it"],"answer":2,"why":"Unpredictable patrols make it harder for intruders to avoid detection."},{"q":"What is a Declaration of Security (DoS)?","options":["A crew contract","A customs form for cargo","A certificate of ship registry","An agreement on security measures between a ship and a port facility or another ship"],"answer":3,"why":"A DoS records the security responsibilities agreed between the ship and the other party."},{"q":"What is special about the Ship Security Alert System (SSAS)?","options":["It sounds a loud alarm on deck","It sends a covert alert to shore without alarming the ship","It only works in port","It replaces the GMDSS"],"answer":1,"why":"The SSAS sends a silent alert to shore so attackers on board are not warned."},{"q":"What does security level 3 mean?","options":["Normal operations","Routine port visit","Heightened risk for a period","A security incident is probable or imminent"],"answer":3,"why":"Level 3 applies when a security incident is probable or imminent and exceptional measures are needed."},{"q":"You find a suspicious unattended package on board. What should you do?","options":["Do not touch it, keep people away and report it","Open it to check the contents","Throw it overboard immediately","Move it to the store room"],"answer":0,"why":"Suspicious items should be isolated and reported, not handled."}],"SSOC - Shipboard Safety Officer Course":[{"q":"What is the main purpose of a workplace inspection on board?","options":["To find hazards before they cause accidents","To check crew attendance","To prepare the cargo plan","To test the radio equipment"],"answer":0,"why":"Regular inspections identify hazards early so they can be controlled."},{"q":"What is the difference between a hazard and a risk?","options":["They mean exactly the same thing","A risk is always a fire","A hazard only exists ashore","A hazard can cause harm; risk is the chance and severity of that harm"],"answer":3,"why":"A hazard is the source of harm, while risk combines its likelihood and consequence."},{"q":"What is the purpose of root cause analysis after an accident?","options":["To find someone to punish","To complete the logbook entry","To find the underlying reasons so it does not happen again","To calculate repair costs"],"answer":2,"why":"Root cause analysis looks beyond the immediate cause to prevent recurrence."},{"q":"After corrective action is taken, what should the safety officer do?","options":["Close the file without checking","Verify that the action was effective","Repeat the same action every day","Ask the crew to forget the incident"],"answer":1,"why":"Follow-up confirms that the corrective action actually removed or reduced the hazard."},{"q":"What does a blue circular safety sign usually mean?","options":["A prohibited action","A fire equipment location","A mandatory action, such as wearing PPE","A safe condition or exit"],"answer":2,"why":"Blue circular signs show mandatory actions, such as wearing ear or eye protection."},{"q":"What oxygen level in an enclosed space is considered normal and safe for entry?","options":["About 10 percent by volume","About 15 percent by volume","About 30 percent by volume","About 21 percent by volume"],"answer":3,"why":"Normal air contains about 21 percent oxygen; lower or higher levels are dangerous."},{"q":"Why is good housekeeping important for safety?","options":["It reduces slips, trips and fire hazards","It makes the ship look expensive","It is only for inspections","It reduces fuel use"],"answer":0,"why":"Clean, tidy work areas prevent many common accidents and fire risks."},{"q":"What is the role of a fire watch during hot work?","options":["To do the welding","To prepare the permit only","To watch for fire and be ready with extinguishing equipment","To guard the gangway"],"answer":2,"why":"The fire watch monitors for sparks and fire and responds immediately."},{"q":"How can the safety officer help new crew members work safely?","options":["Give a proper safety familiarisation and training","Let them learn by trial and error","Assign them the most dangerous jobs first","Skip training if they have experience"],"answer":0,"why":"Familiarisation and training make sure new crew know hazards, procedures and emergency duties."},{"q":"What does the accident pyramid idea teach?","options":["Serious accidents happen without warning signs","Only officers cause accidents","Accidents cannot be prevented","Many near misses and unsafe acts come before a serious accident"],"answer":3,"why":"Reducing near misses and unsafe acts lowers the chance of a serious accident."}],"SSOR - Ship's Security Officer - Refresher":[{"q":"What is the purpose of a Ship Security Assessment?","options":["To check the ship's stability","To identify threats and weaknesses as the basis for the security plan","To calculate cargo quantities","To plan the crew's leave"],"answer":1,"why":"The SSA identifies threats and vulnerabilities and forms the basis of the Ship Security Plan."},{"q":"How should the Ship Security Plan be kept on board?","options":["Posted on the notice board for all visitors","Given to the port agent","Left in the mess room","Protected from unauthorised access or disclosure"],"answer":3,"why":"The SSP is confidential and must be protected from unauthorised access."},{"q":"Under ISPS guidance, how often should security drills be conducted on board?","options":["At least once every three months","Once every two years","Only during port state inspections","Once a week"],"answer":0,"why":"ISPS Code Part B recommends security drills at least once every three months."},{"q":"Who normally sets the security level for a ship?","options":["The ship's agent","The cargo owner","The Contracting Government (flag State)","The chief engineer"],"answer":2,"why":"The flag State's Contracting Government sets the security level that applies to its ships."},{"q":"Which behaviour could be a sign of a security threat?","options":["A pilot boarding at the scheduled time","A stevedore wearing a proper ID","A delivery with correct paperwork","A person photographing the ship's security arrangements"],"answer":3,"why":"Unusual interest in security arrangements may indicate surveillance by a potential attacker."},{"q":"Before the ship leaves port, what search helps prevent stowaways?","options":["A thorough search of the ship's spaces","A check of the fuel tanks only","A count of the lifebuoys","A test of the general alarm only"],"answer":0,"why":"Searching the ship before departure helps detect stowaways hiding on board."},{"q":"Which STCW Code section sets the competence standard for Ship Security Officers?","options":["Section A-II/1","Section A-V/1","Section A-III/2","Section A-VI/5"],"answer":3,"why":"STCW Code Section A-VI/5 covers the training and competence of Ship Security Officers."},{"q":"To whom should the SSO report security incidents?","options":["Only to the crew","The master and the Company Security Officer","The local newspaper","The ship's chandler"],"answer":1,"why":"Security incidents are reported to the master and CSO, who inform authorities as required."},{"q":"Why does the SSO carry out internal reviews of security activities?","options":["To reduce crew numbers","To change the ship's flag","To check the plan is working and correct weaknesses","To prepare the cargo manifest"],"answer":2,"why":"Regular reviews confirm the security measures are effective and up to date."},{"q":"What is the main purpose of a security exercise compared with a drill?","options":["It is only a paperwork check","It tests wider coordination, often with the company and authorities","It replaces all fire drills","It is done only by the master alone"],"answer":1,"why":"Exercises test communication and coordination among ship, company and port or government parties."}],"SVI - SIRE and Vetting Inspection":[{"q":"What does OCIMF stand for?","options":["Offshore Crew International Marine Fund","Ocean Cargo Inspection and Management Forum","Official Classification for International Maritime Fleets","Oil Companies International Marine Forum"],"answer":3,"why":"OCIMF is the Oil Companies International Marine Forum, which runs the SIRE programme."},{"q":"What does SIRE stand for?","options":["Safety Inspection of Registered Engines","Ship Inspection Report Programme","Shipboard Incident Recording Exercise","Standard International Rating Evaluation"],"answer":1,"why":"SIRE is OCIMF's Ship Inspection Report Programme for tankers and other vessels."},{"q":"What does the inspector use as the guide for questions during a SIRE inspection?","options":["The Vessel Inspection Questionnaire (VIQ)","The ship's cargo invoice","The crew's employment contracts","The port tariff"],"answer":0,"why":"Inspectors follow the OCIMF Vessel Inspection Questionnaire during SIRE inspections."},{"q":"Who decides whether a tanker is acceptable for a charter after a SIRE inspection?","options":["The SIRE inspector on the spot","The ship's master","The charterer or oil company using the report","The port agent"],"answer":2,"why":"SIRE reports have no pass or fail; each charterer makes its own vetting decision."},{"q":"What does TMSA stand for?","options":["Tanker Management and Self Assessment","Tanker Maintenance and Safety Audit","Total Marine Security Agreement","Technical Manning Standard Assessment"],"answer":0,"why":"TMSA is OCIMF's tool for companies to assess and improve their management systems."},{"q":"During a vetting inspection, the inspector asks a rating about the emergency shutdown procedure. What is expected?","options":["Refer every question to the master","Give a long speech about another topic","Leave the area","Explain or show the procedure correctly"],"answer":3,"why":"Inspections check crew readiness, so crew must know and demonstrate their duties."},{"q":"SIRE 2.0 places greater focus on what area?","options":["The ship's paint colour","Human factors and how crew actually perform tasks","The ship's catering budget","The age of the ship's furniture"],"answer":1,"why":"SIRE 2.0 places strong emphasis on human factors and observed crew performance."},{"q":"Why must records such as rest hours be accurate before a vetting inspection?","options":["Inspectors never look at records","Records are only for the crew's use","Inspectors compare records with real practice and check for consistency","Accurate records slow down the inspection"],"answer":2,"why":"Inconsistent or false records are serious observations and damage the ship's credibility."},{"q":"How should the operator handle observations from a SIRE report?","options":["Ignore them because there is no pass or fail","Delete the report","Argue with the inspector on board","Investigate root causes and record corrective and preventive actions"],"answer":3,"why":"Good corrective-action management fixes the cause and shows charterers the issue is closed."},{"q":"Which safety systems are commonly checked during a tanker vetting inspection?","options":["Inert gas, fire-fighting and cargo safety systems","Only the crew's entertainment system","Only the galley equipment","Only the ship's library"],"answer":0,"why":"Inspectors check critical tanker safety systems such as inert gas and fire-fighting equipment."}],"TANKFAM - Tanker Familiarization and Safety":[{"q":"What are the three sides of the fire triangle?","options":["Water, air and smoke","Fuel, water and heat","Fuel, oxygen and heat","Oxygen, nitrogen and steam"],"answer":2,"why":"A fire needs fuel, oxygen and heat; removing one puts it out."},{"q":"What is the flash point of a liquid?","options":["The lowest temperature at which it gives off enough vapour to ignite briefly","The temperature at which it freezes","The temperature at which it boils","The highest temperature it can be stored at"],"answer":0,"why":"Flash point is the lowest temperature at which vapour can momentarily ignite with a flame."},{"q":"Under SOLAS, cargo tanks protected by inert gas must keep oxygen content at or below what level?","options":["21 percent by volume","15 percent by volume","12 percent by volume","8 percent by volume"],"answer":3,"why":"SOLAS requires inerted cargo tank atmospheres to have no more than 8 percent oxygen by volume."},{"q":"How is the risk from static electricity reduced during cargo transfer?","options":["By loading at maximum rate from the start","By bonding, earthing and slow initial loading rates","By spraying water on the manifold","By opening all tank hatches"],"answer":1,"why":"Bonding and slow initial rates reduce static build-up and discharge."},{"q":"Why is hydrogen sulphide (H2S) especially dangerous?","options":["It is completely harmless","It is always visible as a yellow cloud","It can quickly deaden the sense of smell and is toxic","It only affects machinery"],"answer":2,"why":"H2S smells of rotten eggs at low levels but paralyses smell at higher levels and is highly toxic."},{"q":"What is the flammable range of a vapour?","options":["The concentration between the lower and upper flammable limits","Any concentration below the lower flammable limit","Any temperature above the boiling point","The distance a flame can travel"],"answer":0,"why":"Only mixtures between the lower and upper flammable limits can burn."},{"q":"Which document gives information on a cargo's hazards and handling?","options":["The crew list","The Safety Data Sheet (SDS)","The bill of lading","The ship's register"],"answer":1,"why":"The SDS lists the cargo's properties, hazards, PPE and first aid."},{"q":"What is ISGOTT?","options":["A tank cleaning machine","A cargo pump manufacturer","A classification society","The International Safety Guide for Oil Tankers and Terminals"],"answer":3,"why":"ISGOTT is the main industry safety guide for oil tanker and terminal operations."},{"q":"What must be completed between the ship and terminal before cargo transfer?","options":["The crew wage sheet","The weather report","The ship/shore safety checklist","The stores requisition"],"answer":2,"why":"The ship/shore safety checklist confirms both sides have agreed safety measures."},{"q":"Before entering a cargo pump room, what must be done?","options":["Ventilate it and test the atmosphere","Enter alone to save time","Switch off all lights","Close all ventilation"],"answer":0,"why":"Pump rooms can collect toxic or flammable gas, so ventilation and gas testing come first."}],"TAS - Trim and Stability":[{"q":"What is a ship's displacement?","options":["The volume of cargo holds","The weight of water the ship displaces, equal to the ship's weight","The length of the ship","The height of the ship above water"],"answer":1,"why":"A floating ship displaces water equal to its own total weight (Archimedes' principle)."},{"q":"What is trim?","options":["The ship's list to port","The ship's speed","The ship's breadth","The difference between the forward and aft drafts"],"answer":3,"why":"Trim is the difference between forward and aft drafts."},{"q":"What is the centre of buoyancy (B)?","options":["The geometric centre of the underwater volume","The centre of the ship's weight","The top of the mast","The middle of the deck"],"answer":0,"why":"B is the centre of the underwater volume, where the buoyant force acts."},{"q":"How is metacentric height (GM) found?","options":["KG minus KM","KB plus BM plus KG","KM minus KG","Draft minus freeboard"],"answer":2,"why":"GM equals the height of the metacentre (KM) minus the height of the centre of gravity (KG)."},{"q":"What is the effect of slack tanks (free surface effect) on stability?","options":["It increases GM","It has no effect","It lowers the centre of gravity","It reduces effective GM"],"answer":3,"why":"Free surface effect causes a virtual rise of G, which reduces the effective GM."},{"q":"Loading a heavy weight high on deck will usually do what?","options":["Lower G and increase GM","Raise G and decrease GM","Increase the freeboard","Remove all trim"],"answer":1,"why":"Adding weight high raises the centre of gravity, reducing GM."},{"q":"A ship with a very large GM is called stiff. How does it roll?","options":["Slowly and gently","It does not roll at all","Quickly and violently","Only to one side"],"answer":2,"why":"A large GM gives a short, jerky roll that can damage cargo and tire the crew."},{"q":"A ship is trimmed by the stern when what is true?","options":["The aft draft is greater than the forward draft","The forward draft is greater than the aft draft","Both drafts are equal","The ship is listing to starboard"],"answer":0,"why":"Trim by the stern means the stern is deeper than the bow."},{"q":"What is the centre of gravity (G)?","options":["The centre of the waterplane","The point through which the total weight of the ship acts","The highest point of the ship","The centre of the propeller"],"answer":1,"why":"G is the point where the whole weight of the ship is considered to act downward."},{"q":"What do the load line (Plimsoll) marks show?","options":["The ship's maximum speed","The position of the cargo holds","The ship's age","The maximum draft the ship may safely load to"],"answer":3,"why":"Load line marks show the deepest allowed draft for different seasons and waters."}],"TI - Tank Inspection":[{"q":"Before entering a tank for inspection, what must be done first?","options":["Ventilate, test the atmosphere and obtain an entry permit","Enter quickly before the gas builds up","Enter with a lit match to test for gas","Close all openings to keep it clean"],"answer":0,"why":"Enclosed spaces may lack oxygen or contain toxic or flammable gas, so ventilation, testing and a permit come first."},{"q":"What is the normal oxygen level in safe air?","options":["About 10 percent","About 15 percent","About 21 percent","About 30 percent"],"answer":2,"why":"Normal air has about 21 percent oxygen, which is required for safe entry."},{"q":"Why should the tank atmosphere be tested at different levels?","options":["To save time","Gas detectors only work at the top","It is a paperwork rule only","Gases can collect at different heights"],"answer":3,"why":"Heavier and lighter gases collect at different levels, so testing must cover the whole space."},{"q":"What is the duty of the standby person at the tank entrance?","options":["Enter the tank to help with the inspection","Keep contact with the entrants and raise the alarm if needed","Leave once the team is inside","Lock the tank entrance"],"answer":1,"why":"The standby person monitors the team and calls for help but does not enter alone."},{"q":"Which is an example of coating breakdown?","options":["Blistering and rust spots on the surface","A clean, smooth painted surface","A new anode fitted","A dry tank floor"],"answer":0,"why":"Blistering, flaking and rust show that the protective coating is failing."},{"q":"Which of these is a structural defect to look for in a tank?","options":["Fresh paint","Clean anodes","Cracks and buckling","Clear tank markings"],"answer":2,"why":"Cracks, buckling and heavy wastage weaken the structure and must be reported."},{"q":"When recording a defect, what information is most useful?","options":["Only the inspector's name","Exact location, size, description and photos","The weather during inspection","The tank's original builder only"],"answer":1,"why":"Precise location, size and photos let the defect be assessed and repaired correctly."},{"q":"Coating condition in ballast tanks is commonly rated by class as what?","options":["Excellent, average or bad","New, used or old","Grade A, B, C or D","Good, fair or poor"],"answer":3,"why":"IACS and class surveys rate ballast tank coating condition as good, fair or poor."},{"q":"Why should ventilation continue while people are inside the tank?","options":["To keep the air safe as conditions can change","To dry the paint faster","To reduce lighting needs","To cool the inspector's tools"],"answer":0,"why":"Continuous ventilation keeps oxygen levels safe and removes gases released during the work."},{"q":"What type of lighting should be used inside a tank that may contain flammable vapours?","options":["Candles or open flames","Ordinary household lamps","Intrinsically safe or explosion-proof lights","No lighting at all"],"answer":2,"why":"Intrinsically safe lighting cannot ignite flammable vapours."}],"VOC - Volatile Organic Compound":[{"q":"What does VOC stand for?","options":["Vessel Operating Certificate","Vapour Outlet Control","Voyage Oil Consumption","Volatile Organic Compound"],"answer":3,"why":"VOC means Volatile Organic Compound, a vapour released from petroleum cargoes."},{"q":"Which MARPOL Annex covers VOC emissions from tankers?","options":["Annex I","Annex VI","Annex IV","Annex V"],"answer":1,"why":"MARPOL Annex VI, which deals with air pollution, includes the regulation on VOC from tankers."},{"q":"Which tankers must carry an approved VOC Management Plan?","options":["Chemical tankers carrying only vegetable oils","Gas carriers only","Tankers carrying crude oil","All passenger ships"],"answer":2,"why":"MARPOL Annex VI requires tankers carrying crude oil to have an approved VOC Management Plan."},{"q":"When are VOCs mainly released from a tanker?","options":["During loading, transport and crude oil washing","Only when the engine is stopped","Only during crew change","Only in dry dock"],"answer":0,"why":"Cargo evaporation during loading, voyage and crude oil washing releases VOCs."},{"q":"What is the purpose of a vapour emission control system during loading?","options":["To collect displaced vapour and send it ashore instead of to the air","To cool the cargo","To measure tank levels","To increase the loading rate"],"answer":0,"why":"Vapour return systems collect vapour displaced by the incoming cargo and send it to shore."},{"q":"What environmental harm do VOC emissions contribute to?","options":["Ocean acidification only","Coral bleaching only","Water ballast contamination","Ground-level ozone and smog"],"answer":3,"why":"VOCs react in sunlight to form ground-level ozone and smog."},{"q":"Which health effect can result from breathing VOC vapours?","options":["Improved concentration","Headache, dizziness and, for some vapours like benzene, cancer risk","Stronger eyesight","Faster healing of wounds"],"answer":1,"why":"VOC vapours can cause headaches and dizziness, and benzene is a known carcinogen."},{"q":"How can crew help reduce VOC emissions?","options":["Open tank hatches often for ventilation","Vent tanks freely whenever possi
