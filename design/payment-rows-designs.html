:root { --font-portal: "Geist", system-ui, sans-serif; --font-num: "Geist Mono", ui-monospace, monospace; color-scheme: light; --ink: #0f2638; --mute: #587184; --line: #d6e9f1; --soft: #eef4f8; --navy: #123F63; --blue: #0571D0; --orange: #F25615; --good: #0a7a3e; --bad: #b42318; --warn: #a2470b; }
html, body { background: #f2f9fc; color: var(--ink); margin: 0; }
#proto { background: #fff; border-bottom: 2px solid var(--navy); padding: 8px 16px; display: flex; flex-direction: column; gap: 6px; font: 13px/1.3 var(--font-portal); }
#proto .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#proto .lab { font-weight: 600; color: var(--mute); margin-right: 4px; }
#proto .idea { color: var(--mute); }
#proto button { font: 600 13px var(--font-portal); height: 30px; padding: 0 11px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--navy); cursor: pointer; }
#proto button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
#proto button:focus-visible, .pr-b:focus-visible, .pr-link:focus-visible, .pr-i:focus-visible, .pr select:focus-visible, .pr input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.pr > .portal-panel, .pr .pr-flush { padding: 0; }
.pr .portal-panel, .pr .portal-table { overflow: visible; }
.pr .portal-table { margin: 0 !important; width: 100% !important; }
.pr .portal-table table { width: 100% !important; min-width: 0 !important; }
.pr .portal-table table { font-size: 14px; }
.pr .portal-table th, .pr .portal-table td { font-size: 14px; white-space: normal; vertical-align: middle; }
.pr .cx-name { font-size: 14px; }
.pr small { display: block; color: var(--mute); font-size: 12px; font-weight: 400; }
.pr .m { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.pr .r { text-align: right; }
.pr .cx-amt { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; }
.pr-b { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--blue); font: 600 14px var(--font-portal); cursor: pointer; white-space: nowrap; }
.pr-b.p { background: var(--orange); border-color: var(--orange); color: #fff; }
.pr-link { background: none; border: 0; padding: 0; color: var(--blue); font: 600 14px var(--font-portal); cursor: pointer; white-space: nowrap; }
.pr-link.d { color: var(--bad); }
.pr-i { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--blue); cursor: pointer; }
.pr-i.d { color: var(--bad); border-color: #efc9c4; }
.pr-i svg { width: 15px; height: 15px; }
.pr-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; position: relative; }
.pr-gone { color: var(--mute); font-size: 12px; white-space: nowrap; }
.pr-c { display: inline-block; padding: 2px 8px; border-radius: 999px; font: 600 12px var(--font-portal); white-space: nowrap; }
.pr-c.g { background: #e3f5ea; color: var(--good); } .pr-c.o { background: #fdeee6; color: #b23d0c; } .pr-c.r { background: #fbe9e7; color: var(--bad); } .pr-c.n { background: var(--soft); color: #40606f; }
.pr-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.pr-dot.g { background: var(--good); } .pr-dot.o { background: var(--orange); } .pr-dot.r { background: var(--bad); }
.pr-void .cx-amt { text-decoration: line-through; color: var(--mute); }
.pr-void .pr-name { color: var(--mute); }
.pr-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 30; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px #0f26382e; padding: 4px; min-width: 150px; }
.pr-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 7px; padding: 8px 10px; font: 500 14px var(--font-portal); color: var(--bad); cursor: pointer; }
.pr-menu button:hover { background: var(--soft); }
/* Design 2, Two-Line Row */
.pr-rowlist > div { padding: 10px 14px; border-top: 1px solid var(--line); }
.pr-rowlist > div:first-child { border-top: 0; }
.pr-2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; font-size: 14px; }
.pr-2 .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.pr-2 .sub { color: var(--mute); font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
/* Design 3, Amount First */
.pr .pr-big { font: 600 15px var(--font-num); font-variant-numeric: tabular-nums; }
/* Design 4, Mode Color Bar */
.pr .pr-bar td:first-child { box-shadow: inset 4px 0 0 var(--c); padding-left: 14px; }
/* Design 5, Receipt Stub */
.pr-stubs { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; }
.pr-stub { display: grid; grid-template-columns: 190px minmax(0, 1.3fr) 200px 92px 150px; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 14px; padding-right: 12px; min-height: 54px; }
.pr-stub .tab { align-self: stretch; display: flex; flex-direction: column; justify-content: center; padding: 8px 12px; background: #f2f9fc; border-right: 2px dashed #b9dcec; border-radius: 10px 0 0 10px; }
/* Design 6, Day Ledger */
.pr .pr-dayrow td { background: var(--soft); font-weight: 600; color: var(--navy); }
/* Design 7, Slim Ledger */
.pr-slim > div { display: grid; grid-template-columns: 12px 150px 84px minmax(0, 1.5fr) minmax(0, 1fr) 86px 130px; gap: 10px; align-items: center; min-height: 36px; padding: 0 14px; border-top: 1px solid var(--line); font-size: 14px; }
.pr-slim > div:first-child { border-top: 0; }
.pr-slim .note { grid-column: 4 / -1; padding-bottom: 6px; color: var(--mute); font-size: 12px; }
.pr-slim .links { display: flex; gap: 10px; justify-content: flex-end; }
/* Design 8, Click to Expand */
.pr-x { border-top: 1px solid var(--line); font-size: 14px; }
.pr-x:first-child { border-top: 0; }
.pr-x > button { display: grid; grid-template-columns: 14px minmax(0, 1.5fr) 110px 190px 92px; gap: 12px; width: 100%; align-items: center; min-height: 44px; padding: 0 14px; background: none; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.pr-x > button:hover { background: #f7fbfd; }
.pr-x > button .cx-amt { text-align: right; }
.pr-x dl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 14px; margin: 0; padding: 10px 14px 12px 40px; background: #f7fbfd; }
.pr-x dt { color: var(--mute); font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.pr-x dd { margin: 0; overflow-wrap: anywhere; }
.pr-x .foot { grid-column: 1 / -1; justify-content: flex-start; }
/* Design 10, Card Rows */
.pr-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 14px; }
.pr-card { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; display: flex; flex-direction: column; gap: 7px; font-size: 14px; background: #fff; min-width: 0; }
.pr-card .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.pr-card .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; }
/* Paid and Enrolled */
.pr-courses { display: flex; flex-direction: column; gap: 4px; }
.pr-course { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pr-code { display: inline-block; padding: 1px 7px; border-radius: 6px; background: #e6f1fb; color: #0b4f8f; font: 500 12px var(--font-num); white-space: nowrap; }
.pr-open { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.pr-open b { color: var(--ink); }
.pr-open span { display: block; color: var(--blue); font: 500 12px var(--font-num); }
.pr-more { background: none; border: 0; padding: 0; color: var(--blue); font: 600 14px var(--font-portal); cursor: pointer; white-space: nowrap; }
/* Search Trainee filters */
.pr-filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.pr-filter label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--mute); }
.pr-filter select, .pr-filter input[type="search"] { height: 36px; box-sizing: border-box; border: 1px solid #cfdbe3; border-radius: 8px; padding: 0 10px; background: #fff; color: var(--ink); font: 14px var(--font-portal); min-width: 0; width: 100%; }
.pr-filter .grow { flex: 1 1 240px; min-width: 0; }
.pr-group { display: flex; flex: 1 1 340px; min-width: 0; }
.pr-group select { width: auto; flex: 0 0 auto; max-width: 48%; border-radius: 8px 0 0 8px; border-right: 0; background: var(--soft); font-weight: 600; }
.pr-group input[type="search"] { flex: 1 1 auto; border-radius: 0 8px 8px 0; }
.pr-seg { display: inline-flex; border: 1px solid #b9dcec; border-radius: 9px; overflow: visible; position: relative; background: #fff; }
.pr-seg > * { position: relative; }
.pr-seg button.seg { height: 36px; padding: 0 12px; background: none; border: 0; border-left: 1px solid #b9dcec; font: 600 14px var(--font-portal); color: var(--navy); cursor: pointer; white-space: nowrap; }
.pr-seg > :first-child button.seg, .pr-seg > button.seg:first-child { border-left: 0; }
.pr-seg button.seg.on { background: var(--navy); color: #fff; }
.pr-seg button.seg small { display: inline; margin-left: 5px; color: inherit; opacity: .75; font: 500 12px var(--font-num); }
.pr-pop { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px #0f26382e; padding: 4px; min-width: 190px; }
.pr-pop button { display: flex; justify-content: space-between; gap: 14px; width: 100%; background: none; border: 0; border-radius: 7px; padding: 8px 10px; font: 500 14px var(--font-portal); color: var(--ink); cursor: pointer; }
.pr-pop button:hover, .pr-pop button.on { background: var(--soft); }
.pr-pop small { display: inline; font-family: var(--font-num); }
.pr-chipon { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: #e6f1fb; color: #0b4f8f; font: 600 14px var(--font-portal); border: 0; cursor: pointer; }
.pr-wait { margin: 12px 14px 16px; padding: 22px 16px; border: 1px dashed #b9dcec; border-radius: 10px; text-align: center; color: var(--mute); font-size: 14px; }
.pr-wait b { display: block; color: var(--ink); font-size: 15px; }
.pr-dates { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 12px 14px 0; font-size: 14px; }
.pr-pick { height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--blue); font: 600 14px var(--font-portal); cursor: pointer; }
.pr-pick.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.pr-pager { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--mute); }
.pr-pager span.btns { display: flex; gap: 12px; }
.pr-note { margin: 0 0 12px; padding: 9px 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; color: var(--mute); }
.pr-note b { color: var(--ink); }
.pr-conf { display: grid; grid-template-columns: 200px minmax(0, 1fr); font-size: 14px; margin: 0; }
.pr-conf > * { padding: 10px 14px; border-top: 1px solid var(--line); margin: 0; }
.pr-conf > :nth-child(-n+2) { border-top: 0; }
.pr-conf dt { font-weight: 600; color: var(--navy); }
#over .bk { position: fixed; inset: 0; z-index: 90; background: #0f26387a; display: flex; align-items: center; justify-content: center; padding: 16px; }
#over .win { background: #fff; border-radius: 14px; width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 18px; font: 14px/1.45 var(--font-portal); color: var(--ink); box-sizing: border-box; }
#over h2 { margin: 0 0 10px; font-size: 17px; }
#over label { display: block; margin: 0 0 10px; font-weight: 600; font-size: 14px; color: var(--mute); }
#over select, #over input[type="text"] { display: block; width: 100%; box-sizing: border-box; height: 36px; margin-top: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font: 14px var(--font-portal); color: var(--ink); background: #fff; }
#over .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
#over table { width: 100%; border-collapse: collapse; font-size: 14px; }
#over th { text-align: left; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--navy); background: #e6f6fc; padding: 7px 8px; }
#over td { border-top: 1px solid var(--line); padding: 7px 8px; }
#over .tick { display: inline-flex; align-items: center; gap: 6px; margin: 0; color: var(--ink); font-weight: 500; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 95; background: var(--navy); color: #fff; padding: 9px 15px; border-radius: 10px; font: 500 14px var(--font-portal); max-width: calc(100vw - 32px); box-sizing: border-box; }
@media (max-width: 760px) {
  .pr-stub { grid-template-columns: minmax(0, 1fr) auto; padding: 0 0 10px; }
  .pr-stub .tab { grid-column: 1 / -1; border-right: 0; border-bottom: 2px dashed #b9dcec; border-radius: 10px 10px 0 0; }
  .pr-stub > :not(.tab) { padding-left: 12px; padding-right: 12px; }
  .pr-slim > div { grid-template-columns: 12px minmax(0, 1fr) auto; gap: 2px 8px; padding: 7px 14px; }
  .pr-slim .ar, .pr-slim .time, .pr-slim .mode { display: none; }
  .pr-slim .links { grid-column: 2 / -1; justify-content: flex-start; }
  .pr-slim .note { grid-column: 2 / -1; padding-bottom: 0; }
  .pr-x > button { grid-template-columns: 14px minmax(0, 1fr) auto; }
  .pr-x > button .mode, .pr-x > button .stat { display: none; }
  .pr-x dl { grid-template-columns: repeat(2, minmax(0, 1fr)); padding-left: 14px; }
  .pr-cards { grid-template-columns: minmax(0, 1fr); }
  .pr-conf { grid-template-columns: minmax(0, 1fr); } .pr-conf dd { border-top: 0; padding-top: 0; }
  .pr-acts { justify-content: flex-start; }
  .pr .portal-table table, .pr .portal-table tbody, .pr .portal-table tr, .pr .portal-table td { display: block; width: 100% !important; box-sizing: border-box; min-width: 0 !important; text-align: left; }
  .pr .portal-table thead { display: none; }
  .pr .portal-table tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .pr .portal-table td { border: 0; padding: 3px 14px !important; }
  .pr .portal-table td .cx-amt, .pr .portal-table td.cx-amt { display: block; text-align: left; }
  .pr-seg { flex-wrap: wrap; }
  .pr .portal-table td[data-l]:not([data-l=""])::before { content: attr(data-l); display: block; float: none; font-size: 11.5px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; }
  .pr-group { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div id="proto"></div>
<main class="portal-shell nw-shell" id="shell"></main>
<div id="over"></div>
<div id="toast" hidden></div>

  return `<section class="portal-panel cx-panel pr-flush"><div class="panel-heading"><div><h2>Paid and Enrolled</h2></div><span class="slot-count">${PE.length}</span></div>${tbl(["Trainee · NWMTACI No.", "Courses", "r:Paid", "r:Balance", ""], PE.map((o) => `<tr><td data-l="" class="lead">${who(o)}</td><td data-l="Courses">${courseCell(o)}</td><td data-l="Paid" class="r"><strong class="cx-amt">${peso(o.paid)}</strong></td><td data-l="Balance" class="r">${o.bal ? `<span class="pr-c o">${peso(o.bal)}</span>` : '<span class="pr-c g">Paid</span>'}</td><td data-l=""><div class="pr-acts">${peRecord(o)}<button type="button" class="pr-b" data-note="The latest receipt opens.">Receipt</button></div></td></tr>`))}</section>`;
}
const stRows = () => ST_SEED.filter((r) => !S.q.trim() || `${r[0]} ${r[1]}`.toLowerCase().includes(S.q.trim().toLowerCase()));
const stCount = (s) => (s === "All" ? stRows().length : stRows().filter((r) => r[2] === s).length);
const stLabel = (s) => `${s} (${stCount(s)})`;
const stSelect = (id) => `<select id="${id}" data-status="1" aria-label="Status">${["All", ...STATUSES].map((s) => `<option value="${s}" ${S.status === s ? "selected" : ""}>${stLabel(s)}</option>`).join("")}</select>`;
const search = (id = "pr-q") => `<input type="search" id="${id}" value="${esc(S.q)}" placeholder="Name, NWMTACI Number or Course" aria-label="Search">`;
function filterBar() {
  if (S.fi === "Today") return `<div class="cx-status" role="tablist" style="padding:0 14px">${["All", ...STATUSES].map((s) => `<button type="button" role="tab" aria-selected="${S.status === s}" class="${S.status === s ? "on" : ""}" data-setstatus="${s}">${s}<span>${stCount(s)}</span></button>`).join("")}</div><div class="pr-filter"><label class="grow">Search${search()}</label></div>`;

    return `<div class="pr-filter"><div class="pr-seg"><button type="button" class="seg ${S.status === "All" ? "on" : ""}" data-setstatus="All">All<small>${stCount("All")}</small></button>${drop("To Collect")}<button type="button" class="seg ${S.status === "Paid" ? "on" : ""}" data-setstatus="Paid">Paid<small>${stCount("Paid")}</small></button>${drop("Others")}</div><div class="grow" style="min-width:0">${search()}</div></div>`;
  }
  return `<div class="pr-filter"><div style="position:relative"><button type="button" class="pr-b" style="height:36px" data-pop="Filter" aria-expanded="${S.pop === "Filter"}">Filter ▾</button>${S.pop === "Filter" ? `<div class="pr-pop">${["All", ...STATUSES].map((s) => `<button type="button" class="${S.status === s ? "on" : ""}" data-setstatus="${s}">${s}<small>${stCount(s)}</small></button>`).join("")}</div>` : ""}</div>${S.status !== "All" ? `<button type="button" class="pr-chipon" data-setstatus="All" aria-label="Clear the ${S.status} filter">${S.status} ✕</button>` : ""}<div class="grow" style="min-width:0">${search()}</div></div>`;
}
function filterPage() {
  const picks = ["Today", "This Week", "This Month", "Last Month"];
  const searching = !!S.q.trim(), visible = S.pick || searching;
  const list = stRows().filter((r) => S.status === "All" || r[2] === S.status);
  const pages = Math.max(1, Math.ceil(list.length / 10)), page = Math.min(S.page, pages), shown = list.slice((page - 1) * 10, page * 10);
  const tones = { Unpaid: "r", "Partially Paid": "o", "Company Charge": "n", Paid: "g", Cancelled: "n" };
  const body = !visible ? '<p class="pr-wait"><b>No Records Shown</b>Pick a date above, or search by name.</p>' : !shown.length ? '<p class="pr-wait"><b>Nothing Here</b>No enrollments match these filters.</p>' : tbl(["Trainee", "Course", "r:Total Due", "r:Paid", "r:Balance", "Status", ""], shown.map((r) => `<tr><td data-l="" class="lead"><b>${r[0].toUpperCase()}</b></td><td data-l="Course"><span class="pr-code">${r[1]}</span></td><td data-l="Total Due" class="r cx-amt">${peso(r[3])}</td><td data-l="Paid" class="r cx-amt">${peso(r[4])}</td><td data-l="Balance" class="r"><strong class="cx-amt">${peso(r[2] === "Cancelled" ? 0 : r[3] - r[4])}</strong></td><td data-l="Status"><span class="pr-c ${tones[r[2]]}">${r[2]}</span></td><td data-l=""><div class="pr-acts">${r[2] === "Unpaid" || r[2] === "Partially Paid" ? '<button type="button" class="pr-b p" data-note="The Record window opens with this course filled.">Balance</button>' : ""}</div></td></tr>`)) + `<div class="pr-pager"><span>Showing ${(page - 1) * 10 + 1}–${(page - 1) * 10 + shown.length} of ${list.length}</span><span class="btns"><button type="button" class="pr-link" data-page="${page - 1}" ${page <= 1 ? "disabled" : ""}>Previous</button><button type="button" class="pr-link" data-page="${page + 1}" ${page >= pages ? "disabled" : ""}>Next</button></span></div>`;
  return `<section class="portal-panel cx-panel pr-flush">${filterBar()}<div class="pr-dates">${searching ? "<span>Searching All Dates</span>" : picks.map((p) => `<button type="button" class="pr-pick ${S.pick === p ? "on" : ""}" data-pick="${p}">${p}</button>`).join("")}</div><div style="margin-top:12px">${body}</div></section>`;
}
function confirmPage() {
  const rows = [
    ["One Status", "Verified and Valid become one chip, in this order: VOID, Void Requested, Duplicate Reference, Verified. Any payment that is not void is valid, so nothing is lost."],
    ["Receipt Number", "The rows show the AR number, which is what prints on the paper. Today the column is headed Receipt but shows the PAY number. The PAY number stays searchable."],

  ];
  return `<section class="portal-panel cx-panel pr-flush"><dl class="pr-conf">${rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl></section>`;
}
function render(keepId) {
  const secs = ["Payment Row", "Paid and Enrolled", "Search Trainee Filters", "To Confirm"];
  const opts = S.sec === "Payment Row" ? DESIGNS.map(([n, t, i]) => [String(n), `${n}`, i, `${n} · ${t}`]) : S.sec === "Paid and Enrolled" ? PE_OPTS.map(([k, l, i]) => [k, l, i, l]) : S.sec === "Search Trainee Filters" ? FI_OPTS.map(([k, l, i]) => [k, l, i, l]) : [];
  const cur = S.sec === "Payment Row" ? String(S.d) : S.sec === "Paid and Enrolled" ? S.pe : S.fi;

  const title = S.sec === "Payment Row" ? "Payments" : S.sec === "Paid and Enrolled" ? "Cashier Dashboard" : S.sec === "Search Trainee Filters" ? "Search Trainee" : "To Confirm";
  const eye = S.sec === "Payment Row" ? "Accounting" : S.sec === "Search Trainee Filters" ? "Enrollments" : "Cashier";
  const tabs = ["Dashboard", "Enrollments ▾", "Accounting ▾", "Reports ▾"], on = S.sec === "Paid and Enrolled" ? 0 : S.sec === "Search Trainee Filters" ? 1 : 2;
  const bar = `<header class="nw-bar"><div class="nw-bar-row"><div class="nw-brand"><span class="new-wave-logo logo-inverted"><span class="logo-image-wrap"><img src="${EMBLEM}" alt="" width="68" height="68"></span><span class="logo-copy"><strong>New Wave</strong><span>Maritime Training and Assessment Center, Inc.</span></span></span></div><div class="nw-tools"><label class="nw-role"><span>Working as</span><select aria-label="Working as"><option>Cashier</option></select></label><div class="nw-user"><span class="user-dot">SC</span><span class="nw-user-text"><strong>Sample Cashier</strong><small>Cashier</small></span></div></div></div><nav class="nw-tabs">${tabs.map((t, i) => `<div class="nw-tab ${i === on && S.sec !== "To Confirm" ? "on" : ""}"><button type="button">${t}</button></div>`).join("")}</nav></header>`;
  const inner = S.sec === "Payment Row" ? rowPage() : S.sec === "Paid and Enrolled" ? pePage() : S.sec === "Search Trainee Filters" ? filterPage() : confirmPage();
  document.getElementById("shell").innerHTML = `${bar}<div class="portal-page cx pr"><div class="cx-head"><div><span class="portal-eyebrow">${eye}</span><h1>${title}</h1></div></div>${inner}</div>`;
  if (keepId) { const q = document.getElementById(keepId); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  const o = document.getElementById("over");
  if (!S.modal) { o.innerHTML = ""; return; }
  if (S.modal.kind === "void") {
    const p = L.find((x) => x.id === S.modal.id);
    o.innerHTML = `<div class="bk" data-bk="1"><div class="win" role="dialog" aria-modal="true" aria-labelledby="m-t"><h2 id="m-t">Request Void</h2><p style="margin:0 0 10px">Void ${p.ar} (${p.mode}, ${peso(p.amt)})? Accounting approves it.</p><label for="m-why">Reason<select id="m-why">${REASONS.map((r) => `<option ${S.why === r ? "selected" : ""}>${r}</option>`).join("")}</select></label>${S.why === "Other" ? `<label for="m-note">Note<input type="text" id="m-note" value="${esc(S.whyNote)}"></label>` : ""}<div class="foot"><button type="button" class="pr-b" data-close="1">Cancel</button><button type="button" class="pr-b p" data-sendvoid="1">Send to Accounting</button></div></div></div>`;
  } else if (S.modal.kind === "account") {

    o.innerHTML = `<div class="bk" data-bk="1"><div class="win" role="dialog" aria-modal="true" aria-labelledby="m-t"><h2 id="m-t">Trainee Account · ${a.name}</h2><p style="margin:0 0 10px;color:var(--mute)">${a.no}</p><table><thead><tr><th>Course</th><th>Training</th><th>Due</th><th>Paid</th><th>Balance</th></tr></thead><tbody>${a.courses.map((c) => `<tr><td><span class="pr-code">${c.c}</span></td><td>${c.d}</td><td class="m">${peso(c.due)}</td><td class="m">${peso(c.paid)}</td><td class="m">${peso(c.due - c.paid)}</td></tr>`).join("")}</tbody></table><div class="foot"><button type="button" class="pr-b" data-close="1">Close</button></div></div></div>`;
  } else {
    const a = PE.find((x) => x.id === S.modal.id), open = a.courses.filter((c) => c.due > c.paid);
    o.innerHTML = `<div class="bk" data-bk="1"><div class="win" role="dialog" aria-modal="true" aria-labelledby="m-t"><h2 id="m-t">Record Payment · ${a.name}</h2><table><thead><tr><th>Pay</th><th>Course</th><th>Balance</th></tr></thead><tbody>${open.map((c) => `<tr><td><label class="tick"><input type="checkbox" checked aria-label="Pay ${esc(c.c)} now"></label></td><td><span class="pr-code">${c.c}</span></td><td class="m">${peso(c.due - c.paid)}</td></tr>`).join("")}</tbody></table><div class="foot"><button type="button" class="pr-b" data-close="1">Cancel</button><button type="button" class="pr-b p" data-close="1" data-note="This is where the tick boxes live once they leave the list.">Record ${peso(a.bal)}</button></div></div></div>`;
  }

let toastT;
function toast(t) { const e = document.getElementById("toast"); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { e.hidden = true; }, 3000); }
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button,[data-bk]");
  if (!t) { if (S.menu || S.pop) { S.menu = null; S.pop = null; render(); } return; }
  const d = t.dataset;
  if (d.bk) { if (ev.target === t) { S.modal = null; render(); } return; }
  if (d.sec) { S.sec = d.sec; S.menu = null; S.pop = null; return render(); }

  if (d.menu) { S.menu = S.menu === d.menu ? null : d.menu; return render(); }
  if (d.open) { S.open = S.open === d.open ? null : d.open; return render(); }
  if (d.rcpt) { const p = L.find((x) => x.id === d.rcpt); p.prints += 1; toast(p.prints >= 2 ? `${p.ar} opens. Printed twice, so the button is gone.` : `${p.ar} opens. Printed ${p.prints} of 2.`); return render(); }
  if (d.void) { S.menu = null; S.why = REASONS[0]; S.whyNote = ""; S.modal = { kind: "void", id: d.void }; return render(); }
  if (d.sendvoid) { const p = L.find((x) => x.id === S.modal.id); p.st = "Void Requested"; p.note = S.why === "Other" ? (S.whyNote.trim() || "Other") : S.why; S.modal = null; toast(`Void request for ${p.ar} sent to Accounting.`); return render(); }
  if (d.close) { S.modal = null; if (d.note) toast(d.note); return render(); }
  if (d.account) { S.modal = { kind: "account", id: d.account }; return render(); }
  if (d.record) { S.modal = { kind: "record", id: d.record }; return render(); }
  if (d.peopen) { S.peOpen = S.peOpen === d.peopen ? null : d.peopen; return render(); }
  if (d.pop) { S.pop = S.pop === d.pop ? null : d.pop; return render(); }
  if (d.setstatus) { S.status = d.setstatus; S.pop = null; S.page = 1; return render(); }
  if (d.pick) { S.pick = d.pick; S.page = 1; return render(); }

});
document.addEventListener("change", (ev) => { const e = ev.target; if (e.dataset.status) { S.status = e.value; S.page = 1; return render(); } if (e.id === "m-why") { S.why = e.value; return render(); } });

document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && (S.modal || S.menu || S.pop)) { S.modal = null; S.menu = null; S.pop = null; render(); } });
render();
