      ["In-House Courses", "HPT", "Hydraulic and Pneumatic Training", DEF_CERT, "", ""],
      ["In-House Courses", "HAZMAT-CFR", "HAZMAT with CFR Cargoes", DEF_CERT, "", "NWMTC{M}{YYYY}-{N}"]
    ].map(function (r) { return { group: r[0], code: r[1], name: r[2], cert: r[3], last: r[4], regOwn: r[5] }; })
  };
  var state = JSON.parse(JSON.stringify(saved));
  var isDirty = function () { return JSON.stringify(state) !== JSON.stringify(saved); };
  var active = null;

  function drawViews() {
    document.getElementById("views").innerHTML = ["Certificate", "Certificate Numbers", "To Confirm"].map(function (v) { return '<button type="button" role="tab" class="' + (v === view ? "on" : "") + '" data-v="' + v + '">' + v + "</button>"; }).join("");
  }
  function drawCert() {
    var r = state.rows[0], n = Number(r.last || 0) + 1;
    body.innerHTML = '<div class="cert-grid"><section class="panel"><div class="ph"><h2>First Page, Filled for a Sample Trainee</h2></div><div style="padding:0 14px 14px"><img class="paper" alt="UBT-PSSR certificate filled for a sample trainee" src="' + CERT + '"></div></section>' +
      '<section class="panel"><div class="ph"><h2>What the Portal Fills In</h2></div><ul class="facts">' +
      [["Trainee Name", "From the Trainee Record"], ["Conducted and Assessed On", "The Training Date"], ["Issued This", "The Day It Is Printed"], ["Certificate No.", render(r.cert || DEF_CERT, r.code, n)], ["Registration No.", render(r.regOwn || state.reg.format, r.code, Number(state.reg.last || 0) + 1)], ["Trainee Photo", "The Uploaded Photo, in the 1.5 x 1.5 Box"], ["Under April Cantoneros", "Operations Manager"]].map(function (f) { return "<li><span>" + f[0] + "</span><b>" + esc(f[1]) + "</b></li>"; }).join("") +
      "</ul></section></div>";
  }
  function preview(fmt, code, n) { return hasN(fmt) ? render(fmt, code, n) : ""; }
  function drawNumbers() {
    var rows = "", last = "";
    var regNext = Number(state.reg.last || 0) + 1;
    state.rows.forEach(function (r, i) {
      if (r.group !== last) { rows += '<tr class="group"><td colspan="5">' + r.group + "</td></tr>"; last = r.group; }
      var changed = JSON.stringify(r) !== JSON.stringify(saved.rows[i]);
      var n = Number(r.last || 0) + 1, regFmt = r.regOwn || state.reg.format;
      rows += '<tr class="' + (changed ? "dirty" : "") + '"><td><b>' + r.code + "</b><small>" + esc(r.name) + "</small></td>" +
        '<td><input class="cell" data-i="' + i + '" data-k="cert" aria-label="Certificate No. format for ' + r.code + '" value="' + esc(r.cert) + '"><span class="err" id="e-c' + i + '"></span></td>' +
        '<td><input class="cell num" inputmode="numeric" data-i="' + i + '" data-k="last" aria-label="Last Certificate No. used for ' + r.code + '" value="' + esc(r.last) + '" placeholder="0"></td>' +
        '<td><input class="cell" data-i="' + i + '" data-k="regOwn" aria-label="Registration No. format for ' + r.code + '" placeholder="Same as Default" value="' + esc(r.regOwn) + '"><span class="err" id="e-r' + i + '"></span></td>' +
        '<td class="next" id="n' + i + '"></td></tr>';
    });
    body.innerHTML = '<section class="panel"><div class="ph"><h2>Registration No., Default for Every Course</h2></div><div class="def">' +
      '<label>Format<input class="cell" id="reg-format" value="' + esc(state.reg.format) + '"></label><label>Last Number Used<input class="cell num" id="reg-last" inputmode="numeric" value="' + esc(state.reg.last) + '"></label>' +
      '<div class="nextbox">Next Registration No.<b id="reg-next"></b></div></div></section>' +
      '<section class="panel" style="margin-top:12px"><div class="ph"><h2>Certificate No. per Course</h2></div>' +
      '<div class="chips"><span>Tap to Add:</span>' + [["{CODE}", "Course Code"], ["{YYYY}", "Year"], ["{YY}", "Year, 2 Digits"], ["{MM}", "Month"], ["{M}", "Month, No Zero"], ["{N:6}", "Running Number, 6 Digits"]].map(function (t) { return '<button type="button" class="chip" data-t="' + t[0] + '">' + t[0] + "<small>" + t[1] + "</small></button>"; }).join("") + "</div>" +
      (done ? '<p class="msg">' + esc(done) + "</p>" : "") +
      '<div class="tw"><table><thead><tr><th>Course</th><th>Certificate No. Format</th><th>Last No. Used</th><th>Registration No. Format</th><th>Next Numbers</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<div class="savebar" id="bar"><span id="bar-t"></span><span class="acts"><button type="button" class="btn" id="discard">Discard</button><button type="button" class="btn primary" id="save">Save Changes</button></span></div></section>';
    refresh();
  }
  function refresh() {
    var regNext = Number(state.reg.last || 0) + 1, bad = false;
    var rf = document.getElementById("reg-format"); if (!rf) return;
    rf.className = "cell" + (hasN(state.reg.format) ? "" : " bad");
    bad = bad || !hasN(state.reg.format);
    document.getElementById("reg-next").textContent = preview(state.reg.format, "", regNext) || "Add {N} to the format";
    state.rows.forEach(function (r, i) {
      var n = Number(r.last || 0) + 1, regFmt = r.regOwn || state.reg.format;
      var cBad = !!r.cert && !hasN(r.cert), rBad = !!r.regOwn && !hasN(r.regOwn); bad = bad || cBad || rBad;
      document.getElementById("e-c" + i).textContent = cBad ? "Add {N} so each number is different." : "";
      document.getElementById("e-r" + i).textContent = rBad ? "Add {N} so each number is different." : "";
      document.getElementById("n" + i).innerHTML = (r.cert ? esc(preview(r.cert, r.code, n)) : "<small>Set a Format First</small>") + "<br>" + esc(preview(regFmt, r.code, regNext));
      var tr = document.getElementById("n" + i).closest("tr"); tr.className = JSON.stringify(r) !== JSON.stringify(saved.rows[i]) ? "dirty" : "";
    });
    var d = isDirty();
    document.getElementById("bar").className = "savebar" + (d ? " on" : "");
    document.getElementById("bar-t").textContent = d ? "Unsaved Changes" : "No Changes";
    document.getElementById("discard").disabled = !d; document.getElementById("save").disabled = !d || bad;
  }
  function drawConfirm() {
    body.innerHTML = '<section class="panel"><div class="ph"><h2>To Confirm Before Building</h2></div><ol class="q">' +
      "<li><b>Where the numbers sit.</b> Your first page has no Certificate No. or Registration No., so I placed them at the lower left, beside the QR. Tell me if they belong elsewhere.</li>" +
      "<li><b>The UBT-PSSR formats.</b> The PDF does not show them, so the sample uses today's pattern. Send one example of each if yours differ. Admin can also change them here at any time.</li>" +
      "<li><b>Registration No. count.</b> It stays one running count for all courses, so no number can repeat. A course can have its own format; HAZMAT with CFR already does.</li>" +
      "<li><b>The QR.</b> It stays exactly as on your template, and matches the MARINA line at the bottom. The portal's own Scan to Verify QR is not added, as on the Safety, Crowd and Crisis certificates.</li>" +
      "<li><b>Your signatures.</b> The two signatures on your first page print on every certificate.</li>" +
      "<li><b>After saving.</b> Staff never type a number; each one is given automatically. Certificates already printed keep their numbers. If a format has {YYYY}, the count restarts at 1 each January, as it does today.</li>" +
      "</ol></section>";
  }
  function draw() { drawViews(); if (view === "Certificate") drawCert(); else if (view === "Certificate Numbers") drawNumbers(); else drawConfirm(); }
  document.getElementById("views").addEventListener("click", function (e) { var v = e.target.getAttribute("data-v"); if (v) { view = v; draw(); } });
  body.addEventListener("focusin", function (e) { if (e.target.classList && e.target.classList.contains("cell") && !e.target.classList.contains("num")) active = e.target; });
  body.addEventListener("input", function (e) {
    var t = e.target; done = "";
    if (t.id === "reg-format") state.reg.format = t.value;
    else if (t.id === "reg-last") state.reg.last = t.value.replace(/\D/g, "");
    else if (t.getAttribute("data-i") != null) { var k = t.getAttribute("data-k"); state.rows[Number(t.getAttribute("data-i"))][k] = k === "last" ? t.value.replace(/\D/g, "") : t.value; }
    refresh();
  });
  body.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-t]") : null;
    if (el && active) { var s = active.selectionStart == null ? active.value.length : active.selectionStart; active.value = active.value.slice(0, s) + el.getAttribute("data-t") + active.value.slice(active.selectionEnd == null ? s : active.selectionEnd); active.dispatchEvent(new Event("input", { bubbles: true })); active.focus(); return; }
    if (e.target.id === "discard") { state = JSON.parse(JSON.stringify(saved)); done = ""; drawNumbers(); }
    if (e.target.id === "save") { saved = JSON.parse(JSON.stringify(state)); done = "Saved. The next certificate of each course takes the next number automatically."; drawNumbers(); }
  });
  var deep = { numbers: "Certificate Numbers", confirm: "To Confirm" }[location.hash.slice(1)];
  if (deep) view = deep;
  draw();
})();
</script>
