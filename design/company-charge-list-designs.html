<title>Company Charge List Designs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Same shell as the live portal: navy bar with dropdown tabs, summary rail on the left, light-cyan table headers. */
:root{--orange:#F25615;--blue:#0571D0;--cyan:#35CCFA;--cyan-l:#9EE3F1;--navy:#123F63;--bg:#f2f6f8;--surface:#fff;--fg:#0f2638;--muted:#587184;--line:#dbe6ec;--soft:#eef4f8;--th:#e6f6fd;--thc:#0b4f8f;--zebra:#f7fafc;
 --good:#0a7a3e;--good-bg:#e2f5e9;--warn:#a2470b;--warn-bg:#fdf0e5;--bad:#b42318;--bad-bg:#fcebea;--info:#0571D0;--info-bg:#e5f1fb;
 --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1722;--surface:#102231;--fg:#e3edf4;--muted:#91a9bb;--line:#20384b;--soft:#152d43;--th:#15344b;--thc:#9fd3f7;--zebra:#12283a;--good:#61d396;--good-bg:#113523;--warn:#ffa56a;--warn-bg:#382313;--bad:#ff8b80;--bad-bg:#3b1918;--info:#5fb4ff;--info-bg:#122e48;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1722;--surface:#102231;--fg:#e3edf4;--muted:#91a9bb;--line:#20384b;--soft:#152d43;--th:#15344b;--thc:#9fd3f7;--zebra:#12283a;--good:#61d396;--good-bg:#113523;--warn:#ffa56a;--warn-bg:#382313;--bad:#ff8b80;--bad-bg:#3b1918;--info:#5fb4ff;--info-bg:#122e48;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.mono,.amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{background:var(--navy);color:#fff;padding-block:16px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{display:flex;align-items:center;gap:12px}.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font:700 15px var(--sans)}.logo b{font-size:19px;font-weight:600}.logo b span{color:var(--orange)}.logo small{display:block;color:var(--cyan-l);font-size:14px}.proto{background:var(--orange);font:600 11px var(--sans);letter-spacing:.08em;padding:2px 8px;border-radius:5px;margin-left:8px}
.who{font-size:14px;color:#cfe3ef;display:flex;align-items:center;gap:8px}.who select{background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:8px;padding:5px 8px}.who select option{color:#0f2638}
.tabs{display:flex;gap:2px;margin-top:16px;flex-wrap:wrap}.tab>button{background:none;border:0;color:#c3dbea;font:500 16px var(--sans);padding:12px 18px;border-radius:10px 10px 0 0;white-space:nowrap;display:flex;align-items:center;gap:8px}.tab>button:hover{color:#fff;background:#ffffff12}.tab.on>button{background:var(--bg);color:var(--fg);font-weight:600}
.caret{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-3px) rotate(45deg)}
.menu{position:absolute;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #0003;padding:6px;z-index:15;display:flex;flex-direction:column;margin-top:2px}.tab{position:relative}.menu button{background:none;border:0;text-align:left;color:var(--fg);font:500 15.5px var(--sans);padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;gap:12px}.menu button:hover{background:var(--soft)}.menu button.on{background:var(--info-bg);color:var(--info);font-weight:600}.menu small,.n{font:600 11.5px var(--mono);background:var(--orange);color:#fff;border-radius:10px;padding:1px 7px}
.page{padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}.eyebrow{display:block;font:600 13px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}h1{font-size:25px;font-weight:600;margin:0}h2{font-size:19px;font-weight:600;margin:0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:16px}.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:14.5px}.seg button.on{background:var(--navy);color:#fff}
.rail{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}@media (max-width:900px){.rail{grid-template-columns:1fr}}.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.ph{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.ph small{color:var(--muted);font-size:14px}
.lines{display:flex;flex-direction:column;padding:0 20px 16px}.lines div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.lines div:first-child{border-top:0}.lines dd,.lines span:last-child{font-family:var(--mono);font-weight:600}.lines .tot{font-weight:700}.lines .bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 16px}.tile{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px}.tile span{display:block;font-size:13px;color:var(--muted)}.tile b{font:600 19px var(--mono)}
.cwrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14.5px}th{background:var(--th);color:var(--thc);font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:10px 12px;border-right:1px solid var(--line);white-space:nowrap}td{padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.35}tbody tr:nth-child(even) td{background:var(--zebra)}td small{display:block;color:var(--muted);font-size:12.5px}.r{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}.due{background:var(--bad-bg);color:var(--bad)}.dueo{background:var(--warn-bg);color:var(--warn)}.appr{background:var(--info-bg);color:var(--info)}.paid{background:var(--good-bg);color:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--blue);border-radius:9px;padding:7px 14px;font-weight:600;font-size:14.5px;white-space:nowrap}.pri{background:var(--orange);color:#fff;border:0}.okb{background:var(--good);color:#fff;border:0}.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:14px 20px;background:var(--soft);border-top:1px solid var(--line)}.form label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}.form select,.form input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);color:var(--fg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
.alert{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:500;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.note{font-size:13.5px;color:var(--muted);padding:0 20px 16px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
</style>

<style>
.sub{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:16px;flex-wrap:wrap}.sub button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:14.5px}.sub button.on{background:var(--navy);color:#fff}
td.num,th.num{text-align:right;font-family:var(--mono);white-space:nowrap}tr.tot td{font-weight:700;border-top:2px solid var(--fg)}
.st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}.st.d{background:var(--good-bg);color:var(--good)}.st.w{background:var(--warn-bg);color:var(--warn)}.st.o{background:var(--info-bg);color:var(--info)}.st.n{background:var(--soft);color:var(--muted)}
.dtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.dtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}.dtabs button.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.grp td{background:var(--soft)!important;font-weight:700}.grp small{font-weight:500;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}.ccard h3{margin:0;font-size:17px}.ccard small{color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}.kv b{font-family:var(--mono);text-align:right}
.big{font:700 22px var(--mono)}
.soa{background:#fff;color:#0f2638;border:1px solid var(--line);border-radius:8px;padding:28px 32px;max-width:860px;box-shadow:0 10px 30px #0001}
.soa .lh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.soa .lh b{color:#123F63;font-size:12px;letter-spacing:.04em}.soa h2{font-size:22px;margin:4px 0}.soa .rule{height:2px;background:#F25615;margin:10px 0 16px}
.soa .to{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 24px;margin-bottom:16px;font-size:14px}.soa .to span{display:block;font-size:11.5px;color:#587184;text-transform:uppercase;letter-spacing:.05em}
.soa table{font-size:12.5px}.soa th{background:#e6f6fd;color:#0b4f8f}
.due{margin-left:auto;margin-top:14px;max-width:340px;border:2px solid #123F63;border-radius:10px;padding:10px 14px}.due div{display:flex;justify-content:space-between;padding:3px 0}.due .amt{font:700 18px var(--mono);color:#123F63}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}@media (max-width:820px){.split{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}.chips button.on{background:var(--navy);color:#fff}
</style>
<header class="top"><div class="w">
  <div class="brand"><div class="logo"><span class="mark">NW</span><div><b>New Wave <span>Maritime</span><span class="proto">5 DESIGNS</span></b><small>Company Charge List · sample trainees</small></div></div><span class="who">Working as Accounting</span></div>
  <nav class="tabs" id="tabs"></nav></div></header>
<main class="page"><div class="w" id="page"></div></main>
<div class="toast" id="toast" hidden></div>
<script>
const peso=(c)=>(c<0?"−":"")+"₱"+(Math.abs(c)/100).toLocaleString("en-PH",{minimumFractionDigits:2});
const CO=[
 {n:"COSTA MARITIME",k:"Consultancy",m:"Deducted on Any Payment",rows:[["SANTOS, Mark","NWMTACI-2026-0412","UBT-PSSR","Oct 22",130000,65000,"d",65000],["REYES, Ana","NWMTACI-2026-0415","PSCMT","Oct 27 – 28",160000,80000,"d",80000],["GARCIA, Leo","NWMTACI-2026-0420","CCI Package","Oct 26 – 31",410000,0,"n",410000]]},
 {n:"EJV MARITIME",k:"Consultancy",m:"Deducted Once Fully Paid",rows:[["MENDOZA, Rico","NWMTACI-2026-0431","STPPDSPPS","Oct 26",120000,60000,"w",50000],["BAUTISTA, Joy","NWMTACI-2026-0433","UBT-PSSR","Oct 23",130000,65000,"d",65000]]},
 {n:"BLUE ANCHOR MANNING",k:"Agency",m:"Paid to the Partner Later",rows:[["AQUINO, Ben","NWMTACI-2026-0440","PSCMHBT","Oct 29 – 31",160000,40000,"o",160000]]},
];
const STL={d:"Deducted",w:"Not Deducted Yet",o:"Owed to the Partner",n:"None"};
const R=(r)=>({name:r[0],no:r[1],course:r[2],when:r[3],fee:r[4],reb:r[5],st:r[6],paid:r[7],full:r[4]-r[7],after:Math.max(0,r[4]-(r[6]==="d"||r[6]==="w"?r[5]:0)-r[7])});
const tot=(rows)=>{const x=rows.map(R);const s=(k)=>x.reduce((a,r)=>a+r[k],0);return {n:x.length,fee:s("fee"),reb:s("reb"),paid:s("paid"),full:s("full"),after:s("after")}};
const ALL=CO.flatMap((c)=>c.rows);
const S={d:1,filter:"All",open:CO[0].n};
const DESIGNS=["1 · Ledger by Company","2 · Statement of Account","3 · Company Cards","4 · One Compact Table","5 · Charges and Rebates Side by Side"];
const head=(t)=>`<div class="cx-head"><div><span class="eyebrow">Accounting · Reports · Company Charge List</span><h1>${t}</h1></div><button class="btn pri" data-t="Print PDF">Print PDF</button></div>`;
function ledger(){return CO.map((c)=>{const t=tot(c.rows);return `<section class="panel" style="margin-bottom:18px"><div class="ph"><div><h2>${c.n}</h2><small>${c.k} · ${c.m}</small></div><button class="btn" data-t="PDF for ${c.n}">PDF</button></div><div class="cwrap"><table><thead><tr><th>#</th><th>Trainee</th><th>Course</th><th>Training</th><th class="num">Full Fee</th><th class="num">Rebate</th><th>Rebate Status</th><th class="num">Paid</th><th class="num">Balance at Full Fee</th></tr></thead><tbody>
 ${c.rows.map(R).map((r,i)=>`<tr><td class="mono">${i+1}</td><td><b>${r.name}</b><small class="mono">${r.no}</small></td><td>${r.course}</td><td>${r.when}</td><td class="num">${peso(r.fee)}</td><td class="num">${r.reb?peso(r.reb):"—"}</td><td><span class="st ${r.st}">${STL[r.st]}</span></td><td class="num">${peso(r.paid)}</td><td class="num">${peso(r.full)}</td></tr>`).join("")}
 <tr class="tot"><td colspan="4">Total · ${t.n}</td><td class="num">${peso(t.fee)}</td><td class="num">${peso(t.reb)}</td><td></td><td class="num">${peso(t.paid)}</td><td class="num">${peso(t.full)}</td></tr></tbody></table></div></section>`}).join("")}
function soa(){const c=CO.find((x)=>x.n===S.open);const t=tot(c.rows);return `<div class="bar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px"><label style="display:flex;align-items:center;gap:8px;font-weight:600;color:var(--navy)">Agency or Consultancy<select id="co" style="border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);color:var(--fg);font-size:15px;min-width:240px;max-width:100%"><optgroup label="Consultancies">${CO.filter((x)=>x.k==="Consultancy").map((x)=>`<option ${S.open===x.n?"selected":""}>${x.n}</option>`).join("")}</optgroup><optgroup label="Agencies">${CO.filter((x)=>x.k==="Agency").map((x)=>`<option ${S.open===x.n?"selected":""}>${x.n}</option>`).join("")}</optgroup></select></label><span class="seg" style="margin:0">${["Daily","Weekly","Monthly","Quarterly","Annually"].map((p)=>`<button class="${p==="Monthly"?"on":""}" data-t="${p}">${p}</button>`).join("")}</span><button class="btn" data-t="Previous period">‹</button><input type="date" value="2026-10-22" aria-label="As of" style="border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--surface);color:var(--fg)"><button class="btn" data-t="Next period">›</button></div>
 <div class="soa"><div class="lh"><div><b>NEW WAVE MARITIME TRAINING AND ASSESSMENT CENTER, INC.</b><h2>Company Charge List</h2></div><div style="text-align:right;font-size:13px;color:#587184">No. CCL-2026-10-001<br>October 22, 2026</div></div><div class="rule"></div>
 <div class="to"><div><span>Charged To</span><b>${c.n}</b><div>${c.k}</div></div><div><span>Period</span>October 1 – 31, 2026<div>by training date</div></div><div><span>Rebate Rule</span>${c.m}</div></div>
 <div class="cwrap"><table><thead><tr><th>#</th><th>Trainee</th><th>Course</th><th>Training</th><th class="num">Full Fee</th><th class="num">Paid</th><th class="num">Balance</th><th>Status</th></tr></thead><tbody>${c.rows.map(R).map((r,i)=>{const pay=r.paid>=r.fee||r.after===0?["Paid","d"]:r.paid>0?["Partly Paid","w"]:["Unpaid","o"];return `<tr><td>${i+1}</td><td><b>${r.name}</b><small>${r.no}</small></td><td>${r.course}</td><td>${r.when}</td><td class="num">${peso(r.fee)}</td><td class="num">${peso(r.paid)}</td><td class="num">${peso(r.full)}</td><td><span class="st ${pay[1]}">${pay[0]}</span><small style="display:block;color:#587184;margin-top:3px">Rebate: ${STL[r.st]}${r.reb?` · ${peso(r.reb)}`:""}</small></td></tr>`}).join("")}</tbody></table></div>
 <div class="due"><div><span>Total Full Fees</span><b class="mono">${peso(t.fee)}</b></div><div><span>Less Payments</span><b class="mono">${peso(-t.paid)}</b></div><div style="border-top:1px solid #123F63;margin-top:4px;padding-top:6px"><span><b>Amount Due</b></span><span class="amt">${peso(t.full)}</span></div><div style="color:#587184;font-size:12.5px"><span>Rebates (${STL.d.toLowerCase()} ${peso(c.rows.map(R).filter((r)=>r.st==="d").reduce((a,r)=>a+r.reb,0))})</span><span>${peso(t.reb)}</span></div></div>
 <div style="display:flex;justify-content:space-between;margin-top:36px;gap:20px;flex-wrap:wrap"><div style="border-top:1px solid #0f2638;padding-top:4px;width:220px;color:#587184">Prepared by (Accounting)</div><div style="border-top:1px solid #0f2638;padding-top:4px;width:220px;color:#587184">Noted by (Admin)</div></div></div>`}
function cards(){return `<div class="cards">${CO.map((c)=>{const t=tot(c.rows);const w=c.rows.map(R).filter((r)=>r.st==="w").length,o=c.rows.map(R).filter((r)=>r.st==="o").length;return `<div class="ccard"><div><h3>${c.n}</h3><small>${c.k} · ${c.m}</small></div><div><small>Balance at Full Fee</small><div class="big">${peso(t.full)}</div></div>
 <div class="kv"><span>Trainees</span><b>${t.n}</b><span>Full Fees</span><b>${peso(t.fee)}</b><span>Paid</span><b>${peso(t.paid)}</b><span>Rebates</span><b>${peso(t.reb)}</b></div>
 <div style="display:flex;gap:6px;flex-wrap:wrap">${w?`<span class="st w">${w} not deducted yet</span>`:""}${o?`<span class="st o">${o} owed to partner</span>`:""}</div>
 <div style="display:flex;gap:8px"><button class="btn" data-open="${c.n}" data-d="2">View Trainees</button><button class="btn" data-t="PDF for ${c.n}">PDF</button></div></div>`}).join("")}</div>`}
function compact(){const g=tot(ALL);return `<section class="panel"><div class="cwrap"><table><thead><tr><th>Trainee</th><th>Course · Training</th><th class="num">Full Fee</th><th class="num">Rebate</th><th>Status</th><th class="num">Paid</th><th class="num">Balance</th></tr></thead><tbody>
 ${CO.map((c)=>{const t=tot(c.rows);return `<tr class="grp"><td colspan="2">${c.n} <small>· ${c.k} · ${c.m}</small></td><td class="num">${peso(t.fee)}</td><td class="num">${peso(t.reb)}</td><td></td><td class="num">${peso(t.paid)}</td><td class="num">${peso(t.full)}</td></tr>${c.rows.map(R).map((r)=>`<tr><td>${r.name}</td><td>${r.course} · ${r.when}</td><td class="num">${peso(r.fee)}</td><td class="num">${r.reb?peso(r.reb):"—"}</td><td><span class="st ${r.st}">${STL[r.st]}</span></td><td class="num">${peso(r.paid)}</td><td class="num">${peso(r.full)}</td></tr>`).join("")}`}).join("")}
 <tr class="tot"><td colspan="2">All Partners · ${g.n} trainees</td><td class="num">${peso(g.fee)}</td><td class="num">${peso(g.reb)}</td><td></td><td class="num">${peso(g.paid)}</td><td class="num">${peso(g.full)}</td></tr></tbody></table></div></section>`}
function split(){const rows=CO.flatMap((c)=>c.rows.map(R).map((r)=>({...r,co:c.n}))).filter((r)=>S.filter==="All"||STL[r.st]===S.filter);
 return `<div class="chips">${["All",...Object.values(STL)].map((f)=>`<button class="${S.filter===f?"on":""}" data-f="${f}">${f}</button>`).join("")}</div>
 <div class="split"><section class="panel"><div class="ph"><h2>Charges at Full Fee</h2></div><div class="cwrap"><table><thead><tr><th>Trainee</th><th>Company</th><th class="num">Full Fee</th><th class="num">Paid</th><th class="num">Balance</th></tr></thead><tbody>${rows.map((r)=>`<tr><td><b>${r.name}</b><small>${r.course} · ${r.when}</small></td><td>${r.co}</td><td class="num">${peso(r.fee)}</td><td class="num">${peso(r.paid)}</td><td class="num">${peso(r.full)}</td></tr>`).join("")}</tbody></table></div></section>
 <section class="panel"><div class="ph"><h2>Rebates</h2></div><div class="cwrap"><table><thead><tr><th>Trainee</th><th class="num">Rebate</th><th>Status</th></tr></thead><tbody>${rows.map((r)=>`<tr><td>${r.name}</td><td class="num">${r.reb?peso(r.reb):"—"}</td><td><span class="st ${r.st}">${STL[r.st]}</span></td></tr>`).join("")}</tbody></table></div></section></div>`}
const V=[ledger,soa,cards,compact,split];
function render(){document.getElementById("tabs").innerHTML=`<div class="tab on"><button>Reports</button></div>`;
 document.getElementById("page").innerHTML=`<div class="dtabs">${DESIGNS.map((d,i)=>`<button class="${S.d===i+1?"on":""}" data-d="${i+1}">${d}</button>`).join("")}</div>`+head(DESIGNS[S.d-1].replace(/^\d · /,""))+V[S.d-1]()}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2400)}
document.addEventListener("click",(e)=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset;
 if(k.open)S.open=k.open;if(k.d)S.d=+k.d;else if(k.f)S.filter=k.f;else if(k.t){toast(k.t);return}else if(!k.open)return;render()});
document.addEventListener("change",(e)=>{if(e.target.id==="co"){S.open=e.target.value;render()}});
S.d=2;render();
</script>
