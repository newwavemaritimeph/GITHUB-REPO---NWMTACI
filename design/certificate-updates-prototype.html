<title>Certificate Updates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: New Wave Ocean Wave portal shell (blue-to-cyan bar, orange active marker) above one working screen per update; public pages framed as a phone. */
:root{--navy:#123F63;--blue:#0571D0;--cyan:#35CCFA;--lcyan:#9EE3F1;--orange:#F25615;--bg:#f1f6f9;--surface:#fff;--line:#d8e4ec;--fg:#0f2638;--muted:#58707f;--soft:#eaf6fa;--th:#e3f6fb;--okbg:#e3f4ea;--ok:#0a7a3e;--warnbg:#fde9dd;--warn:#b4480f;--badbg:#fbe4dc;--bad:#b42318;--infobg:#e2effc;--info:#0b5cad;--sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1824;--surface:#112434;--line:#24394b;--fg:#e4eef5;--muted:#9ab0c1;--soft:#152d3d;--th:#173447;--okbg:#12301f;--ok:#5fd493;--warnbg:#3a2516;--warn:#ffad78;--badbg:#3c1d16;--bad:#ff8a7a;--infobg:#132f4a;--info:#7cc0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1824;--surface:#112434;--line:#24394b;--fg:#e4eef5;--muted:#9ab0c1;--soft:#152d3d;--th:#173447;--okbg:#12301f;--ok:#5fd493;--warnbg:#3a2516;--warn:#ffad78;--badbg:#3c1d16;--bad:#ff8a7a;--infobg:#132f4a;--info:#7cc0ff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--sans)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{background:linear-gradient(100deg,#0571D0,#1c9be3 60%,#35CCFA);color:#fff;padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand b{font-size:17px;letter-spacing:.04em}.brand span{font-size:13px;opacity:.9}
.views{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;align-items:flex-end}.views small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;padding:0 6px 10px 2px}
.views button{border:0;background:none;color:#fff;padding:9px 13px;font-weight:500;font-size:14px;border-radius:10px 10px 0 0}.views button.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 3px 0 var(--orange)}
.page{max-width:1180px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:600}h1{margin:2px 0 0;font-size:26px;text-wrap:balance}h2{margin:0;font-size:16px}h3{margin:0;font-size:15px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.note{background:var(--infobg);color:var(--info);border-radius:10px;padding:10px 14px;font-size:13.5px}.note.warn{background:var(--warnbg);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}.ph small{color:var(--muted)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--th);color:var(--muted);font:600 11.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:8px 12px;white-space:nowrap}td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}.r{text-align:right}td small{display:block;color:var(--muted);font-size:12.5px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.info{background:var(--infobg);color:var(--info)}.mut{background:var(--soft);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;font-weight:500}.pri{background:var(--orange);color:#fff;border:0;border-radius:9px;padding:8px 15px;font-weight:600}.pri:disabled,.btn:disabled{opacity:.5;cursor:default}.danger{background:var(--bad);color:#fff;border:0;border-radius:9px;padding:8px 15px;font-weight:600}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px;padding:4px 16px 14px}.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:15px;color:var(--fg)}.acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.tile span{display:block;font-size:12.5px;color:var(--muted)}.tile b{font:600 19px var(--mono)}
.phone{max-width:410px;width:100%;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 12px 34px rgba(18,63,99,.12)}
.url{background:var(--soft);padding:8px 14px;font:500 12.5px var(--mono);color:var(--muted);border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.site{padding:16px;display:flex;flex-direction:column;gap:12px}.site .logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--blue);letter-spacing:.03em}.site .logo i{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--orange) 0 25%,var(--blue) 0 60%,var(--cyan) 0)}
.state{border-radius:14px;padding:14px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px}.state.v{background:var(--okbg);color:var(--ok)}.state.x{background:var(--badbg);color:var(--bad)}.state.n{background:var(--soft);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.photo{width:96px;height:96px;border-radius:6px;background:linear-gradient(160deg,var(--lcyan),var(--blue));display:grid;place-items:center;color:#fff;font-weight:700;font-size:26px;flex:none}
.steps{display:flex;flex-wrap:wrap;gap:6px}.step{font-size:12.5px;padding:3px 9px;border-radius:99px;font-weight:600}.step.y{background:var(--okbg);color:var(--ok)}.step.n{background:var(--warnbg);color:var(--warn)}.step.w{background:var(--soft);color:var(--muted)}
.enr{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.enr .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.money{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px}.money b{display:block;font:600 14px var(--mono)}
.q{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.rate{display:flex;gap:4px}.rate label{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600}.rate input{position:absolute;opacity:0;pointer-events:none}.rate input:checked+span{color:#fff}.rate label:has(input:checked){background:var(--blue);border-color:var(--blue);color:#fff}
.certs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.certs figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}.certs img{display:block;width:100%;border-radius:4px;border:1px solid var(--line)}.certs figcaption{font-size:13.5px;color:var(--muted);padding-top:8px}
.rtabs{display:flex;gap:4px;flex-wrap:wrap}.rtabs span{padding:6px 12px;border-radius:8px;font-size:13.5px;background:var(--soft);color:var(--muted)}.rtabs span.on{background:var(--navy);color:#fff}.rtabs span.gone{text-decoration:line-through;opacity:.6}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}.seg button{border:0;background:none;padding:7px 13px;font-weight:600;font-size:13.5px}.seg button.on{background:var(--navy);color:#fff}
.mail{font-size:14px}.mail h4{margin:12px 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.pdfmock{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:14px;font:12px/1.45 Georgia,serif}.pdfmock b{font-family:var(--sans)}
@media (max-width:560px){.q{grid-template-columns:1fr}.money{grid-template-columns:1fr 1fr 1fr}h1{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .25s ease-out}@keyframes f{from{opacity:.4;transform:translateY(4px)}to{opacity:1}}}
</style>

<div class="bar"><div class="brand"><b>NEW WAVE · PROTOTYPE</b><span>Certificates, trainee status, evaluation and endorsed programs · 20 Oct 2026 · sample data</span></div>
<nav class="views" id="views"></nav></div>
<main class="page" id="page"></main>

<script>
const VIEWS=[["Website",["Trainee Status","Evaluation Form","Verify Certificate"]],["Portal",["Sample Certificates","Releasing Officer","Admin","Endorsed Programs"]]];
const peso=c=>"₱"+(c/100).toLocaleString("en-PH",{minimumFractionDigits:2});
const S={view:"Trainee Status",found:true,srn:"1234567890",no:"NWMTACI-0000012",evalDone:false,answers:{},verify:"Valid",rtab:"Certificates",releasing:false,sticker:"",revoked:false,revokeAsk:false,reason:"",progs:[],add:{name:"",code:"",dur:"5 days",fee:"",rebate:""},center:"Bluewater Maritime Training Center",msg:null};
const QUESTIONS=["The course objectives were clearly explained","The course content was relevant to my work on board","The instructor knew the subject well","The instructor explained the lessons clearly","Handouts and training materials were useful","Facilities and equipment were in good condition","The time allotted was enough","Overall, I am satisfied with the training"];
function viewsBar(){document.getElementById("views").innerHTML=VIEWS.map(([g,vs])=>`<small>${g}</small>`+vs.map(v=>`<button class="${S.view===v?"on":""}" data-view="${v}">${v}</button>`).join("")).join("")}
function render(){viewsBar();const p=document.getElementById("page");p.innerHTML=({"Trainee Status":status,"Evaluation Form":evaluation,"Verify Certificate":verify,"Sample Certificates":samples,"Releasing Officer":releasing,"Admin":admin,"Endorsed Programs":endorsed})[S.view]();p.classList.remove("fade");void p.offsetWidth;p.classList.add("fade")}

function status(){
  const result=S.found?`<div class="panel"><div class="ph"><div><span class="eyebrow">Trainee Status</span><h2>Juan Miguel P. Dela Cruz</h2><small class="mono">NWMTACI-0000012</small></div></div>
   <div style="padding:0 16px 14px;display:flex;flex-direction:column;gap:10px">
    <div class="tiles"><div class="tile"><span>Total Fees</span><b>${peso(1480000)}</b></div><div class="tile"><span>Paid</span><b>${peso(1360000)}</b></div><div class="tile"><span>Balance</span><b style="color:var(--warn)">${peso(120000)}</b></div></div>
    <div class="enr"><div class="top"><div><b>Operational Use of ECDIS</b><small class="mono" style="display:block;color:var(--muted)">ENR-2026-000031 · Oct 12–16, 2026</small></div><span class="pill ok">Enrolled</span></div>
     <div class="money"><span>Fee<b>${peso(1360000)}</b></span><span>Paid<b>${peso(1360000)}</b></span><span>Balance<b>${peso(0)}</b></span></div>
     <div class="steps"><span class="step y">✓ Training Finished</span><span class="step y">✓ Paid</span><span class="step ${S.evalDone?"y":"n"}">${S.evalDone?"✓ Evaluation Submitted":"✗ Evaluation"}</span><span class="step ${S.evalDone?"y":"w"}">${S.evalDone?"Certificate Ready for Release":"Certificate After Evaluation"}</span></div>
     ${S.evalDone?`<small style="color:var(--muted)">Certificate No. <b class="mono">ECDIS-00150</b> · claim at New Wave with a valid ID.</small>`:`<button class="pri" data-go="Evaluation Form" style="align-self:flex-start">Evaluate Training</button>`}</div>
    <div class="enr"><div class="top"><div><b>BT-PSSR Updating</b><small class="mono" style="display:block;color:var(--muted)">ENR-2026-000044 · Oct 28, 2026</small></div><span class="pill warn">For Payment</span></div>
     <div class="money"><span>Fee<b>${peso(120000)}</b></span><span>Paid<b>${peso(0)}</b></span><span>Balance<b style="color:var(--warn)">${peso(120000)}</b></span></div>
     <div class="steps"><span class="step w">Training Not Started</span><span class="step n">✗ Pay at the Cashier</span></div></div>
    <h3>Payments</h3>
    <div class="wrap"><table><thead><tr><th>Receipt</th><th>Date</th><th>Paid By</th><th class="r">Amount</th></tr></thead><tbody>
     <tr><td class="mono">NWM-AR-2026-000118</td><td>Oct 9</td><td>GCash<small class="mono">Ref 1029384756</small></td><td class="r mono">${peso(680000)}</td></tr>
     <tr><td class="mono">NWM-AR-2026-000131</td><td>Oct 12</td><td>Cash</td><td class="r mono">${peso(680000)}</td></tr></tbody></table></div>
   </div></div>`:`<div class="state n">No record matches that SRN and NWMTACI No. Check both numbers and try again.</div>`;
  return `<div class="head"><div><span class="eyebrow">Website › Trainee Status</span><h1>Check Your Enrollment and Certificate</h1></div></div>
  <div class="note">Replaces the birth-date check. Only the enrollments, payments, balance and certificate status are shown; no address, mobile or email.</div>
  <div class="phone"><div class="url">newwavemaritimemtaci.com/registration-search</div><div class="site"><div class="logo"><i></i>NEW WAVE</div>
   <div class="form" style="padding:0"><label>SRN (Seafarer's Registration No.)<input id="srn" class="mono" value="${S.srn}" inputmode="numeric"></label><label>NWMTACI No.<input id="no" class="mono" value="${S.no}"></label><div class="acts"><button class="pri" data-act="check">Check Status</button></div></div>
   ${result}</div></div>`;
}

function evaluation(){
  if(S.evalDone)return `<div class="head"><div><span class="eyebrow">Website › Evaluation Form</span><h1>Training Evaluation</h1></div></div>
   <div class="grid2"><div class="phone"><div class="url">newwavemaritimemtaci.com/feedback/…</div><div class="site"><div class="logo"><i></i>NEW WAVE</div><div class="state v">✓ Thank you. Your evaluation was submitted.</div><p style="margin:0;font-size:14px">Your certificate can now be released once your fee is settled. Check its status anytime on the Trainee Status page.</p><button class="btn" data-go="Trainee Status">Back to Trainee Status</button></div></div>
   <div class="panel"><div class="ph"><h2>What Staff See</h2><small>Stored in Google Drive only</small></div><div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:10px">
    <div class="note">Filed as <b>NWMTACI Training Evaluations › ECDIS › 2026-10 October › DELA CRUZ, Juan Miguel - ECDIS - 2026-10-20.pdf</b>. The portal keeps only the date and the Drive link; the answers live in the PDF.</div>
    <div class="pdfmock"><b>NEW WAVE MARITIME TRAINING AND ASSESSMENT CENTER, INC.</b><br><b>TRAINING EVALUATION</b><br>Trainee: DELA CRUZ, Juan Miguel P. · NWMTACI-0000012<br>Course: Operational Use of ECDIS · Oct 12–16, 2026<br><br>${QUESTIONS.map((q,i)=>`${i+1}. ${q}: <b>${S.answers[i]??5}</b>`).join("<br>")}<br><br>Liked most: ${S.answers.liked||"Hands-on simulator exercises."}<br>Suggestions: ${S.answers.sugg||"More practice time on route planning."}<br>Recommend New Wave: ${S.answers.rec||"Yes"}<br><br>Submitted Oct 20, 2026, 3:42 PM</div></div></div></div>`;
  return `<div class="head"><div><span class="eyebrow">Website › Evaluation Form</span><h1>Training Evaluation</h1></div></div>
  <div class="note warn">Sample questions. They will be replaced with the exact questions of New Wave's current Google Form once you send its link.</div>
  <div class="phone"><div class="url">newwavemaritimemtaci.com/feedback/…</div><div class="site"><div class="logo"><i></i>NEW WAVE</div>
   <dl class="kv"><dt>Trainee</dt><dd>Juan Miguel P. Dela Cruz</dd><dt>Course</dt><dd>Operational Use of ECDIS</dd><dt>Training</dt><dd>Oct 12–16, 2026</dd></dl>
   <div><b style="font-size:14px">Rate each item from 1 (poor) to 5 (excellent)</b>
   ${QUESTIONS.map((q,i)=>`<div class="q"><span>${q}</span><div class="rate">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="q${i}" value="${n}" data-q="${i}" ${S.answers[i]==n?"checked":""}><span>${n}</span></label>`).join("")}</div></div>`).join("")}</div>
   <div class="form" style="padding:0"><label style="grid-column:1/-1">What did you like most?<textarea id="liked" rows="2">${S.answers.liked??""}</textarea></label><label style="grid-column:1/-1">Suggestions to improve the training<textarea id="sugg" rows="2">${S.answers.sugg??""}</textarea></label><label>Would you recommend New Wave?<select id="rec"><option>Yes</option><option>No</option></select></label>
   <div class="acts"><button class="pri" data-act="submit-eval" ${QUESTIONS.every((_,i)=>S.answers[i])?"":"disabled"}>Submit Evaluation</button></div></div>
   ${QUESTIONS.every((_,i)=>S.answers[i])?"":`<small style="color:var(--muted)">Answer all ${QUESTIONS.length} ratings to submit.</small>`}</div></div>`;
}

function verify(){
  const v=S.verify;
  const body=v==="Valid"?`<div class="state v">✓ VALID CERTIFICATE</div>
   <div style="display:flex;gap:12px;align-items:flex-start"><div class="photo">JD</div><dl class="kv" style="flex:1"><dt>Name</dt><dd>JUAN MIGUEL P. DELA CRUZ</dd><dt>Course</dt><dd>Operational Use of Electronic Chart Display and Information System</dd></dl></div>
   <dl class="kv"><dt>Training</dt><dd>Oct 12–16, 2026</dd><dt>Hours</dt><dd>40</dd><dt>Issued</dt><dd>Oct 20, 2026</dd><dt>Certificate No.</dt><dd class="mono">ECDIS-00150</dd><dt>Sticker No.</dt><dd class="mono">NW-H 004512</dd></dl>
   <div class="note">Compare the name, photo and hologram sticker number with the physical certificate.</div>`
   :v==="Revoked"?`<div class="state x">✗ This certificate has been revoked.</div><dl class="kv"><dt>Certificate No.</dt><dd class="mono">ECDIS-00150</dd></dl><p style="margin:0;font-size:14px">Questions? Call 0948 847 6530 or email newwavemaritime@gmail.com.</p>`
   :`<div class="state n">This certificate is not in New Wave's records.</div><p style="margin:0;font-size:14px">If you are checking a New Wave certificate, call <b class="mono">0948 847 6530</b> or email <b>newwavemaritime@gmail.com</b>.</p>`;
  return `<div class="head"><div><span class="eyebrow">Website › QR Verification</span><h1>Verify a Certificate</h1></div><div class="seg">${["Valid","Revoked","Not Found"].map(s=>`<button class="${v===s?"on":""}" data-verify="${s}">${s}</button>`).join("")}</div></div>
  <div class="note">Opened by scanning the QR on the certificate. The code is random (not the certificate number), every scan is logged, and 30 checks a minute from one device are allowed. Not shown: birth date, address, contact details, SRN or payments.</div>
  <div class="phone"><div class="url">newwavemaritimemtaci.com/verify/${v==="Not Found"?"8KX4-Q2PM-7TZE":"8KX4-Q2PM-7TZD"}</div><div class="site"><div class="logo"><i></i>NEW WAVE</div>${body}</div></div>`;
}

   <div class="panel"><div class="wrap"><table><thead><tr><th>#</th><th>Trainee</th><th>Course</th><th>Training</th><th>Checklist</th><th>Next Step</th></tr></thead><tbody>
    <tr><td class="mono">1</td><td><b>SANTOS, Paolo</b></td><td>HPT</td><td>Oct 15–17</td><td><div class="steps"><span class="step y">✓ Training ended</span><span class="step y">✓ Fee paid</span><span class="step y">✓ 2x2 photo</span><span class="step n">✗ Evaluation</span></div></td><td><b>Trainee submits the evaluation</b><small>From the Trainee Status page</small></td></tr>
    <tr><td class="mono">2</td><td><b>LIM, Andrea</b></td><td>ECDIS</td><td>Oct 19–23</td><td><div class="steps"><span class="step w">◷ Ends Oct 23</span><span class="step y">✓ Fee paid</span><span class="step n">✗ 2x2 photo</span></div></td><td><b>Training ends Oct 23</b><small>Also needs: photo, evaluation</small></td></tr></tbody></table></div></div>
   <div class="note">Trainees with a balance are no longer listed here; they reach Waiting once they have paid.</div>`;
  return `<div class="head"><div><span class="eyebrow">Releasing Officer</span><h1>${rt}</h1></div><div class="seg">${["Certificates","Waiting"].map(t=>`<button class="${rt===t?"on":""}" data-rtab="${t}">${t}</button>`).join("")}</div></div>
  <div class="rtabs"><span>Dashboard</span><span class="${rt==="Certificates"?"on":""}">Certificates</span><span class="${rt==="Waiting"?"on":""}">Waiting</span><span class="gone" title="Removed">Templates</span><span>Numbering</span><span>Released</span><span>Delivery</span></div>
  <div class="note">Templates is removed: certificate templates now come from the Word files in Google Drive. Release needs both the fee paid and the evaluation submitted; the portal checks again when you press Release.</div>
  ${S.msg?`<div class="note">${S.msg}</div>`:""}
  ${rt==="Certificates"?log:waiting}`;
}

function admin(){
  return `<div class="head"><div><span class="eyebrow">Admin › Certificate Controls</span><h1>Revoke and Daily Report</h1></div></div>
  <div class="grid2"><div class="panel"><div class="ph"><h2>Revoke a Certificate</h2></div><div class="form">
   <label style="grid-column:1/-1">Certificate No.<input class="mono" value="ECDIS-00150"></label>
   <div style="grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px"><b>DELA CRUZ, Juan Miguel P.</b> · Operational Use of ECDIS · issued Oct 20, 2026 · <span class="pill ${S.revoked?"bad":"ok"}">${S.revoked?"Revoked":"Valid"}</span></div>
   ${S.revoked?`<div class="acts" style="justify-content:flex-start"><span class="note" style="flex:1">Revoked. The QR now shows "This certificate has been revoked." and printing is blocked.</span></div>`:`<label style="grid-column:1/-1">Reason<input id="reason" value="${S.reason}" placeholder="e.g. Issued in error: trainee did not complete the course"></label>
   <div class="acts">${S.revokeAsk?`<span style="align-self:center;font-size:14px;color:var(--bad)">Revoke ECDIS-00150? This shows on the QR page at once.</span><button class="btn" data-act="revoke-no">Keep</button><button class="danger" data-act="revoke-yes">Yes, Revoke</button>`:`<button class="danger" data-act="revoke" ${S.reason.trim().length<5?"disabled":""}>Revoke</button>`}</div>`}</div></div>
  <div class="panel"><div class="ph"><h2>Daily Certificate Report</h2><small>Emailed to the Admin at 8:00 PM</small></div><div class="mail" style="padding:0 16px 16px">
   <b>Subject:</b> New Wave certificates · Tue, Oct 20, 2026
   <h4>Today</h4><div class="wrap"><table><tbody><tr><td>Printed</td><td class="mono r">6</td><td>Karen M. (5), April C. (1)</td></tr><tr><td>Reprinted</td><td class="mono r">1</td><td>ABC-00042 · copy 2 · 4:10 PM</td></tr><tr><td>Revoked</td><td class="mono r">${S.revoked?1:0}</td><td>${S.revoked?"ECDIS-00150 · Admin":"—"}</td></tr></tbody></table></div>
   <h4>Exceptions</h4><div class="wrap"><table><tbody><tr><td>Printed with a balance</td><td class="mono r">0</td></tr><tr><td>Direct database changes</td><td class="mono r">0</td></tr><tr><td>Reprints before 8 AM or after 6 PM</td><td class="mono r">0</td></tr></tbody></table></div>
   <h4>QR Scans</h4><div class="wrap"><table><tbody><tr><td>Total scans</td><td class="mono r">23</td></tr><tr><td>Not found</td><td class="mono r">2</td></tr><tr><td>Scanned from 3+ devices</td><td class="mono r">1</td><td>HPT-00131 (4 devices)</td></tr></tbody></table></div>
  </div></div></div>`;
}

function endorsed(){
  const centers=["Bluewater Maritime Training Center","Pacific Seafarers Academy","Harbor Review Center"];const a=S.add;const fee=Math.round(Number(a.fee||0)*100),reb=Math.round(Number(a.rebate||0)*100);
  const mine=S.progs.filter(p=>p.center===S.center);const can=a.name.trim().length>2&&a.code.trim()&&fee>0&&reb>=0&&reb<=fee;
  return `<div class="head"><div><span class="eyebrow">Accounting and Admin › Configuration › Partners</span><h1>Endorsed Programs</h1></div></div>
  <div class="note">All 96 earlier endorsed programs are removed. Programs that past enrollments used are kept out of sight so their receipts and rebates still read correctly. Partner centers stay. Encode the new programs below.</div>
  ${S.msg?`<div class="note">${S.msg}</div>`:""}
  <div class="grid2" style="grid-template-columns:minmax(220px,300px) 1fr"><div class="panel"><div class="ph"><h2>Partner Centers</h2></div>${centers.map(c=>`<button class="btn" data-center="${c}" style="display:block;width:calc(100% - 24px);margin:0 12px 8px;text-align:left;${S.center===c?"border-color:var(--blue);box-shadow:inset 3px 0 0 var(--orange)":""}">${c}<small style="display:block;color:var(--muted)">${S.progs.filter(p=>p.center===c).length} programs</small></button>`).join("")}</div>
  <div class="panel"><div class="ph"><h2>${S.center}</h2><small>${mine.length} programs</small></div>
   <div class="wrap"><table><thead><tr><th>Course</th><th>Duration</th><th class="r">Training Fee</th><th class="r">Rebate</th><th class="r">Payable to Partner</th></tr></thead><tbody>
    ${mine.length?mine.map(p=>`<tr><td><b>${p.name}</b><small class="mono">${p.code}</small></td><td>${p.dur}</td><td class="r mono">${peso(p.fee)}</td><td class="r mono">${peso(p.reb)}</td><td class="r mono">${peso(p.fee-p.reb)}</td></tr>`).join(""):`<tr><td colspan="5" style="color:var(--muted)">No programs yet. Add the first one below.</td></tr>`}</tbody></table></div>
   <div class="ph" style="border-top:1px solid var(--line)"><h3>Add Program</h3></div>
   <div class="form"><label>Course Name<input id="a-name" value="${a.name}" placeholder="e.g. Ship Security Officer"></label><label>Course Code<input id="a-code" class="mono" value="${a.code}" placeholder="e.g. SSO"></label><label>Duration<input id="a-dur" value="${a.dur}"></label><label>Training Fee (PHP)<input id="a-fee" class="mono" inputmode="decimal" value="${a.fee}" placeholder="0.00"></label><label>Rebate to New Wave (PHP)<input id="a-rebate" class="mono" inputmode="decimal" value="${a.rebate}" placeholder="0.00"></label>
    <label>Payable to Partner<input class="mono" disabled value="${fee?peso(Math.max(0,fee-reb)):"—"}"></label>
    <div class="acts">${reb>fee&&fee?`<span style="color:var(--bad);font-size:13.5px;align-self:center">The rebate cannot be more than the training fee.</span>`:""}<button class="pri" data-act="add-prog" ${can?"":"disabled"}>Add Program</button></div></div></div></div>`;
}

document.addEventListener("click",e=>{const t=e.target.closest("[data-view],[data-go],[data-act],[data-verify],[data-rtab],[data-center]");if(!t)return;
  if(t.dataset.view||t.dataset.go){S.view=t.dataset.view||t.dataset.go;S.msg=null}
  else if(t.dataset.verify)S.verify=t.dataset.verify;else if(t.dataset.rtab){S.rtab=t.dataset.rtab;S.msg=null}else if(t.dataset.center)S.center=t.dataset.center;
  else{const a=t.dataset.act;e.preventDefault();
   if(a==="check")S.found=S.srn.replace(/\D/g,"")==="1234567890"&&S.no.trim().toUpperCase()==="NWMTACI-0000012";
   if(a==="submit-eval")S.evalDone=true;
   if(a==="release")S.releasing=true;if(a==="cancel-release")S.releasing=false;
   if(a==="do-release"){S.releasing=false;S.msg=`Released to the trainee${S.sticker?` · sticker ${S.sticker}`:""}. The sticker number now shows on the QR page.`}
   if(a==="revoke")S.revokeAsk=true;if(a==="revoke-no")S.revokeAsk=false;if(a==="revoke-yes"){S.revoked=true;S.revokeAsk=false;S.verify="Revoked"}
   if(a==="add-prog"){const x=S.add;S.progs.push({center:S.center,name:x.name.trim(),code:x.code.trim().toUpperCase(),dur:x.dur,fee:Math.round(Number(x.fee)*100),reb:Math.round(Number(x.rebate||0)*100)});S.msg=`${x.name.trim()} added to ${S.center}. It now shows on the website and in Registration.`;S.add={name:"",code:"",dur:"5 days",fee:"",rebate:""}}}
  render()});
document.addEventListener("input",e=>{const id=e.target.id;
  if(id==="srn")S.srn=e.target.value;if(id==="no")S.no=e.target.value;if(id==="sticker")S.sticker=e.target.value;
  if(id==="reason"){S.reason=e.target.value;const b=document.querySelector('[data-act="revoke"]');if(b)b.disabled=S.reason.trim().length<5}
  if(id==="liked"||id==="sugg")S.answers[id]=e.target.value;
  if(id&&id.startsWith("a-")){S.add[id.slice(2)]=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch{}}}});
document.addEventListener("change",e=>{if(e.target.dataset.q!==undefined){S.answers[e.target.dataset.q]=Number(e.target.value);render()}if(e.target.id==="rec")S.answers.rec=e.target.value});
render();
</script>
