<style>
/* Layout: the portal's report page, one shared date bar, five ways to read the same figures, then the consolidated menus. */
:root {
  --bg: #f2f6f9; --fg: #123f63; --ink: #0f2a3d; --muted: #4d6a7d; --line: #d5e1e9; --panel: #ffffff; --thead: #e6f5fa; --tab: #e2ebf1; --tab-fg: #123f63; --tab-on: #123f63; --tab-on-fg: #ffffff; --accent: #0571d0; --focus: #f25615;
  --ok: #0a7a3e; --ok-bg: #e4f5ec; --warn: #b23d0c; --warn-bg: #fdeee6; --info: #0562b4; --info-bg: #e3f0fb; --rail: #123f63; --rail-fg: #ffffff; --rail-dim: #b9d3e4; --rail-line: #2b5678;
  /* Chart series: checked for colorblind separation on each theme's surface. */
  --c0: #0571d0; --c1: #f25615; --c2: #149a68; --grid: #e4ecf1;
  --bar-a: #0571d0; --bar-b: #35ccfa; --on-bar: #ffffff; --tab-active-bg: #f2f6f9; --tab-active-fg: #0571d0;
  --font: "Geist", "Segoe UI", Arial, sans-serif; --mono: "Geist Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0e1a24; --fg: #e4eef5; --ink: #e4eef5; --muted: #9db4c3; --line: #2a3d4c; --panel: #162734; --thead: #1e3444; --tab: #223544; --tab-fg: #d6e4ee; --tab-on: #35ccfa; --tab-on-fg: #082030; --accent: #6db6f2; --ok: #5fd39a; --ok-bg: #123527; --warn: #ff9a6b; --warn-bg: #3a2218; --info: #8cc4f5; --info-bg: #15304a; --rail: #1e3444; --rail-fg: #e4eef5; --rail-dim: #9db4c3; --rail-line: #2f4a5e; --c0: #3a8fe0; --c1: #e8672f; --c2: #1faf76; --grid: #24394a; --bar-a: #123f63; --bar-b: #0571d0; --tab-active-bg: #0e1a24; --tab-active-fg: #8cc4f5; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0e1a24; --fg: #e4eef5; --ink: #e4eef5; --muted: #9db4c3; --line: #2a3d4c; --panel: #162734; --thead: #1e3444; --tab: #223544; --tab-fg: #d6e4ee; --tab-on: #35ccfa; --tab-on-fg: #082030; --accent: #6db6f2; --ok: #5fd39a; --ok-bg: #123527; --warn: #ff9a6b; --warn-bg: #3a2218; --info: #8cc4f5; --info-bg: #15304a; --rail: #1e3444; --rail-fg: #e4eef5; --rail-dim: #9db4c3; --rail-line: #2f4a5e; --c0: #3a8fe0; --c1: #e8672f; --c2: #1faf76; --grid: #24394a; --bar-a: #123f63; --bar-b: #0571d0; --tab-active-bg: #0e1a24; --tab-active-fg: #8cc4f5; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 700; color: var(--fg); text-wrap: balance; }
h2 { margin: 0; font-size: 15px; line-height: 1.3; font-weight: 700; color: var(--fg); }
button { font: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; background: var(--tab); padding: 3px; border-radius: 9px; }
.seg button { font-size: 13px; font-weight: 600; min-height: 32px; padding: 0 11px; border: 0; border-radius: 6px; background: transparent; color: var(--tab-fg); cursor: pointer; }
.seg button[aria-selected="true"], .seg button.on { background: var(--tab-on); color: var(--tab-on-fg); }
.page-head { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: center; }
.eyebrow { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { min-height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--focus); border-color: var(--focus); color: #fff; }
.note { font-size: 12.5px; color: var(--muted); }
.date-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.date-bar input[type="date"] { font: inherit; font-size: 13px; min-height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); max-width: 100%; }
.date-bar .step { min-width: 32px; min-height: 32px; padding: 0; }
.date-bar .step:disabled { opacity: .4; cursor: default; }
.range-label { font-size: 13px; color: var(--muted); }
.range-label b { color: var(--fg); }
.sample { font-size: 11px; font-weight: 700; letter-spacing: .05em; padding: 2px 8px; border-radius: 99px; background: var(--info-bg); color: var(--info); margin-left: auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; padding: 10px 14px; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: var(--thead); color: var(--fg); font-size: 12px; font-weight: 700; text-align: left; padding: 7px 10px; white-space: nowrap; }
td { padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.n { text-align: right; white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
th.n { font-family: var(--font); font-size: 12px; }
tfoot td, tr.tot td { font-weight: 700; background: var(--thead); color: var(--fg); }
.sub { display: block; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.warn { color: var(--warn); }
.chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.due { background: var(--warn-bg); color: var(--warn); }
.chip.wait { background: var(--info-bg); color: var(--info); }
.link { border: 0; background: none; padding: 0; color: var(--fg); font-weight: 700; font-size: 13px; cursor: pointer; text-align: left; }
.link:hover { color: var(--accent); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.pager { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }
.pager button { min-height: 28px; font-size: 12.5px; padding: 0 9px; }
.empty { padding: 26px 14px; text-align: center; color: var(--muted); }

/* Design 1 */
.d1 { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 12px; align-items: start; }
.rail { background: var(--rail); color: var(--rail-fg); border-radius: 10px; padding: 12px 14px; }
.rail dl { margin: 0; display: grid; gap: 0; }
.rail div { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 6px 0; }
.rail div + div { border-top: 1px solid var(--rail-line); }
.rail dt { font-size: 12.5px; color: var(--rail-dim); }
.rail dd { margin: 0; font-family: var(--mono); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.rail .big dt { color: var(--rail-fg); font-weight: 600; }
.rail .big dd { font-size: 14px; }
.expand td { background: var(--bg); padding: 0; }
.expand .tw { margin: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }

/* Design 2 */
.stack { display: flex; flex-direction: column; gap: 12px; }
.grand { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 10px 14px; background: var(--thead); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
.grand b { font-family: var(--mono); color: var(--fg); }

/* Design 3 */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.tile span { display: block; font-size: 12px; color: var(--muted); }
.tile b { display: block; font-family: var(--mono); font-size: 15.5px; color: var(--fg); }
.cell-btn { width: 100%; border: 0; background: none; cursor: pointer; color: inherit; padding: 2px 4px; border-radius: 6px; text-align: right; font-family: var(--mono); font-size: 12.5px; }
.cell-btn small { display: block; font-family: var(--font); font-size: 11.5px; color: var(--muted); }
.cell-btn:hover, .cell-btn.on { background: var(--thead); }
.none { color: var(--muted); text-align: right; display: block; }

/* Design 4 */
.flow { padding: 12px 14px; border-top: 1px solid var(--line); }
.flow:first-of-type { border-top: 0; }
.flow h2 { margin-bottom: 8px; }
.flow-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px 14px; }
.step { position: relative; min-width: 0; }
.step span { display: block; font-size: 12px; color: var(--muted); }
.step b { display: block; font-family: var(--mono); font-size: 13.5px; color: var(--fg); margin-bottom: 4px; }
.step + .step::before { content: "›"; position: absolute; left: -11px; top: 8px; color: var(--muted); font-weight: 700; }
.track { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 4px; }

/* Design 5 */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.chart { position: relative; padding: 6px 14px 10px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--font); font-size: 11.5px; fill: var(--muted); }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:hover { fill: var(--thead); }
.chart .picked { fill: var(--thead); }
.tip { position: absolute; pointer-events: none; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(11, 31, 51, .2); min-width: 190px; }
.tip b { display: block; color: var(--fg); margin-bottom: 3px; }
.tip div { display: flex; justify-content: space-between; gap: 14px; }
.tip em { font-style: normal; font-family: var(--mono); }

/* Reports Menu */
.mock-bar { background: linear-gradient(90deg, var(--bar-a), var(--bar-b)); border-radius: 10px; padding: 10px 10px 0; display: flex; flex-wrap: wrap; gap: 2px; }
.mock-tab { position: relative; }
.mock-tab > button { min-height: 36px; padding: 0 12px; border: 0; background: transparent; color: var(--on-bar); font-size: 13.5px; font-weight: 600; border-radius: 8px 8px 0 0; cursor: pointer; }
.mock-tab.active > button { background: var(--tab-active-bg); color: var(--tab-active-fg); }
.mock-list { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.mock-list h2 { padding: 10px 14px 4px; }
.mock-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 13.5px; font-weight: 600; color: var(--fg); }
.menus { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 12px; align-items: start; }
.role-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

@media (max-width: 860px) {
  .d1 { grid-template-columns: minmax(0, 1fr); }
  .flow-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .step + .step::before { display: none; }
  .sample { margin-left: 0; }
}
</style>

<div class="wrap">

  <div id="body"></div>
</div>

  var RAW = [
    ["DELA CRUZ, Juan P.", "NBT", "2026-11-05", 1, "Owed", "Due", 1], ["REYES, Maria L.", "NAFF", "2026-11-05", .5, "Owed", "Due", 0], ["SANTOS, Paolo R.", "ABT", "2026-11-04", 1, "For Approval", "Due", 0],
    ["GARCIA, Liza M.", "MII4", "2026-11-04", 1, "Paid", "Due", 1], ["TORRES, Noel A.", "NMEFA", "2026-11-03", 1, "Paid", "Due", 1], ["RAMOS, Carlo B.", "AAFF", "2026-11-03", .5, "Owed", "Due", 0],

    ["CASTRO, Nina F.", "MII4", "2026-10-19", 1, "Paid", "Received", 1], ["RIVERA, Leo G.", "NBT", "2026-10-12", 1, "Paid", "Received", 0], ["GOMEZ, Tess H.", "AAFF", "2026-10-12", 1, "Paid", "Received", 0],
    ["PASCUAL, Dan I.", "MRASE", "2026-10-12", 1, "Paid", "Received", 1], ["NAVARRO, Ella J.", "NMEFA", "2026-10-05", 1, "Paid", "Received", 1], ["MORALES, Rico K.", "NBT", "2026-10-05", 1, "Paid", "Received", 1],

    ["TAN, Oscar Z.", "ABT", "2026-07-20", 1, "Paid", "Received", 0], ["CHUA, Bea A.", "NBT", "2026-06-15", 1, "Paid", "Received", 1], ["YU, Art B.", "MII4", "2026-05-18", 1, "Paid", "Received", 1],
    ["SY, Dina C.", "NAFF", "2026-03-09", 1, "Paid", "Received", 0], ["ONG, Fred D.", "ABT", "2026-01-19", 1, "Paid", "Received", 0], ["GO, Hana E.", "NBT", "2025-11-10", 1, "Paid", "Received", 1],
    ["UY, Ian F.", "MRASE", "2025-08-18", 1, "Paid", "Received", 1]
  ];
  var ROWS = RAW.map(function (r, i) {
    var o = OFFERS[r[1]];
    return { name: r[0], no: "NWMTACI-" + String(1200 + i).padStart(7, "0"), offer: r[1], c: o.c, code: o.code, course: o.name, date: r[2], fee: o.fee, paid: Math.round(o.fee * r[3]), center: r[4], rebateState: r[5], rebate: o.rebate, share: r[6] ? o.share : 0 };
  });

  var peso = function (c) { return "₱" + (c / 100).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var shortPeso = function (c) { var v = c / 100; return v >= 1e6 ? "₱" + (v / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : v >= 1000 ? "₱" + Math.round(v / 1000) + "K" : "₱" + Math.round(v); };
  var day = function (s) { return new Date(s + "T00:00:00Z"); };

  var human = function (s) { return label(s, { month: "short", day: "numeric", year: "numeric" }); };

  function startOf(p, e) {
    var t = day(e), y = t.getUTCFullYear(), m = t.getUTCMonth();
    if (p === "Daily") return e;

    if (p === "Quarterly") return "Q" + (Math.floor(t.getUTCMonth() / 3) + 1) + " " + t.getUTCFullYear();

  }

  var state = { design: 1, period: "Monthly", end: TODAY, from: "2026-10-01", to: TODAY, open: {}, pages: {}, cell: null };
  var DESIGNS = ["1 · Summary Rail", "2 · Center Statements", "3 · Course Matrix", "4 · Money Flow", "5 · Trend", "Reports Menu"];
  var PERIODS = ["Daily", "Weekly", "Monthly", "Quarterly", "Annually", "Custom"];
  var range = function () { return state.period === "Custom" ? { from: state.from, to: state.to } : { from: startOf(state.period, state.end), to: state.end }; };
  var inRange = function () { var r = range(); return ROWS.filter(function (x) { return x.date >= r.from && x.date <= r.to; }).sort(function (a, z) { return z.date.localeCompare(a.date) || a.name.localeCompare(z.name); }); };

  function sum(rows) {
    var t = { trainees: rows.length, fees: 0, paid: 0, balance: 0, centerPaid: 0, centerOwed: 0, rebate: 0, received: 0, due: 0, share: 0, keeps: 0 };

  body.addEventListener("focusin", function (ev) { var el = ev.target.closest && ev.target.closest("[data-bar]"); if (el) showTip(el); });
  body.addEventListener("focusout", hideTip);
  body.addEventListener("mouseleave", hideTip);
  body.addEventListener("keydown", function (ev) { if ((ev.key === "Enter" || ev.key === " ") && ev.target.dataset && ev.target.dataset.bar) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });

  render();
})();
</script>
