function scr(p) {

  if (s === "email") return `<div class="card"><div class="eyebrow">Email (Sample)</div>${p.emails.map((m) => `<div class="mail" style="margin-top:8px"><div class="when">${m.when}</div><b class="subj">${m.subject}</b><div>${m.lines}</div>${m.buttons.map((b) => `<div class="btnbox ${b.o ? "o" : ""}"><p>${b.box}</p><button type="button" class="lnk ${b.blue ? "blue" : ""}" data-go="${b.go}">${b.label}</button>${b.code ? `<p style="margin:8px 0 0">Class Code: <b>${b.code}</b></p>` : ""}</div>`).join("")}</div>`).join("")}</div>`;
  if (s === "classroom") return `<div class="card">${back(p.after === "status" ? "status" : "email")}<div class="eyebrow">Google Classroom (Sample)</div><h3>APA - Anti Piracy Awareness</h3><div class="row"><span>Module 1 · Ship Security Basics</span><span class="chip">PDF</span></div><div class="row"><span>Module 2 · Best Management Practices</span><span class="chip">Video</span></div>${p.classTest ? `<div class="row" style="border-color:var(--orange)"><span><b>Post-Test</b></span><button type="button" class="mini p" data-go="${p.style === "form" ? "test" : "identity"}">Open</button></div>` : ""}<p class="note">The portal cannot see inside the class, so it does not know when the module is finished.</p></div>`;
  if (s === "identity") return `<div class="card">${back("classroom")}${head("Course Post-Test").replace(/<dl[\s\S]*<\/dl>/, "")}<p class="note">One link is shared by the whole class, so please enter your details.</p><label class="f" for="rx-srn">SRN<input id="rx-srn" value="1234567"></label><label class="f" for="rx-no">NWMTACI No.<input id="rx-no" value="NWMTACI-0000401"></label><button type="button" class="big" data-go="test">Open the Post-Test</button></div>`;
  if (s === "gate") return `<div class="card">${back("email")}${head("Course Post-Test")}<p class="note">Please finish the module in Google Classroom first.</p><label class="opt ${D.modDone ? "on" : ""}"><input type="checkbox" id="rx-done" data-mod="1" ${D.modDone ? "checked" : ""}><span>I Finished the Module</span></label><button type="button" class="big" data-go="test" ${D.modDone ? "" : "disabled"}>Open the Post-Test</button></div>`;
  if (s === "code") return `<div class="card">${back("email")}${head("Scheduled Exam")}<p class="warn"><b>Nov 9, 2026, 2:00 PM · Google Meet · Camera On.</b> The proctor gives the code when the session starts.</p><label class="f" for="rx-code">Exam Code<input id="rx-code" value="7Q4K2" autocomplete="off"></label><button type="button" class="big" data-go="test">Start the Exam</button></div>`;
  if (s === "status") { const steps = [["Join the Google Classroom", true, `<button type="button" class="mini" data-go="classroom">Open</button>`], ["Finish the Module", D.modDone, D.modDone ? "" : `<button type="button" class="mini" data-markmod="1">I Finished</button>`], ["Post-Test", D.passed, D.passed ? "" : `<button type="button" class="mini p" data-go="test">Take</button>`], ["Evaluation", D.evalDone, D.evalDone ? "" : `<button type="button" class="mini" data-go="eval">Answer</button>`], ["2x2 Photo", D.photo, D.photo ? "" : `<button type="button" class="mini" data-photo="1">Upload</button>`], ["Certificate", D.released, D.printed ? "<span class=\"chip b\">Ready for Pick-Up</span>" : "<span class=\"chip\">Not Yet</span>"]]; return `<div class="card">${head("My Training")}${steps.map(([t, done, act]) => `<div class="row ${done ? "done" : ""}"><span>${done ? "✓ " : ""}${t}</span>${act}</div>`).join("")}<p class="hint">Also opens with your SRN and NWMTACI No. at any time.</p></div>`; }
  if (s === "eval") return `<div class="card">${back(p.after === "status" ? "status" : D.result ? "test" : "email")}${head("Training Evaluation")}<label class="opt on"><input type="checkbox" checked> <span>I Confirm My Attendance</span></label>${["Course Content", "Module Materials", "Google Classroom Access"].map((x, i) => `<label class="f" for="rx-r${i}">${x}<select id="rx-r${i}"><option>Excellent</option><option>Very Good</option><option>Good</option><option>Fair</option><option>Poor</option></select></label>`).join("")}<label class="f" for="rx-c">Comments and Suggestions<input id="rx-c" placeholder="Optional"></label><button type="button" class="big blue" data-evalsubmit="1">Submit Evaluation</button></div>`;
  if (s === "done") return `<div class="card">${head("Thank You")}<div class="res y"><strong>✓ All Steps Done</strong><p style="margin:8px 0 0;color:#35607a">${p.certMsg}</p></div>${D.soft ? `<div class="mail" style="margin-top:10px"><div class="when">Just now</div><b class="subj">Your certificate soft copy · APA</b><span class="chip">certificate-NWMTACI-APA2026000014.pdf</span></div>` : ""}<button type="button" class="big ghost" style="margin-top:10px" data-go="${p.after === "status" ? "status" : "email"}">Back</button></div>`;
  if (s === "result") { const r = D.result, left = p.maxTries ? p.maxTries - D.tries : null; return `<div class="card">${head(p.style === "exam" ? "Scheduled Exam" : "Course Post-Test")}<div class="res ${r.passed ? "y" : "n"}" role="status"><strong>${r.passed ? "✓ Passed" : "✗ Not Passed Yet"}</strong><p class="score">${r.score}/10 <span>${r.score * 10}% · passing score 70%</span></p>${r.passed ? `<p style="margin:0 0 10px;color:#35607a">Your result is saved.${p.style === "combo" ? " Your evaluation is saved too." : ""}</p>${p.style === "combo" ? `<button type="button" class="big blue" data-go="done">Continue</button>` : `<button type="button" class="big blue" data-go="eval">Evaluate the Training</button>`}` : left === 0 ? `<p class="warn" style="margin:6px 0 0">${p.style === "exam" ? "Please ask Registration for a new exam schedule." : "All 3 tries are used. Please ask Registration to reopen the test."}</p><button type="button" class="big ghost" style="margin-top:8px" data-reopen="1">Registration Reopens It (Sample)</button>` : `<p style="margin:0 0 10px;color:#35607a">You need at least 7 correct answers. Review the module and take the test again.${left != null ? ` ${left} ${left === 1 ? "try" : "tries"} left.` : " There is no limit on retakes."}</p><button type="button" class="big" data-retake="1">Retake the Test</button>`}</div></div>`; }
  // The test itself.
  const title = p.style === "exam" ? "Scheduled Exam" : p.style === "combo" ? "Post-Test and Evaluation" : "Course Post-Test";
  if (p.style === "one" || p.style === "exam") { const i = D.q, last = i === 9; return `<div class="card">${head(title)}<div style="display:flex;justify-content:space-between;align-items:center"><b style="color:var(--navy)">Question ${i + 1} of 10</b><span class="timer" id="rx-timer">30:00</span></div><div class="bar"><i style="width:${(i + 1) * 10}%"></i></div>${qBlock(i)}<div style="display:flex;gap:8px"><button type="button" class="big ghost" data-qstep="-1" ${i === 0 ? "disabled" : ""}>Previous</button>${last ? `<button type="button" class="big" data-submit="1" ${answered() < 10 ? "disabled" : ""}>Submit Answers</button>` : `<button type="button" class="big blue" data-qstep="1">Next</button>`}</div><p class="hint">${answered()} of 10 answered${p.maxTries ? ` · Try ${D.tries + 1} of ${p.maxTries}` : ""}</p></div>`; }
  const intro = p.style === "form" ? `<div class="eyebrow">Google Forms Quiz (Sample)</div><h3>APA Post-Test</h3><p class="note">Signed in as juan@example.com. Your score goes to the portal by this email address.</p>` : `${head(title)}<p class="note">10 questions. Choose one answer each. You pass with 70% (7 correct).${D.tries ? ` This is retake ${D.tries}.` : ""}</p>`;
  const extra = p.style === "combo" ? `<fieldset><legend>Training Evaluation</legend><label class="f" for="rx-ce">Course Content<select id="rx-ce"><option>Excellent</option><option>Very Good</option><option>Good</option></select></label><label class="f" for="rx-cc">Comments and Suggestions<input id="rx-cc" placeholder="Optional"></label></fieldset>` : "";
  return `<div class="card">${intro}${QS.map((_, i) => qBlock(i)).join("")}${extra}<button type="button" class="big" data-submit="1" ${answered() < 10 ? "disabled" : ""}>Submit Answers</button>${answered() < 10 ? `<p class="hint">Answer all 10 questions to submit (${answered()} answered).</p>` : ""}</div>`;
}
const onTest = () => !["email", "classroom", "identity", "gate", "code", "status", "eval", "done", "result"].includes(D.screen);
const device = (p) => `<div class="tools"><button type="button" class="mini" data-restart="1">Start Over</button>${onTest() ? `<button type="button" class="mini" data-fill="10">Answer All Correctly</button><button type="button" class="mini" data-fill="5">Answer 5 Correctly</button>` : ""}</div><div class="dev">${scr(p)}</div>`;
function staffBox(p) {
  const soft = D.soft, needs = [!D.passed && "Post-Test", !D.evalDone && "Evaluation", !D.photo && "Photo"].filter(Boolean);
  const stage = D.released ? "Released" : soft ? "Soft Copy Emailed" : D.printed ? "To Release" : needs.length ? "Waiting" : "To Print";
  const act = stage === "Waiting" && !D.photo ? `<button type="button" class="mini" data-photo="1">Upload</button>` : stage === "To Print" ? `<button type="button" class="mini p" data-print="1">Print</button>` : stage === "To Release" ? `<button type="button" class="mini p" data-release="1">Release</button>` : "";
  return `<section class="panel"><h2>What the Releasing Officer Sees</h2><div class="staff"><div><b>DELA CRUZ, Juan</b> <span class="m">0000401</span><br><b>APA</b> · <span class="chip g">Paid</span></div><div><span class="chip ${stage === "To Print" ? "o" : stage === "Waiting" ? "" : "b"}">${stage}</span>${stage === "Waiting" ? needs.map((x) => `<span class="chip">${x}</span>`).join("") : ""}</div>${act}</div></section>`;
}
function planPage(p) {
  return `<h1>Plan ${p.id} · ${p.name}${p.rec ? '<span class="rec-chip">Recommended</span>' : ""}</h1><p class="sub">${p.best}</p><div class="tagrow"><span class="tag"><b>Post-Test Opens</b>${p.opens}</span><span class="tag"><b>Where</b>${p.where}</span><span class="tag"><b>Tries</b>${p.tries}</span><span class="tag"><b>Certificate</b>${p.cert}</span><span class="tag"><b>Build</b>${p.build}</span></div><h2>The Process</h2><ol class="flow">${p.flow.map(([w, t, c]) => `<li class="${c ? "new" : ""}"><small>${w}</small>${t}</li>`).join("")}</ol><div class="cols"><div><h2>Try It as the Trainee</h2>${device(p)}</div><div class="side">${staffBox(p)}<div class="two"><section class="panel"><h2>Good</h2><ul>${p.good.map((x) => `<li>${x}</li>`).join("")}</ul></section><section class="panel"><h2>Watch Out</h2><ul>${p.watch.map((x) => `<li>${x}</li>`).join("")}</ul></section></div></div></div>`;
}
function todayPage(p) {
  const tone = { Live: "g", "Outside the Portal": "b", "Waiting for You": "o", Gap: "r" };
  return `<h1>Our In-House Process Today</h1><p class="sub">What the portal does now, step by step. Try the post-test on the right; it looks like the real page.</p><div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,430px)"><section class="panel">${TODAY_STEPS.map(([t, d, st], i) => `<div class="st"><span>${i + 1}</span><div><b>${t}</b> <span class="chip ${tone[st]}">${st}</span><small>${d}</small></div></div>`).join("")}</section><div><h2>How the Post-Test Looks</h2>${device(p)}</div></div>`;
}
function comparePage() {
  return `<h1>Compare the Plans</h1><p class="sub">Orange marks the one I recommend. You can also combine them, for example Plan 3 now and Plan 5 later.</p><div class="wrap"><table><thead><tr><th>Plan</th><th>Post-Test Opens</th><th>Where</th><th>Tries</th><th>Certificate</th><th>Staff Work</th><th>Build</th></tr></thead><tbody>${PLANS.map((p) => `<tr><td><button type="button" class="mini ${p.rec ? "p" : ""}" data-tab="${p.id}">${p.id}</button> <b>${p.name}</b></td><td>${p.opens}</td><td>${p.where}</td><td>${p.tries}</td><td>${p.cert}</td><td>${p.staff}</td><td>${p.build}</td></tr>`).join("")}</tbody></table></div><div class="two" style="margin-top:14px"><section class="panel"><h2>Can Be Added to Any Plan</h2><ul><li>The trainee uploads the 2x2 photo; the Releasing Officer checks it</li><li>Full payment required before the post-test opens</li><li>The right answers shown after passing</li><li>Passing mark other than 70%, set per course</li></ul></section><section class="panel"><h2>Needed in Every Plan</h2><ul><li>The Admin approves each course's questions; 0 of 151 are approved today</li><li>Each course needs its Google Classroom linked</li><li>A way to get the 2x2 photo from online trainees</li></ul></section></div>`;
}
let toastT;
function toast(t) { const e = document.getElementById("toast"); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { e.hidden = true; }, 3000); }
function render() {
  document.getElementById("tabs").innerHTML = `<b>In-House Course Plans</b><button type="button" class="${S.tab === "today" ? "on" : ""}" data-tab="today">Today</button>${PLANS.map((p) => `<button type="button" class="${S.tab === p.id ? "on" : ""} ${p.rec ? "rec" : ""}" data-tab="${p.id}">${p.id} · ${p.name}</button>`).join("")}<button type="button" class="${S.tab === "compare" ? "on" : ""}" data-tab="compare">Compare</button>`;
  document.getElementById("app").innerHTML = S.tab === "today" ? todayPage(S.plan) : S.tab === "compare" ? comparePage() : planPage(S.plan);
}
const submitTest = (p) => { const score = correct(D.picks); D.tries += 1; D.result = { score, passed: score >= 7 }; if (D.result.passed) { D.passed = true; if (p.style === "combo") D.evalDone = true; } D.screen = "result"; };
const softCheck = (p) => { if (p.id === 7 && D.passed && D.evalDone && D.photo) D.soft = true; };
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button"); if (!t) return;
  const d = t.dataset, p = S.plan;
  if (d.tab) { S.tab = /^\d+$/.test(d.tab) ? Number(d.tab) : d.tab; if (typeof S.tab === "number") S.plan = PLANS[S.tab - 1]; else if (S.tab === "today") S.plan = PLANS[3]; D = fresh(S.plan); if (S.tab === "today") D.screen = "test"; render(); window.scrollTo({ top: 0 }); return; }
  if (d.restart) { D = fresh(p); if (S.tab === "today") D.screen = "test"; return render(); }
  if (d.go) { if (d.go === "test" && D.passed && p.after !== "status") { toast("You already passed this post-test."); return; } D.screen = d.go; return render(); }
  if (d.fill) { const want = Number(d.fill); D.picks = QS.map((q, i) => (i < want ? q[2] : (q[2] + 1) % 4)); D.q = 9; return render(); }
  if (d.qstep) { D.q = Math.max(0, Math.min(9, D.q + Number(d.qstep))); return render(); }
  if (d.submit) { submitTest(p); softCheck(p); return render(); }
  if (d.retake) { D.picks = Array(10).fill(null); D.q = 0; D.result = null; D.screen = "test"; return render(); }
  if (d.reopen) { D.tries = 0; D.picks = Array(10).fill(null); D.q = 0; D.result = null; D.screen = "test"; toast("Registration reopened the test."); return render(); }
  if (d.evalsubmit) { D.evalDone = true; softCheck(p); D.screen = p.after === "status" ? "status" : "done"; return render(); }
  if (d.markmod) { D.modDone = true; return render(); }
  if (d.photo) { D.photo = true; softCheck(p); toast("Photo saved."); return render(); }
  if (d.print) { D.printed = true; toast("Printed. Moved to To Release."); return render(); }
  if (d.release) { D.released = true; toast("Released to the trainee."); return render(); }
});
document.addEventListener("change", (ev) => {
  const e = ev.target;
  if (e.dataset.q !== undefined) { D.picks[Number(e.dataset.q)] = Number(e.dataset.k); render(); }
  if (e.dataset.mod) { D.modDone = e.checked; render(); }
});
setInterval(() => { const e = document.getElementById("rx-timer"); if (!e) return; D.secs = Math.max(0, D.secs - 1); e.textContent = `${String(Math.floor(D.secs / 60)).padStart(2, "0")}:${String(D.secs % 60).padStart(2, "0")}`; }, 1000);
D.screen = "test";
render();
</script>
