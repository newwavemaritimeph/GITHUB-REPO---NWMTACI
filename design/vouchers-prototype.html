  const inMonth=V.filter(v=>!S.month||monthOf(v)===S.month);
  const filtered=inMonth.filter(v=>(S.status==="All"||(S.status==="Awaiting release"?v.status==="Approved":S.status==="Released"?v.status==="Released":v.reprint==="Pending"))&&(S.ch==="All"||v.ch===S.ch)&&(`${v.cv} ${v.payee} ${v.cat}`.toLowerCase().includes(S.q.toLowerCase())));
  const months=[...new Set(V.map(monthOf))].sort().reverse();
  const curM=S.month||months[0], cm=V.filter(v=>monthOf(v)===curM);
  const cnt=k=>inMonth.filter(v=>k==="All"||(k==="Awaiting release"?v.status==="Approved":k==="Released"?v.status==="Released":v.reprint==="Pending")).length;
  document.getElementById("app").innerHTML=`
  <div class="head"><div><span class="eyebrow">Accounting</span><h1>Expenses</h1></div>${S.role==="c"?'<button class="btn p">Record expense</button>':""}</div>
  <div class="sub"><button>Expenses</button><button class="on">Vouchers${pendingReprints.length?`<span>${pendingReprints.length}</span>`:""}</button></div>
  <div class="tiles">
    <div class="tile"><span>${mlabel(curM)}</span><b>${peso(cm.reduce((s,v)=>s+total(v),0))}</b><small>${cm.length} vouchers</small></div>
    <div class="tile" style="--c:#0a7a3e"><span>Released</span><b>${peso(cm.filter(v=>v.status==="Released").reduce((s,v)=>s+total(v),0))}</b><small>${cm.filter(v=>v.status==="Released").length} paid out</small></div>
    <div class="tile" style="--c:#F25615"><span>Awaiting release</span><b>${peso(cm.filter(v=>v.status==="Approved").reduce((s,v)=>s+total(v),0))}</b><small>${cm.filter(v=>v.status==="Approved").length} approved, not yet paid</small></div>
    <div class="tile" style="--c:#a2470b"><span>Reprint requests</span><b>${pendingReprints.length}</b><small>${S.role==="a"?"waiting for you":"waiting for the Accounting Manager"}</small></div>
  </div>
  ${S.role==="a"&&pendingReprints.length?`<section class="panel"><div class="ph"><h2>Reprint requests</h2><span class="count">${pendingReprints.length}</span></div><div class="tw"><table class="vt"><tbody>${pendingReprints.map(v=>`<tr><td data-l=""><span class="cv">${v.cv}</span><small>${v.payee}</small></td><td data-l="Reason">Original was damaged<small>Karen Mallari · Oct 8</small></td><td data-l=""><div class="acts"><button class="btn sm p" onclick="V.find(x=>x.cv==='${v.cv}').reprint='Approved';V.find(x=>x.cv==='${v.cv}').allowed++;toast('Reprint approved. It can be printed once more.')">Approve</button><button class="btn sm" onclick="V.find(x=>x.cv==='${v.cv}').reprint='Rejected';toast('Reprint request rejected.')">Reject</button></div></td></tr>`).join("")}</tbody></table></div></section>`:""}
  <div class="filters">
    <select aria-label="Month" onchange="S.month=this.value;render()"><option value="">All months</option>${months.map(m=>`<option value="${m}" ${S.month===m?"selected":""}>${mlabel(m)}</option>`).join("")}</select>
    <div class="chips">${["All","Awaiting release","Released","Reprint requests"].map(k=>`<button class="${S.status===k?"on":""}" onclick="S.status='${k}';render()">${k}<small>${cnt(k)}</small></button>`).join("")}</div>
    <select aria-label="Channel" onchange="S.ch=this.value;render()">${["All","Cash","GCash","PSBank","UnionBank"].map(c=>`<option ${S.ch===c?"selected":""} value="${c}">${c==="All"?"All channels":c}</option>`).join("")}</select>
    <input placeholder="Search voucher no., payee or category" value="${S.q}" oninput="S.q=this.value;render();const i=document.querySelector('.filters input');i.focus();i.setSelectionRange(i.value.length,i.value.length)">
  </div>
  ${months.filter(m=>!S.month||m===S.month).map(m=>{const rows=filtered.filter(v=>monthOf(v)===m);if(!rows.length)return "";const isOpen=S.open[m]??!!S.month;return `<section class="panel month">
    <button class="mhead" aria-expanded="${isOpen}" onclick="S.open['${m}']=!${isOpen};render()"><h2>${mlabel(m)}</h2><span class="meta">${rows.length} voucher${rows.length===1?"":"s"}</span><b>${peso(rows.reduce((s,v)=>s+total(v),0))}</b><span class="pdf" onclick="event.stopPropagation();toast('Monthly voucher summary (PDF) opened.')">Summary PDF</span><span aria-hidden="true">${isOpen?"▾":"▸"}</span></button>
    ${isOpen?`<div class="tw"><table class="vt"><thead><tr><th>Voucher</th><th>Payee</th><th>Channel</th><th class="r">Amount</th><th>Status</th><th>Printing</th><th></th></tr></thead><tbody>${rows.map(v=>{const p=printState(v);return `<tr class="row" onclick="S.sel='${v.cv}';render()">
      <td data-l=""><span class="cv">${v.cv}</span><small>${fmt(v.date)}</small></td>
      <td data-l="Payee"><b>${v.payee}</b><small>${v.cat}</small></td>
      <td data-l="Channel">${v.ch}${v.ref?`<small class="mono">${v.ref}</small>`:""}</td>
      <td data-l="Amount" class="r"><b class="mono">${peso(total(v))}</b></td>
      <td data-l="Status"><span class="chip ${v.status==="Released"?"c-good":"c-info"}">${v.status==="Released"?"Released":"Awaiting release"}</span></td>
      <td data-l="Printing"><span class="print ${p.k}">${p.k==="ok"?"✓ ":p.k==="wait"?"⏳ ":""}${p.t}</span></td>
      <td data-l="">${act(v)}</td></tr>`}).join("")}</tbody></table></div>`:""}
  </section>`}).join("")||'<section class="panel"><p class="empty">No vouchers match.</p></section>'}`;
  const v=S.sel&&V.find(x=>x.cv===S.sel);
  document.getElementById("layer").innerHTML=(v?drawer(v):"")+(S.reprintFor?reprintModal():"")+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:"");
}
function drawer(v){const t=total(v),p=printState(v);
  const steps=[["Recorded",`${v.er} · ${v.by}`,true],["Approved",`${v.appr} · ${v.apprAt}`,true],["Printed",v.prints?`${v.prints} print${v.prints>1?"s":""}${v.reprint==="Pending"?" · reprint requested":""}`:"Not yet",v.prints>0],["Released",v.relAt?`${v.ch}${v.ref?" · "+v.ref:""} · ${v.relAt}`:"Waiting for the Cashier",!!v.relAt]];
  return `<div class="drawer" onclick="if(event.target===this){S.sel=null;render()}"><aside class="dpanel" role="dialog" aria-label="Voucher ${v.cv}">
    <div class="dh"><div><span class="eyebrow">Expense voucher</span><h3>${v.cv}</h3><span class="chip ${v.status==="Released"?"c-good":"c-info"}">${v.status==="Released"?"Released":"Awaiting release"}</span></div><button class="x" onclick="S.sel=null;render()" aria-label="Close">×</button></div>
    <div class="db">
      <div class="kv"><div><span>Payee</span><b>${v.payee}</b></div><div><span>Category</span><b>${v.cat}</b></div><div><span>Date issued</span><b>${fmt(v.date)}</b></div><div><span>Request no.</span><b class="mono">${v.er}</b></div><div><span>Mode of payment</span><b>${v.ch}</b></div><div><span>Supporting document</span><b>${v.doc}</b></div></div>
      <div><div class="lines"><table><thead><tr><th>Particulars</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead><tbody>${v.lines.map(l=>`<tr><td>${l[0]}</td><td class="r mono">${l[1]}</td><td class="r mono">${peso(l[1]*l[2])}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="2">Total</td><td class="r mono">${peso(t)}</td></tr></tfoot></table></div><div class="words">${words(t)}</div></div>
      <div><span class="eyebrow">History</span><ol class="tl">${steps.map(s=>`<li class="${s[2]?"":"todo"}"><i>${s[2]?"✓":""}</i><div><b>${s[0]}</b><small>${s[1]}</small></div></li>`).join("")}</ol></div>
    </div>
    <div class="df"><button class="btn" onclick="toast('File copy opened (marked “File copy – not for release”).')">View file copy</button>${v.drive?'<button class="btn" onclick="toast(\'Opening the voucher in Google Drive.\')">Open in Drive</button>':""}${v.status==="Approved"&&S.role==="c"?`<button class="btn p" onclick="release('${v.cv}')">Mark released</button>`:""}${v.prints<v.allowed?`<button class="btn p" onclick="doPrint('${v.cv}')">${v.prints?"Print reprint":"Print voucher"}</button>`:v.reprint==="Pending"?`<span class="print wait">⏳ Reprint awaiting approval</span>`:`<button class="btn" onclick="S.reprintFor='${v.cv}';S.reason='';render()">Request reprint</button>`}</div>
  </aside></div>`}
function reprintModal(){return `<div class="ovl"><div class="modal" role="dialog" aria-label="Request reprint"><div class="mh"><h3>Request reprint · ${S.reprintFor}</h3><button class="x" onclick="S.reprintFor=null;render()" aria-label="Close">×</button></div>
  <div class="mb"><label class="full">Reason for reprinting<input value="${S.reason}" oninput="S.reason=this.value" placeholder="e.g. Original was damaged"></label><p class="meta full">The voucher prints once. The Accounting Manager approves each extra print, which is marked “Reprint”.</p></div>
  <div class="mf"><button class="btn" onclick="S.reprintFor=null;render()">Cancel</button><button class="btn p" onclick="if(S.reason.trim().length<3){toast('Enter a reason.');return}V.find(x=>x.cv===S.reprintFor).reprint='Pending';S.reprintFor=null;toast('Sent to the Accounting Manager.')">Send to Accounting</button></div></div></div>`}
render();
</script>
