<title>Training Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* One look: the staff portal is light only. Layout: the portal's navy bar, three tabs (the page, the Batch window, To Confirm), then each at its portal size. */
:root { color-scheme: light; --ink: #0f2638; --mute: #587184; --line: #d6e9f1; --soft: #eef4f8; --head: #e3f4fb; --navy: #123F63; --blue: #0571D0; --orange: #F25615; --good: #0a7a3e; --goodbg: #e3f5ea; --warn: #a4530c; --warnbg: #fdeee0; --bad: #b42318; --badbg: #fbe9e7; --info: #e2f0fc; --ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --num: "Geist Mono", ui-monospace, Consolas, monospace; }
html, body { background: #f2f9fc; color: var(--ink); margin: 0; font: 14px/1.45 var(--ui); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#bar { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 10px; padding-block: 8px; }
#bar img { width: 30px; height: 30px; }
#bar b { font-weight: 600; }
#bar span { margin-left: auto; color: #cfe6f2; font-size: 13px; }
#pick { background: #fff; border-bottom: 2px solid var(--navy); padding-block: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: 600 13px var(--ui); height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--navy); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
#app { padding-block: 16px 40px; display: flex; flex-direction: column; gap: 14px; max-width: 1100px; margin-inline: auto; box-sizing: border-box; width: 100%; }
.eyebrow { color: var(--blue); font: 600 12px var(--ui); letter-spacing: .08em; text-transform: uppercase; }
h1 { margin: 2px 0 0; font: 700 24px/1.2 var(--ui); }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.panel > header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 10px; padding: 12px 16px; }
.panel h2 { margin: 0; font: 600 16px/1.25 var(--ui); }
.count { display: inline-block; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--navy); font: 600 12.5px var(--num); text-align: center; }
.alert { border-color: #f3c7c1; }
.alert > header h2 { color: var(--bad); }
.strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.strip > div { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.strip b { display: block; }
.strip small { color: var(--mute); font-size: 12.5px; }
.strip .hot { border-color: #f1c9a6; background: #fffaf5; }
.ctabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.ctab { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 9px 12px; cursor: pointer; font: inherit; color: var(--ink); min-width: 0; }
.ctab b { display: block; font: 700 14px var(--ui); }
.ctab small { color: var(--mute); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctab .todo { margin-top: 4px; display: inline-block; font: 600 12px var(--ui); color: var(--warn); }
.ctab .todo.none { color: var(--good); }
.ctab[aria-selected="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); background: #f4f9fc; }
.row { display: grid; align-items: center; gap: 6px 12px; padding: 9px 16px; border-top: 1px solid var(--line); }
.row.b { grid-template-columns: 130px minmax(0, 1.1fr) 80px 120px 110px minmax(0, 1.5fr); }
.row.head2 { background: var(--head); color: var(--navy); font: 600 12px var(--ui); letter-spacing: .05em; text-transform: uppercase; padding-block: 7px; }
.row.group { background: #f7fbfd; color: var(--navy); font: 700 12.5px var(--ui); letter-spacing: .04em; text-transform: uppercase; padding-block: 6px; }
.c { min-width: 0; }
.c small { display: block; color: var(--mute); font-size: 12.5px; }
.m { font-family: var(--num); font-variant-numeric: tabular-nums; }
.lbl { display: none; color: var(--mute); font: 600 11.5px var(--ui); letter-spacing: .05em; text-transform: uppercase; }
.link { background: none; border: 0; padding: 0; color: var(--blue); font: 600 14px var(--num); text-decoration: underline; cursor: pointer; }
.b2 { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--blue); font: 600 13px var(--ui); cursor: pointer; white-space: nowrap; text-decoration: none; }
.b2.p { background: var(--orange); border-color: var(--orange); color: #fff; }
.b2.s { height: 28px; padding: 0 9px; font-size: 12.5px; }
.b2[disabled] { background: #eef2f5; border-color: #dbe3e9; color: #8496a3; cursor: not-allowed; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font: 600 12px var(--ui); white-space: nowrap; }
.chip.g { background: var(--goodbg); color: var(--good); }
.chip.o { background: var(--warnbg); color: var(--warn); }
.chip.r { background: var(--badbg); color: var(--bad); }
.chip.bl { background: var(--info); color: var(--blue); }
.chip.n { background: var(--soft); color: var(--mute); }
.empty { padding: 14px 16px; color: var(--mute); border-top: 1px solid var(--line); margin: 0; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
/* The Batch window, as the portal's. */
.modal { background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px #0f263822; overflow: hidden; }
.modal > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.modal > header h2 { margin: 0; font: 700 19px var(--ui); color: var(--navy); }
.mb { padding: 16px 20px 18px; display: grid; gap: 12px; }
.bhead { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.bhead > div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.bhead span { display: block; color: var(--mute); font: 600 11.5px var(--ui); letter-spacing: .05em; text-transform: uppercase; }
.bhead b { display: block; font: 600 15px var(--ui); margin-top: 2px; }
.bhead small { color: var(--mute); font-size: 12.5px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; justify-content: space-between; }
.tools label { display: grid; gap: 4px; font: 600 13px var(--ui); color: var(--navy); flex: 1 1 220px; max-width: 320px; }
.tools input { font: 500 14px var(--ui); height: 34px; border: 1px solid #b9dcec; border-radius: 8px; padding: 0 9px; }
.marina { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #f4f9fc; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
.marina > b { font: 600 13px var(--ui); color: var(--navy); margin-right: 4px; }
.marina small { color: var(--mute); font-size: 12.5px; }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 1060px; font-size: 14px; }
th { background: var(--head); color: var(--navy); font: 600 12px var(--ui); letter-spacing: .05em; text-transform: uppercase; text-align: left; padding: 8px 10px; white-space: nowrap; }
td { border-top: 1px solid var(--line); padding: 8px 10px; vertical-align: middle; }
td.mm { min-width: 200px; }
.tick { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; cursor: pointer; }
.tick input { width: 16px; height: 16px; }
.done { color: var(--good); font: 600 13px var(--ui); }
.add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-top: 6px; }
.add input { font: 500 13px var(--ui); height: 30px; border: 1px solid #b9dcec; border-radius: 7px; padding: 0 7px; min-width: 0; }
.note { color: var(--mute); font-size: 13px; margin: 0; }
.confirm { padding: 4px 16px 16px; }
.confirm h3 { margin: 12px 0 6px; font: 600 14px var(--ui); color: var(--navy); }
.confirm ol { margin: 0; padding-left: 20px; display: grid; gap: 7px; max-width: 78ch; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 50; max-width: calc(100% - 32px); box-sizing: border-box; }
@media (max-width: 760px) {
  .strip, .bhead { grid-template-columns: 1fr; }
  .ctabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row.b { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding-block: 11px; }
  .row.head2 { display: none; }
  .row .wide { grid-column: 1 / -1; }
  .lbl { display: block; }
}
</style>

  { id: 8, code: "PSCMHBT", no: "26-508-023", start: "2026-11-12", end: "2026-11-14", room: null, instr: null, t: [
    T("PASCUAL, ROSE E.", "0000028", "8512250152", "1996-03-30", "Purser", "company", { enc: "Nov 9" }),
    T("BAUTISTA, LEO G.", "0000029", "8512250167", "1992-11-11", "Cadet", "owe"),
  ] },
];
const S = { tab: 0, course: "UBT-PSSR", batch: 1, q: "", adding: null, add: { srn: "", birth: "" }, voidDone: false };
const app = document.getElementById("app"), tabs = document.getElementById("tabs"), toastEl = document.getElementById("toast");
let timer;
const toast = (t) => { toastEl.textContent = t; toastEl.hidden = false; clearTimeout(timer); timer = setTimeout(() => { toastEl.hidden = true; }, 3200); };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
const fmt = (d) => new Date(`${d}T00:00:00+08:00`).toLocaleDateString("en-PH", { month: "short", day: "numeric", timeZone: "Asia/Manila" });
const dates = (a, b) => (a === b ? fmt(a) : `${fmt(a)}–${Number(b.slice(8))}`);
const listed = (t) => t.pay !== "owe";
const missing = (t) => [!t.srn && "SRN", !t.birth && "Birth Date"].filter(Boolean);
const state = (t) => (!listed(t) ? "Not Paid" : t.enc ? "Encoded" : missing(t).length ? "Missing Details" : "To Encode");
const when = (b) => (b.end < TODAY ? "Past" : b.start > TODAY ? "Upcoming" : "Today");
const stats = (b) => ({ paid: b.t.filter(listed).length, total: b.t.length, enc: b.t.filter((t) => t.enc).length, todo: b.t.filter((t) => state(t) === "To Encode").length, miss: b.t.filter((t) => state(t) === "Missing Details").length });
const todoOf = (code) => BATCHES.filter((b) => b.code === code).reduce((n, b) => n + stats(b).todo + stats(b).miss, 0);
const finalCell = (b) => {
  const s = stats(b), cut = b.start;
  if (when(b) === "Upcoming") return `<span class="chip n">4:00 PM · ${fmt(cut)}</span>`;
  if (when(b) === "Today") return `<span class="chip o">Not Yet · 4:00 PM Today</span>`;
  return `<span class="acts"><button type="button" class="b2 s" data-act="toast" data-id="Opens the MARINA Final List PDF for ${b.no}.">Final List PDF</button><button type="button" class="b2 s" data-act="toast" data-id="Downloads the CSV for MARINA for ${b.no}.">CSV</button><span class="chip ${s.enc === s.paid ? "g" : "o"}">${s.enc} of ${s.paid} Encoded</span></span>`;
};

function reports() {
  const list = BATCHES.filter((b) => b.code === S.course);
  const groups = [["Today", list.filter((b) => when(b) === "Today")], ["Upcoming", list.filter((b) => when(b) === "Upcoming").sort((a, z) => a.start.localeCompare(z.start))], ["Past · Work Left", list.filter((b) => when(b) === "Past" && (stats(b).todo || stats(b).miss || stats(b).enc < stats(b).paid))]];
  const today = BATCHES.filter((b) => when(b) === "Today"), unpaid = today.flatMap((b) => b.t).filter((t) => !listed(t)).length;
  const rows = groups.filter(([, g]) => g.length).map(([label, g]) => `<div class="row group">${label} · ${g.length}</div>` + g.map((b) => { const s = stats(b); return `<div class="row b">
      <div class="c"><span class="lbl">Batch No.</span><button type="button" class="link" data-act="open" data-id="${b.id}">${b.no}</button></div>
      <div class="c"><span class="lbl">Class Dates</span><b>${dates(b.start, b.end)}</b><small>${esc(b.room ?? "No room")} · ${esc(b.instr ?? "No instructor")}</small></div>
      <div class="c"><span class="lbl">Paid</span><span class="m">${s.paid} of ${s.total}</span></div>
      <div class="c"><span class="lbl">Encoded</span><span class="chip ${s.paid && s.enc === s.paid ? "g" : s.todo ? "o" : "n"}">${s.enc} of ${s.paid}</span></div>
      <div class="c"><span class="lbl">Missing Details</span>${s.miss ? `<span class="chip r">${s.miss}</span>` : '<span class="m">0</span>'}</div>
      <div class="c wide"><span class="lbl">Final List</span>${finalCell(b)}</div>
    </div>`; }).join("")).join("");
  return `<div><div class="eyebrow">MISMO Compliance Officer</div><h1>Training Reports</h1></div>
    ${S.voidDone ? "" : `<section class="panel alert"><header><h2>Payment Voided · Correct in MARINA</h2><span class="count">1</span></header>
      <div class="row" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.4fr) auto"><div class="c"><b>CRUZ, ALLAN V.</b><small class="m">8512250175</small></div><div class="c"><b>UBT-PSSR</b><small class="m">26-609-143</small></div><div class="c">Wrong amount encoded</div><button type="button" class="b2 p" data-act="void">Corrected in MARINA</button></div></section>`}
    <div class="strip"><div class="hot"><span><b>11:00 AM · Unpaid: ${unpaid}</b><small>Names only on the instructor's printout.</small></span><span class="chip n">Opens at 11:00 AM</span></div>
      <div><span><b>4:00 PM · Final List</b><small>Made at 4:00 PM for today's classes.</small></span><span class="chip n">Not Yet</span></div></div>
    <div class="ctabs" role="tablist" aria-label="Courses">${COURSES.map((c) => { const n = todoOf(c.code); return `<button type="button" role="tab" class="ctab" data-act="course" data-id="${c.code}" aria-selected="${S.course === c.code}"><b>${c.code}</b><small>${esc(c.name)}</small><span class="todo${n ? "" : " none"}">${n ? `${n} To Encode` : "All Encoded"}</span></button>`; }).join("")}</div>
    <section class="panel"><header><h2>${S.course} Batches</h2><span class="count">${list.length}</span></header>
      <div class="row b head2"><div>Batch No.</div><div>Class Dates</div><div>Paid</div><div>Encoded</div><div>Missing Details</div><div>Final List</div></div>
      ${rows || '<p class="empty">No batches for this course in the last 6 months or the next 6 months.</p>'}
    </section>`;
}

function mmCell(b, t, i) {
  const st = state(t), badges = `${t.late ? ' <span class="chip o">Paid Late</span>' : ""}${t.moved ? ` <span class="chip o" title="Encoded under ${t.moved}. Correct the entry in MARINA.">Moved · Was ${t.moved}</span>` : ""}`;
  if (st === "Not Paid") return `<span class="chip r">Not Paid</span>`;
  if (st === "Encoded") return `<span class="acts"><span class="done">Encoded · ${t.enc}</span><button type="button" class="b2 s" data-act="undo" data-id="${i}">Undo</button></span>${badges}`;
  if (st === "Missing Details") return S.adding === i ? `<span class="chip r">${missing(t).join(" · ")} Missing</span><div class="add">${!t.srn ? `<input id="add-srn" placeholder="SRN" inputmode="numeric" value="${esc(S.add.srn)}" aria-label="SRN">` : '<span></span>'}${!t.birth ? `<input id="add-birth" type="date" value="${esc(S.add.birth)}" aria-label="Birth Date">` : '<span></span>'}<button type="button" class="b2 s p" data-act="add-save" data-id="${i}">Save</button></div>`
    : `<span class="acts"><span class="chip r">${missing(t).join(" · ")} Missing</span><button type="button" class="b2 s p" data-act="add" data-id="${i}">Add Details</button></span>`;
  return `<span class="acts"><button type="button" class="b2 s" data-act="copy" data-id="${i}">Copy</button><label class="tick"><input type="checkbox" data-act="enc" data-id="${i}"> Encoded</label></span>${badges}`;
}

function windowTab() {
  const b = BATCHES.find((x) => x.id === S.batch), s = stats(b), w = when(b);
  const term = S.q.trim().toLowerCase();
  const rows = b.t.map((t, i) => ({ t, i })).filter(({ t }) => !term || `${t.name} ${t.no} ${t.srn ?? ""}`.toLowerCase().includes(term));
  const pay = (t) => (t.pay === "paid" ? '<span class="chip g">Paid</span>' : t.pay === "company" ? '<span class="chip bl">Company Charge</span>' : '<span class="chip o">Balance ₱1,450.00</span>');
  const enrolled = b.t.filter(listed).length;
  return `<div class="seg" role="group" aria-label="Sample batch">${BATCHES.map((x) => `<button type="button" data-act="open" data-id="${x.id}" aria-selected="${x.id === S.batch}">${x.no}</button>`).join("")}</div>
  <div class="modal" role="dialog" aria-label="Batch ${b.no}"><header><h2>Batch ${b.no}</h2><button type="button" class="b2" data-act="back" aria-label="Close">×</button></header><div class="mb">
    <div class="bhead"><div><span>Course</span><b>${b.code}</b><small>${esc(COURSES.find((c) => c.code === b.code).name)}</small></div>
      <div><span>Dates</span><b>${dates(b.start, b.end)}</b><small>08:00 – 17:00</small></div>
      <div><span>Room · Instructor</span><b>${esc(b.room ?? "To be assigned")}</b><small>${esc(b.instr ?? "No instructor yet")}</small></div>
      <div><span>Trainees</span><b>${enrolled} enrolled · ${b.t.length - enrolled} pending</b><small>${24 - b.t.length} slots left of 24</small></div></div>
    <div class="tools"><label>Find<input id="find" value="${esc(S.q)}" placeholder="Name, NWMTACI No., SRN, mobile"></label>
      <span class="acts"><button type="button" class="b2" data-act="toast" data-id="Copied ${b.t.length} names for Messenger or Viber.">Copy List</button><button type="button" class="b2" data-act="toast" data-id="Downloads the batch list as Excel.">Download Excel</button><button type="button" class="b2 p" data-act="toast" data-id="Opens the batch list PDF.">Print / Save PDF</button></span></div>
    <div class="marina"><b>For MARINA</b>
      ${w === "Past" ? `<button type="button" class="b2" data-act="toast" data-id="Opens the Final List PDF (settled by 4:00 PM, ${fmt(b.start)}).">Final List PDF</button><button type="button" class="b2" data-act="toast" data-id="Downloads the CSV for the MARINA MISMO Portal.">CSV for MARINA</button>` : `<button type="button" class="b2" disabled>Final List · 4:00 PM ${w === "Today" ? "Today" : fmt(b.start)}</button>`}
      ${w === "Today" ? `<button type="button" class="b2" disabled title="Opens at 11:00 AM">11:00 AM Unpaid</button>` : ""}
      <button type="button" class="b2" data-act="toast" data-id="Opens this batch's Completion Record.">Completion Record</button>
      <span class="chip ${s.paid && s.enc === s.paid ? "g" : "o"}">${s.enc} of ${s.paid} Encoded</span></div>
    <div class="tw"><table><thead><tr><th>#</th><th>Trainee</th><th>NWMTACI No.</th><th>SRN</th><th>Rank</th><th>Mobile</th><th>Source</th><th>Status</th><th>Payment</th><th>MARINA MISMO</th></tr></thead><tbody>
      ${rows.map(({ t, i }, k) => `<tr><td>${k + 1}</td><td><b>${esc(t.name)}</b></td><td class="m">NWMTACI-${t.no}</td><td class="m">${t.srn ?? "—"}</td><td>${esc(t.rank)}</td><td class="m">${t.mobile}</td><td>${t.source}</td><td>${listed(t) ? '<span class="chip g">Enrolled</span>' : '<span class="chip o">Pending</span>'}</td><td>${pay(t)}</td><td class="mm">${mmCell(b, t, i)}</td></tr>`).join("") || '<tr><td colspan="10" class="note">No trainee matches.</td></tr>'}
    </tbody></table></div>
    <p class="note">Cancelled enrollments are left out. Not Paid trainees appear only on the instructor's 11:00 AM printout.</p>
  </div></div>`;
}

const confirmTab = () => `<section class="panel"><header><h2>To Confirm</h2></header><div class="confirm"><ol>
    <li>The tab is renamed <b>Training Reports</b> and covers the 5 STCW courses: UBT-PSSR, Safety, Crowd, Crisis and CCMD.</li>
    <li>It is per course, then per batch: Today, Upcoming, and past batches with work left. The batch number opens the Batch window.</li>
    <li>Copy and the Encoded tick move into the Batch window, one row per trainee. The old tabs (For Encoding, For Completion, Encoded, Final List, Completion Records) go away; their work is in the batch rows and the window.</li>
    <li>The same column shows in Schedules' Batch window for the MISMO Compliance Officer and the Admin, on STCW batches only.</li>
    <li>The Payment Voided alert and the 11:00 AM and 4:00 PM strip stay at the top. The MARINA PDF keeps its title, and the role is still called MISMO Compliance Officer.</li>
  </ol></div></section>`;

function render() {
  tabs.innerHTML = TABS.map((t, i) => `<button type="button" role="tab" data-act="tab" data-id="${i}" aria-selected="${S.tab === i}">${t}</button>`).join("");
  const focus = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  app.innerHTML = S.tab === 0 ? reports() : S.tab === 1 ? windowTab() : confirmTab();
  const el = focus && document.getElementById(focus);
  if (el) { el.focus(); if (typeof pos === "number" && el.setSelectionRange) try { el.setSelectionRange(pos, pos); } catch { /* date field */ } }
}
const batchNow = () => BATCHES.find((x) => x.id === S.batch);
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "find") { S.q = t.value; return render(); }
  if (t.id === "add-srn") { S.add.srn = t.value; return; }
  if (t.id === "add-birth") { S.add.birth = t.value; return; }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset.act === "enc") { const tr = batchNow().t[Number(t.dataset.id)]; tr.enc = "Nov 9"; toast(`${tr.name} marked Encoded.`); render(); }
});
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.disabled || el.dataset.act === "enc") return;
  const { act, id } = el.dataset;
  if (act === "tab") { S.tab = Number(id); return render(); }
  if (act === "course") { S.course = id; return render(); }
  if (act === "open") { S.batch = Number(id); S.tab = 1; S.q = ""; S.adding = null; return render(); }
  if (act === "back") { S.tab = 0; return render(); }
  if (act === "toast") return toast(id);
  if (act === "void") { S.voidDone = true; toast("Marked corrected in MARINA."); return render(); }
  const tr = batchNow().t[Number(id)];
  if (act === "copy") { toast(`Copied ${tr.name} for the MARINA MISMO System.`); el.textContent = "Copied"; return; }
  if (act === "undo") { tr.enc = null; toast(`Undone. ${tr.name} is back to Copy and Encoded.`); return render(); }
  if (act === "add") { S.adding = Number(id); S.add = { srn: "", birth: "" }; return render(); }
  if (act === "add-save") {
    if (!tr.srn && !S.add.srn.trim()) return toast("Enter the SRN.");
    if (!tr.birth && !S.add.birth) return toast("Enter the birth date.");
    if (!tr.srn) tr.srn = S.add.srn.trim(); if (!tr.birth) tr.birth = S.add.birth;
    S.adding = null; toast(`Saved. ${tr.name} is ready to Copy and Encode.`); return render();
  }
});
render();
</script>
