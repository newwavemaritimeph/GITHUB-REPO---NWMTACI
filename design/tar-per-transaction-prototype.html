<title>Per-Transaction TAR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Same shell as the live portal: navy bar with dropdown tabs, summary rail on the left, light-cyan table headers. */
:root{--orange:#F25615;--blue:#0571D0;--cyan:#35CCFA;--cyan-l:#9EE3F1;--navy:#123F63;--bg:#f2f6f8;--surface:#fff;--fg:#0f2638;--muted:#587184;--line:#dbe6ec;--soft:#eef4f8;--th:#e6f6fd;--thc:#0b4f8f;--zebra:#f7fafc;
 --good:#0a7a3e;--good-bg:#e2f5e9;--warn:#a2470b;--warn-bg:#fdf0e5;--bad:#b42318;--bad-bg:#fcebea;--info:#0571D0;--info-bg:#e5f1fb;
 --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1722;--surface:#102231;--fg:#e3edf4;--muted:#91a9bb;--line:#20384b;--soft:#152d43;--th:#15344b;--thc:#9fd3f7;--zebra:#12283a;--good:#61d396;--good-bg:#113523;--warn:#ffa56a;--warn-bg:#382313;--bad:#ff8b80;--bad-bg:#3b1918;--info:#5fb4ff;--info-bg:#122e48;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1722;--surface:#102231;--fg:#e3edf4;--muted:#91a9bb;--line:#20384b;--soft:#152d43;--th:#15344b;--thc:#9fd3f7;--zebra:#12283a;--good:#61d396;--good-bg:#113523;--warn:#ffa56a;--warn-bg:#382313;--bad:#ff8b80;--bad-bg:#3b1918;--info:#5fb4ff;--info-bg:#122e48;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.mono,.amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{background:var(--navy);color:#fff;padding-block:16px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{display:flex;align-items:center;gap:12px}.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font:700 15px var(--sans)}.logo b{font-size:19px;font-weight:600}.logo b span{color:var(--orange)}.logo small{display:block;color:var(--cyan-l);font-size:14px}.proto{background:var(--orange);font:600 11px var(--sans);letter-spacing:.08em;padding:2px 8px;border-radius:5px;margin-left:8px}
.who{font-size:14px;color:#cfe3ef;display:flex;align-items:center;gap:8px}.who select{background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:8px;padding:5px 8px}.who select option{color:#0f2638}
.tabs{display:flex;gap:2px;margin-top:16px;flex-wrap:wrap}.tab>button{background:none;border:0;color:#c3dbea;font:500 16px var(--sans);padding:12px 18px;border-radius:10px 10px 0 0;white-space:nowrap;display:flex;align-items:center;gap:8px}.tab>button:hover{color:#fff;background:#ffffff12}.tab.on>button{background:var(--bg);color:var(--fg);font-weight:600}
.caret{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-3px) rotate(45deg)}
.menu{position:absolute;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #0003;padding:6px;z-index:15;display:flex;flex-direction:column;margin-top:2px}.tab{position:relative}.menu button{background:none;border:0;text-align:left;color:var(--fg);font:500 15.5px var(--sans);padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;gap:12px}.menu button:hover{background:var(--soft)}.menu button.on{background:var(--info-bg);color:var(--info);font-weight:600}.menu small,.n{font:600 11.5px var(--mono);background:var(--orange);color:#fff;border-radius:10px;padding:1px 7px}
.page{padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}.eyebrow{display:block;font:600 13px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}h1{font-size:25px;font-weight:600;margin:0}h2{font-size:19px;font-weight:600;margin:0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:16px}.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:14.5px}.seg button.on{background:var(--navy);color:#fff}
.rail{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}@media (max-width:900px){.rail{grid-template-columns:1fr}}.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.ph{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.ph small{color:var(--muted);font-size:14px}
.lines{display:flex;flex-direction:column;padding:0 20px 16px}.lines div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.lines div:first-child{border-top:0}.lines dd,.lines span:last-child{font-family:var(--mono);font-weight:600}.lines .tot{font-weight:700}.lines .bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 16px}.tile{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px}.tile span{display:block;font-size:13px;color:var(--muted)}.tile b{font:600 19px var(--mono)}
.cwrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14.5px}th{background:var(--th);color:var(--thc);font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:10px 12px;border-right:1px solid var(--line);white-space:nowrap}td{padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.35}tbody tr:nth-child(even) td{background:var(--zebra)}td small{display:block;color:var(--muted);font-size:12.5px}.r{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}.due{background:var(--bad-bg);color:var(--bad)}.dueo{background:var(--warn-bg);color:var(--warn)}.appr{background:var(--info-bg);color:var(--info)}.paid{background:var(--good-bg);color:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--blue);border-radius:9px;padding:7px 14px;font-weight:600;font-size:14.5px;white-space:nowrap}.pri{background:var(--orange);color:#fff;border:0}.okb{background:var(--good);color:#fff;border:0}.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:14px 20px;background:var(--soft);border-top:1px solid var(--line)}.form label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}.form select,.form input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);color:var(--fg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
.alert{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:500;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.note{font-size:13.5px;color:var(--muted);padding:0 20px 16px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
</style>
<style>
.top{background:linear-gradient(100deg,#0571D0 0%,#2aa6ec 60%,#35CCFA 100%);box-shadow:0 2px 0 #9EE3F1}
.tab>button{color:#eaf7fd}.tab>button:hover{background:#ffffff26;color:#fff}.tab.on>button{background:var(--bg);color:#0571D0;box-shadow:inset 0 3px 0 #F25615}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:16px 20px;align-items:center}.hero b{font-size:19px;display:block}.hero small{color:var(--muted);font:500 14px var(--mono)}
.tx{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.txh{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}.txh h3{margin:0;font-size:17px}.txh small{color:var(--muted);font-size:14px;display:block;font-weight:400}
.docs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.dchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--soft);font-size:14px}.dchip b{font-family:var(--mono);font-size:13.5px}.dchip.no{color:var(--muted);background:none;border-style:dashed}
.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}.sheet{background:#fff;color:#0f2638;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13.5px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sh-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;border-bottom:2px solid #123F63;padding-bottom:6px}.sh-top b{color:#123F63;letter-spacing:.04em}.sh-top span{color:#587184;font-size:12px}.sh-top em{margin-left:auto;font-style:normal;font-size:12px;color:#587184}.sh-top em b{color:#b23d0c;font-family:var(--mono)}
.sh-kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}.sh-kv span{color:#587184}.sh-sub{font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#0571D0}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}.sheet th{background:#e6f6fd;color:#0b4f8f;text-align:left;padding:5px 8px;font-weight:600}.sheet td{background:#fff!important;color:#0f2638;padding:5px 8px;border-top:1px solid #dbe6ec}.sheet .r{text-align:right;font-family:var(--mono)}
.sh-sig{display:flex;justify-content:space-between;gap:16px;margin-top:6px}.sh-sig span{flex:1;border-top:1px solid #0f2638;padding-top:4px;text-align:center;font-size:12px;color:#587184}
.pair{display:flex;flex-direction:column;gap:8px;min-width:0}.pair>h3{margin:0;font-size:16px}
.pay{padding:0 20px 18px;display:flex;flex-direction:column;gap:12px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-weight:600;font-size:14px}.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.txrow td{background:var(--th)!important;color:var(--thc);font-weight:600;font-size:13.5px}
.foot2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}.ref{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--surface);max-width:220px;width:100%}
.say{background:var(--info-bg);color:var(--info);border-radius:10px;padding:9px 12px;font-size:14.5px;font-weight:500}
.okbox{background:var(--good-bg);color:var(--good);border-radius:10px;padding:10px 12px;font-size:14.5px}.okbox b{font-family:var(--mono)}
</style>
<header class="top"><div class="w">
  <div class="brand"><div class="logo"><div class="mark">NW</div><div><b>New Wave <span>Portal</span><span class="proto">PROTOTYPE</span></b><small>Ride the New Wave of Maritime Excellence</small></div></div><div class="who">Working as <select aria-label="Working as"><option>Registration</option></select></div></div>
  <nav class="tabs"><div class="tab"><button type="button">Dashboard</button></div><div class="tab"><button type="button">Courses</button></div><div class="tab"><button type="button">Instructions</button></div><div class="tab on"><button type="button">Trainees and Enrollments</button></div></nav>
</div></header>
<main class="page"><div class="w stack">
  <div class="cx-head" style="margin:0"><div><span class="eyebrow">Trainee Account</span><h1>One TAR per Transaction</h1></div></div>
  <div class="seg" id="seg" role="tablist" style="margin:0"></div>
  <div id="say" class="say"></div>
  <section class="panel" id="account"></section>
  <section class="panel" id="payBox" hidden></section>
  <div id="sheets" class="stack"></div>
  <p class="note" style="padding:0">Sample trainee and amounts. TARs and receipts already issued keep their numbers.</p>
</div></main>
<script>
const COURSE={APA:{code:"APA",name:"Anti-Piracy Awareness",dates:"Nov 10, 2026",fee:105000},PSCMT:{code:"PSCMT",name:"Crowd Management",dates:"Nov 11–12, 2026",fee:130000},SSO:{code:"SSO",name:"Ship Security Officer",dates:"Nov 16–18, 2026",fee:480000}};
const SCEN={
  morning:{label:"Morning, Then Afternoon",say:"Enrolled in the morning, back in the afternoon: two TARs and two receipts.",tx:[{at:"Nov 4, 9:12 AM",c:["APA"],tar:"TAR-2026-000011",ar:"AR-2026-000124"},{at:"Nov 4, 2:40 PM",c:["PSCMT"],tar:"TAR-2026-000012",ar:"AR-2026-000125"}]},
  closed:{label:"Added Right After",say:"The first TAR and receipt are already generated, so a course added 5 minutes later is not combined.",tx:[{at:"Nov 4, 9:12 AM",c:["APA"],tar:"TAR-2026-000011",ar:"AR-2026-000124"},{at:"Nov 4, 9:17 AM",c:["PSCMT"],tar:null,ar:null}]},
  together:{label:"Paid Together",say:"Morning and afternoon courses paid in one Record Payment, with no TAR yet: they fall into one TAR and one receipt.",pay:true,tx:[{at:"Nov 4, 9:12 AM",c:["APA"],tar:null,ar:null},{at:"Nov 4, 2:40 PM",c:["PSCMT"],tar:null,ar:null}]},
  visit:{label:"Same Visit",say:"Three courses added within 30 minutes, before any TAR or receipt: one TAR and one receipt.",tx:[{at:"Nov 4, 9:12 AM",c:["APA","PSCMT","SSO"],tar:null,ar:"AR-2026-000124"}]},
};
const clone=o=>JSON.parse(JSON.stringify(o));
let key="morning",tx=clone(SCEN.morning.tx),paid=false,mode="GCash",nextTar=11,nextAr=124;
const $=id=>document.getElementById(id);
const peso=c=>"₱"+(c/100).toLocaleString("en-PH",{minimumFractionDigits:2});
const total=t=>t.c.reduce((s,k)=>s+COURSE[k].fee,0);
const num=(p,n)=>`${p}-2026-${String(n).padStart(6,"0")}`;
function reset(k){key=k;tx=clone(SCEN[k].tx);paid=false;mode="GCash";const used=tx.flatMap(t=>[t.tar,t.ar]).filter(Boolean);nextTar=11+used.filter(x=>x.startsWith("TAR")).length;nextAr=124+used.filter(x=>x.startsWith("AR")).length;render()}
function chip(label,val){return val?`<span class="dchip">${label} <b>${val}</b></span>`:`<span class="dchip no">${label} · Not Yet Generated</span>`}
function render(){
  const S=SCEN[key];
  $("seg").innerHTML=Object.entries(SCEN).map(([k,v])=>`<button type="button" role="tab" aria-selected="${k===key}" class="${k===key?"on":""}" data-s="${k}">${v.label}</button>`).join("");
  $("say").textContent=S.say;
  $("account").innerHTML=`<div class="hero"><div><b>DELA CRUZ, Juan P.</b><small>NWMTACI-0000041</small></div><span class="docs"><a class="btn" href="#" onclick="return false">Open Conversation</a><span class="pill paid">${tx.length} Transaction${tx.length>1?"s":""}</span></span></div>`+tx.map((t,i)=>`<div class="tx"><div class="txh"><h3>Transaction ${i+1}<small>${t.at}</small></h3><div class="docs">${chip("TAR",t.tar)}${chip("Receipt",t.ar)}</div></div>
    <div class="cwrap"><table><thead><tr><th>Course</th><th>Training Dates</th><th class="r">Fee</th></tr></thead><tbody>${t.c.map(k=>`<tr><td><b>${COURSE[k].code}</b> ${COURSE[k].name}</td><td>${COURSE[k].dates}</td><td class="r mono">${peso(COURSE[k].fee)}</td></tr>`).join("")}</tbody></table></div>
    <div class="docs"><button type="button" class="btn pri" data-tar="${i}">${t.tar?"Reprint Goes to Accounting":`Print TAR · ${t.at}`}</button></div></div>`).join("");
  document.querySelectorAll("[data-tar]").forEach(b=>{if(tx[+b.dataset.tar].tar)b.disabled=true});
  const box=$("payBox");box.hidden=!S.pay;
  if(S.pay)box.innerHTML=`<div class="ph"><h2>Record Payment</h2></div><div class="pay">${paid?`<div class="okbox">Recorded. ${tx.map((t,i)=>`<div><b>${t.ar}</b> · ${peso(total(t))} · Transaction ${i+1}</div>`).join("")}</div><div><button type="button" class="btn" id="again">Start Again</button></div>`:`
    <div class="cwrap"><table><thead><tr><th>Course</th><th class="r">Amount</th></tr></thead><tbody>${tx.map((t,i)=>`<tr class="txrow"><td colspan="2">Transaction ${i+1} · ${t.at}</td></tr>${t.c.map(k=>`<tr><td><b>${COURSE[k].code}</b> ${COURSE[k].name}</td><td class="r mono">${peso(COURSE[k].fee)}</td></tr>`).join("")}`).join("")}</tbody></table></div>
    <div class="chips" role="radiogroup" aria-label="Mode of payment">${["Cash","GCash","PSBank","UnionBank"].map(m=>`<button type="button" role="radio" aria-checked="${m===mode}" class="${m===mode?"on":""}" data-m="${m}">${m}</button>`).join("")}</div>
    ${mode==="Cash"?"":`<label>Reference No.<br><input class="ref" value="4021 553 190"></label>`}
    <div class="say">Paid together: one TAR and one receipt.</div>
    <div class="foot2"><span></span><button type="button" class="btn pri" id="rec">Record ${peso(tx.reduce((s,t)=>s+total(t),0))}</button></div>`}</div>`;
  $("sheets").innerHTML=tx.map((t,i)=>`<div class="pair"><h3>Transaction ${i+1} · ${t.at}</h3><div class="sheets">${tarSheet(t)}${arSheet(t)}</div></div>`).join("");
}
function tarSheet(t){const paidAmt=t.ar?total(t):0;return `<article class="sheet"><div class="sh-top"><b>TRAINING ADMISSION RECORD</b><span>admission slip</span><em>TAR NO. <b>${t.tar??"Assigned at Printing"}</b></em></div>
  <div class="sh-kv"><span>Name</span><b>DELA CRUZ, Juan P.</b><span>Enrollment No.</span><b>NWMTACI-0000041</b><span>Enrolled</span><b>${t.at}</b></div>
  <table><thead><tr><th>Course</th><th>Training Dates</th><th class="r">Fee</th></tr></thead><tbody>${t.c.map(k=>`<tr><td>${COURSE[k].name} (${k})</td><td>${COURSE[k].dates}</td><td class="r">${peso(COURSE[k].fee)}</td></tr>`).join("")}<tr><td colspan="2"><b>Total Amount Due</b></td><td class="r"><b>${peso(total(t))}</b></td></tr><tr><td colspan="2"><b>Balance</b></td><td class="r"><b>${peso(total(t)-paidAmt)}</b></td></tr></tbody></table>
  <div class="sh-sub">Receipts Issued</div><div>${t.ar?`<b class="mono">${t.ar}</b> · ${peso(total(t))} · Training Fee`:"No receipt issued yet."}</div>
  <div class="sh-sig"><span>Registration Officer</span><span>Trainee</span></div></article>`}
function arSheet(t){if(!t.ar)return `<article class="sheet"><div class="sh-top"><b>ACKNOWLEDGEMENT RECEIPT</b><span>payment received</span></div><div style="color:#587184">Generated when this transaction is paid.</div></article>`;return `<article class="sheet"><div class="sh-top"><b>ACKNOWLEDGEMENT RECEIPT</b><span>payment received</span><em>AR NO. <b>${t.ar}</b></em></div>
  <div class="sh-kv"><span>Received From</span><b>DELA CRUZ, Juan P.</b><span>Mode</span><b>${mode}${mode==="Cash"?"":" · 4021 553 190"}</b><span>Amount</span><b class="mono">${peso(total(t))}</b><span>For</span><b>Training Fee · ${t.c.join(", ")}</b></div>
  <div class="sh-sig"><span>Cashier</span><span>Received By</span></div></article>`}
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-s]");if(s){reset(s.dataset.s);return}
  const m=e.target.closest("[data-m]");if(m){mode=m.dataset.m;render();return}
  const p=e.target.closest("[data-tar]");if(p){const t=tx[+p.dataset.tar];if(!t.tar){t.tar=num("TAR",nextTar++);render()}return}
  if(e.target.id==="rec"){tx=[{at:tx[0].at,c:tx.flatMap(t=>t.c),tar:null,ar:num("AR",nextAr++)}];paid=true;render();return}
  if(e.target.id==="again")reset(key);
});
reset("morning");
</script>
