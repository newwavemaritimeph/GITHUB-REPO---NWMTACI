<title>Batch Schedules</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Same shell as the live portal: navy bar with dropdown tabs, summary rail on the left, light-cyan table headers. */
:root{--orange:#F25615;--blue:#0571D0;--cyan:#35CCFA;--cyan-l:#9EE3F1;--navy:#123F63;--bg:#f2f6f8;--surface:#fff;--fg:#0f2638;--muted:#587184;--line:#dbe6ec;--soft:#eef4f8;--th:#e6f6fd;--thc:#0b4f8f;--zebra:#f7fafc;
 --good:#0a7a3e;--good-bg:#e2f5e9;--warn:#a2470b;--warn-bg:#fdf0e5;--bad:#b42318;--bad-bg:#fcebea;--info:#0571D0;--info-bg:#e5f1fb;
 --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1722;--surface:#102231;--fg:#e3edf4;--muted:#91a9bb;--line:#20384b;--soft:#152d43;--th:#15344b;--thc:#9fd3f7;--zebra:#12283a;--good:#61d396;--good-bg:#113523;--warn:#ffa56a;--warn-bg:#382313;--bad:#ff8b80;--bad-bg:#3b1918;--info:#5fb4ff;--info-bg:#122e48;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1722;--surface:#102231;--fg:#e3edf4;--muted:#91a9bb;--line:#20384b;--soft:#152d43;--th:#15344b;--thc:#9fd3f7;--zebra:#12283a;--good:#61d396;--good-bg:#113523;--warn:#ffa56a;--warn-bg:#382313;--bad:#ff8b80;--bad-bg:#3b1918;--info:#5fb4ff;--info-bg:#122e48;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.mono,.amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{background:var(--navy);color:#fff;padding-block:16px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{display:flex;align-items:center;gap:12px}.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font:700 15px var(--sans)}.logo b{font-size:19px;font-weight:600}.logo b span{color:var(--orange)}.logo small{display:block;color:var(--cyan-l);font-size:14px}.proto{background:var(--orange);font:600 11px var(--sans);letter-spacing:.08em;padding:2px 8px;border-radius:5px;margin-left:8px}
.who{font-size:14px;color:#cfe3ef;display:flex;align-items:center;gap:8px}.who select{background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:8px;padding:5px 8px}.who select option{color:#0f2638}
.tabs{display:flex;gap:2px;margin-top:16px;flex-wrap:wrap}.tab>button{background:none;border:0;color:#c3dbea;font:500 16px var(--sans);padding:12px 18px;border-radius:10px 10px 0 0;white-space:nowrap;display:flex;align-items:center;gap:8px}.tab>button:hover{color:#fff;background:#ffffff12}.tab.on>button{background:var(--bg);color:var(--fg);font-weight:600}
.caret{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-3px) rotate(45deg)}
.menu{position:absolute;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #0003;padding:6px;z-index:15;display:flex;flex-direction:column;margin-top:2px}.tab{position:relative}.menu button{background:none;border:0;text-align:left;color:var(--fg);font:500 15.5px var(--sans);padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;gap:12px}.menu button:hover{background:var(--soft)}.menu button.on{background:var(--info-bg);color:var(--info);font-weight:600}.menu small,.n{font:600 11.5px var(--mono);background:var(--orange);color:#fff;border-radius:10px;padding:1px 7px}
.page{padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}.eyebrow{display:block;font:600 13px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}h1{font-size:25px;font-weight:600;margin:0}h2{font-size:19px;font-weight:600;margin:0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:16px}.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:14.5px}.seg button.on{background:var(--navy);color:#fff}
.rail{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}@media (max-width:900px){.rail{grid-template-columns:1fr}}.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.ph{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.ph small{color:var(--muted);font-size:14px}
.lines{display:flex;flex-direction:column;padding:0 20px 16px}.lines div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.lines div:first-child{border-top:0}.lines dd,.lines span:last-child{font-family:var(--mono);font-weight:600}.lines .tot{font-weight:700}.lines .bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 16px}.tile{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px}.tile span{display:block;font-size:13px;color:var(--muted)}.tile b{font:600 19px var(--mono)}
.cwrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14.5px}th{background:var(--th);color:var(--thc);font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:10px 12px;border-right:1px solid var(--line);white-space:nowrap}td{padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.35}tbody tr:nth-child(even) td{background:var(--zebra)}td small{display:block;color:var(--muted);font-size:12.5px}.r{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}.due{background:var(--bad-bg);color:var(--bad)}.dueo{background:var(--warn-bg);color:var(--warn)}.appr{background:var(--info-bg);color:var(--info)}.paid{background:var(--good-bg);color:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--blue);border-radius:9px;padding:7px 14px;font-weight:600;font-size:14.5px;white-space:nowrap}.pri{background:var(--orange);color:#fff;border:0}.okb{background:var(--good);color:#fff;border:0}.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:14px 20px;background:var(--soft);border-top:1px solid var(--line)}.form label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}.form select,.form input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);color:var(--fg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
.alert{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:500;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.note{font-size:13.5px;color:var(--muted);padding:0 20px 16px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
</style>
<style>
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--blue)}.bar.full i{background:var(--bad)}.bar.low i{background:var(--orange)}
.cert{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:18px 22px;display:grid;gap:6px;max-width:640px}
.cert .t{font:600 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cert .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
.cert b{font:600 16px var(--mono)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 20px 16px}
.cbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.cbox span{display:block;font-size:13px;color:var(--muted)}.cbox b{font:600 18px var(--mono)}.cbox small{color:var(--muted);font-size:12.5px}
.grp td{background:var(--soft)!important;font-weight:600}
.code{font:600 13px var(--mono);background:var(--info-bg);color:var(--info);border-radius:6px;padding:1px 7px}
.ro{color:var(--muted)}
</style>
<header class="top"><div class="w">
  <div class="brand"><div class="logo"><div class="mark">NW</div><div><b>New <span>Wave</span> Portal <span class="proto">PROTOTYPE</span></b><small>Batch Schedules with seats · automatic certificate numbers</small></div></div></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="page"><div class="w" id="view"></div></main>
<script>
const TODAY = "2026-11-03";
const IN_HOUSE = [["ABC", "Awareness on Basic Computer", 0], ["ESEA", "Enclosed Space Entry Awareness", 0], ["HAZMAT-CFR", "Hazardous Materials (US CFR) Awareness", 0], ["HPT", "Hydraulic Pressure Testing", 0], ["SDSD", "Security Training for Seafarers with Designated Security Duties", 0]];
const STCW = [["UBT-PSSR", "Updating Course on Basic Training - Personal Safety and Social Responsibilities (BT-PSSR)"], ["STPPDSPPS", "Safety Training for Personnel Providing Direct Service to Passengers in Passenger Spaces"], ["PSCMT", "Passenger Ship Crowd Management Training"], ["PSCMHBT", "Passenger Ship Crisis Management and Human Behaviour Training"], ["CCMD", "Crowd and Crisis Management - Domestic"]];
const fmt = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-PH", { month: "short", day: "numeric", weekday: "short", timeZone: "UTC" });
const add = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dow = (d) => new Date(d + "T00:00:00Z").getUTCDay();
// Sample upcoming batches (Nov 3 to Nov 30), seat counts fixed so the page reads the same each time.
const BATCHES = [];
const seats = [21, 18, 24, 9, 14, 6, 3, 12, 24, 17, 8, 5, 20, 11, 2, 15, 22, 7, 4, 13];
let k = 0, n609 = 139, n506 = 23, n507 = 23, n508 = 23, nB = 1;
for (let d = TODAY; d <= "2026-11-30"; d = add(d, 1)) {
  const w = dow(d); if (w === 0) continue;
  const push = (code, no, end) => { const held = seats[k++ % seats.length]; const pending = Math.min(held, [0, 1, 2, 3][k % 4]); BATCHES.push({ code, no, start: d, end, held, enrolled: held - pending, pending }); };
  push("UBT-PSSR", `26-609-${String(n609++).padStart(3, "0")}`, d);
  if (w === 1) push("STPPDSPPS", `26-506-${String(n506++).padStart(3, "0")}`, d);
  if (w === 2) push("PSCMT", `26-507-${String(n507++).padStart(3, "0")}`, add(d, 1));
  if (w === 4) push("PSCMHBT", `26-508-${String(n508++).padStart(3, "0")}`, add(d, 2));
  if (w === 1) push("CCMD", `BCH-2026-${String(nB++).padStart(4, "0")}`, add(d, 2));
}
// In-House batches in the same list (Batch Schedules = Class Schedules with seats, owner 3 Nov 2026).
const IH = [["HPT", "Hydraulic Pressure Testing", 2, [4, 18]], ["ABC", "Awareness on Basic Computer", 1, [6, 13, 20, 27]], ["ESEA", "Enclosed Space Entry Awareness", 1, [7, 21]]];
for (const [code, , days, dates] of IH) for (const day of dates) { const d = `2026-11-${String(day).padStart(2, "0")}`; const held = seats[k++ % seats.length]; const pending = Math.min(held, k % 3); BATCHES.push({ code, no: `BCH-2026-${String(nB++).padStart(4, "0")}`, start: d, end: add(d, days - 1), held, enrolled: held - pending, pending, ih: true }); }
const ROOMS = ["Room 101 · Capt. Reyes", "Room 102 · Engr. Santos", "Room 304 · Capt. Lim", "Not yet assigned"];
const S = { tab: "Batch Schedules", period: "Weekly", filter: "All" };
const TABS = ["Batch Schedules", "Registration Dashboard"];
const range = () => S.period === "Weekly" ? [TODAY, "2026-11-08"] : S.period === "Every 2 Weeks" ? [TODAY, "2026-11-15"] : [TODAY, "2026-11-30"];
const barCls = (left) => (left === 0 ? "full" : left <= 3 ? "low" : "");
const statusOf = (x) => (24 - x.held === 0 ? "Full" : "Open");
function batches() {
  const [a, b] = range();
  const inRange = BATCHES.filter((x) => x.start >= a && x.start <= b);
  const list = inRange.filter((x) => S.filter === "All" || statusOf(x) === S.filter);
  const tot = (r) => ({ batches: r.length, enrolled: r.reduce((s, x) => s + x.enrolled, 0), pending: r.reduce((s, x) => s + x.pending, 0), left: r.reduce((s, x) => s + 24 - x.held, 0) });
  const all = tot(list);
  const groups = [["STCW", STCW], ["In-House", IH.map(([c, n]) => [c, n])]];
  return `<div class="cx-head"><div><span class="eyebrow">Registration · Cashier · Admin · Admin Assistant</span><h1>Batch Schedules</h1></div><div style="display:flex;gap:8px"><button class="btn">Open Batches</button><button class="btn pri">Create Schedule</button></div></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><div class="seg">${["Weekly", "Every 2 Weeks", "Monthly"].map((p) => `<button class="${S.period === p ? "on" : ""}" data-p="${p}">${p}</button>`).join("")}</div>
  <div class="seg">${["All", "Open", "Full"].map((f) => `<button class="${S.filter === f ? "on" : ""}" data-f="${f}">${f} <small>${inRange.filter((x) => f === "All" || statusOf(x) === f).length}</small></button>`).join("")}</div></div>
  <div class="sum" style="padding:0 0 16px"><div class="cbox"><span>Batches</span><b>${all.batches}</b></div><div class="cbox"><span>Enrolled</span><b>${all.enrolled}</b></div><div class="cbox"><span>Pending (holding a seat)</span><b>${all.pending}</b></div><div class="cbox"><span>Slots Left</span><b>${all.left}</b></div></div>
  <section class="panel"><div class="cwrap"><table><thead><tr><th>Batch No.</th><th>Dates</th><th>Room · Instructor</th><th class="r">Enrolled</th><th class="r">Pending</th><th class="r">Slots Left</th><th>Seats</th><th>Status</th><th></th></tr></thead><tbody>
  ${groups.map(([g, courses]) => { const rowsG = list.filter((x) => courses.some(([c]) => c === x.code)); if (!rowsG.length) return ""; return `<tr class="grp"><td colspan="9" style="background:var(--th)!important;color:var(--thc)">${g} Courses</td></tr>` + courses.map(([c, name]) => { const r = rowsG.filter((x) => x.code === c); if (!r.length) return ""; const t = tot(r);
    return `<tr class="grp"><td colspan="9"><span class="code">${c}</span> ${name.length > 60 ? name.slice(0, 58) + "…" : name} · ${t.batches} batch${t.batches === 1 ? "" : "es"} · ${t.enrolled} enrolled · ${t.left} slots left</td></tr>` +
      r.map((x, i) => { const left = 24 - x.held; return `<tr><td class="mono">${x.no}</td><td>${fmt(x.start)}${x.end !== x.start ? " – " + fmt(x.end) : ""}</td><td>${ROOMS[(i + x.held) % ROOMS.length]}</td><td class="r amt">${x.enrolled}</td><td class="r amt">${x.pending}</td><td class="r amt"><b>${left}</b> / 24</td><td><div class="bar ${barCls(left)}"><i style="width:${(x.held / 24) * 100}%"></i></div></td><td>${left === 0 ? '<span class="pill due">Full</span>' : left <= 3 ? '<span class="pill dueo">Almost Full</span>' : '<span class="pill paid">Open</span>'}</td><td><div style="display:flex;gap:6px"><button class="btn">Edit</button><button class="btn">Cancel Batch</button></div></td></tr>`; }).join(""); }).join(""); }).join("")}
  </tbody></table></div><p class="note" style="padding-top:12px">Edit and Cancel Batch show for the Admin and Admin Assistant; Registration and the Cashier see the same list without them.</p></section>`;
}
function dash() {
  const next = STCW.map(([c, name]) => ({ c, name, b: BATCHES.find((x) => x.code === c && x.held < 24) }));
  return `<div class="cx-head"><div><span class="eyebrow">Registration</span><h1>Dashboard</h1></div></div>
  <section class="panel" style="max-width:720px"><div class="ph"><h2>STCW Slots · This Week</h2><button class="btn" data-go="Batch Schedules">View Batch Schedules</button></div>
  <div class="cwrap"><table><thead><tr><th>Course</th><th>Next Open Batch</th><th class="r">Slots Left</th></tr></thead><tbody>${next.map(({ c, b }) => `<tr><td><span class="code">${c}</span></td><td>${b ? `${b.no} · ${fmt(b.start)}` : "No open batch"}</td><td class="r amt">${b ? `${24 - b.held} / 24` : "—"}</td></tr>`).join("")}</tbody></table></div></section>
  <div style="height:20px"></div>
  <section class="panel" style="max-width:720px"><div class="ph"><h2>Certificate Numbers</h2><small>Automatic · no setup tab</small></div><div style="padding:0 20px 20px">
    <div class="cert"><span class="t">Certificate of Completion · Hydraulic Pressure Testing</span>
      <div class="row"><span>Certificate No.</span><b>NWMTACI-2026-HPT-000001</b></div>
      <div class="row"><span>Registration No.</span><b>NWMTC000124-112026</b></div>
      <small class="ro">Each In-House course counts on its own and restarts at 000001 every January. STCW courses keep their own numbers. (Shown here only to preview the format; it is not a portal screen.)</small></div></div></section>`;
}
function render() {
  document.getElementById("tabs").innerHTML = TABS.map((t) => `<div class="tab ${t === S.tab ? "on" : ""}"><button data-tab="${t}">${t}</button></div>`).join("");
  document.getElementById("view").innerHTML = S.tab === "Batch Schedules" ? batches() : dash();
}
document.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.tab) S.tab = b.dataset.tab; if (b.dataset.p) S.period = b.dataset.p; if (b.dataset.f) S.filter = b.dataset.f; if (b.dataset.go) S.tab = b.dataset.go; render(); });
render();
</script>
