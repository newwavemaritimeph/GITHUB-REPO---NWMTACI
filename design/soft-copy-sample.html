<meta name="claude:viewport-fit-sides" content="cover">
<title>Soft Copy Sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* One look: the staff portal is light only. Layout: the portal's navy bar, three tabs, then the email or the Releasing Officer's table at the size it has in the portal. */
:root { color-scheme: light; --ink: #0f2638; --mute: #587184; --line: #d6e9f1; --soft: #eef4f8; --head: #e3f4fb; --navy: #123F63; --blue: #0571D0; --orange: #F25615; --good: #0a7a3e; --warn: #a4530c; --bad: #b42318; --ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --num: "Geist Mono", ui-monospace, Consolas, monospace; }
html, body { background: #f2f9fc; color: var(--ink); margin: 0; font: 14px/1.45 var(--ui); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#bar { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 10px; padding-block: 8px; }
#bar img { width: 30px; height: 30px; }
#bar b { font-weight: 600; }
#bar span { margin-left: auto; color: #cfe6f2; font-size: 13px; }
#pick { background: #fff; border-bottom: 2px solid var(--navy); padding-block: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: 600 13px var(--ui); height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--navy); cursor: pointer; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
#app { padding-block: 16px 40px; display: flex; flex-direction: column; gap: 14px; max-width: 1040px; margin-inline: auto; box-sizing: border-box; width: 100%; }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.panel > header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 10px; padding: 12px 16px; }
.panel h2 { margin: 0; font: 600 16px/1.25 var(--ui); }
/* The email, in an inbox frame. */
.mailbar { display: flex; justify-content: flex-end; }
.mail { width: 100%; max-width: 720px; margin-inline: auto; box-sizing: border-box; }
.mail.phone { max-width: 380px; }
.meta { padding: 14px 16px 10px; display: grid; gap: 3px; }
.meta h2 { font: 600 17px/1.3 var(--ui); overflow-wrap: anywhere; }
.meta small { color: var(--mute); font-size: 13px; overflow-wrap: anywhere; }
.attach { display: flex; align-items: center; gap: 10px; margin: 12px 16px 16px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.attach i { flex: none; width: 30px; height: 30px; border-radius: 7px; background: #fbe9e7; color: var(--bad); font: 700 10.5px/30px var(--ui); text-align: center; font-style: normal; }
.attach span { min-width: 0; overflow-wrap: anywhere; font: 500 13px var(--ui); }
.attach small { display: block; color: var(--mute); font-weight: 400; }
.tag { font: 500 12.5px var(--ui); color: var(--mute); }
/* The Releasing Officer's table. */
.row { display: grid; align-items: center; gap: 4px 14px; padding: 9px 16px; border-top: 1px solid var(--line); }
.row.print { grid-template-columns: 28px minmax(0, 1.4fr) minmax(0, 1fr) 150px 170px; }
.row.rel { grid-template-columns: 28px minmax(0, 1.25fr) minmax(0, .8fr) minmax(0, 1.45fr) 130px 150px; }
.row.head { background: var(--head); color: var(--navy); font: 600 12px var(--ui); letter-spacing: .05em; text-transform: uppercase; padding-block: 7px; }
.c { min-width: 0; }
.c b { font-weight: 600; }
.c small { display: block; color: var(--mute); font-size: 12.5px; }
.m { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 13px; overflow-wrap: anywhere; }
.n { color: var(--mute); font: 500 13px var(--num); }
.b { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--blue); font: 600 13.5px var(--ui); cursor: pointer; white-space: nowrap; }
.b.p { background: var(--orange); border-color: var(--orange); color: #fff; }
.b.s { height: 26px; padding: 0 8px; font-size: 12.5px; }
.acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font: 600 12.5px var(--ui); white-space: nowrap; }
.chip.g { background: #e3f5ea; color: var(--good); }
.chip.o { background: #fdeee0; color: var(--warn); }
.chip.b2 { background: #e2f0fc; color: var(--blue); }
.soft { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; margin-top: 2px; font-size: 12.5px; font-weight: 600; }
.soft.sent { color: var(--good); }
.soft.wait { color: var(--warn); }
.soft.fail { color: var(--bad); }
.soft.none { color: var(--mute); font-weight: 500; }
details.more { position: relative; }
details.more summary { list-style: none; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; box-sizing: border-box; border: 1px solid #b9dcec; border-radius: 8px; color: var(--blue); cursor: pointer; }
details.more summary::-webkit-details-marker { display: none; }
details.more > div { position: absolute; right: 0; top: 36px; z-index: 5; display: grid; min-width: 180px; padding: 4px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px #0f263822; }
details.more > div button { border: 0; background: none; padding: 8px 10px; text-align: left; font: 500 13.5px var(--ui); color: var(--ink); border-radius: 6px; cursor: pointer; }
details.more > div button:hover { background: var(--soft); }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.empty { padding: 14px 16px; color: var(--mute); border-top: 1px solid var(--line); margin: 0; }
.confirm { padding: 4px 16px 14px; }
.confirm h3 { margin: 12px 0 6px; font: 600 14px var(--ui); color: var(--navy); }
.confirm ol, .confirm ul { margin: 0; padding-left: 20px; display: grid; gap: 7px; max-width: 74ch; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 50; max-width: calc(100% - 32px); box-sizing: border-box; }
@media (max-width: 720px) {
  .row.print, .row.rel { grid-template-columns: minmax(0, 1fr) auto; padding-block: 11px; }
  .row.head, .row .n { display: none; }
  .row .who { grid-column: 1 / -1; }
  .row .wide { grid-column: 1 / -1; }
  .row .acts { justify-content: flex-start; grid-column: 1 / -1; }
  .pay { justify-self: end; }
}
</style>

        ${detail("Registration No.", "NWMTC000124-112026")}
        ${detail("Date of Issue", "November 6, 2026")}
      </table>
    </div>
    <div style="padding:14px 20px 4px">
      <a href="#" data-act="toast" data-id="Opens this certificate's page on the New Wave website." style="display:inline-block;margin:0 8px 8px 0;background:#0571D0;color:#ffffff;text-decoration:none;font-size:13.5px;font-weight:700;padding:10px 16px;border-radius:8px">Verify This Certificate</a>
      <a href="#" data-act="toast" data-id="Opens the Certificate Delivery form on the New Wave website." style="display:inline-block;margin:0 0 8px;border:1px solid #0571D0;color:#0571D0;text-decoration:none;font-size:13.5px;font-weight:700;padding:9px 15px;border-radius:8px">Request Delivery by LBC</a>
    </div>
    <p style="margin:0;padding:4px 20px 16px;font-size:13.5px;line-height:1.5;color:#587184">You can claim the printed certificate at our office with a valid ID, or have it delivered by LBC.</p>
    <div style="background:#123F63;color:#cfe3ef;padding:12px 20px;font-size:12px;line-height:1.6"><b style="color:#ffffff">Questions?</b> Call or text 0948-847-6530 · newwavemaritime@gmail.com · facebook.com/newwavemtc<br>Ride the New Wave of Maritime Excellence</div>
  </div>
</div>`;
const mailTab = () => `<div class="mailbar"><div class="seg" role="group" aria-label="Screen width"><button type="button" data-act="width" data-id="0" aria-pressed="${!S.phone}">Laptop</button><button type="button" data-act="width" data-id="1" aria-pressed="${S.phone}">Phone</button></div></div>
  <section class="panel mail${S.phone ? " phone" : ""}">
    <div class="meta"><h2>Your Certificate of Completion · Passenger Ship Crowd Management Training</h2><small>From: ${ORIG} &lt;newwavemaritime@gmail.com&gt;</small><small>To: juan.delacruz@example.com</small></div>
    ${EMAIL}
    <div class="attach"><i>PDF</i><span>certificate-NWMTACI-PSCMT2026000142.pdf<small>Attachment · The certificate's soft copy</small></span></div>
  </section>`;

const softLine = (r) => {
  if (r.soft === "sent") return `<div class="soft sent">Soft Copy Sent · ${r.on}</div>`;
  if (r.soft === "wait") return `<div class="soft wait">Sends When Balance Is Paid <button type="button" class="b s" data-act="settle" data-id="${r.id}">Try It: Cashier Records ₱500</button></div>`;
  if (r.soft === "fail") return `<div class="soft fail">Soft Copy Failed <button type="button" class="b s" data-act="resend" data-id="${r.id}">Resend</button></div>`;
  return `<div class="soft none">No Email on Record</div>`;
};
const payChip = (r) => `<span class="chip ${r.pay === "Paid" ? "g" : r.pay === "Company Charge" ? "b2" : "o"}">${r.pay}</span>`;
const who = (r) => `<div class="c who"><b>${r.name}</b><small class="m">${r.no}</small></div>`;
const counts = () => ({ print: S.rows.filter((r) => r.stage === "print").length, rel: S.rows.filter((r) => r.stage === "rel").length });
const more = (r) => `<details class="more"><summary aria-label="More Actions">▾</summary><div><button type="button" data-act="toast" data-id="Works as it does today.">Correct Details</button><button type="button" data-act="toast" data-id="Works as it does today.">Request Void</button>${r.email && r.pay !== "Balance ₱500" ? `<button type="button" data-act="resend" data-id="${r.id}">Resend Soft Copy</button>` : ""}</div></details>`;
const relTab = () => {
  const c = counts(), list = S.rows.filter((r) => r.stage === S.stage);
  const seg = `<div class="seg" role="tablist" aria-label="Stage"><button type="button" role="tab" data-act="stage" data-id="print" aria-selected="${S.stage === "print"}">To Print · ${c.print}</button><button type="button" role="tab" data-act="stage" data-id="rel" aria-selected="${S.stage === "rel"}">To Release · ${c.rel}</button></div>`;
  const body = S.stage === "print"
    ? `<div class="row print head"><div>#</div><div>Trainee · NWMTACI No.</div><div>Course</div><div>Payment</div><div></div></div>` + (list.length ? list.map((r, i) => `<div class="row print"><div class="n">${i + 1}</div>${who(r)}<div class="c"><b>${r.code}</b><small>${r.ended}</small></div><div class="pay">${payChip(r)}</div><div class="acts"><button type="button" class="b p" data-act="print" data-id="${r.id}">Print</button><button type="button" class="b" data-act="toast" data-id="Draft only. It never counts as a print and sends nothing.">Preview</button></div></div>`).join("") : '<p class="empty">Nothing left to print. See To Release.</p>')
    : `<div class="row rel head"><div>#</div><div>Trainee · NWMTACI No.</div><div>Course</div><div>Certificate No.</div><div>Payment</div><div></div></div>` + list.map((r, i) => `<div class="row rel"><div class="n">${i + 1}</div>${who(r)}<div class="c"><b>${r.code}</b><small>${r.ended}</small></div><div class="c wide"><span class="m">${r.cert}</span>${softLine(r)}</div><div class="pay">${payChip(r)}</div><div class="acts"><button type="button" class="b p"${r.pay === "Balance ₱500" ? " disabled style=\"opacity:.5;cursor:not-allowed\"" : ""} data-act="toast" data-id="Works as it does today.">Release</button>${more(r)}</div></div>`).join("");
  return `<section class="panel"><header><h2>Certificates</h2>${seg}</header>${body}</section>`;
};
const confirmTab = () => `<section class="panel"><header><h2>What Changes</h2></header><div class="confirm"><ol>
    <li>The soft copy goes out once the certificate is printed. Today it can go out as soon as the evaluation comes in, before anything is printed, and that uses up a Certificate No. early.</li>
    <li>A soft copy sent again later keeps the printed date as its Date of Issue. Today it would show the day it was sent again.</li>
    <li>A failed send shows on the row, so a wrong email can be corrected and the soft copy sent again. Today it shows nowhere.</li>
    <li>The email gets the same letterhead as the Training Instructions, with the numbers and two buttons.</li>
  </ol>
  <h3>To Confirm</h3><ol>
    <li>Every print sends it, including a reprint, so a corrected certificate replaces a wrong copy.</li>
    <li>With a balance, it waits and then sends by itself once the balance is settled. This keeps your 5 Nov rule.</li>
    <li>It also waits for the same things Release waits for: the evaluation, and the post-test where the course has one.</li>
    <li>Company Charge trainees get it at printing, with no payment needed.</li>
    <li>Certificates printed before this goes live are not mass-emailed. Resend Soft Copy sends any one of them.</li>
    <li>The PDF carries only a small "Electronic Copy" line at the lower left. Say if you want a larger mark across the page.</li>
  </ol></div></section>`;

function render() {
  tabs.innerHTML = TABS.map((t, i) => `<button type="button" role="tab" data-act="tab" data-id="${i}" aria-selected="${S.tab === i}">${t}</button>`).join("");
  app.innerHTML = S.tab === 0 ? mailTab() : S.tab === 1 ? relTab() : confirmTab();
}
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  if (el.tagName === "A") ev.preventDefault();
  const { act, id } = el.dataset, row = S.rows.find((r) => String(r.id) === id);
  if (act === "tab") { S.tab = Number(id); return render(); }
  if (act === "width") { S.phone = id === "1"; return render(); }
  if (act === "stage") { S.stage = id; return render(); }
  if (act === "toast") return toast(id);
  if (act === "print") {
    row.stage = "rel"; row.ended = "Printed Nov 6";
    if (row.pay === "Balance ₱500") { row.soft = "wait"; toast(`Printed. The soft copy waits for the balance.`); }
    else { row.soft = "sent"; row.on = "Nov 6"; toast(`Printed. Soft copy emailed to ${row.email}.`); }
    return render();
  }
  if (act === "settle") { row.pay = "Paid"; row.soft = "sent"; row.on = "Nov 6"; toast(`Balance settled. Soft copy emailed to ${row.email}.`); return render(); }
  if (act === "resend") { row.soft = "sent"; row.on = "Nov 6"; row.email = row.email.endsWith("@example") ? "felix.mendoza@example.com" : row.email; toast(`Soft copy emailed to ${row.email}.`); return render(); }
});
render();
</script>
