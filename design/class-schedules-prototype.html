<title>Class Schedules</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Same shell as the live portal: navy bar with dropdown tabs, summary rail on the left, light-cyan table headers. */
:root{--orange:#F25615;--blue:#0571D0;--cyan:#35CCFA;--cyan-l:#9EE3F1;--navy:#123F63;--bg:#f2f6f8;--surface:#fff;--fg:#0f2638;--muted:#587184;--line:#dbe6ec;--soft:#eef4f8;--th:#e6f6fd;--thc:#0b4f8f;--zebra:#f7fafc;
 --good:#0a7a3e;--good-bg:#e2f5e9;--warn:#a2470b;--warn-bg:#fdf0e5;--bad:#b42318;--bad-bg:#fcebea;--info:#0571D0;--info-bg:#e5f1fb;
 --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1722;--surface:#102231;--fg:#e3edf4;--muted:#91a9bb;--line:#20384b;--soft:#152d43;--th:#15344b;--thc:#9fd3f7;--zebra:#12283a;--good:#61d396;--good-bg:#113523;--warn:#ffa56a;--warn-bg:#382313;--bad:#ff8b80;--bad-bg:#3b1918;--info:#5fb4ff;--info-bg:#122e48;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1722;--surface:#102231;--fg:#e3edf4;--muted:#91a9bb;--line:#20384b;--soft:#152d43;--th:#15344b;--thc:#9fd3f7;--zebra:#12283a;--good:#61d396;--good-bg:#113523;--warn:#ffa56a;--warn-bg:#382313;--bad:#ff8b80;--bad-bg:#3b1918;--info:#5fb4ff;--info-bg:#122e48;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.mono,.amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{background:var(--navy);color:#fff;padding-block:16px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{display:flex;align-items:center;gap:12px}.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font:700 15px var(--sans)}.logo b{font-size:19px;font-weight:600}.logo b span{color:var(--orange)}.logo small{display:block;color:var(--cyan-l);font-size:14px}.proto{background:var(--orange);font:600 11px var(--sans);letter-spacing:.08em;padding:2px 8px;border-radius:5px;margin-left:8px}
.who{font-size:14px;color:#cfe3ef;display:flex;align-items:center;gap:8px}.who select{background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:8px;padding:5px 8px}.who select option{color:#0f2638}
.tabs{display:flex;gap:2px;margin-top:16px;flex-wrap:wrap}.tab>button{background:none;border:0;color:#c3dbea;font:500 16px var(--sans);padding:12px 18px;border-radius:10px 10px 0 0;white-space:nowrap;display:flex;align-items:center;gap:8px}.tab>button:hover{color:#fff;background:#ffffff12}.tab.on>button{background:var(--bg);color:var(--fg);font-weight:600}
.caret{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-3px) rotate(45deg)}
.menu{position:absolute;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #0003;padding:6px;z-index:15;display:flex;flex-direction:column;margin-top:2px}.tab{position:relative}.menu button{background:none;border:0;text-align:left;color:var(--fg);font:500 15.5px var(--sans);padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;gap:12px}.menu button:hover{background:var(--soft)}.menu button.on{background:var(--info-bg);color:var(--info);font-weight:600}.menu small,.n{font:600 11.5px var(--mono);background:var(--orange);color:#fff;border-radius:10px;padding:1px 7px}
.page{padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}.eyebrow{display:block;font:600 13px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}h1{font-size:25px;font-weight:600;margin:0}h2{font-size:19px;font-weight:600;margin:0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:16px}.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:14.5px}.seg button.on{background:var(--navy);color:#fff}
.rail{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}@media (max-width:900px){.rail{grid-template-columns:1fr}}.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.ph{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.ph small{color:var(--muted);font-size:14px}
.lines{display:flex;flex-direction:column;padding:0 20px 16px}.lines div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.lines div:first-child{border-top:0}.lines dd,.lines span:last-child{font-family:var(--mono);font-weight:600}.lines .tot{font-weight:700}.lines .bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 16px}.tile{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px}.tile span{display:block;font-size:13px;color:var(--muted)}.tile b{font:600 19px var(--mono)}
.cwrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14.5px}th{background:var(--th);color:var(--thc);font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:10px 12px;border-right:1px solid var(--line);white-space:nowrap}td{padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.35}tbody tr:nth-child(even) td{background:var(--zebra)}td small{display:block;color:var(--muted);font-size:12.5px}.r{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}.due{background:var(--bad-bg);color:var(--bad)}.dueo{background:var(--warn-bg);color:var(--warn)}.appr{background:var(--info-bg);color:var(--info)}.paid{background:var(--good-bg);color:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--blue);border-radius:9px;padding:7px 14px;font-weight:600;font-size:14.5px;white-space:nowrap}.pri{background:var(--orange);color:#fff;border:0}.okb{background:var(--good);color:#fff;border:0}.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:14px 20px;background:var(--soft);border-top:1px solid var(--line)}.form label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}.form select,.form input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);color:var(--fg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
.alert{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:500;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.note{font-size:13.5px;color:var(--muted);padding:0 20px 16px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
</style>

<style>
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.bar .seg{margin:0}.bar input{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--surface);color:var(--fg)}.bar .lbl{color:var(--muted);font-size:14.5px}.bar .lbl b{color:var(--fg)}
.grp td{background:var(--soft)!important;font:600 12.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--thc)}
.cxl td{color:var(--muted)}.cxl td b.mono{text-decoration:line-through}
.acts{display:flex;gap:6px;flex-wrap:wrap}.danger{color:var(--bad)}
.filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 20px 14px}
.ovl{position:fixed;inset:0;background:#0a172299;display:grid;place-items:center;z-index:30;padding:16px}
.dlg{background:var(--surface);color:var(--fg);border-radius:16px;max-width:620px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 50px #0005}
.dlg .ph{border-bottom:1px solid var(--line)}.dlg .body{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}.dlg select,.dlg input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);color:var(--fg);font-size:15px;min-width:0;max-width:100%}
.dlg .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.ro{padding:8px 10px;border:1px dashed var(--line);border-radius:9px;color:var(--fg);font-size:15px}
.mini{width:100%;border-collapse:collapse;font-size:14px}.mini td{padding:6px 8px;border:0;border-bottom:1px solid var(--line);background:none!important}
.err{color:var(--bad);font-size:13px}
</style>

<header class="top"><div class="w">
  <div class="brand"><div class="logo"><span class="mark">NW</span><div><b>New Wave <span>Maritime</span><span class="proto">PROTOTYPE</span></b><small>Staff Portal · sample batches and trainees</small></div></div><span class="who">Working as Admin Assistant</span></div>
  <nav class="tabs" id="tabs"></nav></div></header>
<main class="page"><div class="w" id="page"></div></main>
<div id="dlg"></div>
<div class="toast" id="toast" hidden></div>

<script>
const STCW=["UBT-PSSR","STPPDSPPS","PSCMT","PSCMHBT"];
const CN={"UBT-PSSR":"Updating Training on Basic Training – PSSR",STPPDSPPS:"Safety (Passenger Spaces)",PSCMT:"Crowd Management",PSCMHBT:"Crisis Management and Human Behaviour",ESEA:"Enclosed Space Entry Awareness",ABC:"Awareness on Basic Computer"};
const NAMES=["DELA CRUZ, Juan","SANTOS, Mark","REYES, Ana","GARCIA, Leo","MENDOZA, Rico","BAUTISTA, Joy","AQUINO, Ben","RAMOS, Lea"];
const B=[
 {id:1,no:"BCH-2026-0412",c:"UBT-PSSR",s:"2026-10-22",e:"2026-10-22",n:5,room:"Room 103",ins:"Capt. R. Villanueva",st:"Open"},
 {id:2,no:"BCH-2026-0413",c:"UBT-PSSR",s:"2026-10-23",e:"2026-10-23",n:20,room:"Room 103",ins:"Capt. R. Villanueva",st:"Open"},
 {id:3,no:"BCH-2026-0418",c:"UBT-PSSR",s:"2026-10-24",e:"2026-10-24",n:3,room:"Room 103",ins:"Capt. L. Garcia",st:"Open"},
 {id:4,no:"BCH-2026-0420",c:"STPPDSPPS",s:"2026-10-26",e:"2026-10-26",n:0,room:"Room 304",ins:"Engr. P. Reyes",st:"Open"},
 {id:5,no:"BCH-2026-0421",c:"PSCMT",s:"2026-10-27",e:"2026-10-28",n:24,room:"Room 304",ins:"Capt. R. Villanueva",st:"Open"},
 {id:6,no:"BCH-2026-0422",c:"PSCMHBT",s:"2026-10-22",e:"2026-10-24",n:12,room:"Room 304",ins:"Capt. R. Villanueva",st:"Open"},
 {id:7,no:"BCH-2026-0430",c:"ESEA",s:"2026-10-23",e:"2026-10-23",n:2,room:"Room 201",ins:"Engr. P. Reyes",st:"Open"},
 {id:8,no:"BCH-2026-0431",c:"ESEA",s:"2026-10-27",e:"2026-10-27",n:4,room:"Room 201",ins:"Engr. P. Reyes",st:"Open"},
 {id:9,no:"BCH-2026-0399",c:"PSCMT",s:"2026-10-20",e:"2026-10-21",n:0,room:"Room 304",ins:"—",st:"Cancelled",why:"Instructor unavailable",by:"A. Assistant · Oct 18"}];
const TODAY="2026-10-21";
const S={mode:"Weekly",anchor:TODAY,filter:"All",dlg:null};
const add=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const f=(d,o={month:"short",day:"numeric"})=>new Intl.DateTimeFormat("en-PH",{timeZone:"UTC",...o}).format(new Date(d+"T00:00:00Z"));
const dates=(b)=>b.s===b.e?f(b.s):`${f(b.s)} – ${f(b.e)}`;
function range(){const d=S.anchor;if(S.mode==="Monthly"){const from=d.slice(0,8)+"01",to=add(add(from,32).slice(0,8)+"01",-1);return{from,to,label:f(from,{month:"long",year:"numeric"})}}
 const from=add(d,-((new Date(d+"T00:00:00Z").getUTCDay()+6)%7)),to=add(from,S.mode==="Weekly"?6:13);return{from,to,label:`${f(from)} – ${f(to,{month:"short",day:"numeric",year:"numeric"})}`}}
const statusOf=(b)=>b.st==="Cancelled"?"Cancelled":b.e<TODAY?"Ended":b.s<=TODAY?"Ongoing":b.n>=24?"Full":"Open";
const PILL={Open:"paid",Full:"dueo",Ongoing:"appr",Cancelled:"due",Ended:""};
const targets=(b)=>B.filter((o)=>o.id!==b.id&&o.c===b.c&&o.st!=="Cancelled"&&o.s>TODAY);
function schedules(){const r=range();const inR=B.filter((b)=>b.s<=r.to&&b.e>=r.from);const list=inR.filter((b)=>S.filter==="All"||statusOf(b)===S.filter);
 const cnt=(s)=>inR.filter((b)=>statusOf(b)===s).length;
 const row=(b)=>{const s=statusOf(b);const live=s!=="Cancelled"&&s!=="Ended";return `<tr class="${s==="Cancelled"?"cxl":""}"><td><b class="mono">${b.no}</b></td><td><b>${b.c}</b><small>${CN[b.c]}</small></td><td>${dates(b)}</td><td class="mono">${b.n}/24</td><td>${b.room}<small>${b.ins}</small></td>
  <td><span class="pill ${PILL[s]}">${s}</span>${s==="Cancelled"?`<small>${b.why} · ${b.by}</small>`:""}</td>
  <td>${live?`<div class="acts"><button class="btn" data-edit="${b.id}">Edit</button>${s!=="Ongoing"?`<button class="btn danger" data-cxl="${b.id}">Cancel Batch</button>`:""}</div>`:""}</td></tr>`};
 const grp=(t,rows)=>rows.length?`<tr class="grp"><td colspan="7">${t} · ${rows.length}</td></tr>${rows.map(row).join("")}`:"";
 return `<div class="cx-head"><div><span class="eyebrow">Admin Assistant</span><h1>Class Schedules</h1></div><div class="acts"><button class="btn" data-t="Create Schedule: course, dates by the course pattern, times, mode, venue, deadline (24 seats)">Create Schedule</button><button class="btn pri" data-open>Open Batches</button></div></div>
 <div class="bar"><span class="seg">${["Weekly","Every 2 Weeks","Monthly"].map((m)=>`<button class="${S.mode===m?"on":""}" data-mode="${m}">${m}</button>`).join("")}</span>
  <button class="btn" data-step="-1" aria-label="Previous">‹</button><input type="date" id="anc" value="${S.anchor}" aria-label="Date"><button class="btn" data-step="1" aria-label="Next">›</button>${S.anchor!==TODAY?`<button class="btn" data-today>Today</button>`:""}<span class="lbl"><b>${r.label}</b> · ${inR.length} batches</span></div>
 <div class="rail"><div class="stack"><section class="panel"><div class="ph"><h2>This Period</h2></div><div class="lines">${["Open","Full","Ongoing","Cancelled"].map((s)=>`<div><span>${s}</span><span>${cnt(s)}</span></div>`).join("")}<div><span>Trainees Booked</span><span>${inR.filter((b)=>b.st!=="Cancelled").reduce((a,b)=>a+b.n,0)}</span></div></div>
  <p class="note">Dates follow each course's pattern (BT-PSSR Mon–Sat, Safety Monday, Crowd Tue–Wed, Crisis Thu–Sat). To change dates, cancel the batch and open a new one.</p></section></div>
 <div class="stack"><section class="panel"><div class="ph"><h2>Batches</h2></div>
  <div class="filter"><span class="seg" style="margin:0">${["All","Open","Full","Ongoing","Cancelled"].map((x)=>`<button class="${S.filter===x?"on":""}" data-f="${x}">${x}</button>`).join("")}</span></div>
  <div class="cwrap"><table><thead><tr><th>Batch No.</th><th>Course</th><th>Dates</th><th>Seats</th><th>Room · Instructor</th><th>Status</th><th></th></tr></thead><tbody>
  ${list.length?grp("STCW",list.filter((b)=>STCW.includes(b.c)))+grp("In-House",list.filter((b)=>!STCW.includes(b.c))):`<tr><td colspan="7" style="color:var(--muted)">No batches in this period.</td></tr>`}</tbody></table></div></section></div></div>`}
function editDlg(b){return `<div class="ovl"><div class="dlg" role="dialog" aria-label="Edit batch"><div class="ph"><h2>Edit ${b.c} · <span class="mono">${b.no}</span></h2><button class="btn" data-close>Close</button></div><div class="body">
 <div class="grid"><label>Batch No.<input id="eno" class="mono" value="${b.no}"></label><label>Dates<span class="ro">${dates(b)}, 2026</span></label></div>
 <div class="grid"><label>Daily Start<input type="time" value="08:00"></label><label>Daily End<input type="time" value="17:00"></label><label>Mode<select><option>Face-to-Face</option><option>Online</option></select></label></div>
 <div class="grid"><label>Venue<input value="New Wave Training Center, Manila"></label><label>Enrollment Deadline<input type="datetime-local" value="${add(b.s,-1)}T17:00"></label><label>Public Registration<select><option>Published</option><option>Hidden</option></select></label></div>
 <span class="err" id="eerr"></span><p class="note" style="padding:0">Dates follow the course pattern and can't be changed here.</p>
 <div class="acts" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn pri" data-esave="${b.id}">Save</button></div></div></div></div>`}
function cxlDlg(b){const t=targets(b);const people=NAMES.slice(0,Math.min(b.n,8));
 return `<div class="ovl"><div class="dlg" role="dialog" aria-label="Cancel batch"><div class="ph"><h2>Cancel ${b.c} · <span class="mono">${b.no}</span></h2><button class="btn" data-close>Close</button></div><div class="body">
 <div>${dates(b)} · ${b.room} · <b>${b.n} trainee${b.n===1?"":"s"}</b></div>
 ${b.n?`<table class="mini"><tbody>${people.map((p,i)=>`<tr><td class="mono">${i+1}</td><td>${p}</td><td style="text-align:right">${i%3===2?`<span class="pill dueo">Balance ₱700.00</span>`:`<span class="pill paid">Paid</span>`}</td></tr>`).join("")}${b.n>8?`<tr><td></td><td style="color:var(--muted)">and ${b.n-8} more</td><td></td></tr>`:""}</tbody></table>
 <label>Move Every Trainee To<select id="mto"><option value="">Choose a ${b.c} batch</option>${t.map((o)=>{const left=24-o.n;return `<option value="${o.id}" ${left<b.n?"disabled":""}>${o.no} · ${dates(o)} · ${left<b.n?`Only ${left} seats left`:`${left} seats left`}</option>`}).join("")}</select></label>
 ${!t.length?`<span class="err">No other ${b.c} batch is open. Open one first, then cancel this batch.</span>`:""}`:`<p class="note" style="padding:0">No trainees on this batch; it is cancelled straight away.</p>`}
 <label>Reason<select id="why"><option value="">Choose a reason</option><option>Instructor unavailable</option><option>Not enough trainees</option><option>Holiday / office closed</option><option>Typhoon / weather</option><option>Room unavailable</option><option>Others</option></select></label>
 <span class="err" id="cerr"></span>
 <div class="acts" style="justify-content:flex-end"><button class="btn" data-close>Keep Batch</button><button class="btn pri" style="background:var(--bad)" data-cgo="${b.id}">Cancel Batch${b.n?" and Move Trainees":""}</button></div></div></div></div>`}
function openDlg(){return `<div class="ovl"><div class="dlg" role="dialog" aria-label="Open batches"><div class="ph"><h2>Open Batches</h2><button class="btn" data-close>Close</button></div><div class="body">
 <div class="grid"><label>Course<select><option>All STCW and In-House courses</option>${Object.keys(CN).map((c)=>`<option>${c} · ${CN[c]}</option>`).join("")}</select></label><label>For<select><option>Week of Oct 26 – Nov 1</option><option>November 2026</option></select></label></div>
 <p class="note" style="padding:0">Batches follow each course's day pattern, 24 seats, 8:00 AM – 5:00 PM, and appear on the public registration form right away. Dates already opened are skipped.</p>
 <div class="acts" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn pri" data-opengo>Open Batches</button></div></div></div></div>`}
function render(){document.getElementById("tabs").innerHTML=["Dashboard","Requisitions","Class Schedules","Resource Planning","Instructors","Reconciliation"].map((t)=>`<div class="tab ${t==="Class Schedules"?"on":""}"><button data-view="${t}">${t}</button></div>`).join("");
 document.getElementById("page").innerHTML=schedules();const b=B.find((x)=>x.id===S.dlg?.id);document.getElementById("dlg").innerHTML=!S.dlg?"":S.dlg.k==="edit"?editDlg(b):S.dlg.k==="cxl"?cxlDlg(b):openDlg()}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,3200)}
document.addEventListener("click",(e)=>{const btn=e.target.closest("button");if(!btn)return;const k=btn.dataset;
 if(k.view){toast(k.view==="Class Schedules"?"You are on Class Schedules":k.view+" stays as it is today");return}
 else if(k.mode)S.mode=k.mode;else if(k.step){const r=range(),n=+k.step;S.anchor=S.mode==="Monthly"?(n<0?add(r.from,-1):add(r.to,1)):add(S.anchor,n*(S.mode==="Weekly"?7:14))}
 else if("today" in k)S.anchor=TODAY;else if(k.f)S.filter=k.f;
 else if(k.edit)S.dlg={k:"edit",id:+k.edit};else if(k.cxl)S.dlg={k:"cxl",id:+k.cxl};else if("open" in k)S.dlg={k:"open"};else if("close" in k)S.dlg=null;
 else if(k.esave){const b=B.find((x)=>x.id===+k.esave),no=document.getElementById("eno").value.trim().toUpperCase();if(B.some((x)=>x.id!==b.id&&x.no===no)){document.getElementById("eerr").textContent=`${no} is already used by another batch.`;return}const old=b.no;b.no=no;S.dlg=null;toast(old!==no?`Renamed ${old} to ${no}. Saved.`:"Saved.")}
 else if(k.cgo){const b=B.find((x)=>x.id===+k.cgo),why=document.getElementById("why").value,to=b.n?document.getElementById("mto").value:"";if(!why||(b.n&&!to)){document.getElementById("cerr").textContent=b.n&&!to?"Choose the batch the trainees move to.":"Choose a reason.";return}
  const t=B.find((x)=>x.id===+to);const moved=b.n;if(t)t.n+=moved;b.n=0;b.st="Cancelled";b.why=why;b.by="A. Assistant · Oct 21";S.dlg=null;toast(`${b.no} cancelled${moved?` · ${moved} trainee${moved===1?"":"s"} moved to ${t.no}`:""}`)}
 else if("opengo" in k){S.dlg=null;toast("Opened 9 batches for Oct 26 – Nov 1 (3 already open were skipped)")}
 else if(k.t){toast(k.t);return}else return;render()});
document.addEventListener("change",(e)=>{if(e.target.id==="anc"&&e.target.value){S.anchor=e.target.value;render()}});
render();
</script>
