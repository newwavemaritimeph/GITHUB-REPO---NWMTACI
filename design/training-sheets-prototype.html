<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Training Report Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* One look: the staff portal is light only; the printed sheets are black on white paper. Layout: navy bar, two tabs, the Batch window, then the chosen sheet on paper. */
:root { color-scheme: light; --ink: #0f2638; --mute: #587184; --line: #d6e9f1; --soft: #eef4f8; --head: #e3f4fb; --navy: #123F63; --blue: #0571D0; --orange: #F25615; --good: #0a7a3e; --goodbg: #e3f5ea; --warn: #a4530c; --warnbg: #fdeee0; --paper: #ffffff; --rule: #111111; --ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --num: "Geist Mono", ui-monospace, Consolas, monospace; --print: Arial, Helvetica, sans-serif; }
html, body { background: #f2f9fc; color: var(--ink); margin: 0; font: 14px/1.45 var(--ui); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#bar { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 10px; padding-block: 8px; }
#bar img { width: 30px; height: 30px; }
#bar b { font-weight: 600; }
#bar span { margin-left: auto; color: #cfe6f2; font-size: 13px; }
#pick { background: #fff; border-bottom: 2px solid var(--navy); padding-block: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: 600 13px var(--ui); height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--navy); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
#app { padding-block: 16px 40px; display: flex; flex-direction: column; gap: 14px; max-width: 1120px; margin-inline: auto; box-sizing: border-box; width: 100%; }
.modal { background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px #0f263822; overflow: hidden; }
.modal > header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.modal > header h2 { margin: 0; font: 700 19px var(--ui); color: var(--navy); }
.mb { padding: 16px 20px 18px; display: grid; gap: 12px; }
.bhead { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.bhead > div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.bhead span { display: block; color: var(--mute); font: 600 11.5px var(--ui); letter-spacing: .05em; text-transform: uppercase; }
.bhead b { display: block; font: 600 15px var(--ui); margin-top: 2px; }
.bhead small { color: var(--mute); font-size: 12.5px; }
.bar2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #f4f9fc; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.bar2 > b { font: 600 13px var(--ui); color: var(--navy); margin-right: 4px; }
.b2 { display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--blue); font: 600 13.5px var(--ui); cursor: pointer; white-space: nowrap; }
.b2.p { background: var(--orange); border-color: var(--orange); color: #fff; }
.b2[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.daypick { display: inline-flex; gap: 4px; align-items: center; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.daypick button { border: 0; background: none; font: 600 12.5px var(--ui); color: var(--mute); padding: 6px 9px; border-radius: 7px; cursor: pointer; }
.daypick button[aria-pressed="true"] { background: var(--soft); color: var(--navy); }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font: 600 12px var(--ui); white-space: nowrap; }
.chip.g { background: var(--goodbg); color: var(--good); }
.chip.o { background: var(--warnbg); color: var(--warn); }
.note { color: var(--mute); font-size: 13px; margin: 0; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
/* The printed sheet, on paper. */
.sheetwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #e9eef1; padding: 16px; }
.paper { background: var(--paper); color: #000; width: 1000px; margin-inline: auto; padding: 28px 32px; box-sizing: border-box; box-shadow: 0 2px 10px #0002; font: 11.5px/1.35 var(--print); }
.ph { display: grid; grid-template-columns: 64px 1fr 210px; gap: 12px; align-items: center; border-bottom: 2px solid var(--rule); padding-bottom: 10px; }
.ph img { width: 60px; height: 60px; }
.ph .org b { display: block; font-size: 15px; letter-spacing: .02em; }
.ph .org small { display: block; font-size: 10.5px; }
.ctl { border: 1px solid var(--rule); font-size: 10px; }
.ctl div { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule); }
.ctl div:first-child { border-top: 0; }
.ctl span { padding: 2px 5px; }
.ctl span + span { border-left: 1px solid var(--rule); }
.ttl { text-align: center; font: 700 16px var(--print); letter-spacing: .06em; margin: 12px 0 8px; }
.info { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--rule); margin-bottom: 10px; }
.info div { padding: 4px 7px; border-left: 1px solid var(--rule); border-top: 1px solid var(--rule); }
.info div:nth-child(3n+1) { border-left: 0; }
.info div:nth-child(-n+3) { border-top: 0; }
.info span { display: block; font-size: 9px; text-transform: uppercase; color: #333; }
.info b { font-size: 11.5px; }
.paper table { width: 100%; border-collapse: collapse; font-size: 11px; }
.paper th, .paper td { border: 1px solid var(--rule); padding: 3px 5px; text-align: left; vertical-align: middle; }
.paper th { background: #eeeeee; font-size: 9.5px; text-transform: uppercase; text-align: center; }
.paper td.n { text-align: center; width: 26px; }
.paper td.c { text-align: center; }
.paper td.sig { height: 22px; }
.signs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 26px; }
.signs div { text-align: center; }
.signs .line { border-top: 1px solid var(--rule); padding-top: 3px; font-weight: 700; }
.signs small { display: block; font-size: 10px; }
.legend { margin-top: 8px; font-size: 10px; }
.confirm { padding: 4px 16px 16px; }
.confirm h3 { margin: 12px 0 6px; font: 600 14px var(--ui); color: var(--navy); }
.confirm ol { margin: 0; padding-left: 20px; display: grid; gap: 7px; max-width: 80ch; }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.panel > header { padding: 12px 16px; }
.panel h2 { margin: 0; font: 600 16px var(--ui); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 50; max-width: calc(100% - 32px); box-sizing: border-box; }
@media (max-width: 760px) { .bhead { grid-template-columns: 1fr; } }
</style>

const B = { no: "26-507-023", code: "PSCMT", course: "Passenger Ship Crowd Management Training", days: ["2026-11-10", "2026-11-11"], room: "Room 103", instr: "Capt. Juan Joel Hernandez", assessor: "Capt. Ramon Reyes" };
const TRAINEES = [
  { name: "DELA CRUZ, JUAN P.", srn: "8512250011", rank: "AB", pct: 88, ticks: [true, true, true, true], ex: [true, true, true, true, true] },
  { name: "SANTOS, MARIA L.", srn: "8512250014", rank: "OS", pct: 92, ticks: [true, true, true, true], ex: [true, true, true, true, true] },
  { name: "REYES, CARLO M.", srn: "8512250022", rank: "Oiler", pct: 71, ticks: [true, true, false, true], ex: [true, true, false, true, true] },
  { name: "GARCIA, ANNA B.", srn: "8512250031", rank: "Messman", pct: 80, ticks: [true, true, true, true], ex: [true, true, true, true, true] },
  { name: "TAN, ROBERTO C.", srn: "8512250044", rank: "Bosun", pct: null, ticks: [null, null, null, null], ex: [true, true, true, null, null] },
];
const TASKS = ["Assist passengers to muster stations", "Use of public address and alarm signals", "Crowd control in corridors and stairways", "Embarkation into survival craft"];
const EXERCISES = ["Muster drill", "Communication with passengers", "Directing passengers to exits", "Use of evacuation routes", "Abandon ship drill"];
const FORMS = { attendance: ["Attendance Sheet", "AD-03-00"], exercise: ["Exercise Performance Sheet", "AD-04-00"], assessment: ["Assessment Performance Sheet", "AD-06-00"], tcroa: ["Training Completion and Record of Assessment Report", "05-00"] };
const S = { tab: 0, sheet: "attendance", day: 0 };
const app = document.getElementById("app"), tabs = document.getElementById("tabs"), toastEl = document.getElementById("toast");
let timer;
const toast = (t) => { toastEl.textContent = t; toastEl.hidden = false; clearTimeout(timer); timer = setTimeout(() => { toastEl.hidden = true; }, 3200); };
const fmt = (d) => new Date(`${d}T00:00:00+08:00`).toLocaleDateString("en-PH", { month: "long", day: "numeric", year: "numeric", timeZone: "Asia/Manila" });
const dates = () => (B.days.length === 1 ? fmt(B.days[0]) : `${fmt(B.days[0])} – ${fmt(B.days.at(-1))}`);
const mark = (v) => (v === true ? "✓" : v === false ? "✗" : "");
const result = (t) => (t.pct === null || t.ticks.some((x) => x === null) ? "" : t.pct >= 75 && t.ticks.every(Boolean) ? "C" : "NYC");
const LINES = 12;

function head(kind) {
  const [title, ad] = FORMS[kind];
  return `<div class="ph"><img src="${EMBLEM}" alt=""><div class="org"><b>NEW WAVE MARITIME TRAINING AND ASSESSMENT CENTER, INC.</b><small>Room 103, Bel-Air Apartment, 1020 Roxas Boulevard, Ermita, Manila 1000</small><small>+63 948 847 6530 · newwavemaritime@gmail.com</small></div>
    <div class="ctl"><div><span>AD No.</span><span>${ad}</span></div><div><span>Initial Issue Date</span><span>09-14-2023</span></div><div><span>Revision Date</span><span>00</span></div></div></div>
    <div class="ttl">${title.toUpperCase()}</div>`;
}
function info(extra) {
  const cells = [["Course", B.course], ["Batch No.", B.no], ["Training Dates", dates()], ...extra];
  return `<div class="info">${cells.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;
}
const signs = (who) => `<div class="signs">${who.map(([name, role]) => `<div><div class="line">${name}</div><small>${role}</small></div>`).join("")}</div>`;
const blank = (n, cols) => Array.from({ length: Math.max(0, n) }, (_, i) => `<tr><td class="n">${TRAINEES.length + i + 1}</td>${"<td class=\"sig\"></td>".repeat(cols)}</tr>`).join("");

function sheet() {
  if (S.sheet === "attendance") {
    const d = B.days[S.day];
    return head("attendance") + info([["Training Day", `Day ${S.day + 1} of ${B.days.length} · ${fmt(d)}`], ["Room", B.room], ["Instructor", B.instr]]) +
      `<table><thead><tr><th rowspan="2">No.</th><th rowspan="2">Name of Trainee<br>(Last, First, M.I.)</th><th rowspan="2">SRN</th><th colspan="2">Morning</th><th colspan="2">Afternoon</th><th rowspan="2">Remarks</th></tr><tr><th>Time In</th><th>Signature</th><th>Time Out</th><th>Signature</th></tr></thead><tbody>
      ${TRAINEES.map((t, i) => `<tr><td class="n">${i + 1}</td><td><b>${t.name}</b></td><td class="c">${t.srn}</td><td class="sig"></td><td class="sig"></td><td class="sig"></td><td class="sig"></td><td></td></tr>`).join("")}${blank(LINES - TRAINEES.length, 7)}</tbody></table>` +
      signs([[B.instr, "Instructor · Signature over Printed Name"], ["", "Training Director"], ["", "Date"]]);
  }
  if (S.sheet === "exercise") {
    return head("exercise") + info([["Room", B.room], ["Instructor", B.instr], ["Exercises", String(EXERCISES.length)]]) +
      `<table><thead><tr><th>No.</th><th>Name of Trainee</th>${EXERCISES.map((e, i) => `<th>Ex. ${i + 1}<br><span style="font-weight:400;text-transform:none">${e}</span></th>`).join("")}<th>Remarks</th></tr></thead><tbody>
      ${TRAINEES.map((t, i) => `<tr><td class="n">${i + 1}</td><td><b>${t.name}</b></td>${t.ex.map((x) => `<td class="c">${mark(x)}</td>`).join("")}<td>${t.ex.every(Boolean) ? "Satisfactory" : t.ex.some((x) => x === null) ? "" : "Repeat exercise"}</td></tr>`).join("")}${blank(LINES - TRAINEES.length, EXERCISES.length + 2)}</tbody></table>
      <p class="legend">✓ Performed satisfactorily &nbsp; ✗ Not performed satisfactorily</p>` + signs([[B.instr, "Instructor · Signature over Printed Name"], ["", "Training Director"], ["", "Date"]]);
  }
  if (S.sheet === "assessment") {
    return head("assessment") + info([["Assessment Date", fmt(B.days.at(-1))], ["Place", B.room], ["Assessor", B.assessor]]) +
      `<table><thead><tr><th rowspan="2">No.</th><th rowspan="2">Name of Trainee</th><th rowspan="2">Rank</th><th rowspan="2">Written<br>Score %</th><th colspan="${TASKS.length}">Practical Assessment Tasks</th><th rowspan="2">Result</th><th rowspan="2">Assessor's Remarks</th></tr><tr>${TASKS.map((t, i) => `<th title="${t}">Task ${i + 1}</th>`).join("")}</tr></thead><tbody>
      ${TRAINEES.map((t, i) => `<tr><td class="n">${i + 1}</td><td><b>${t.name}</b></td><td>${t.rank}</td><td class="c">${t.pct ?? ""}</td>${t.ticks.map((x) => `<td class="c">${mark(x)}</td>`).join("")}<td class="c"><b>${result(t)}</b></td><td>${result(t) === "NYC" ? "Re-assessment needed" : ""}</td></tr>`).join("")}${blank(LINES - TRAINEES.length, TASKS.length + 6)}</tbody></table>
      <p class="legend">Tasks: ${TASKS.map((t, i) => `${i + 1}. ${t}`).join(" · ")}. Pass mark 75%. C Competent · NYC Not Yet Competent.</p>` + signs([[B.assessor, "Assessor · Signature over Printed Name"], ["", "Training Director"], ["", "Date"]]);
  }
  return head("tcroa") + `<p class="note" style="color:#333;text-align:center;margin:30px 0">This is the TCROA already in the portal (AD No. 05-00), drawn like New Wave's form and filed in Google Drive › TCROA. It opens here as it does today, and now carries the name TCROA.</p>`;
}

function windowTab() {
  const btn = (k, label) => `<button type="button" class="b2" data-act="sheet" data-id="${k}" aria-pressed="${S.sheet === k}">${label}</button>`;
  return `<div class="modal" role="dialog" aria-label="Batch ${B.no}"><header><h2>Batch ${B.no}</h2><button type="button" class="b2" data-act="toast" data-id="Closes the window." aria-label="Close">×</button></header><div class="mb">
    <div class="bhead"><div><span>Course</span><b>${B.code}</b><small>${B.course}</small></div><div><span>Dates</span><b>Nov 10 – 11, 2026</b><small>08:00 – 17:00</small></div><div><span>Room · Instructor</span><b>${B.room}</b><small>${B.instr}</small></div><div><span>Trainees</span><b>5 enrolled · 0 pending</b><small>19 slots left of 24</small></div></div>
    <div class="bar2"><b>For MARINA</b><button type="button" class="b2" data-act="toast" data-id="Opens the MARINA Final List PDF.">Final List PDF</button><button type="button" class="b2" data-act="toast" data-id="Downloads the CSV for MARINA.">CSV for MARINA</button><span class="chip g">5 of 5 Encoded</span></div>
    <div class="bar2"><b>Training Reports</b>${btn("attendance", "Attendance Sheet")}${btn("exercise", "Exercise Performance Sheet")}${btn("assessment", "Assessment Performance Sheet")}${btn("tcroa", "TCROA")}</div>
    ${S.sheet === "attendance" ? `<div class="bar2"><b>Day</b><span class="daypick" role="group" aria-label="Training day">${B.days.map((d, i) => `<button type="button" data-act="day" data-id="${i}" aria-pressed="${S.day === i}">Day ${i + 1} · ${fmt(d).replace(", 2026", "")}</button>`).join("")}</span><button type="button" class="b2 p" data-act="toast" data-id="Opens the Attendance Sheet for Day ${S.day + 1} as a PDF to print.">Print Day ${S.day + 1}</button><button type="button" class="b2" data-act="toast" data-id="Opens one PDF with a sheet for every training day.">Print All Days</button></div>`
      : S.sheet === "tcroa" ? `<div class="bar2"><b>TCROA</b><button type="button" class="b2 p" data-act="toast" data-id="Opens the TCROA editor, as Completion Record does today.">Open TCROA</button></div>`
      : `<div class="bar2"><b>${FORMS[S.sheet][0]}</b><button type="button" class="b2 p" data-act="toast" data-id="Opens the sheet as a PDF to print.">Print</button><span class="note">${S.sheet === "assessment" ? "Filled from the TCROA: written % and practical ticks are entered once, there." : "Ticks are entered here per trainee, or left blank to fill by hand."}</span></div>`}
    <div class="sheetwrap"><div class="paper">${sheet()}</div></div>
  </div></div>`;
}
const confirmTab = () => `<section class="panel"><header><h2>To Confirm</h2></header><div class="confirm"><ol>
    <li>Training Reports' Batch window gets a Training Reports row: Attendance Sheet, Exercise Performance Sheet, Assessment Performance Sheet and TCROA. All print as PDF, A4 landscape.</li>
    <li>Attendance Sheet prints per training day (Day 1, Day 2 …) or all days in one PDF. Names and SRN are filled in; times and signatures are written by hand.</li>
    <li>Exercise Performance Sheet lists each course's practical exercises. The Admin sets the exercise titles per course, as the TCROA's assessment tasks are set today.</li>
    <li>Assessment Performance Sheet fills from the TCROA entries (written % and each practical task), so nothing is typed twice.</li>
    <li>TCROA is the Completion Record already in the portal, now named TCROA.</li>
    <li>The AD No., issue date and revision for each sheet are set in Configuration › Form Numbers, like the other forms. The numbers shown here are placeholders.</li>
  </ol>
  <h3>To match your forms exactly</h3><ol><li>Send a photo or PDF of New Wave's Attendance Sheet, Exercise Performance Sheet and Assessment Performance Sheet, and each will be drawn cell for cell like your form, as the TCROA was.</li></ol></div></section>`;

function render() {
  tabs.innerHTML = TABS.map((t, i) => `<button type="button" role="tab" data-act="tab" data-id="${i}" aria-selected="${S.tab === i}">${t}</button>`).join("");
  app.innerHTML = S.tab === 0 ? windowTab() : confirmTab();
}
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const { act, id } = el.dataset;
  if (act === "tab") { S.tab = Number(id); return render(); }
  if (act === "sheet") { S.sheet = id; return render(); }
  if (act === "day") { S.day = Number(id); return render(); }
  if (act === "toast") return toast(id);
});
render();
</script>
