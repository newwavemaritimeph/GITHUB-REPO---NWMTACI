<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Training Report Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* One look: the staff portal is light only; the printed sheets are black on white paper. Layout: navy bar, two tabs, the Batch window, then the chosen sheet on paper. */
:root { color-scheme: light; --ink: #0f2638; --mute: #587184; --line: #d6e9f1; --soft: #eef4f8; --head: #e3f4fb; --navy: #123F63; --blue: #0571D0; --orange: #F25615; --good: #0a7a3e; --goodbg: #e3f5ea; --warn: #a4530c; --warnbg: #fdeee0; --paper: #ffffff; --rule: #111111; --ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --num: "Geist Mono", ui-monospace, Consolas, monospace; --print: Arial, Helvetica, sans-serif; }
html, body { background: #f2f9fc; color: var(--ink); margin: 0; font: 14px/1.45 var(--ui); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#bar { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 10px; padding-block: 8px; }
#bar img { width: 30px; height: 30px; }
#bar b { font-weight: 600; }
#bar span { margin-left: auto; color: #cfe6f2; font-size: 13px; }
#pick { background: #fff; border-bottom: 2px solid var(--navy); padding-block: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: 600 13px var(--ui); height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--navy); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
#app { padding-block: 16px 40px; display: flex; flex-direction: column; gap: 14px; max-width: 1120px; margin-inline: auto; box-sizing: border-box; width: 100%; }
.modal { background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px #0f263822; overflow: hidden; }
.modal > header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.modal > header h2 { margin: 0; font: 700 19px var(--ui); color: var(--navy); }
.mb { padding: 16px 20px 18px; display: grid; gap: 12px; }
.bhead { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.bhead > div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.bhead span { display: block; color: var(--mute); font: 600 11.5px var(--ui); letter-spacing: .05em; text-transform: uppercase; }
.bhead b { display: block; font: 600 15px var(--ui); margin-top: 2px; }
.bhead small { color: var(--mute); font-size: 12.5px; }
.bar2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #f4f9fc; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.bar2 > b { font: 600 13px var(--ui); color: var(--navy); margin-right: 4px; }
.b2 { display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #b9dcec; background: #fff; color: var(--blue); font: 600 13.5px var(--ui); cursor: pointer; white-space: nowrap; }
.b2.p { background: var(--orange); border-color: var(--orange); color: #fff; }
.b2[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.daypick { display: inline-flex; gap: 4px; align-items: center; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.daypick button { border: 0; background: none; font: 600 12.5px var(--ui); color: var(--mute); padding: 6px 9px; border-radius: 7px; cursor: pointer; }
.daypick button[aria-pressed="true"] { background: var(--soft); color: var(--navy); }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font: 600 12px var(--ui); white-space: nowrap; }
.chip.g { background: var(--goodbg); color: var(--good); }
.chip.o { background: var(--warnbg); color: var(--warn); }
.note { color: var(--mute); font-size: 13px; margin: 0; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
/* The printed sheet, on paper. */
.sheetwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #e9eef1; padding: 16px; }
.paper { background: var(--paper); color: #000; width: 1000px; margin-inline: auto; padding: 28px 32px; box-sizing: border-box; box-shadow: 0 2px 10px #0002; font: 11.5px/1.35 var(--print); }
.ph { display: grid; grid-template-columns: 64px 1fr 210px; gap: 12px; align-items: center; border-bottom: 2px solid var(--rule); padding-bottom: 10px; }
.ph img { width: 60px; height: 60px; }
.ph .org b { display: block; font-size: 15px; letter-spacing: .02em; }
.ph .org small { display: block; font-size: 10.5px; }
.ctl { border: 1px solid var(--rule); font-size: 10px; }
.ctl div { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule); }
.ctl div:first-child { border-top: 0; }
.ctl span { padding: 2px 5px; }
.ctl span + span { border-left: 1px solid var(--rule); }
.ttl { text-align: center; font: 700 16px var(--print); letter-spacing: .06em; margin: 12px 0 8px; }
.info { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--rule); margin-bottom: 10px; }
.info div { padding: 4px 7px; border-left: 1px solid var(--rule); border-top: 1px solid var(--rule); }
.info div:nth-child(3n+1) { border-left: 0; }
.info div:nth-child(-n+3) { border-top: 0; }
.info span { display: block; font-size: 9px; text-transform: uppercase; color: #333; }
.info b { font-size: 11.5px; }
.paper table { width: 100%; border-collapse: collapse; font-size: 11px; }
.paper th, .paper td { border: 1px solid var(--rule); padding: 3px 5px; text-align: left; vertical-align: middle; }
.paper th { background: #eeeeee; font-size: 9.5px; text-transform: uppercase; text-align: center; }
.paper td.n { text-align: center; width: 26px; }
.paper td.c { text-align: center; }
.paper td.sig { height: 22px; }
.signs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 26px; }
.signs div { text-align: center; }
.signs .line { border-top: 1px solid var(--rule); padding-top: 3px; font-weight: 700; }
.signs small { display: block; font-size: 10px; }
.legend { margin-top: 8px; font-size: 10px; }
.confirm { padding: 4px 16px 16px; }
.confirm h3 { margin: 12px 0 6px; font: 600 14px var(--ui); color: var(--navy); }
.confirm ol { margin: 0; padding-left: 20px; display: grid; gap: 7px; max-width: 80ch; }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.panel > header { padding: 12px 16px; }
.panel h2 { margin: 0; font: 600 16px var(--ui); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 50; max-width: calc(100% - 32px); box-sizing: border-box; }
@media (max-width: 760px) { .bhead { grid-template-columns: 1fr; } }
/* Round 2 (9 Nov 2026): New Wave's own forms, drawn like the owner's Word file (screenshot of 9 Nov), the watermark, and Accounting's To Do. */
.paper { position: relative; isolation: isolate; overflow: hidden; }
.paper .wm { position: absolute; left: 50%; top: 51%; width: 85%; transform: translateX(-50%); opacity: .16; z-index: -1; pointer-events: none; }
.paper.landscape .wm { width: 58%; top: 34%; }
.band { position: absolute; width: 14px; z-index: -1; }
.band.r { right: 0; top: 0; height: 30%; background: #86d6f5; }
.band.l { left: 0; bottom: 0; height: 30%; background: #f6c4a0; }
.paper.portrait { width: 720px; min-height: 1018px; padding: 22px 34px 70px; }
.paper.landscape { width: 1010px; min-height: 714px; padding: 20px 34px 64px; }
.paper + .paper { margin-top: 16px; }
.fh { display: grid; grid-template-columns: 84px 2px 1fr 150px; align-items: center; gap: 12px; border: 3px solid #9ddcf3; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3.5px #f4b183; padding: 6px 10px 6px 8px; }
.fh .lg { width: 84px; height: 84px; overflow: hidden; display: block; }
.fh .lg img { width: 120px; max-width: none; margin: -10px 0 0 -18px; }
.fh .dv { width: 2px; height: 60px; background: #00B0F0; }
.ft { text-align: center; font: 700 27px var(--print); color: #e2e2e2; -webkit-text-stroke: 1px #7f7f7f; text-shadow: 1.5px 1.5px 0 #c4c4c4; letter-spacing: .04em; }
.fbox { align-self: start; text-align: right; font-size: 7.5px; line-height: 1.35; color: #333; }
.fi { margin: 14px 0 6px; display: grid; gap: 5px; font-size: 12px; }
.fi .two { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.fi u { text-underline-offset: 2px; }
.paper table { table-layout: fixed; font-size: 10.5px; }
.paper th { background: #FBE4D5; font-size: 10px; text-transform: none; font-weight: 700; padding: 3px 2px; }
.paper th.sub { background: #D9E2F3; padding: 1px 2px; }
.paper th.ep { font-size: 8.5px; padding: 2px 1px; }
.paper td { height: 21px; padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paper.ccmd td { height: 17px; }
.paper.landscape td { height: 16px; }
.paper td.n { width: auto; font-size: 10px; text-align: left; padding: 0 2px 0 4px; text-overflow: clip; }
.paper.landscape td.n { font-size: 8.5px; padding: 0 1px 0 2px; }
.nf { display: block; text-align: center; font-style: italic; }
.cv { margin-top: 18px; font-size: 11.5px; padding-left: 36px; }
.cv .sg { margin-top: 24px; width: 220px; text-align: center; }
.cv .sg b { display: block; border-bottom: 1px solid var(--rule); min-height: 14px; font-size: 10.5px; }
.cv .sg span { display: block; font-size: 11.5px; padding-top: 2px; }
.fs { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 18px; font-size: 10.5px; }
.fs .sg { margin: 18px 0 0 40px; width: 250px; text-align: center; }
.fs .sg b { display: block; border-bottom: 1px solid var(--rule); padding-bottom: 2px; }
.fs .sg div { font-size: 9.5px; padding-top: 2px; }
.fs .lg { font-size: 10.5px; line-height: 1.7; }
.fs .lg span { padding-left: 45px; }
.tag { position: absolute; right: 34px; bottom: 18px; text-align: right; font: italic 8.5px Georgia, "Times New Roman", serif; line-height: 1.3; padding-right: 6px; border-right: 2px solid #f4b183; }
.same { text-align: center; color: #333; margin: 30px 0; min-height: 300px; display: grid; place-items: center; }
.days { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 600 13px var(--ui); color: var(--navy); }
.wmt { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; font: 600 13px var(--ui); color: var(--navy); }
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
.panel > header { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.rail { padding-bottom: 8px; }
.grp { padding: 2px 8px 6px; }
.grph { display: block; font: 600 11.5px var(--ui); letter-spacing: .07em; text-transform: uppercase; color: var(--blue); padding: 8px 8px 4px; }
.grp button { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 8px; border-radius: 9px; text-align: left; color: var(--ink); font: 500 14px var(--ui); cursor: pointer; }
.grp button.on { background: #e5f1fb; color: var(--blue); font-weight: 600; }
.grp button small { display: block; color: var(--mute); font-size: 12px; font-weight: 400; }
.grp button b { background: var(--orange); color: #fff; border-radius: 999px; min-width: 22px; text-align: center; font-size: 12px; padding: 1px 6px; }
.grp button b.zero { background: var(--soft); color: var(--mute); }
.new { font-style: normal; font: 600 10.5px var(--ui); color: var(--good); background: var(--goodbg); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
.list { display: grid; }
.req { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.req:first-child { border-top: 0; }
.req.dim { opacity: .45; }
.req strong { display: block; }
.req small { display: block; color: var(--mute); font-size: 12.5px; }
.req .mono, .amt { font-family: var(--num); }
.acts { display: flex; gap: 6px; }
.rej { color: #b42318; font: 600 13px var(--ui); }
.rejrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 0 16px 12px; background: #fff7f5; }
.rejrow label { display: grid; gap: 3px; font: 600 12.5px var(--ui); }
.rejrow select { height: 34px; border-radius: 8px; border: 1px solid #b9dcec; font: 14px var(--ui); padding: 0 8px; }
.b2[disabled] { opacity: .5; cursor: not-allowed; }
.pad { padding: 14px 16px; }
@media (max-width: 600px) { .req { grid-template-columns: 1fr; } }
</style>

  "UBT-PSSR": { name: "Updating Course on Basic Training – Personal Safety and Social Responsibilities", no: "26-609-031", days: ["2026-11-10"], ep: "EP A6.", eps: [562, 4253, 1134, 1134, 1417, 1417, 2127, 2977] },
  STPPDSPPS: { name: "Safety Training for Personnel Providing Direct Service to Passengers in Passenger Spaces", no: "26-506-014", days: ["2026-11-11"], ep: "EP A7.", eps: [562, 4253, 1134, 1134, 1417, 1417, 2127, 2977] },
  PSCMT: { name: "Passenger Ship Crowd Management Training", no: "26-507-023", days: ["2026-11-12", "2026-11-13"], ep: "EP A8.", eps: [442, 4656, 699, 699, 699, 699, 699, 691, 681, 681, 681, 1814, 2320] },
  PSCMHBT: { name: "Passenger Ship Crisis Management and Human Behaviour Training", no: "26-508-012", days: ["2026-11-16", "2026-11-17", "2026-11-18"], ep: "EP A4.", eps: [367, 4595, 513, 512, 512, 512, 525, 512, 512, 512, 512, 590, 590, 590, 590, 604, 590, 1322, 1375] },
  CCMD: { name: "Crowd and Crisis Management for Personnel Serving Onboard Domestic/RORO/Passenger Ships", no: "CCMD014", days: ["2026-11-19", "2026-11-20", "2026-11-21"], ep: "EP ", eps: [367, 5047, 722, 720, 720, 720, 2338, 2250], allDays: true },
};
const INSTR = "CAPT. JUAN JOEL HERNANDEZ";
const TRAINEES = [
  { name: "DELA CRUZ, JUAN PEREZ", rank: "Able Seafarer Deck" },
  { name: "SANTOS, MARIA LOPEZ", rank: "Ordinary Seaman" },
  { name: "REYES, CARLO MENDOZA", rank: "Oiler" },
  { name: "GARCIA, ANNA BAUTISTA", rank: "Messman" },
  { name: "TAN, ROBERTO CRUZ", rank: "Bosun" },
];
const FORMNO = { attendance: ["NW-TRNG-06-25", "10/08/2025"], exercise: ["NW-TRNG-08-26", "05/25/2026"] };
const S = { tab: 0, course: "PSCMT", sheet: "attendance", day: 0, todo: "TAR Reprints", rejecting: null, why: "", done: {}, wm: true };
const app = document.getElementById("app"), tabs = document.getElementById("tabs"), toastEl = document.getElementById("toast");
let timer;
const toast = (t) => { toastEl.textContent = t; toastEl.hidden = false; clearTimeout(timer); timer = setTimeout(() => { toastEl.hidden = true; }, 3200); };
const MON = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
const formDay = (d) => { const [y, m, dd] = d.split("-"); return `${dd} ${MON[m - 1]} ${y}`; };
const shortDay = (d) => { const [, m, dd] = d.split("-"); return `${["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][m - 1]} ${Number(dd)}`; };
const C = () => COURSES[S.course];
const pct = (ws) => { const t = ws.reduce((a, b) => a + b, 0); return `<colgroup>${ws.map((w) => `<col style="width:${(100 * w / t).toFixed(2)}%">`).join("")}</colgroup>`; };
// The watermark: New Wave's emblem, centred behind the sheet at low opacity (owner, 9 Nov 2026).
const paper = (cls, body) => `<div class="paper ${cls}"><i class="band r"></i><i class="band l"></i>${S.wm ? `<img class="wm" src="${EMBLEM}" alt="">` : ""}${body}</div>`;

function head(kind) {
  const [no, issued] = FORMNO[kind];
  return `<div class="fh"><span class="lg"><img src="${LOGO}" alt=""></span><i class="dv"></i><div class="ft">${kind === "attendance" ? "ATTENDANCE SHEET" : "EXERCISE PERFORMANCE SHEET"}</div><div class="fbox">Form. No.: ${no}<br>Revision No.:<br>Revision Date:<br>Issued Date: ${issued}</div></div>`;
}
function info(kind) {
  const c = C(), d = c.days;
  const line = (k, v) => `<div><b>${k}</b> <u>${v}</u></div>`;
  if (c.allDays) {
    const [y, m, a] = d[0].split("-"), b = d.at(-1).split("-")[2];
    return `<div class="fi">${line("Course:", c.name)}${line("Course Batch:", c.no)}${line("Schedule:", `${MON[m - 1]} ${a}-${b}, ${y} (08:00-17:00)`)}</div>`;
  }
  const sched = `${formDay(d[0])} – ${formDay(d.at(-1))}`;
  return kind === "exercise"
    ? `<div class="fi"><div class="two">${line("Training Course:", c.name)}${line("Class No.:", c.no)}</div>${line("Class Schedule:", sched)}</div>`
    : `<div class="fi">${line("Training Course:", c.name)}${line("Class No.:", c.no)}${line("Class Schedule:", sched)}</div>`;
}
const tagline = `<div class="tag">“Ride the<br>New Wave of<br>Maritime Excellence”</div>`;
function rows(lines, cells, filled) {
  let out = "";
  for (let i = 0; i < lines; i++) {
    const t = TRAINEES[i];
    const name = t ? t.name : i === TRAINEES.length ? '<span class="nf">-Nothing Follows-</span>' : "";
    out += `<tr><td class="n">${i + 1}.</td><td>${name}</td>${filled(t)}${"<td></td>".repeat(cells)}</tr>`;
  }
  return out;
}
const checked = `<div class="cv"><div>Checked and Verified by:</div><div class="sg"><b>${INSTR}</b><span>Instructor</span></div></div>`;
function attendancePage(dayIndex) {
  const c = C();
  if (c.allDays) {
    const n = c.days.length, w = [567, 3181, 1964, ...(n === 3 ? [2069, 1558, 1558] : Array(n).fill(5185 / n))];
    return paper("portrait ccmd", `${head("attendance")}${info("attendance")}<table>${pct(w)}<thead><tr><th rowspan="2"></th><th rowspan="2">NAME OF TRAINEES</th><th rowspan="2">RANK/ POSITION</th><th colspan="${n}">SIGNATURE</th></tr><tr>${c.days.map((_, i) => `<th class="sub">DAY ${i + 1}</th>`).join("")}</tr></thead><tbody>${rows(30, n, (t) => `<td>${t ? t.rank : ""}</td>`)}</tbody></table>${checked}${tagline}`);
  }
  const label = c.days.length > 1 ? `SIGNATURE DAY ${dayIndex + 1}` : "SIGNATURE";
  return paper("portrait", `${head("attendance")}${info("attendance")}<table>${pct([567, 4140, 2410, 1843, 1842])}<thead><tr><th rowspan="2"></th><th rowspan="2">NAME OF TRAINEES</th><th rowspan="2">RANK/ POSITION</th><th colspan="2">${label}</th></tr><tr><th class="sub">AM SESSION</th><th class="sub">PM SESSION</th></tr></thead><tbody>${rows(24, 2, (t) => `<td>${t ? t.rank : ""}</td>`)}</tbody></table>${checked}${tagline}`);
}
function exercisePage() {
  const c = C(), n = c.eps.length - 4;
  return paper("landscape", `${head("exercise")}${info("exercise")}<table>${pct(c.eps)}<thead><tr><th></th><th>TRAINEE’S NAME</th>${Array.from({ length: n }, (_, i) => `<th class="ep">${c.ep}${i + 1}</th>`).join("")}<th>Signature</th><th>Remarks</th></tr></thead><tbody>${rows(24, n + 2, () => "")}</tbody></table>
    <div class="fs"><div><span>Certified correct by:</span><div class="sg"><b>${INSTR}</b><div>Instructor’s printed name over signature</div></div></div><div class="lg">Legend: ✓ = Performed<br><span>X = Not Performed</span></div></div>${tagline}`);
}
function sheet() {
  const c = C();
  if (S.sheet === "attendance") {
    const pages = c.allDays ? [attendancePage(0)] : S.day === "all" ? c.days.map((_, i) => attendancePage(i)) : [attendancePage(S.day)];
    return pages.join("");
  }
  if (S.sheet === "exercise") return exercisePage();
  return paper("landscape", `<p class="same">${S.sheet === "assessment" ? "The Assessment Performance Sheet stays as it is in the portal now (Form No. NW-TRNG-09-26), with the watermark added." : "The TCROA stays as it is in the portal now, with the watermark added."}</p>`);
}
function windowTab() {
  const c = C();
  const on = (k, d) => (S.sheet === k && (d === undefined || S.day === d) ? ' aria-pressed="true"' : ' aria-pressed="false"');
  const attendance = c.allDays
    ? `<button type="button" class="b2" data-act="sheet" data-id="attendance"${on("attendance")}>Attendance Sheet</button>`
    : `<span class="days">Attendance Sheet:${c.days.map((d, i) => `<button type="button" class="b2" data-act="day" data-id="${i}"${on("attendance", i)}>Day ${i + 1} · ${shortDay(d)}</button>`).join("")}${c.days.length > 1 ? `<button type="button" class="b2" data-act="day" data-id="all"${on("attendance", "all")}>All Days</button>` : ""}</span>`;
  return `<div class="bar2"><b>Sample Batch</b><span class="seg">${Object.keys(COURSES).map((k) => `<button type="button" data-act="course" data-id="${k}" aria-selected="${S.course === k}">${k}</button>`).join("")}</span><label class="wmt"><input type="checkbox" data-act="wm"${S.wm ? " checked" : ""}> Watermark</label></div>
  <div class="modal" role="dialog" aria-label="Batch ${c.no}"><header><h2>Batch ${c.no}</h2><button type="button" class="b2" data-act="toast" data-id="Closes the window." aria-label="Close">×</button></header><div class="mb">
    <div class="bar2"><b>Training Reports</b>${attendance}<button type="button" class="b2" data-act="sheet" data-id="exercise"${on("exercise")}>Exercise Performance Sheet</button><button type="button" class="b2" data-act="sheet" data-id="assessment"${on("assessment")}>Assessment Performance Sheet</button><button type="button" class="b2" data-act="sheet" data-id="tcroa"${on("tcroa")}>TCROA</button></div>
    <p class="note">Each button opens the sheet as a PDF to print. The sheet it opens is shown below.</p>
    <div class="sheetwrap">${sheet()}</div>
  </div></div>`;
}

const TODO = {
  "Expense Requests": [{ id: "e1", title: "Meralco · Utilities", detail: "October electric bill", ref: "ER-2026-000188 · Cashier · Nov 8, 2026", amount: "₱12,480.00" }],
  Refunds: [],
  Discounts: [{ id: "d1", title: "SANTOS, Maria · Passenger Ship Crowd Management Training", detail: "Agency rebate", ref: "EN-2026-004417 · Cashier · Nov 8, 2026", amount: "₱300.00" }],
  "Payment Voids": [],
  "TAR Reprints": [
    { id: "t1", title: "REYES, Carlo · PSCMT", detail: "Reason: Lost by the Trainee", ref: "REQ-2026-000412 · Nov 9, 2026", amount: "—", tar: true },
    { id: "t2", title: "GARCIA, Anna · UBT-PSSR", detail: "Reason: Damaged", ref: "REQ-2026-000415 · Nov 9, 2026", amount: "—", tar: true },
  ],
  "Rebates Owed to Partners": [],
  "Cashier Opening and Closing": [{ id: "c1", title: "Cashier closing · Nov 8, 2026", detail: "Expected ₱48,200.00 · counted ₱48,200.00", ref: "Balanced · Cashier", amount: "₱0.00" }],
};
const GROUPS = [["Needs Your Decision", ["Expense Requests", "Refunds", "Discounts", "Payment Voids", "TAR Reprints"]], ["For Billing", ["Rebates Owed to Partners"]], ["Cash Control", ["Cashier Opening and Closing"]]];
const REJECT = ["Not Covered by the Policy", "Missing Documents", "Amount Is Incorrect", "Duplicate Request", "Other"];
const left = (k) => TODO[k].filter((r) => !S.done[r.id]);
function todoTab() {
  const k = S.todo, list = left(k), waiting = Object.keys(TODO).reduce((s, x) => s + left(x).length, 0);
  const sub = (x) => (x === "TAR Reprints" ? `${left(x).length} to decide` : x === "Cashier Opening and Closing" ? `${left(x).length} to review` : x === "Expense Requests" ? "₱12,480.00" : x === "Discounts" ? "₱300.00" : "₱0.00");
  const okLabel = k === "Cashier Opening and Closing" ? "Mark Reviewed" : "Approve";
  const row = (r) => `<div class="req${S.rejecting && S.rejecting !== r.id ? " dim" : ""}"><div><strong>${r.title}</strong><small>${r.detail}</small><small class="mono">${r.ref}</small></div><strong class="amt">${r.amount}</strong>${S.rejecting === r.id ? '<span class="rej">Rejecting</span>' : `<div class="acts"><button type="button" class="b2 p" data-act="ok" data-id="${r.id}">${okLabel}</button>${k === "Cashier Opening and Closing" ? "" : `<button type="button" class="b2" data-act="rej" data-id="${r.id}">Reject</button>`}</div>`}</div>
    ${S.rejecting === r.id ? `<div class="rejrow"><label>Reason<select data-act="why"><option value="">Choose a Reason</option>${REJECT.map((x) => `<option${S.why === x ? " selected" : ""}>${x}</option>`).join("")}</select></label><button type="button" class="b2" data-act="cancel">Cancel</button><button type="button" class="b2 p" data-act="reject" data-id="${r.id}"${S.why ? "" : " disabled"}>Reject</button></div>` : ""}`;
  return `<p class="note">Accounting › Dashboard. Sample figures.</p><div class="split"><section class="panel rail"><header><h2>To Do</h2><span class="chip o">${waiting} waiting</span></header>
    ${GROUPS.map(([g, cs], i) => `<div class="grp"><span class="grph">${i + 1} · ${g}</span>${cs.map((x) => `<button type="button" data-act="todo" data-id="${x}" class="${S.todo === x ? "on" : ""}"><span>${x}${x === "TAR Reprints" ? ' <i class="new">New</i>' : ""}<small>${sub(x)}</small></span><b class="${left(x).length ? "" : "zero"}">${left(x).length}</b></button>`).join("")}</div>`).join("")}</section>
    <section class="panel"><header><h2>${k}</h2><span class="note">${list.length} waiting</span></header><div class="list">${list.length ? list.map(row).join("") : '<p class="note pad">Nothing waiting.</p>'}</div></section></div>`;
}
const confirmTab = () => `<section class="panel"><header><h2>To Confirm</h2></header><div class="confirm"><ol>
    <li><b>Look of the sheet</b> follows your Word file: the framed header with the New Wave logo, the blue divider and the grey outlined title; Form No. at the top right; peach and light blue header cells; numbered lines (1., 2. and so on); the blue band at the top right and the peach band at the bottom left; "Ride the New Wave of Maritime Excellence" at the bottom right. The Exercise Performance Sheet gets the same frame.</li>
    <li><b>Watermark.</b> New Wave's emblem, large and faint, in the lower half behind every Training Reports sheet: Attendance, Exercise Performance, Assessment Performance and the TCROA. Use the Watermark tick on the Batch Window tab to compare.</li>
    <li><b>TAR Reprints go to Accounting.</b> Registration or the Cashier asks for one, and it goes straight to Accounting's To Do. No Cashier fee step, and nothing approves itself. Approve allows one more print with the same AR number; Reject needs a reason. Decided ones show in Approvals under TAR Reprints.</li>
    <li><b>Attendance Sheet</b> follows New Wave's template: A4 portrait, Form No. NW-TRNG-06-25, Name of Trainees, Rank/Position, and Signature with AM and PM Session. One sheet per training day, headed Signature Day 1, Day 2 and so on.</li>
    <li>The template's Issued Date reads "10/082025". It prints as <b>10/08/2025</b>; Accounting or the Admin can change it in Form Numbers.</li>
    <li><b>CCMD</b> prints one Attendance Sheet for all three days (Day 1, Day 2, Day 3 columns, 30 lines), with Course, Course Batch and Schedule, as on its template. So CCMD has one Attendance Sheet button, not day buttons.</li>
    <li>The training day's date and the room no longer print on the Attendance Sheet, as the template has neither.</li>
    <li><b>Exercise Performance Sheet</b> follows each course's form: Form No. NW-TRNG-08-26, A4 landscape, the course's EP columns (UBT-PSSR EP A6.1 to A6.4, Safety EP A7.1 to A7.4, Crowd EP A8.1 to A8.9, Crisis EP A4.1 to A4.15, CCMD EP 1 to EP 4), Signature and Remarks. The cells are left blank to tick by hand.</li>
    <li>The Exercise Titles box is removed from the batch window.</li>
  </ol></div></section>`;

function render() {
  tabs.innerHTML = TABS.map((t, i) => `<button type="button" role="tab" data-act="tab" data-id="${i}" aria-selected="${S.tab === i}">${t}</button>`).join("");
  app.innerHTML = S.tab === 0 ? windowTab() : S.tab === 1 ? todoTab() : confirmTab();
}
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  const { act, id } = el.dataset;
  if (act === "tab") { S.tab = Number(id); return render(); }
  if (act === "course") { S.course = id; if (S.sheet === "attendance") S.day = 0; return render(); }
  if (act === "sheet") { S.sheet = id; return render(); }
  if (act === "day") { S.sheet = "attendance"; S.day = id === "all" ? "all" : Number(id); return render(); }
  if (act === "todo") { S.todo = id; S.rejecting = null; return render(); }
  if (act === "ok") { S.done[id] = true; render(); return toast(S.todo === "TAR Reprints" ? "Approved. One more print of the TAR is allowed." : "Done."); }
  if (act === "rej") { S.rejecting = id; S.why = ""; return render(); }
  if (act === "cancel") { S.rejecting = null; return render(); }
  if (act === "reject") { S.done[id] = true; S.rejecting = null; render(); return toast("Rejected. Registration and the Cashier see the reason."); }
  if (act === "toast") return toast(id);
});
document.addEventListener("change", (ev) => {
  const a = ev.target.dataset.act;
  if (a === "why") { S.why = ev.target.value; render(); }
  if (a === "wm") { S.wm = ev.target.checked; render(); }
});
render();
</script>
