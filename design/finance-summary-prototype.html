<title>Cash and Sales Summary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Same shell as the live portal: navy bar with dropdown tabs, summary rail on the left, light-cyan table headers. */
:root{--orange:#F25615;--blue:#0571D0;--cyan:#35CCFA;--cyan-l:#9EE3F1;--navy:#123F63;--bg:#f2f6f8;--surface:#fff;--fg:#0f2638;--muted:#587184;--line:#dbe6ec;--soft:#eef4f8;--th:#e6f6fd;--thc:#0b4f8f;--zebra:#f7fafc;
 --good:#0a7a3e;--good-bg:#e2f5e9;--warn:#a2470b;--warn-bg:#fdf0e5;--bad:#b42318;--bad-bg:#fcebea;--info:#0571D0;--info-bg:#e5f1fb;
 --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1722;--surface:#102231;--fg:#e3edf4;--muted:#91a9bb;--line:#20384b;--soft:#152d43;--th:#15344b;--thc:#9fd3f7;--zebra:#12283a;--good:#61d396;--good-bg:#113523;--warn:#ffa56a;--warn-bg:#382313;--bad:#ff8b80;--bad-bg:#3b1918;--info:#5fb4ff;--info-bg:#122e48;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1722;--surface:#102231;--fg:#e3edf4;--muted:#91a9bb;--line:#20384b;--soft:#152d43;--th:#15344b;--thc:#9fd3f7;--zebra:#12283a;--good:#61d396;--good-bg:#113523;--warn:#ffa56a;--warn-bg:#382313;--bad:#ff8b80;--bad-bg:#3b1918;--info:#5fb4ff;--info-bg:#122e48;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.mono,.amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{background:var(--navy);color:#fff;padding-block:16px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{display:flex;align-items:center;gap:12px}.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font:700 15px var(--sans)}.logo b{font-size:19px;font-weight:600}.logo b span{color:var(--orange)}.logo small{display:block;color:var(--cyan-l);font-size:14px}.proto{background:var(--orange);font:600 11px var(--sans);letter-spacing:.08em;padding:2px 8px;border-radius:5px;margin-left:8px}
.who{font-size:14px;color:#cfe3ef;display:flex;align-items:center;gap:8px}.who select{background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:8px;padding:5px 8px}.who select option{color:#0f2638}
.tabs{display:flex;gap:2px;margin-top:16px;flex-wrap:wrap}.tab>button{background:none;border:0;color:#c3dbea;font:500 16px var(--sans);padding:12px 18px;border-radius:10px 10px 0 0;white-space:nowrap;display:flex;align-items:center;gap:8px}.tab>button:hover{color:#fff;background:#ffffff12}.tab.on>button{background:var(--bg);color:var(--fg);font-weight:600}
.caret{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-3px) rotate(45deg)}
.menu{position:absolute;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #0003;padding:6px;z-index:15;display:flex;flex-direction:column;margin-top:2px}.tab{position:relative}.menu button{background:none;border:0;text-align:left;color:var(--fg);font:500 15.5px var(--sans);padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;gap:12px}.menu button:hover{background:var(--soft)}.menu button.on{background:var(--info-bg);color:var(--info);font-weight:600}.menu small,.n{font:600 11.5px var(--mono);background:var(--orange);color:#fff;border-radius:10px;padding:1px 7px}
.page{padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}.eyebrow{display:block;font:600 13px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}h1{font-size:25px;font-weight:600;margin:0}h2{font-size:19px;font-weight:600;margin:0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:16px}.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:14.5px}.seg button.on{background:var(--navy);color:#fff}
.rail{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}@media (max-width:900px){.rail{grid-template-columns:1fr}}.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.ph{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.ph small{color:var(--muted);font-size:14px}
.lines{display:flex;flex-direction:column;padding:0 20px 16px}.lines div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.lines div:first-child{border-top:0}.lines dd,.lines span:last-child{font-family:var(--mono);font-weight:600}.lines .tot{font-weight:700}.lines .bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 16px}.tile{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px}.tile span{display:block;font-size:13px;color:var(--muted)}.tile b{font:600 19px var(--mono)}
.cwrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14.5px}th{background:var(--th);color:var(--thc);font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:10px 12px;border-right:1px solid var(--line);white-space:nowrap}td{padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.35}tbody tr:nth-child(even) td{background:var(--zebra)}td small{display:block;color:var(--muted);font-size:12.5px}.r{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}.due{background:var(--bad-bg);color:var(--bad)}.dueo{background:var(--warn-bg);color:var(--warn)}.appr{background:var(--info-bg);color:var(--info)}.paid{background:var(--good-bg);color:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--blue);border-radius:9px;padding:7px 14px;font-weight:600;font-size:14.5px;white-space:nowrap}.pri{background:var(--orange);color:#fff;border:0}.okb{background:var(--good);color:#fff;border:0}.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:14px 20px;background:var(--soft);border-top:1px solid var(--line)}.form label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}.form select,.form input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);color:var(--fg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
.alert{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:500;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.note{font-size:13.5px;color:var(--muted);padding:0 20px 16px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
</style>

<style>
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.bar .seg{margin:0}.bar input{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--surface);color:var(--fg)}.bar .lbl{color:var(--muted);font-size:14.5px}.bar .lbl b{color:var(--fg)}
.sub{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:16px}.sub button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:14.5px}.sub button.on{background:var(--navy);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px}.kpi span{display:block;font-size:13px;color:var(--muted)}.kpi b{font:600 20px var(--mono)}.kpi small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px;margin-top:20px}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sec td{background:var(--soft)!important;font:600 12.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--thc)}
tr.tot td{font-weight:700;border-top:2px solid var(--fg)}tr.net td{font-weight:700;background:var(--info-bg)!important;color:var(--info)}
tr.sub2 td:first-child{padding-left:28px;color:var(--muted)}
.neg{color:var(--bad)}.pos{color:var(--good)}
.colE{color:var(--warn)}.colD{color:var(--info)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);padding:0 20px 14px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
</style>
<header class="top"><div class="w">
  <div class="brand"><div class="logo"><span class="mark">NW</span><div><b>New Wave <span>Maritime</span><span class="proto">PROTOTYPE</span></b><small>Staff Portal · sample figures</small></div></div><span class="who">Working as Accounting</span></div>
  <nav class="tabs" id="tabs"></nav></div></header>
<main class="page"><div class="w" id="page"></div></main>
<div class="toast" id="toast" hidden></div>
<script>
const CH=["Cash","GCash","PSBank","UnionBank","Check"];
// Cash received: [line, column E|D, {channel: centavos}]
const REC=[["Training Fees","E",{Cash:3300000,GCash:2200000,PSBank:1100000}],["Training Fees","D",{Cash:18240000,GCash:9650000,PSBank:4120000,UnionBank:1800000}],["Miscellaneous Charges","D",{Cash:435000,GCash:120000}],["Endorsement Rebates","E",{Cash:330000,PSBank:900000}],["Rental","D",{Cash:500000}],["Interest","D",{PSBank:1288}]];
const DIS=[["Payments to Partnered Centers","E",{PSBank:5500000,Cash:1100000}],["Agency Shares Paid","E",{GCash:600000}],["Salary","D",{UnionBank:12000000}],["Utilities","D",{PSBank:1845000}],["Office Supplies","D",{Cash:623000}],["Repairs & Maintenance","D",{GCash:580000}],["Transportation","D",{Cash:340000}],["Representation","D",{Cash:210000}]];
const COURSES=[["UBT-PSSR",96,130000],["STPPDSPPS",40,150000],["PSCMT",30,180000],["PSCMHBT",28,240000],["ABC",8,315000],["ESEA",12,180000]];
const DIRECT={charges:555000,discounts:420000,collected:33190000};
const CENTERS=[["Nautical Options",7,3850000,910000,910000,700000],["Altitude Maritime",3,1650000,360000,120000,0],["Mariana",2,1100000,200000,200000,100000]]; // name, trainees, fees, rebate due, rebate received, agency share
const S={sub:"Cash and Sales Summary",period:"Monthly"};
const peso=(c)=>(c<0?"−":"")+"₱"+(Math.abs(c)/100).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const sum=(o)=>Object.values(o).reduce((a,b)=>a+b,0);
const tot=(rows,col)=>rows.filter((r)=>!col||r[1]===col).reduce((a,r)=>a+sum(r[2]),0);
const byCh=(rows,ch)=>rows.reduce((a,r)=>a+(r[2][ch]||0),0);
function three(rows){const groups=[["Training Endorsement","E"],["Direct New Wave","D"]];return groups.map(([t,c])=>`<tr class="sec"><td colspan="4">${t}</td></tr>${rows.filter((r)=>r[1]===c).map((r)=>`<tr class="sub2"><td>${r[0]}</td><td class="num">${c==="E"?peso(sum(r[2])):"—"}</td><td class="num">${c==="D"?peso(sum(r[2])):"—"}</td><td class="num">${peso(sum(r[2]))}</td></tr>`).join("")}`).join("")}
function cashTable(title,rows){const e=tot(rows,"E"),d=tot(rows,"D");return `<section class="panel"><div class="ph"><h2>${title}</h2><small>by ${title==="Cash Received"?"date received":"date released"}</small></div><div class="cwrap"><table><thead><tr><th>Line</th><th class="num">Endorsement</th><th class="num">Direct</th><th class="num">Total</th></tr></thead><tbody>
 ${three(rows)}<tr class="tot"><td>Total ${title}</td><td class="num">${peso(e)}</td><td class="num">${peso(d)}</td><td class="num">${peso(e+d)}</td></tr>
 <tr class="sec"><td colspan="4">By Channel</td></tr>${CH.map((ch)=>{const ce=byCh(rows.filter((r)=>r[1]==="E"),ch),cd=byCh(rows.filter((r)=>r[1]==="D"),ch);return ce+cd?`<tr class="sub2"><td>${ch}</td><td class="num">${peso(ce)}</td><td class="num">${peso(cd)}</td><td class="num">${peso(ce+cd)}</td></tr>`:""}).join("")}
 </tbody></table></div></section>`}
function summary(){
 const rE=tot(REC,"E"),rD=tot(REC,"D"),dE=tot(DIS,"E"),dD=tot(DIS,"D");
 const fees=COURSES.reduce((a,c)=>a+c[1]*c[2],0),trainees=COURSES.reduce((a,c)=>a+c[1],0),dSales=fees+DIRECT.charges-DIRECT.discounts;
 const eT=CENTERS.reduce((a,c)=>a+c[1],0),eFees=CENTERS.reduce((a,c)=>a+c[2],0),eReb=CENTERS.reduce((a,c)=>a+c[3],0),eRec=CENTERS.reduce((a,c)=>a+c[4],0),eShare=CENTERS.reduce((a,c)=>a+c[5],0);
 return `<div class="cx-head"><div><span class="eyebrow">Accounting · Reports</span><h1>Cash and Sales Summary</h1></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-t="Excel downloads with the same three blocks">Download Excel</button><button class="btn pri" data-t="A4 PDF with Prepared by (Accounting) and Noted by (Admin)">Print PDF</button></div></div>
 <span class="sub">${["Overview","Cash and Sales Summary"].map((x)=>`<button class="${S.sub===x?"on":""}" data-sub="${x}">${x}</button>`).join("")}</span>
 <div class="bar"><span class="seg">${["Daily","Weekly","Monthly","Quarterly","Annually"].map((p)=>`<button class="${S.period===p?"on":""}" data-p="${p}">${p}</button>`).join("")}</span><button class="btn" aria-label="Previous" data-t="Previous period">‹</button><input type="date" value="2026-10-21" aria-label="As of"><button class="btn" aria-label="Next" data-t="Next period">›</button><span class="lbl"><b>October 2026</b> · Oct 1 – Oct 31</span></div>
 <div class="kpis">
  <div class="kpi" style="--c:var(--good)"><span>Cash Received</span><b>${peso(rE+rD)}</b><small>Endorsement ${peso(rE)} · Direct ${peso(rD)}</small></div>
  <div class="kpi" style="--c:var(--bad)"><span>Disbursements</span><b>${peso(dE+dD)}</b><small>Endorsement ${peso(dE)} · Direct ${peso(dD)}</small></div>
  <div class="kpi" style="--c:var(--blue)"><span>Net Cash</span><b>${peso(rE+rD-dE-dD)}</b><small>received less disbursed</small></div>
  <div class="kpi" style="--c:var(--orange)"><span>Direct Sales</span><b>${peso(dSales)}</b><small>${trainees} trainees by training date</small></div>
  <div class="kpi" style="--c:var(--warn)"><span>Endorsement Keeps</span><b>${peso(eReb-eShare)}</b><small>${eT} trainees · rebates less agency shares</small></div>
 </div>
 <div class="grid2">${cashTable("Cash Received",REC)}${cashTable("Disbursements",DIS)}</div>
 <section class="panel" style="margin-top:20px"><div class="ph"><h2>Net Cash</h2></div><div class="cwrap"><table><thead><tr><th></th><th class="num">Endorsement</th><th class="num">Direct</th><th class="num">Total</th></tr></thead><tbody>
  <tr><td>Cash Received</td><td class="num">${peso(rE)}</td><td class="num">${peso(rD)}</td><td class="num">${peso(rE+rD)}</td></tr>
  <tr><td>Less Disbursements</td><td class="num neg">${peso(-dE)}</td><td class="num neg">${peso(-dD)}</td><td class="num neg">${peso(-dE-dD)}</td></tr>
  <tr class="net"><td>Net Cash</td><td class="num">${peso(rE-dE)}</td><td class="num">${peso(rD-dD)}</td><td class="num">${peso(rE+rD-dE-dD)}</td></tr></tbody></table></div></section>
 <div class="grid2">
 <section class="panel"><div class="ph"><h2>Direct Sales</h2><small>New Wave courses · by training date</small></div><div class="cwrap"><table><thead><tr><th>Course</th><th class="num">Trainees</th><th class="num">Sales</th></tr></thead><tbody>
  ${COURSES.map((c)=>`<tr><td><b>${c[0]}</b></td><td class="num">${c[1]}</td><td class="num">${peso(c[1]*c[2])}</td></tr>`).join("")}
  <tr class="tot"><td>Course Fees</td><td class="num">${trainees}</td><td class="num">${peso(fees)}</td></tr>
  <tr class="sub2"><td>Add Miscellaneous Charges</td><td></td><td class="num">${peso(DIRECT.charges)}</td></tr><tr class="sub2"><td>Less Discounts</td><td></td><td class="num neg">${peso(-DIRECT.discounts)}</td></tr>
  <tr class="net"><td>Direct Sales</td><td></td><td class="num">${peso(dSales)}</td></tr>
  <tr class="sub2"><td>Collected</td><td></td><td class="num pos">${peso(DIRECT.collected)}</td></tr><tr class="sub2"><td>Balance Still Due</td><td></td><td class="num neg">${peso(dSales-DIRECT.collected)}</td></tr>
  <tr class="sub2"><td>Less Direct Expenses (period)</td><td></td><td class="num neg">${peso(-dD)}</td></tr>
  <tr class="net"><td>Direct Gross Margin</td><td></td><td class="num">${peso(dSales-dD)}</td></tr></tbody></table></div></section>
 <section class="panel"><div class="ph"><h2>Training Endorsement</h2><small>Other STCW at partnered centers · by training date</small></div><div class="cwrap"><table><thead><tr><th>Center</th><th class="num">Trainees</th><th class="num">Fees Billed</th><th class="num">Paid to Center</th><th class="num">Rebate</th><th class="num">Agency Share</th><th class="num">New Wave Keeps</th></tr></thead><tbody>
  ${CENTERS.map((c)=>`<tr><td><b>${c[0]}</b><small>rebate received ${peso(c[4])} of ${peso(c[3])}</small></td><td class="num">${c[1]}</td><td class="num">${peso(c[2])}</td><td class="num">${peso(c[2])}</td><td class="num">${peso(c[3])}</td><td class="num neg">${peso(-c[5])}</td><td class="num">${peso(c[3]-c[5])}</td></tr>`).join("")}
  <tr class="tot"><td>Total</td><td class="num">${eT}</td><td class="num">${peso(eFees)}</td><td class="num">${peso(eFees)}</td><td class="num">${peso(eReb)}</td><td class="num neg">${peso(-eShare)}</td><td class="num">${peso(eReb-eShare)}</td></tr>
  <tr class="sub2"><td colspan="6">Rebates still due from centers</td><td class="num neg">${peso(eReb-eRec)}</td></tr></tbody></table></div>
  <p class="note" style="padding-top:12px">New Wave collects the full fee and pays the same amount to the center; what New Wave keeps is the rebate less the referring agency's share.</p></section>
 </div>`}
function render(){document.getElementById("tabs").innerHTML=["Dashboard","Approvals","Transactions","Reports","Configuration"].map((t)=>`<div class="tab ${t==="Reports"?"on":""}"><button data-view="${t}">${t}</button></div>`).join("");
 document.getElementById("page").innerHTML=S.sub==="Overview"?`<div class="cx-head"><div><span class="eyebrow">Accounting · Reports</span><h1>Overview</h1></div></div><span class="sub">${["Overview","Cash and Sales Summary"].map((x)=>`<button class="${S.sub===x?"on":""}" data-sub="${x}">${x}</button>`).join("")}</span><section class="panel"><p class="note" style="padding-top:16px">Today's Reports screen (trend, channels, sources, top courses) stays here unchanged.</p></section>`:summary()}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2800)}
document.addEventListener("click",(e)=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset;
 if(k.view){toast(k.view==="Reports"?"You are on Reports":k.view+" stays as it is today");return}
 if(k.sub)S.sub=k.sub;else if(k.p){S.period=k.p;toast(`${k.p} figures (sample shows October)`)}else if(k.t){toast(k.t);return}else return;render()});
render();
</script>
